name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift release tests
        run: swift test -c release
      - name: Build static product
        run: swift build -c release --product EDPCore
      - name: Standalone static-link probe
        run: |
          REL=.build/arm64-apple-macosx/release
          xcrun swiftc -O -swift-version 6 \
            -I "$REL/Modules" \
            -I Sources/CEDPCore/include \
            Examples/StandaloneLinkProbe.swift \
            -L "$REL" -lEDPCore \
            -o "$RUNNER_TEMP/edp-core-link-probe"
          "$RUNNER_TEMP/edp-core-link-probe"
