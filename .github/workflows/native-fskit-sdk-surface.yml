name: Native FSKit SDK Surface

on:
  push:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - "native/EDPFSKitPoC/Tools/probe-fskit-sdk.sh"
      - ".github/workflows/native-fskit-sdk-surface.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-fskit-sdk-surface
  cancel-in-progress: true

jobs:
  sdk-surface:
    name: Probe installed Swift FSKit API surface
    runs-on: macos-26
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6

      - name: Probe installed FSKit SDK capabilities
        run: |
          set -euo pipefail
          bash native/EDPFSKitPoC/Tools/probe-fskit-sdk.sh \
            | tee "${RUNNER_TEMP}/fskit-sdk-capabilities.txt"
          grep -F 'RESULT=FSKIT_SDK_CAPABILITIES_PROBED' "${RUNNER_TEMP}/fskit-sdk-capabilities.txt"
          if grep -Fq 'FSKIT_SDK_VOLUME_HANDLER=true' "${RUNNER_TEMP}/fskit-sdk-capabilities.txt"; then
            echo '::notice::Handler-style FSKit volume APIs are available; evaluate migration from FSVolume.Operations.'
          fi
          if grep -Fq 'FSKIT_SDK_CLIENT_DIRECT_SETTINGS=true' "${RUNNER_TEMP}/fskit-sdk-capabilities.txt"; then
            echo '::notice::Direct File System Extensions settings API is available; evaluate replacing the ServiceManagement fallback.'
          fi
