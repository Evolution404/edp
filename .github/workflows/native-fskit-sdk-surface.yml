name: Native FSKit SDK Surface

on:
  push:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - ".github/workflows/native-fskit-sdk-surface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Ask Swift compiler for FSKit Handler surface
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/ProbeFSKit.swift" <<'SWIFT'
          import Foundation
          import FSKit

          final class ProbeVolume: FSVolume, FSVolume.Handler, FSVolume.ReadWriteHandler {
          }

          func probeInitializers() {
              _ = FSItem()
              _ = FSItem.Identifier()
              _ = FSItem.Attributes()
              _ = FSVolume.Identifier()
              _ = FSActivateResult()
              _ = FSLookupItemResult()
              _ = FSGetAttributesResult()
              _ = FSEnumerateDirectoryResult()
              _ = FSReadFileResult()
              _ = FSStatFSResult()
              _ = FSVolume.SupportedCapabilities()
          }
          SWIFT

          set +e
          xcrun swiftc \
            -typecheck \
            -target arm64-apple-macos26.0 \
            "${RUNNER_TEMP}/ProbeFSKit.swift" \
            >"${RUNNER_TEMP}/fskit-compiler.out" \
            2>"${RUNNER_TEMP}/fskit-compiler.err"
          RC=$?
          set -e
          echo "TYPECHECK_EXPECTED_RC=${RC}"
          test "${RC}" -ne 0
          cat "${RUNNER_TEMP}/fskit-compiler.err"

      - name: Upload FSKit compiler evidence
        uses: actions/upload-artifact@v7
        with:
          name: fskit-sdk-surface-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ProbeFSKit.swift
            ${{ runner.temp }}/fskit-compiler.out
            ${{ runner.temp }}/fskit-compiler.err
          retention-days: 7
