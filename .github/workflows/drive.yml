name: EDP Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"
  push:
    branches: [main]
    paths:
      - "Apps/Drive/**"
      - "Packages/EDPCore/**"
      - "Tools/build-drive-ui-update.sh"
      - "Tools/install-drive-ui-update.sh"
      - "Tools/manage-drive-ui.sh"
      - "Makefile"
      - ".github/workflows/drive.yml"
  pull_request:
    paths:
      - "Apps/Drive/**"
      - "Packages/EDPCore/**"
      - "Tools/build-drive-ui-update.sh"
      - "Tools/install-drive-ui-update.sh"
      - "Tools/manage-drive-ui.sh"
      - "Makefile"
      - ".github/workflows/drive.yml"

permissions:
  contents: read

jobs:
  native:
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify monorepo and branding contract
        run: |
          set -euo pipefail
          grep -Fq '<string>EDP Drive</string>' Apps/Drive/product/App/Info.plist
          ! grep -Fq 'EDP USB Vault Raw Access.app' Apps/Drive/installer/build-native-installer.sh
          grep -Fq 'com.edp.drive' Apps/Drive/product/App/Info.plist
          grep -Fq '/Applications/EDP Drive.app/Contents/MacOS/EDP Drive' Apps/Drive/product/EDPXPCSecurity.swift
          grep -Fq 'com.edp.drive.service' Apps/Drive/product/App/com.edp.drive.service.plist
          grep -Fq '/Applications/EDP Drive.app/Contents/Library/LaunchServices/edp-drive-service' Apps/Drive/installer/com.edp.drive.service.plist
          ! grep -Fq '<key>KeepAlive</key>' Apps/Drive/product/App/com.edp.drive.service.plist
          ! grep -Fq '<key>RunAtLoad</key>' Apps/Drive/product/App/com.edp.drive.service.plist
          grep -Fq 'requestGracefulShutdown' Apps/Drive/product/EDPXPCProtocol.swift
          grep -Fq 'retryTransientAutomaticMounts' Apps/Drive/product/EDPXPCProtocol.swift
          grep -Fq 'automation.failureCode(for: partitionKey) == .bridgeExtensionUnavailable' Apps/Drive/product/EDPVaultRuntime.swift
          ! grep -Fq 'failure.contains("File system extension' Apps/Drive/product/EDPVaultRuntime.swift
          grep -Fq 'case bridgeExtensionRequiresApproval' Apps/Drive/product/EDPMountLifecycle.swift
          grep -Fq 'direct_mfmount_async_result=4' Apps/Drive/product/EDPMountLifecycle.swift
          grep -Fq 'EDP_MFMOUNT_QUIET": "0"' Apps/Drive/product/EDPTransportProvider.swift
          grep -Fq 'packageUpgradeAction == '\''clean'\''' Apps/Drive/installer/build-clean-installer.sh
          grep -Fq 'packageUpgradeAction == '\''upgrade'\''' Apps/Drive/installer/build-clean-installer.sh
          ! grep -Fq 'ensureMacFUSELocalEnablement' Apps/Drive/product/App/Model/EDPVaultViewModel.swift Apps/Drive/product/App/Service/EDPAppServiceSupport.swift
          grep -Fq 'retryTransientAutomaticMounts()' Apps/Drive/product/App/Model/EDPVaultViewModel.swift
          test "$(grep -Fc 'retryTransientAutomaticMounts()' Apps/Drive/product/App/Model/EDPVaultViewModel.swift)" -ge 3
          grep -Fq 'remoteObjectProxyWithErrorHandler { @Sendable [weak self] error in' Apps/Drive/product/App/Model/EDPVaultViewModel.swift
          grep -Fq 'proxy.requestGracefulShutdown { @Sendable [weak self] errorMessage in' Apps/Drive/product/App/Model/EDPVaultViewModel.swift
          grep -Fq 'connection.interruptionHandler = { @Sendable in disconnectSemaphore.signal() }' Apps/Drive/product/App/EDPUSBVaultApp.swift
          grep -Fq 'proxy.requestGracefulShutdown { @Sendable errorMessage in' Apps/Drive/product/App/EDPUSBVaultApp.swift
          ! grep -Fq 'remoteObjectProxyWithErrorHandler({ error in' Apps/Drive/product/App/Model/EDPVaultViewModel.swift Apps/Drive/product/App/EDPUSBVaultApp.swift
          grep -Fq 'Button("启动")' Apps/Drive/product/App/Pages/EDPSettingsView.swift
          grep -Fq 'Button("停止")' Apps/Drive/product/App/Pages/EDPSettingsView.swift
          grep -Fq 'Button("重启")' Apps/Drive/product/App/Pages/EDPSettingsView.swift
          grep -Fq 'EDPMenuCompactButton(title: "仅退出界面"' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          grep -Fq 'title: "完全退出"' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          ! grep -Fq '仅退出界面（' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          ! grep -Fq '完全退出（' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          ! grep -Fq 'Menu(' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          grep -Fq '.menuBarExtraStyle(.window)' Apps/Drive/product/App/EDPUSBVaultApp.swift
          ! grep -Fq '.menuBarExtraStyle(.menu)' Apps/Drive/product/App/EDPUSBVaultApp.swift
          grep -Fq 'private func serviceIconButton(' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          grep -Fq 'systemImage: "play.fill"' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          grep -Fq 'systemImage: "stop.fill"' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          grep -Fq 'partitionRow(device: device, partition: partition)' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          grep -Fq '.frame(width: 390)' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          grep -Fq 'EDPMenuNavigationRow' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          ! grep -Fq 'HSplitView {' Apps/Drive/product/App/Shell/EDPMainWindow.swift Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          grep -Fq 'Picker("切换设备", selection: deviceSelection)' Apps/Drive/product/App/Pages/EDPDevicesView.swift
          grep -Fq 'struct EDPDevicesView: View' Apps/Drive/product/App/Pages/EDPDevicesView.swift
          grep -Fq 'struct EDPActivityView: View' Apps/Drive/product/App/Pages/EDPActivityView.swift
          grep -Fq 'struct EDPSettingsView: View' Apps/Drive/product/App/Pages/EDPSettingsView.swift
          grep -Fq 'struct EDPMenuBarView: View' Apps/Drive/product/App/MenuBar/EDPMenuBarView.swift
          grep -Fq 'struct EDPNativeSidebarView: View' Apps/Drive/product/App/Sidebar/EDPSidebarView.swift
          ! grep -Fq 'struct EDPNativeSidebarView: View' Apps/Drive/product/App/Shell/EDPMainWindow.swift
          ! grep -Fq 'struct EDPDevicesView: View' Apps/Drive/product/App/EDPUSBVaultApp.swift
          ! grep -Fq 'struct EDPMenuBarView: View' Apps/Drive/product/App/EDPUSBVaultApp.swift
          ! grep -Fq 'struct EDPActivityView: View' Apps/Drive/product/App/EDPUSBVaultApp.swift
          ! grep -Fq 'struct EDPSettingsView: View' Apps/Drive/product/App/EDPUSBVaultApp.swift
          grep -Fq 'EDPNativeSplitViewController: NSSplitViewController' Apps/Drive/product/App/Shell/EDPMainWindow.swift
          grep -Fq 'sidebarItem.collapseBehavior = .preferResizingSiblingsWithFixedSplitView' Apps/Drive/product/App/Shell/EDPMainWindow.swift
          grep -Fq 'sidebarItem.canCollapseFromWindowResize = false' Apps/Drive/product/App/Shell/EDPMainWindow.swift
          ! grep -Fq 'NavigationSplitView {' Apps/Drive/product/App/EDPUSBVaultApp.swift Apps/Drive/product/App/Shell/EDPMainWindow.swift
          ! grep -Fq '.navigationSplitViewStyle(.prominentDetail)' Apps/Drive/product/App/EDPUSBVaultApp.swift Apps/Drive/product/App/Shell/EDPMainWindow.swift
          ! grep -Fq '.frame(width: 180)' Apps/Drive/product/App/EDPUSBVaultApp.swift Apps/Drive/product/App/Shell/EDPMainWindow.swift
          grep -Fq 'struct EDPMainView: View' Apps/Drive/product/App/Shell/EDPMainWindow.swift
          ! grep -Fq 'struct EDPMainView: View' Apps/Drive/product/App/EDPUSBVaultApp.swift
          test -x Tools/build-drive-ui-update.sh
          test -x Tools/install-drive-ui-update.sh
          test -x Tools/manage-drive-ui.sh
          bash -n Tools/build-drive-ui-update.sh Tools/install-drive-ui-update.sh Tools/manage-drive-ui.sh
          grep -Fq 'drive-ui-deploy:' Makefile
          grep -Fq 'drive-ui-status:' Makefile
          grep -Fq 'drive-stop:' Makefile
          grep -Fq 'Shared/UI/EDPDesignSystem.swift' Apps/Drive/installer/build-native-installer.sh
          grep -Fq 'Shared/UI/EDPDesignSystem.swift' Apps/Drive/installer/build-clean-installer.sh
          grep -Fq '<string>EDPDrive.icns</string>' Apps/Drive/product/App/Info.plist
          grep -Fq '<string>Copyright © 2026 EDP</string>' Apps/Drive/product/App/Info.plist
          test -f Apps/Drive/product/App/EDPDriveIcon.svg
          test -x Tools/build-macos-icon.sh
          grep -Fq 'service-stop' Apps/Drive/scripts/first-install-acceptance.sh
          grep -Fq 'service-start' Apps/Drive/scripts/first-install-acceptance.sh
          grep -Fq 'service-restart' Apps/Drive/scripts/first-install-acceptance.sh
          grep -Fq 'service-cycle' Apps/Drive/scripts/first-install-acceptance.sh
          test "$(/usr/libexec/PlistBuddy -c 'Print :ThrottleInterval' Apps/Drive/product/App/com.edp.drive.service.plist)" = '1'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ThrottleInterval' Apps/Drive/installer/com.edp.drive.service.plist)" = '1'
          grep -Fq 'F_DUPFD_CLOEXEC' Apps/Drive/product/EDPMountSupport.swift
          grep -Fq 'prepare_inherited_raw_fd' Apps/Drive/product/EDPConsoleExec.c
          grep -Fq 'FD_CLOEXEC' Apps/Drive/product/EDPConsoleExec.c
          ! grep -Fq 'kickstart -k system/com.edp.drive.service' Apps/Drive/scripts/first-install-acceptance.sh
          ! test -e Apps/Drive/product/RawAccessHelper/Info.plist
          ! grep -Fq 'EDP_CORE_EXPECTED_REV' Apps/Drive/scripts/prepare-shared-edp-core.sh
          grep -Fq 'Packages/EDPCore' Apps/Drive/scripts/prepare-shared-edp-core.sh
          ! grep -Fq 'cachedDisks' Apps/Drive/product/EDPVaultRuntime.swift
          ! grep -Fq 'recognized_cached' Apps/Drive/product/EDPVaultRuntime.swift
          grep -Fq 'static func lba4OnlyID' Apps/Drive/native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift
          grep -Fq 'EDP-PHYSICAL-ID-V3' Apps/Drive/native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift
          grep -Fq 'labelOnlyID: labelOnlyID' Apps/Drive/product/EDPNativeSystem.swift
          grep -Fq 'identity == disk.identity' Apps/Drive/product/EDPNativeSystem.swift
          ! grep -Fq 'migrateDeviceID' Apps/Drive/product/EDPVaultRuntime.swift Apps/Drive/product/EDPDevicePolicyStore.swift Apps/Drive/product/EDPCredentialStore.swift
          grep -Fq 'func forceDurability() throws' Apps/Drive/native/EDPFSKitPoC/Extension/EDPRawIO.swift
          grep -Fq 'try context.block.forceDurability()' Apps/Drive/native/EDPFSKitPoC/Tools/EDPReadWriteBlockCBridge.swift
          grep -Fq 'state->flush_calls += 1;' Apps/Drive/native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c
          grep -Fq 'DIRECT_IO_SUMMARY' Apps/Drive/native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c
          grep -Fq 'EDP_FINAL_DURABILITY' Apps/Drive/native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountEDPAdapter.c
          grep -Fq 'physical_fsync' Apps/Drive/native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c
          grep -Fq 'skipped_fsync' Apps/Drive/native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c
          grep -Fq 'write_generation == state->synced_generation' Apps/Drive/native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c
          ! grep -Fq 'DIRECT_OPCODE opcode=' Apps/Drive/native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c
          grep -Fq 'runBoundedProcess' Apps/Drive/product/EDPBlockDevicePublisher.swift
          grep -Fq 'timeout: 15' Apps/Drive/product/EDPBlockDevicePublisher.swift
          grep -Fq 'DispatchSource.makeProcessSource' Apps/Drive/product/EDPBlockDevicePublisher.swift
          grep -Fq 'info.pbi_start_tvsec' Apps/Drive/product/EDPBlockDevicePublisher.swift
          ! grep -Fq 'waitForPublicationToDisappearAsync' Apps/Drive/product/EDPBlockDevicePublisher.swift
          ! grep -Fq '@Sendable func poll()' Apps/Drive/product/EDPBlockDevicePublisher.swift
          grep -Fq 'process.forceTerminate()' Apps/Drive/product/EDPTransportProvider.swift
          grep -Fq 'executableURL = URL(fileURLWithPath: "/sbin/umount")' Apps/Drive/product/EDPNativeSystem.swift
          ! grep -Fq 'Darwin.unmount(path, flags)' Apps/Drive/product/EDPNativeSystem.swift
          grep -Fq 'EDPIOMediaTerminationMonitor' Apps/Drive/product/EDPIOKitLifecycle.swift
          grep -Fq 'EDP_MFMOUNT_READY_FD' Apps/Drive/product/EDPMountSupport.swift
          ! grep -Fq 'pollBridgeActivation' Apps/Drive/product/EDPVaultRuntime.swift
          ! grep -Fq 'scheduler.schedule(on: lifecycleQueue, after: 0.1)' Apps/Drive/product/EDPVaultRuntime.swift
          ! grep -Fq '.milliseconds(250)' Apps/Drive/product/EDPNativeSystem.swift
          grep -Fq 'func acknowledgeGracefulShutdownReply()' Apps/Drive/product/EDPXPCProtocol.swift
          grep -Fq 'acknowledgementProxy.acknowledgeGracefulShutdownReply()' Apps/Drive/product/App/Model/EDPVaultViewModel.swift
          ! grep -Fq '.milliseconds(100)' Apps/Drive/product/EDPServiceMain.swift
          grep -Fq 'func unmountAsync(' Apps/Drive/product/EDPVaultRuntime.swift
          grep -Fq 'func ejectAsync(deviceID: String, completion:' Apps/Drive/product/EDPVaultRuntime.swift
          grep -Fq 'func unmountAllAsync(' Apps/Drive/product/EDPVaultRuntime.swift
          grep -Fq 'func shutdownGracefullyAsync(' Apps/Drive/product/EDPVaultRuntime.swift
          ! grep -Fq 'manager.unmount(' Apps/Drive/product/EDPVaultRuntime.swift
          ! grep -Fq 'manager.eject(' Apps/Drive/product/EDPVaultRuntime.swift
          test -f Apps/Drive/native/EDPFSKitPoC/Tools/ValidateTransportLifecycle.swift
          test -f Apps/Drive/native/EDPFSKitPoC/Tools/ValidateBoundedVFS.swift
          grep -Fq 'SERVICE_UCOMM="edp-drive-servic"' Apps/Drive/installer/scripts/native-preinstall
          grep -Fq "on /Volumes/.edp-block-" Apps/Drive/installer/scripts/native-preinstall
          grep -Fq 'restart macOS and run the installer again' Apps/Drive/installer/scripts/native-preinstall
          grep -Fq 'bootstrap_service()' Apps/Drive/installer/scripts/native-postinstall
          grep -Fq 'installer/scripts/native-preinstall' Apps/Drive/installer/build-clean-installer.sh
          grep -Fq 'installer/scripts/native-postinstall' Apps/Drive/installer/build-clean-installer.sh
          ! grep -Fq 'cat > "${SCRIPTS}/preinstall"' Apps/Drive/installer/build-clean-installer.sh
          bash -n Apps/Drive/installer/scripts/native-preinstall
          bash -n Apps/Drive/installer/scripts/native-postinstall
          bash -n Apps/Drive/installer/build-clean-installer.sh
          bash -n Apps/Drive/scripts/prepare-shared-edp-core.sh
          bash -n Tools/build-macos-icon.sh
          Tools/build-macos-icon.sh icns \
            Apps/Drive/product/App/EDPDriveIcon.svg \
            "${RUNNER_TEMP}/EDPDrive.icns"
          /usr/bin/file "${RUNNER_TEMP}/EDPDrive.icns" | grep -Fq 'Mac OS X icon'
          bash -n Apps/Drive/installer/build-native-installer.sh
          bash -n Apps/Drive/installer/build-transport-backends.sh
          echo 'RESULT=EDP_DRIVE_MONOREPO_CONTRACT_OK'
      - name: Build core and run EDP golden validation
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          cd Apps/Drive
          REPO_ROOT="$PWD"
          . scripts/prepare-shared-edp-core.sh
          CORE_SOURCES=(
            native/EDPFSKitPoC/Extension/EDPRawIO.swift
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift
            native/EDPFSKitPoC/Extension/EDPCrypto.swift
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift
            native/EDPFSKitPoC/Extension/EDPBlockDevice.swift
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift
          )
          xcrun swiftc -O -swift-version 6 -warnings-as-errors \
            -framework CryptoKit -framework Security \
            "${EDP_CORE_SWIFTC_FLAGS[@]}" \
            "${CORE_SOURCES[@]}" \
            native/EDPFSKitPoC/Tools/ValidateEDPNativeCore.swift \
            -o "${RUNNER_TEMP}/validate-edp-native-core"
          "${RUNNER_TEMP}/validate-edp-native-core" fixtures/golden/disks.json \
            | tee "${RUNNER_TEMP}/native-core.txt"
          grep -Fq 'RESULT=SWIFT_NATIVE_CRYPTO_CORE_OK' "${RUNNER_TEMP}/native-core.txt"
          grep -Fq 'RESULT=SWIFT_NATIVE_LBA11_LBA12_OK' "${RUNNER_TEMP}/native-core.txt"
          grep -Fq 'RESULT=SWIFT_NATIVE_ENCRYPTED_READER_OK' "${RUNNER_TEMP}/native-core.txt"
          xcrun swiftc -O -swift-version 6 -warnings-as-errors \
            product/EDPLifecycleScheduler.swift \
            product/EDPTransportProvider.swift \
            native/EDPFSKitPoC/Tools/ValidateTransportLifecycle.swift \
            -o "${RUNNER_TEMP}/validate-transport-lifecycle"
          "${RUNNER_TEMP}/validate-transport-lifecycle" \
            | tee "${RUNNER_TEMP}/transport-lifecycle.txt"
          grep -Fq 'RESULT=TRANSPORT_LIFECYCLE_HARDENING_OK' \
            "${RUNNER_TEMP}/transport-lifecycle.txt"
          xcrun swiftc -O -swift-version 6 -warnings-as-errors \
            -framework CryptoKit -framework Security -framework DiskArbitration -framework IOKit \
            "${EDP_CORE_SWIFTC_FLAGS[@]}" \
            "${CORE_SOURCES[@]}" \
            product/EDPIOKitLifecycle.swift \
            product/EDPNativeSystem.swift \
            native/EDPFSKitPoC/Tools/ValidateBoundedVFS.swift \
            -o "${RUNNER_TEMP}/validate-bounded-vfs"
          "${RUNNER_TEMP}/validate-bounded-vfs" \
            | tee "${RUNNER_TEMP}/bounded-vfs.txt"
          grep -Fq 'RESULT=BOUNDED_VFS_UNMOUNT_GUARD_OK' \
            "${RUNNER_TEMP}/bounded-vfs.txt"
          xcrun swiftc -O -swift-version 6 -warnings-as-errors \
            native/EDPFSKitPoC/Extension/EDPAlignedRead.swift \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Tools/ValidateEDPMetadataProbe.swift \
            -o "${RUNNER_TEMP}/validate-edp-media-classifier"
          "${RUNNER_TEMP}/validate-edp-media-classifier" fixtures/golden/disks.json \
            | tee "${RUNNER_TEMP}/media-classifier.txt"
          grep -Fq 'MEDIA_CLASS_STANDARD_ENCRYPTED=OK' "${RUNNER_TEMP}/media-classifier.txt"
          grep -Fq 'MEDIA_CLASS_LEGACY_NOPWD=OK' "${RUNNER_TEMP}/media-classifier.txt"
          grep -Fq 'MEDIA_CLASS_CURRENT_NOPWD=OK' "${RUNNER_TEMP}/media-classifier.txt"
          grep -Fq 'MEDIA_CLASS_UNRECOGNIZED_EDP=OK' "${RUNNER_TEMP}/media-classifier.txt"
          grep -Fq 'MEDIA_CLASS_ORDINARY_USB=OK' "${RUNNER_TEMP}/media-classifier.txt"
          grep -Fq 'REAL_STANDARD_CLASSIFICATION_OK=disk4' "${RUNNER_TEMP}/media-classifier.txt"
          grep -Fq 'REAL_STANDARD_CLASSIFICATION_OK=disk5' "${RUNNER_TEMP}/media-classifier.txt"
          echo 'RESULT=EDP_DRIVE_GOLDEN_GATE_OK'
      - name: Compile native daemon and SwiftUI app
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          cd Apps/Drive
          REPO_ROOT="$PWD"
          . scripts/prepare-shared-edp-core.sh
          CORE_SOURCES=(
            native/EDPFSKitPoC/Extension/EDPRawIO.swift
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift
            native/EDPFSKitPoC/Extension/EDPCrypto.swift
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift
            native/EDPFSKitPoC/Extension/EDPBlockDevice.swift
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift
          )
          PRODUCT_SOURCES=(
            product/EDPCredentialStore.swift
            product/EDPDevicePolicyStore.swift
            product/EDPMacFUSERuntimePolicy.swift
            product/EDPLifecycleScheduler.swift
            product/EDPLifecycleJournal.swift
            product/EDPRuntimeMetrics.swift
            product/EDPTransportProvider.swift
            product/EDPTransportRuntimePolicy.swift
            product/EDPFinderVolumeDefaults.swift
            product/EDPIOKitLifecycle.swift
            product/EDPNativeSystem.swift
            product/EDPBlockDevicePublisher.swift
            product/EDPXPCProtocol.swift
            product/EDPXPCSecurity.swift
            product/EDPRuntimeSupport.swift
            product/EDPRuntimeState.swift
            product/EDPDeviceOperations.swift
            product/EDPDeviceDiscoveryController.swift
            product/EDPRawAccess.swift
            product/EDPRawAccessCoordinator.swift
            product/EDPAutomationState.swift
            product/EDPActivityStore.swift
            product/EDPEjectCoordinator.swift
            product/EDPServiceLifecycleState.swift
            product/EDPRecoveryCoordinator.swift
            product/EDPMountLifecycle.swift
            product/EDPMountSupport.swift
            product/EDPXPCService.swift
            product/EDPServiceMain.swift
            product/EDPVaultRuntime.swift
          )
          /usr/bin/cc -O2 -Wall -Wextra -Iproduct -c product/EDPRawValidation.c -o "${RUNNER_TEMP}/EDPRawValidation.o"
          /usr/bin/cc -O2 -Wall -Wextra -Iproduct -c product/EDPRawFDBroker.c -o "${RUNNER_TEMP}/EDPRawFDBroker.o"
          xcrun swiftc -O -swift-version 6 -warnings-as-errors \
            -Xfrontend -disable-availability-checking \
            -framework CryptoKit -framework Security -framework CoreFoundation -framework IOKit \
            "${EDP_CORE_SWIFTC_FLAGS[@]}" \
            "${CORE_SOURCES[@]}" "${PRODUCT_SOURCES[@]}" \
            "${RUNNER_TEMP}/EDPRawValidation.o" "${RUNNER_TEMP}/EDPRawFDBroker.o" \
            -o "${RUNNER_TEMP}/edp-drive-service"
          xcrun swiftc -O -swift-version 6 -warnings-as-errors \
            -framework AppKit -framework FSKit -framework SwiftUI -framework ServiceManagement \
            -framework CoreFoundation -framework IOKit \
            ../../Shared/UI/EDPDesignSystem.swift \
            product/EDPXPCProtocol.swift product/App/EDPUSBVaultApp.swift \
            product/App/Service/EDPAppServiceSupport.swift \
            product/App/Service/EDPXPCSmokeSupport.swift \
            product/App/Model/EDPVaultViewModel.swift \
            product/App/Sidebar/EDPSidebarView.swift \
            product/App/Shell/EDPMainWindow.swift \
            product/App/Pages/EDPOverviewView.swift \
            product/App/Pages/EDPDevicesView.swift \
            product/App/Pages/EDPActivityView.swift \
            product/App/Pages/EDPSettingsView.swift \
            product/App/MenuBar/EDPMenuBarView.swift \
            "${RUNNER_TEMP}/EDPRawValidation.o" "${RUNNER_TEMP}/EDPRawFDBroker.o" \
            -o "${RUNNER_TEMP}/edp-drive-app"
          xcrun swiftc -O -swift-version 6 -warnings-as-errors \
            -Xfrontend -disable-availability-checking \
            -framework CryptoKit -framework Security \
            product/EDPCredentialStore.swift \
            native/EDPFSKitPoC/Tools/ValidateCredentialStore.swift \
            -o "${RUNNER_TEMP}/validate-edp-credential-store"
          "${RUNNER_TEMP}/validate-edp-credential-store" \
            | tee "${RUNNER_TEMP}/credential-store.txt"
          grep -Fq 'RESULT=KEYCHAIN_NAMESPACE_MIGRATION_ATOMIC_OK' \
            "${RUNNER_TEMP}/credential-store.txt"
          echo 'RESULT=EDP_DRIVE_NATIVE_BUILD_OK'

  regression-fast:
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fast and identity regression
        run: |
          set -euo pipefail
          mkdir -p artifacts/drive-tests
          make drive-test-fast | tee artifacts/drive-tests/fast.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drive-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/drive-tests/fast.log

  regression-virtual-usb:
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
