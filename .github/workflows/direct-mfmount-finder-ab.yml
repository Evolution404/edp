name: Direct MFMount Generic vs Local Finder A-B

on:
  push:
    branches: ["test/self-signed-standalone-distribution"]
    paths:
      - ".github/workflows/direct-mfmount-finder-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-mfmount-finder-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finder-ab:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      MACFUSE_DMG_SHA256: "7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15"
      MACFUSE_DMG_URL: "https://github.com/macfuse/macfuse/releases/download/macfuse-5.3.3/macfuse-5.3.3.dmg"
      GENERIC_ID: "io.macfuse.app.fsmodule.macfuse"
      LOCAL_ID: "io.macfuse.app.fsmodule.macfuse-local"
      MOUNT_COMMIT: "313b9c68d04cd779bffc9f8bd9f32a4e1f5baf70"
      LIBRARY3_COMMIT: "9a3db24bf7e3896d69a514a70e91dc41eefb948b"

    steps:
      - uses: actions/checkout@v6

      - name: Install and enable macFUSE 5.3.3 FSKit modules
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          DMG="${RUNNER_TEMP}/macfuse.dmg"
          curl -fsSL --retry 3 "${MACFUSE_DMG_URL}" -o "${DMG}"
          test "$(shasum -a 256 "${DMG}" | awk '{print $1}')" = "${MACFUSE_DMG_SHA256}"
          ATTACH="$(hdiutil attach -nobrowse -readonly "${DMG}")"
          VOL="$(printf '%s\n' "${ATTACH}" | awk -F '\t' '/\/Volumes\// {print $NF; exit}')"
          PKG="$(find "${VOL}" -maxdepth 2 \( -type f -o -type d \) -name '*.pkg' -print -quit)"
          pkgutil --check-signature "${PKG}"
          sudo installer -pkg "${PKG}" -target /
          hdiutil detach "${VOL}" >/dev/null

          APP="/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app"
          LSREGISTER="/System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister"
          "${LSREGISTER}" -f -R -trusted "${APP}"
          while IFS= read -r EXT; do pluginkit -a "${EXT}" || true; done < <(find "${APP}/Contents" -maxdepth 5 -type d -name '*.appex' -print)
          pluginkit -a "${APP}" || true
          pluginkit -e use -i "${GENERIC_ID}" || true
          pluginkit -e use -i "${LOCAL_ID}" || true
          SETTINGS="${HOME}/Library/Group Containers/group.com.apple.fskit.settings/enabledModules.plist"
          mkdir -p "$(dirname "${SETTINGS}")"
          python3 - "${SETTINGS}" "${GENERIC_ID}" "${LOCAL_ID}" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'wb') as f:
              plistlib.dump(sys.argv[2:], f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          chmod 600 "${SETTINGS}"
          killall -9 fskit_agent extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/plugins.txt" || true
          grep -Fq "+    ${GENERIC_ID}" "${RUNNER_TEMP}/plugins.txt"
          grep -Fq "+    ${LOCAL_ID}" "${RUNNER_TEMP}/plugins.txt"

      - name: Build Generic and Local Direct binaries
        run: |
          set -euo pipefail
          FRAMEWORKS="/Library/Filesystems/macfuse.fs/Contents/Frameworks"
          INC="${RUNNER_TEMP}/include"
          mkdir -p "${INC}/MFMount"
          curl -fsSL "https://raw.githubusercontent.com/macfuse/mount/${MOUNT_COMMIT}/Mount/MFMount.h" -o "${INC}/MFMount/MFMount.h"
          curl -fsSL "https://raw.githubusercontent.com/macfuse/library/${LIBRARY3_COMMIT}/include/fuse_kernel.h" -o "${INC}/fuse_kernel.h"

          cp native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c "${RUNNER_TEMP}/Generic.c"
          cp native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c "${RUNNER_TEMP}/Local.c"
          python3 - "${RUNNER_TEMP}/Local.c" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); old='"nobrowse,volname=%s"'; assert old in s; p.write_text(s.replace(old,'"local,nobrowse,volname=%s"',1))
          PY

          for MODE in Generic Local; do
            xcrun clang -std=c17 -Wall -Wextra -Werror -I"${INC}" -F"${FRAMEWORKS}" \
              -DMFMount=EDPAsyncMFMount -c "${RUNNER_TEMP}/${MODE}.c" -o "${RUNNER_TEMP}/${MODE}.o"
            xcrun clang -std=c17 -Wall -Wextra -Werror -I"${INC}" -F"${FRAMEWORKS}" \
              -c native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountAsyncShim.c -o "${RUNNER_TEMP}/shim-${MODE}.o"
            xcrun clang "${RUNNER_TEMP}/${MODE}.o" "${RUNNER_TEMP}/shim-${MODE}.o" \
              -F"${FRAMEWORKS}" -framework MFMount -framework CoreFoundation -framework DiskArbitration \
              -Wl,-rpath,"${FRAMEWORKS}" -o "${RUNNER_TEMP}/direct-${MODE}"
            otool -L "${RUNNER_TEMP}/direct-${MODE}" | tee "${RUNNER_TEMP}/otool-${MODE}.txt"
            grep -Fq 'MFMount.framework' "${RUNNER_TEMP}/otool-${MODE}.txt"
            ! grep -Eiq 'libfuse|libosxfuse|libmacfuse' "${RUNNER_TEMP}/otool-${MODE}.txt"
          done
          echo 'AB_NO_LIBFUSE_DEPENDENCY=1'

          cat >"${RUNNER_TEMP}/flags.c" <<'C'
          #include <sys/mount.h>
          #include <stdio.h>
          int main(int c,char**v){struct statfs s;if(c!=2||statfs(v[1],&s))return 1;printf("FSTYPE=%s FLAGS=0x%08x DONTBROWSE=%d LOCAL=%d\n",s.f_fstypename,(unsigned)s.f_flags,!!(s.f_flags&MNT_DONTBROWSE),!!(s.f_flags&MNT_LOCAL));return 0;}
          C
          xcrun clang -Wall -Wextra -Werror "${RUNNER_TEMP}/flags.c" -o "${RUNNER_TEMP}/flags"
          cat >"${RUNNER_TEMP}/inspect.swift" <<'SWIFT'
          import Foundation
          @main struct I { static func main() throws { let u=URL(fileURLWithPath:CommandLine.arguments[1],isDirectory:true); let v=try u.resourceValues(forKeys:[.volumeIsBrowsableKey,.volumeNameKey,.volumeIsLocalKey]); print("BROWSABLE=\(v.volumeIsBrowsable == true ? 1:0) NAME=\(v.volumeName ?? "<nil>") LOCAL=\(v.volumeIsLocal == true ? 1:0)") } }
          SWIFT
          xcrun swiftc -swift-version 6 -parse-as-library -warnings-as-errors "${RUNNER_TEMP}/inspect.swift" -o "${RUNNER_TEMP}/inspect"

      - name: Mount Generic and Local simultaneously
        run: |
          set -euo pipefail
          for MODE in Generic Local; do
            RAW="${RUNNER_TEMP}/${MODE}.raw"
            MP="/Volumes/EDP-AB-${MODE}-$(uuidgen | tr '[:upper:]' '[:lower:]')"
            NAME="EDP AB ${MODE}"
            dd if=/dev/zero of="${RAW}" bs=1m count=16 status=none
            printf "EDP-AB-${MODE}" | dd of="${RAW}" bs=1 seek=4096 conv=notrunc status=none
            sudo mkdir -p "${MP}" && sudo chown "$(id -u):$(id -g)" "${MP}"
            echo -n "${MP}" > "${RUNNER_TEMP}/mp-${MODE}"
            basename "${MP}" > "${RUNNER_TEMP}/finder-name-${MODE}"
            "${RUNNER_TEMP}/direct-${MODE}" "${RAW}" "${MP}" "${NAME}" >"${RUNNER_TEMP}/${MODE}.log" 2>&1 &
            echo $! > "${RUNNER_TEMP}/pid-${MODE}"
            OK=0
            for _ in $(seq 1 30); do
              if mount | grep -Fq " on ${MP} "; then OK=1; break; fi
              kill -0 "$(cat "${RUNNER_TEMP}/pid-${MODE}")" 2>/dev/null || break
              sleep 1
            done
            cat "${RUNNER_TEMP}/${MODE}.log" || true
            test "${OK}" = 1
            echo "AB_${MODE}_MOUNTED=1"
            LINE="$(mount | grep -F " on ${MP} ")"; echo "AB_${MODE}_MOUNT=${LINE}"; echo "${LINE}" | grep -Fq 'fskit'
            echo "AB_${MODE}_STATFS=$(${RUNNER_TEMP}/flags "${MP}")"
            echo "AB_${MODE}_RESOURCE=$(${RUNNER_TEMP}/inspect "${MP}")"
            test -f "${MP}/volume.raw"
            test "$(dd if="${MP}/volume.raw" bs=1 skip=4096 count="$(printf 'EDP-AB-%s' "${MODE}" | wc -c | tr -d ' ')" status=none)" = "EDP-AB-${MODE}"
            printf 'RW' | dd of="${MP}/volume.raw" bs=1 seek=8192 conv=notrunc status=none
            test "$(dd if="${RAW}" bs=1 skip=8192 count=2 status=none)" = RW
            echo "AB_${MODE}_RW_OK=1"
            ATTACH="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${MP}/volume.raw")"
            DISK="$(printf '%s\n' "${ATTACH}" | awk '/^\/dev\/disk/ {print $1; exit}')"
            test -n "${DISK}"
            hdiutil detach "${DISK}" -force >/dev/null
            echo "AB_${MODE}_DISKIMAGES2_OK=1"
          done

      - name: Finder visibility A-B hard comparison
        run: |
          set -euo pipefail
          GENERIC_FINDER_NAME="$(cat "${RUNNER_TEMP}/finder-name-Generic")"
          LOCAL_FINDER_NAME="$(cat "${RUNNER_TEMP}/finder-name-Local")"
          echo "GENERIC_FINDER_EXPECTED=${GENERIC_FINDER_NAME}"
          echo "LOCAL_FINDER_EXPECTED=${LOCAL_FINDER_NAME}"

          check_finder() {
            local LABEL="$1"
            local OUT
            OUT="$(osascript -e 'tell application "Finder" to get name of every disk' 2>/dev/null || true)"
            echo "FINDER_${LABEL}=${OUT}"
            if printf '%s\n' "${OUT}" | grep -Fq "${GENERIC_FINDER_NAME}"; then G=1; else G=0; fi
            if printf '%s\n' "${OUT}" | grep -Fq "${LOCAL_FINDER_NAME}"; then L=1; else L=0; fi
            echo "FINDER_${LABEL}_GENERIC_VISIBLE=${G}"
            echo "FINDER_${LABEL}_LOCAL_VISIBLE=${L}"
            printf '%s %s' "${G}" "${L}" > "${RUNNER_TEMP}/finder-${LABEL}.flags"
          }

          open -a Finder
          sleep 3
          check_finder initial
          sleep 10
          check_finder settled
          killall Finder 2>/dev/null || true
          open -a Finder
          sleep 5
          check_finder relaunched

          read G1 L1 < "${RUNNER_TEMP}/finder-initial.flags"
          read G2 L2 < "${RUNNER_TEMP}/finder-settled.flags"
          read G3 L3 < "${RUNNER_TEMP}/finder-relaunched.flags"
          echo "AB_VISIBILITY_MATRIX generic=${G1}/${G2}/${G3} local=${L1}/${L2}/${L3}"

          if [[ "${G1}${G2}${G3}" = 111 && "${L1}${L2}${L3}" = 000 ]]; then
            echo 'RESULT=LOCAL_FSKIT_FINDER_HIDDEN_AB_CONFIRMED'
          elif [[ "${G1}${G2}${G3}" = 000 && "${L1}${L2}${L3}" = 000 ]]; then
            echo 'RESULT=HOSTED_FINDER_INCONCLUSIVE_BOTH_HIDDEN'
            exit 2
          else
            echo 'RESULT=LOCAL_FSKIT_FINDER_AB_NOT_CONFIRMED'
            exit 1
          fi

      - name: Cleanup without blocking
        if: always()
        run: |
          set +e
          for MODE in Generic Local; do
            echo "--- ${MODE} final log ---"; cat "${RUNNER_TEMP}/${MODE}.log" 2>/dev/null || true
            if [[ -f "${RUNNER_TEMP}/pid-${MODE}" ]]; then P="$(cat "${RUNNER_TEMP}/pid-${MODE}")"; kill "${P}" 2>/dev/null; sleep 1; kill -9 "${P}" 2>/dev/null; fi
            if [[ -f "${RUNNER_TEMP}/mp-${MODE}" ]]; then
              MP="$(cat "${RUNNER_TEMP}/mp-${MODE}")"
              if mount | grep -Fq " on ${MP} "; then
                sudo /sbin/umount -f "${MP}" >/dev/null 2>&1 & U=$!
                for _ in $(seq 1 5); do kill -0 "${U}" 2>/dev/null || break; sleep 1; done
                kill -9 "${U}" 2>/dev/null || true
              fi
              sudo rmdir "${MP}" 2>/dev/null || true
            fi
          done
          exit 0
