name: EDP Crypto + NTFS-3G Read/Write E2E

on:
  push:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - ".github/workflows/edp-crypto-ntfs3g-readwrite.yml"
      - "scripts/build-ntfs3g-runtime.sh"
      - "native/EDPFSKitPoC/Extension/EDPRawIO.swift"
      - "native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift"
      - "native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift"
      - "native/EDPFSKitPoC/Extension/EDPCrypto.swift"
      - "native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift"
      - "native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift"
      - "native/EDPFSKitPoC/Extension/EDPBlockDevice.swift"
      - "native/EDPFSKitPoC/Tools/DiskImages2Attach.m"
      - "native/EDPFSKitPoC/Tools/PrepareEncryptedDiskImage.swift"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteBlockCBridge.swift"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteFuseBridge.c"
      - "native/EDPFSKitPoC/Tools/probe-edp-crypto-ntfs-readwrite.sh"
      - "product/EDPVaultRuntime.swift"
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  ntfs3g-readwrite:
    name: encrypted backing -> bundled NTFS-3G read/write/remount
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Record runtime
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          uname -m
          xcodebuild -version
          test -d /System/Library/PrivateFrameworks/DiskImages2.framework
          echo 'RESULT=DISKIMAGES2_PRESENT'

      - name: Install official macFUSE
        run: |
          set -euo pipefail
          brew install --cask macfuse
          brew list --cask --versions macfuse
          pkg-config --exists fuse
          pkg-config --modversion fuse
          test -d /Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app/Contents/Extensions/io.macfuse.app.fsmodule.macfuse.appex
          echo 'RESULT=OFFICIAL_MACFUSE_INSTALLED'

      - name: Enable macFUSE FSKit modules on ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/pluginkit -e use -i io.macfuse.app.fsmodule.macfuse || true
          /usr/bin/pluginkit -e use -i io.macfuse.app.fsmodule.macfuse-local || true

          SETTINGS_DIR="$HOME/Library/Group Containers/group.com.apple.fskit.settings"
          SETTINGS="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${SETTINGS}" <<'PY'
          import os
          import plistlib
          import sys
          path = sys.argv[1]
          enabled = []
          if os.path.exists(path):
              try:
                  with open(path, "rb") as handle:
                      value = plistlib.load(handle)
                  if isinstance(value, list):
                      enabled = value
              except Exception:
                  pass
          for identifier in (
              "io.macfuse.app.fsmodule.macfuse",
              "io.macfuse.app.fsmodule.macfuse-local",
          ):
              if identifier not in enabled:
                  enabled.append(identifier)
          with open(path, "wb") as handle:
              plistlib.dump(enabled, handle, fmt=plistlib.FMT_BINARY)
          PY
          plutil -p "${SETTINGS}"
          killall fskit_agent 2>/dev/null || true
          killall extensionkitservice 2>/dev/null || true
          sleep 2
          echo 'RESULT=CI_ONLY_MACFUSE_MODULE_STATE_SEEDED'

      - name: Build pinned bundled NTFS-3G runtime
        timeout-minutes: 8
        run: |
          set -euo pipefail
          bash scripts/build-ntfs3g-runtime.sh "${RUNNER_TEMP}/ntfs-runtime"
          test -x "${RUNNER_TEMP}/ntfs-runtime/ntfs-3g/bin/ntfs-3g"
          test -x "${RUNNER_TEMP}/ntfs-runtime/ntfs-3g/test-tools/mkntfs"
          echo 'RESULT=BUNDLED_NTFS3G_RUNTIME_READY'

      - name: Run encrypted NTFS-3G read/write/remount proof
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo mkdir -p /Volumes/edp-crypto-readwrite /Volumes/EDPNTFSRW
          sudo chown "$(id -u):$(id -g)" /Volumes/edp-crypto-readwrite /Volumes/EDPNTFSRW
          chmod 700 /Volumes/edp-crypto-readwrite /Volumes/EDPNTFSRW
          EDP_RW_MOUNT_POINT=/Volumes/edp-crypto-readwrite \
          EDP_NTFS_MOUNT_POINT=/Volumes/EDPNTFSRW \
          EDP_NTFS_RUNTIME="${RUNNER_TEMP}/ntfs-runtime/ntfs-3g" \
            bash native/EDPFSKitPoC/Tools/probe-edp-crypto-ntfs-readwrite.sh

      - name: Capture live state after failure
        if: failure()
        timeout-minutes: 1
        run: |
          set +e
          OUT="${RUNNER_TEMP}/edp-crypto-ntfs3g-readwrite/live-state.txt"
          mkdir -p "$(dirname "${OUT}")"
          {
            echo '=== timestamp ==='
            date -u
            echo '=== mounts ==='
            /sbin/mount
            echo '=== disks ==='
            /usr/sbin/diskutil list
            echo '=== relevant processes ==='
            /bin/ps -axo pid,ppid,state,etime,command | /usr/bin/grep -E 'ntfs-3g|edp-readwrite-fuse|macfuse|fskit|DiskImages2|umount' || true
            echo '=== macFUSE / FSKit unified log ==='
            /usr/bin/log show --last 5m --style compact \
              --predicate '(process == "fskitd") OR (process == "fskit_agent") OR (process CONTAINS[c] "macfuse") OR (eventMessage CONTAINS[c] "macfuse") OR (eventMessage CONTAINS[c] "ntfs")' \
              2>&1 | /usr/bin/tail -n 500 || true
            echo '=== PluginKit macFUSE modules ==='
            /usr/bin/pluginkit -mAvvv -i io.macfuse.app.fsmodule.macfuse || true
            /usr/bin/pluginkit -mAvvv -i io.macfuse.app.fsmodule.macfuse-local || true
          } >"${OUT}" 2>&1
          cat "${OUT}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edp-crypto-ntfs3g-readwrite-${{ github.run_id }}
          path: ${{ runner.temp }}/edp-crypto-ntfs3g-readwrite/
          if-no-files-found: ignore
          retention-days: 14
