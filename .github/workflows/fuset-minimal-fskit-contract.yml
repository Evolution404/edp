name: FUSE-T Minimal FSKit Contract

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/**"
      - ".github/workflows/fuset-minimal-fskit-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuset-minimal-fskit-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: RPC framing and 1.2.7 binary contract
    runs-on: macos-26
    timeout-minutes: 12
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      DIAG_PATH: "docs/diagnostics/fuset-1.2.7-ci-contract.txt"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify macOS 26 and Xcode 26
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test "$(xcodebuild -version | awk '/Xcode/ {print int($2); exit}')" -ge 26

      - name: Run dependency-free RPC contract tests
        run: |
          set -euo pipefail
          python3 native/EDPFSKitPoC/Tools/FuseTMinimal/fuset_rpc.py --self-test

      - name: Expand official FUSE-T package without installing it
        id: expand
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/fuse-t-${FUSET_VERSION}.pkg"
          EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl --fail --location --retry 3 --silent --show-error "${FUSET_PKG_URL}" -o "${PKG}"
          ACTUAL="$(shasum -a 256 "${PKG}" | awk '{print $1}')"
          echo "FUSET_PKG_SHA256_ACTUAL=${ACTUAL}"
          test "${ACTUAL}" = "${FUSET_PKG_SHA256}"
          rm -rf "${EXPANDED}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"

          GO_BIN="$(find "${EXPANDED}" -type f -name "go-nfsv4-${FUSET_VERSION}" -print -quit)"
          EXT_BIN="$(find "${EXPANDED}" -type f -path '*FskitSrvModule.appex/Contents/MacOS/FskitSrvModule' -print -quit)"
          HOST_BIN="$(find "${EXPANDED}" -type f -path '*fuse-t.app/Contents/MacOS/*' -print -quit)"
          test -n "${GO_BIN}"
          test -n "${EXT_BIN}"
          test -n "${HOST_BIN}"
          test -f "${GO_BIN}"
          test -f "${EXT_BIN}"
          printf 'GO_BIN=%s\nEXT_BIN=%s\nHOST_BIN=%s\n' "${GO_BIN}" "${EXT_BIN}" "${HOST_BIN}" >> "${GITHUB_ENV}"

      - name: Extract stable protocol evidence
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${DIAG_PATH}")"
          TMP="${RUNNER_TEMP}/fuset-contract.txt"

          {
            echo '# FUSE-T 1.2.7 macOS 26 CI protocol contract'
            echo
            echo "generated_at_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "runner_os=$(sw_vers -productVersion)"
            echo "runner_build=$(sw_vers -buildVersion)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "package_sha256=${FUSET_PKG_SHA256}"
            echo
            echo '## Binary identities'
            file "${GO_BIN}"
            file "${EXT_BIN}"
            shasum -a 256 "${GO_BIN}" "${EXT_BIN}"
            echo
            echo '## Embedded Go JSON struct tags'
            python3 - "${GO_BIN}" <<'PY'
          import re
          import sys
          path = sys.argv[1]
          data = open(path, 'rb').read()
          tags = sorted(set(x.decode('ascii', 'replace') for x in re.findall(rb'json:"[^"\x00]{1,96}"', data)))
          for tag in tags:
              print(tag)
          PY
            echo
            echo '## Embedded protocol tokens'
            python3 - "${GO_BIN}" "${EXT_BIN}" <<'PY'
          import re
          import sys
          wanted = {
              'auth_token', 'session_id', 'request_id', 'socket_path', 'method', 'ok', 'errno',
              'lookup_item', 'dir_items', 'eof', 'cookie', 'verifier', 'max_entries', 'parent_id',
              'node_id', 'handle_id', 'open_modes', 'keeping_modes', 'offset', 'length', 'payload',
              'handshake', 'ping', 'get_root_attributes', 'statfs', 'lookup', 'open_directory',
              'enumerate_directory', 'close_directory', 'open', 'read', 'close', 'list_xattrs',
              'get_xattr', 'create', 'create_directory', 'create_symlink', 'remove',
              'remove_directory', 'rename', 'set_attributes', 'set_xattr', 'remove_xattr',
              'truncate', 'write', 'readonly', 'namedattr'
          }
          for path in sys.argv[1:]:
              data = open(path, 'rb').read()
              printable = set(x.decode('ascii', 'replace') for x in re.findall(rb'[A-Za-z_][A-Za-z0-9_]{1,63}', data))
              print(f'[{path}]')
              for token in sorted(wanted & printable):
                  print(token)
          PY
            echo
            echo '## go-nfsv4 focused strings'
            strings -a "${GO_BIN}" \
              | grep -Eai 'handshake|auth_token|session_id|request_id|socket_path|open_directory|enumerate_directory|close_directory|lookup|statfs|get_root_attributes|open_file|read_file|close_file|node_id|file_handle|handle_id|directory_handle|dir_items|cookie|verifier|eof|max_entries|offset|length|readonly|namedattr|xattr|errno|payload' \
              | sort -u \
              | head -n 1400 || true
            echo
            echo '## FskitSrvModule focused strings'
            strings -a "${EXT_BIN}" \
              | grep -Eai 'handshake|auth_token|session_id|request_id|socket_path|open_directory|enumerate_directory|close_directory|lookup|statfs|get_root_attributes|open_file|read_file|close_file|node_id|file_handle|handle_id|directory_handle|dir_items|cookie|verifier|eof|max_entries|offset|length|readonly|namedattr|xattr|errno|payload|readFileWithNodeID|fetchAttributesForNodeID|enumerateDirectory' \
              | sort -u \
              | head -n 1400 || true
            echo
            echo '## Mach-O symbols containing fskit/rpc'
            nm -nm "${EXT_BIN}" 2>/dev/null \
              | grep -Eai 'fskit|rpc|handshake|lookup|enumerate|readFile|fetchAttributes' \
              | head -n 1000 || true
            echo
            echo '## go-nfsv4 Mach-O symbols containing fskit/rpc'
            nm -nm "${GO_BIN}" 2>/dev/null \
              | grep -Eai 'fskit|rpc|handshake|lookup|enumerate|readFile|fetchAttributes' \
              | head -n 1000 || true
          } > "${TMP}"

          cp "${TMP}" "${DIAG_PATH}"
          echo "DIAGNOSTIC_LINES=$(wc -l < "${DIAG_PATH}" | tr -d ' ')"
          echo "DIAGNOSTIC_BYTES=$(wc -c < "${DIAG_PATH}" | tr -d ' ')"
          sed -n '1,340p' "${DIAG_PATH}"

      - name: Commit deterministic diagnostic back to experiment branch
        if: github.ref_name == 'test/fuset-minimal-fskit-bridge'
        run: |
          set -euo pipefail
          perl -0pi -e 's/generated_at_utc=.*/generated_at_utc=<normalized>/g' "${DIAG_PATH}"
          git add "${DIAG_PATH}"
          if git diff --cached --quiet -- "${DIAG_PATH}"; then
            echo 'RESULT=FUSET_CONTRACT_DIAGNOSTIC_UNCHANGED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: capture FUSE-T 1.2.7 CI contract [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'RESULT=FUSET_CONTRACT_DIAGNOSTIC_COMMITTED'
