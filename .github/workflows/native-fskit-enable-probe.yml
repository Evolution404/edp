name: Native FSKit Enablement Negative Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-control:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build sign install and register
        run: |
          set -euo pipefail
          brew install xcodegen
          cd native/EDPFSKitPoC
          xcodegen generate
          xcodebuild \
            -project EDPFSKitPoC.xcodeproj \
            -scheme EDPFSKitHost \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/DD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          cd "${GITHUB_WORKSPACE}"

          SRC="${RUNNER_TEMP}/DD/Build/Products/Release/EDPFSKitPoC.app"
          EXT="${SRC}/Contents/Extensions/EDPFSKitExtension.appex"
          codesign --force --sign - --generate-entitlement-der \
            --entitlements native/EDPFSKitPoC/Extension/EDPFSKitExtension.entitlements \
            "${EXT}"
          codesign --force --sign - "${SRC}"

          sudo rm -rf /Applications/EDPFSKitPoC.app
          sudo ditto "${SRC}" /Applications/EDPFSKitPoC.app
          APP=/Applications/EDPFSKitPoC.app
          EXT="${APP}/Contents/Extensions/EDPFSKitExtension.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister \
            -f -R -trusted "${APP}"
          pluginkit -a "${EXT}"
          pluginkit -a "${APP}"

          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv \
            | tee "${RUNNER_TEMP}/pluginkit.txt"
          grep -F 'com.edp.usbvault.fskit-poc.extension' "${RUNNER_TEMP}/pluginkit.txt"

      - name: Compile FSClient inspector
        run: |
          set -euo pipefail
          xcrun swiftc -framework FSKit \
            native/EDPFSKitPoC/Tools/InspectFSKit.swift \
            -o "${RUNNER_TEMP}/inspect-fskit"

          set +e
          "${RUNNER_TEMP}/inspect-fskit" >"${RUNNER_TEMP}/before.txt" 2>&1
          BEFORE_RC=$?
          set -e
          cat "${RUNNER_TEMP}/before.txt"
          echo "BEFORE_RC=${BEFORE_RC}"

      - name: Seed unsupported enabledModules plist
        run: |
          set -euo pipefail
          SETTINGS="${HOME}/Library/Group Containers/group.com.apple.fskit.settings/enabledModules.plist"
          mkdir -p "$(dirname "${SETTINGS}")"
          python3 - "${SETTINGS}" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          enabled = plistlib.load(path.open("rb")) if path.exists() else []
          if not isinstance(enabled, list):
              raise SystemExit(f"unexpected plist root: {type(enabled).__name__}")
          identifier = "com.edp.usbvault.fskit-poc.extension"
          if identifier not in enabled:
              enabled.append(identifier)
          with path.open("wb") as handle:
              plistlib.dump(enabled, handle, fmt=plistlib.FMT_BINARY)
          PY
          plutil -p "${SETTINGS}"
          killall fskit_agent 2>/dev/null || true
          killall extensionkitservice 2>/dev/null || true
          sleep 3

      - name: Prove plist seed does not bypass approval
        run: |
          set -euo pipefail
          set +e
          "${RUNNER_TEMP}/inspect-fskit" >"${RUNNER_TEMP}/after.txt" 2>&1
          AFTER_RC=$?
          set -e
          cat "${RUNNER_TEMP}/after.txt"
          echo "AFTER_RC=${AFTER_RC}"

          if grep -Fq 'FSKIT_MODULE_FOUND=com.edp.usbvault.fskit-poc.extension' "${RUNNER_TEMP}/after.txt"; then
            echo 'RESULT=PLIST_SEED_UNEXPECTEDLY_CHANGED_FSCLIENT_VISIBILITY'
            exit 1
          fi

          echo 'RESULT=PLIST_SEED_DOES_NOT_BYPASS_FSKIT_APPROVAL'

      - name: Upload negative-control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-fskit-enable-negative-control-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pluginkit.txt
            ${{ runner.temp }}/before.txt
            ${{ runner.temp }}/after.txt
          if-no-files-found: ignore
          retention-days: 14
