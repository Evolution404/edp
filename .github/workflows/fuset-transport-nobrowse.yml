name: FUSE-T FSKit Transport No-Browse

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift"
      - "product/EDPNativeSystem.swift"
      - "product/EDPVaultRuntime.swift"
      - ".github/workflows/fuset-transport-nobrowse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuset-transport-nobrowse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  option-delivery:
    name: ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: baseline-cli-nobrowse
            bridge_option: nobrowse
            config_scope: none
            expect_hidden: "0"
          - scenario: candidate-cli-dontbrowse
            bridge_option: dontbrowse
            config_scope: none
            expect_hidden: "1"
          - scenario: candidate-user-ini-nobrowse
            bridge_option: nobrowse
            config_scope: user
            expect_hidden: "1"
          - scenario: candidate-system-ini-nobrowse
            bridge_option: nobrowse
            config_scope: system
            expect_hidden: "1"
    runs-on: macos-26
    timeout-minutes: 15
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      FUSET_BUNDLE_ID: "org.fuset.fskit-srv.module"

    steps:
      - uses: actions/checkout@v6

      - name: Verify hosted runtime
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Stage official FUSE-T FSKit app
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/fuse-t-${FUSET_VERSION}.pkg"
          EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl --fail --location --retry 3 --silent --show-error "${FUSET_PKG_URL}" -o "${PKG}"
          ACTUAL="$(shasum -a 256 "${PKG}" | awk '{print $1}')"
          test "${ACTUAL}" = "${FUSET_PKG_SHA256}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"
          SOURCE_APP="$(find "${EXPANDED}" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"
          test -n "${SOURCE_APP}"
          codesign --verify --deep --strict --verbose=2 "${SOURCE_APP}"
          sudo rm -rf /Applications/fuse-t.app
          sudo ditto "${SOURCE_APP}" /Applications/fuse-t.app
          EXT="/Applications/fuse-t.app/Contents/Extensions/FskitSrvModule.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted /Applications/fuse-t.app
          pluginkit -a "${EXT}" || true
          pluginkit -a /Applications/fuse-t.app || true
          pluginkit -e use -i "${FUSET_BUNDLE_ID}" || true

          echo 'PACKAGE_CONFIG_FILES:'
          find "${EXPANDED}" -type f -name 'fuse-t.ini' -print -exec cat {} \; || true

      - name: Enable FSKit module on disposable runner
        run: |
          set -euo pipefail
          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"
          ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${FUSET_BUNDLE_ID}" <<'PY'
          import os, plistlib, sys
          path, bundle_id = sys.argv[1:]
          enabled = []
          if os.path.exists(path):
              try:
                  with open(path, "rb") as f:
                      value = plistlib.load(f)
                  if isinstance(value, list):
                      enabled = [x for x in value if isinstance(x, str)]
              except Exception:
                  pass
          if bundle_id not in enabled:
              enabled.append(bundle_id)
          with open(path, "wb") as f:
              plistlib.dump(enabled, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          chmod 600 "${ENABLED_PLIST}"
          killall -9 fskit_agent 2>/dev/null || true
          killall -9 extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/pluginkit.txt" || true
          grep -Fq "${FUSET_BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit.txt"

      - name: Configure candidate option path
        env:
          CONFIG_SCOPE: ${{ matrix.config_scope }}
        run: |
          set -euo pipefail
          case "${CONFIG_SCOPE}" in
            none)
              ;;
            user)
              mkdir -p "${HOME}/.fuse-t"
              cat >"${HOME}/.fuse-t/fuse-t.ini" <<'EOF'
          [Default]
          nobrowse=true
          EOF
              cat "${HOME}/.fuse-t/fuse-t.ini"
              ;;
            system)
              sudo mkdir -p "/Library/Application Support/fuse-t/cfg"
              printf '[Default]\nnobrowse=true\n' | sudo tee "/Library/Application Support/fuse-t/cfg/fuse-t.ini"
              ;;
            *)
              echo "unknown config scope: ${CONFIG_SCOPE}" >&2
              exit 64
              ;;
          esac

      - name: Build writable fixture and bridge variant
        env:
          BRIDGE_OPTION: ${{ matrix.bridge_option }}
        run: |
          set -euo pipefail
          RAW="${RUNNER_TEMP}/nobrowse.raw"
          SOURCE="${RUNNER_TEMP}/FuseTMinimalBridge.swift"
          cp native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift "${SOURCE}"
          if [[ "${BRIDGE_OPTION}" = "dontbrowse" ]]; then
            python3 - "${SOURCE}" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = 'readOnly ? "nobrowse,rdonly" : "nobrowse"'
          new = 'readOnly ? "dontbrowse,rdonly" : "dontbrowse"'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one bridge mount option expression, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          fi
          grep -F "readOnly ? \"${BRIDGE_OPTION},rdonly\" : \"${BRIDGE_OPTION}\"" "${SOURCE}"

          dd if=/dev/zero of="${RAW}" bs=1m count=8 status=none
          printf 'EDP-NOBROWSE-PROBE' | dd of="${RAW}" bs=1 seek=4096 conv=notrunc status=none
          xcrun swiftc -swift-version 6 -parse-as-library -warnings-as-errors \
            "${SOURCE}" -o "${RUNNER_TEMP}/FuseTMinimalBridge"

          cat >"${RUNNER_TEMP}/check-nobrowse.c" <<'EOF'
          #include <errno.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/mount.h>

          int main(int argc, char **argv) {
              if (argc != 2) return 64;
              struct statfs info;
              if (statfs(argv[1], &info) != 0) {
                  fprintf(stderr, "statfs: %s\n", strerror(errno));
                  return 65;
              }
              const int hidden = (info.f_flags & MNT_DONTBROWSE) != 0;
              printf("STATFS_FLAGS=0x%08x MNT_DONTBROWSE=%d\n", info.f_flags, hidden);
              return hidden ? 0 : 1;
          }
          EOF
          xcrun clang -Wall -Wextra -Werror "${RUNNER_TEMP}/check-nobrowse.c" -o "${RUNNER_TEMP}/check-nobrowse"
          echo "RAW=${RAW}" >> "${GITHUB_ENV}"

      - name: Verify kernel no-browse flag and writable transport
        env:
          EXPECT_HIDDEN: ${{ matrix.expect_hidden }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          HIDDEN="${RUNNER_TEMP}/.edp-nobrowse-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          LOG="${RUNNER_TEMP}/bridge.log"
          mkdir -p "${HIDDEN}"
          echo "HIDDEN=${HIDDEN}" >> "${GITHUB_ENV}"

          "${RUNNER_TEMP}/FuseTMinimalBridge" \
            --writable \
            --backing "${RAW}" \
            --mountpoint "${HIDDEN}" \
            --volume-name 'EDP NoBrowse Transport' \
            >"${LOG}" 2>&1 &
          BRIDGE_PID=$!
          echo "BRIDGE_PID=${BRIDGE_PID}" >> "${GITHUB_ENV}"

          mounted=false
          for attempt in $(seq 1 30); do
            if mount | grep -Fq " on ${HIDDEN} "; then
              mounted=true
              break
            fi
            if ! kill -0 "${BRIDGE_PID}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "${LOG}" || true
          test "${mounted}" = true
          echo "MOUNT=$(mount | grep -F " on ${HIDDEN} ")"

          set +e
          "${RUNNER_TEMP}/check-nobrowse" "${HIDDEN}"
          hidden_status=$?
          set -e
          case "${hidden_status}" in
            0) actual_hidden=1 ;;
            1) actual_hidden=0 ;;
            *) exit "${hidden_status}" ;;
          esac
          echo "SCENARIO=${SCENARIO} EXPECT_HIDDEN=${EXPECT_HIDDEN} ACTUAL_HIDDEN=${actual_hidden}"
          test "${actual_hidden}" = "${EXPECT_HIDDEN}"

          EXPOSED="${HIDDEN}/volume.raw"
          test -f "${EXPOSED}"
          cmp <(dd if="${RAW}" bs=1 skip=4096 count=18 status=none) \
              <(dd if="${EXPOSED}" bs=1 skip=4096 count=18 status=none)
          printf 'RW' | dd of="${EXPOSED}" bs=1 seek=8192 conv=notrunc status=none
          cmp <(dd if="${RAW}" bs=1 skip=8192 count=2 status=none) <(printf 'RW')
          echo "RESULT=FUSET_TRANSPORT_OPTION_DELIVERY_${SCENARIO}_OK"

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [[ -n "${HIDDEN:-}" ]]; then /sbin/umount "${HIDDEN}" 2>/dev/null || sudo /sbin/umount "${HIDDEN}" 2>/dev/null; fi
          if [[ -n "${BRIDGE_PID:-}" ]]; then kill "${BRIDGE_PID}" 2>/dev/null; fi
          sudo rm -rf /Applications/fuse-t.app
          sudo rm -f "/Library/Application Support/fuse-t/cfg/fuse-t.ini"
          rm -f "${HOME}/.fuse-t/fuse-t.ini"
          exit 0
