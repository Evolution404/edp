name: FUSE-T FSKit Transport Finder Visibility

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift"
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/DADiskNobrowseProbe.c"
      - "product/EDPNativeSystem.swift"
      - "product/EDPVaultRuntime.swift"
      - ".github/workflows/fuset-transport-nobrowse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuset-transport-finder-visibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disk-arbitration-nobrowse-contract:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      FUSET_BUNDLE_ID: "org.fuset.fskit-srv.module"

    steps:
      - uses: actions/checkout@v6

      - name: Verify hosted runtime
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Stage exact official FUSE-T FSKit runtime
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/fuse-t-${FUSET_VERSION}.pkg"
          EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl --fail --location --retry 3 --silent --show-error "${FUSET_PKG_URL}" -o "${PKG}"
          test "$(shasum -a 256 "${PKG}" | awk '{print $1}')" = "${FUSET_PKG_SHA256}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"
          SOURCE_APP="$(find "${EXPANDED}" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"
          test -n "${SOURCE_APP}"
          codesign --verify --deep --strict --verbose=2 "${SOURCE_APP}"
          sudo rm -rf /Applications/fuse-t.app
          sudo ditto "${SOURCE_APP}" /Applications/fuse-t.app
          EXT="/Applications/fuse-t.app/Contents/Extensions/FskitSrvModule.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted /Applications/fuse-t.app
          pluginkit -a "${EXT}" || true
          pluginkit -a /Applications/fuse-t.app || true
          pluginkit -e use -i "${FUSET_BUNDLE_ID}" || true

      - name: Enable FSKit module on disposable runner
        run: |
          set -euo pipefail
          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"
          ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${FUSET_BUNDLE_ID}" <<'PY'
          import os, plistlib, sys
          path, bundle_id = sys.argv[1:]
          enabled = []
          if os.path.exists(path):
              try:
                  with open(path, "rb") as f:
                      value = plistlib.load(f)
                  if isinstance(value, list):
                      enabled = [x for x in value if isinstance(x, str)]
              except Exception:
                  pass
          if bundle_id not in enabled:
              enabled.append(bundle_id)
          with open(path, "wb") as f:
              plistlib.dump(enabled, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          chmod 600 "${ENABLED_PLIST}"
          killall -9 fskit_agent 2>/dev/null || true
          killall -9 extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/pluginkit.txt" || true
          grep -Fq "${FUSET_BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit.txt"

      - name: Build bridge, Finder-browsability and Disk Arbitration probes
        run: |
          set -euo pipefail
          RAW="${RUNNER_TEMP}/finder-visibility.raw"
          dd if=/dev/zero of="${RAW}" bs=1m count=8 status=none
          printf 'EDP-FINDER-VISIBILITY' | dd of="${RAW}" bs=1 seek=4096 conv=notrunc status=none
          xcrun swiftc -swift-version 6 -parse-as-library -warnings-as-errors \
            native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift \
            -o "${RUNNER_TEMP}/FuseTMinimalBridge"

          cat >"${RUNNER_TEMP}/InspectVolume.swift" <<'SWIFT'
          import Foundation

          @main
          struct InspectVolume {
              static func main() throws {
                  guard CommandLine.arguments.count == 2 else { exit(64) }
                  let url = URL(fileURLWithPath: CommandLine.arguments[1], isDirectory: true)
                  let values = try url.resourceValues(forKeys: [
                      .volumeIsBrowsableKey,
                      .volumeNameKey,
                      .volumeLocalizedNameKey,
                      .volumeIsLocalKey,
                      .volumeIsReadOnlyKey,
                      .volumeMountFromLocationKey,
                      .volumeTypeNameKey,
                  ])
                  guard let browsable = values.volumeIsBrowsable else {
                      fputs("volumeIsBrowsable unavailable\n", stderr)
                      exit(65)
                  }
                  print("BROWSABLE=\(browsable ? 1 : 0)")
                  print("VOLUME_NAME=\(values.volumeName ?? "<nil>")")
                  print("LOCALIZED_NAME=\(values.volumeLocalizedName ?? "<nil>")")
                  print("LOCAL=\(values.volumeIsLocal == true ? 1 : 0)")
                  print("READ_ONLY=\(values.volumeIsReadOnly == true ? 1 : 0)")
                  print("MOUNT_FROM=\(values.volumeMountFromLocation ?? "<nil>")")
                  print("TYPE=\(values.volumeTypeName ?? "<nil>")")
              }
          }
          SWIFT
          xcrun swiftc -swift-version 6 -parse-as-library -warnings-as-errors \
            "${RUNNER_TEMP}/InspectVolume.swift" -o "${RUNNER_TEMP}/InspectVolume"

          cat >"${RUNNER_TEMP}/DASetPrivate.c" <<'EOF'
          #include <CoreFoundation/CoreFoundation.h>
          #include <DiskArbitration/DiskArbitration.h>
          #include <stdio.h>
          #include <string.h>

          /* kDADiskOptionPrivate was removed from the macOS 26.5 SDK headers.
             Historical public value: 0x00000100. Keep this diagnostic-local. */
          static const DADiskOptions kEDPLegacyDADiskOptionPrivate = 0x00000100u;

          int main(int argc, char **argv) {
              if (argc != 2) return 64;
              DASessionRef session = DASessionCreate(kCFAllocatorDefault);
              if (!session) return 65;
              CFURLRef url = CFURLCreateFromFileSystemRepresentation(
                  kCFAllocatorDefault,
                  (const UInt8 *)argv[1],
                  (CFIndex)strlen(argv[1]),
                  true
              );
              if (!url) return 66;
              DADiskRef disk = DADiskCreateFromVolumePath(kCFAllocatorDefault, session, url);
              if (!disk) {
                  puts("DA_DISK_FROM_VOLUME_PATH=0");
                  return 2;
              }
              puts("DA_DISK_FROM_VOLUME_PATH=1");
              const char *bsd = DADiskGetBSDName(disk);
              printf("DA_BSD_NAME=%s\n", bsd ? bsd : "<nil>");
              DADiskOptions before = DADiskGetOptions(disk);
              printf("DA_OPTIONS_BEFORE=0x%08x PRIVATE=%d\n",
                     (unsigned int)before,
                     (before & kEDPLegacyDADiskOptionPrivate) != 0);
              DAReturn status = DADiskSetOptions(disk, kEDPLegacyDADiskOptionPrivate, true);
              printf("DA_SET_PRIVATE_STATUS=0x%08x\n", (unsigned int)status);
              DADiskOptions after = DADiskGetOptions(disk);
              printf("DA_OPTIONS_AFTER=0x%08x PRIVATE=%d\n",
                     (unsigned int)after,
                     (after & kEDPLegacyDADiskOptionPrivate) != 0);
              CFRelease(disk);
              CFRelease(url);
              CFRelease(session);
              if (status != kDAReturnSuccess) return 3;
              if ((after & kEDPLegacyDADiskOptionPrivate) == 0) return 4;
              return 0;
          }
          EOF
          xcrun clang -std=c17 -Wall -Wextra -Werror \
            "${RUNNER_TEMP}/DASetPrivate.c" \
            -framework CoreFoundation -framework DiskArbitration \
            -o "${RUNNER_TEMP}/DASetPrivate"

          xcrun clang -std=c17 -Wall -Wextra -Werror \
            native/EDPFSKitPoC/Tools/FuseTMinimal/DADiskNobrowseProbe.c \
            -framework CoreFoundation -framework DiskArbitration \
            -o "${RUNNER_TEMP}/DADiskNobrowseProbe"
          echo "RAW=${RAW}" >> "${GITHUB_ENV}"

      - name: Probe Disk Arbitration nobrowse on live FSKit transport
        run: |
          set -euo pipefail
          HIDDEN="/Volumes/.edp-p0-da-nobrowse-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          LOG="${RUNNER_TEMP}/bridge.log"
          sudo mkdir -p "${HIDDEN}"
          sudo chown "$(id -u):$(id -g)" "${HIDDEN}"
          echo "HIDDEN=${HIDDEN}" >> "${GITHUB_ENV}"

          "${RUNNER_TEMP}/FuseTMinimalBridge" \
            --writable \
            --backing "${RAW}" \
            --mountpoint "${HIDDEN}" \
            --volume-name 'EDP P0 DA Nobrowse Transport' \
            >"${LOG}" 2>&1 &
          BRIDGE_PID=$!
          echo "BRIDGE_PID=${BRIDGE_PID}" >> "${GITHUB_ENV}"

          mounted=false
          for attempt in $(seq 1 30); do
            if mount | grep -Fq " on ${HIDDEN} "; then mounted=true; break; fi
            if ! kill -0 "${BRIDGE_PID}" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "${LOG}"
          test "${mounted}" = true

          BEFORE="$(${RUNNER_TEMP}/InspectVolume "${HIDDEN}")"
          printf '%s\n' "${BEFORE}"
          test "$(printf '%s\n' "${BEFORE}" | sed -n 's/^BROWSABLE=//p')" = 1

          # Historical DA private bit still sets successfully on macOS 26, but is
          # intentionally asserted NOT to solve Finder browsability.
          sudo "${RUNNER_TEMP}/DASetPrivate" "${HIDDEN}" | tee "${RUNNER_TEMP}/da-private.log"
          AFTER_PRIVATE="$(${RUNNER_TEMP}/InspectVolume "${HIDDEN}")"
          printf '%s\n' "${AFTER_PRIVATE}"
          test "$(printf '%s\n' "${AFTER_PRIVATE}" | sed -n 's/^BROWSABLE=//p')" = 1
          echo 'DA_PRIVATE_CONFIRMED_NOT_A_FIX=1'

          set +e
          sudo "${RUNNER_TEMP}/DADiskNobrowseProbe" "${HIDDEN}" 2>&1 | tee "${RUNNER_TEMP}/da-nobrowse.log"
          DA_STATUS=${PIPESTATUS[0]}
          set -e
          echo "DA_NOBROWSE_EXIT=${DA_STATUS}"
          test "${DA_STATUS}" -eq 0

          sleep 1
          AFTER_NOBROWSE="$(${RUNNER_TEMP}/InspectVolume "${HIDDEN}")"
          printf '%s\n' "${AFTER_NOBROWSE}"
          test "$(printf '%s\n' "${AFTER_NOBROWSE}" | sed -n 's/^BROWSABLE=//p')" = 0

          EXPOSED="${HIDDEN}/volume.raw"
          test -f "${EXPOSED}"
          printf 'RW' | dd of="${EXPOSED}" bs=1 seek=8192 conv=notrunc status=none
          cmp <(dd if="${RAW}" bs=1 skip=8192 count=2 status=none) <(printf 'RW')
          echo 'RW_OK=1'

          OUT="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${EXPOSED}")"
          printf '%s\n' "${OUT}"
          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${DISK}"
          hdiutil detach "${DISK}" -force >/dev/null
          echo 'DISKIMAGES2_RAW_ATTACH_OK=1'
          echo 'RESULT=P0_DA_NOBROWSE_NONBROWSABLE_RW_DISKIMAGES2_OK'

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [[ -n "${HIDDEN:-}" ]]; then /sbin/umount "${HIDDEN}" 2>/dev/null || sudo /sbin/umount "${HIDDEN}" 2>/dev/null; fi
          if [[ -n "${BRIDGE_PID:-}" ]]; then kill "${BRIDGE_PID}" 2>/dev/null || true; fi
          sudo find /Volumes -maxdepth 1 -type d -name '.edp-p0-da-nobrowse-*' -exec rmdir {} \; 2>/dev/null || true
          sudo rm -rf /Applications/fuse-t.app
          exit 0
