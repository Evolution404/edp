name: macFUSE Local Product Lifecycle E2E

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "product/EDPTransportProvider.swift"
      - "product/EDPTransportRuntimePolicy.swift"
      - "product/EDPMacFUSERuntimePolicy.swift"
      - "product/EDPConsoleExec.c"
      - "product/EDPNativeSystem.swift"
      - "product/EDPBlockDevicePublisher.swift"
      - "installer/build-transport-backends.sh"
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c"
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountAsyncShim.c"
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountEDPAdapter.c"
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountUnmountHelper.c"
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/PrepareEDPFilesystemFixture.swift"
      - "native/EDPFSKitPoC/Tools/DiskImages2Attach.m"
      - ".github/workflows/macfuse-local-product-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macfuse-local-product-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-e2e:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MACFUSE_VERSION: "5.3.3"
      MACFUSE_DMG_SHA256: "7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15"
      GENERIC_ID: "io.macfuse.app.fsmodule.macfuse"
      LOCAL_ID: "io.macfuse.app.fsmodule.macfuse-local"
      GOLDEN_NAME: "disk4_real_lexar"
      REAL_LBA11: "fixtures/real_disks/disk4/LBA11.bin"
      REAL_LBA12: "fixtures/real_disks/disk4/LBA12.bin"
      VOLNAME: "EDPPRODUCT"

    steps:
      - uses: actions/checkout@v6

      - name: Install and enable exact macFUSE Local runtime
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          DMG="${RUNNER_TEMP}/macfuse.dmg"
          curl -fsSL --retry 3 \
            "https://github.com/macfuse/macfuse/releases/download/macfuse-${MACFUSE_VERSION}/macfuse-${MACFUSE_VERSION}.dmg" \
            -o "${DMG}"
          test "$(shasum -a 256 "${DMG}" | awk '{print $1}')" = "${MACFUSE_DMG_SHA256}"
          ATTACH="$(hdiutil attach -nobrowse -readonly "${DMG}")"
          VOL="$(printf '%s\n' "${ATTACH}" | awk -F '\t' '/\/Volumes\// {print $NF; exit}')"
          PKG="$(find "${VOL}" -maxdepth 2 \( -type f -o -type d \) -name '*.pkg' -print -quit)"
          test -n "${PKG}"
          pkgutil --check-signature "${PKG}"
          sudo installer -pkg "${PKG}" -target /
          hdiutil detach "${VOL}" >/dev/null
          APP="/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app"
          for ID in "${GENERIC_ID}" "${LOCAL_ID}"; do
            test -d "${APP}/Contents/Extensions/${ID}.appex"
          done
          LS=/System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister
          "${LS}" -f -R -trusted "${APP}"
          while IFS= read -r EXT; do pluginkit -a "${EXT}" || true; done < <(find "${APP}/Contents" -maxdepth 5 -type d -name '*.appex' -print)
          pluginkit -a "${APP}" || true
          pluginkit -e use -i "${GENERIC_ID}" || true
          pluginkit -e use -i "${LOCAL_ID}" || true
          SETTINGS="${HOME}/Library/Group Containers/group.com.apple.fskit.settings/enabledModules.plist"
          mkdir -p "$(dirname "${SETTINGS}")"
          python3 - "${SETTINGS}" "${GENERIC_ID}" "${LOCAL_ID}" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'wb') as handle:
              plistlib.dump(sys.argv[2:], handle, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          chmod 600 "${SETTINGS}"
          killall -9 fskit_agent extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/plugins.txt" || true
          grep -Fq "+    ${GENERIC_ID}" "${RUNNER_TEMP}/plugins.txt"
          grep -Fq "+    ${LOCAL_ID}" "${RUNNER_TEMP}/plugins.txt"
          echo 'RESULT=PRODUCT_MACFUSE_FSKIT_MODULES_ENABLED'

      - name: Resolve captured EDP metadata without logging password
        run: |
          set -euo pipefail
          PASSWORD_FILE="${RUNNER_TEMP}/edp-product-password"
          python3 - fixtures/golden/disks.json "${GOLDEN_NAME}" "${PASSWORD_FILE}" "${GITHUB_ENV}" <<'PY'
          import json, os, sys
          source, wanted, password_path, env_path = sys.argv[1:]
          item = next(x for x in json.load(open(source))['disks'] if x['name'] == wanted)
          p = item['lba11_params']
          fd = os.open(password_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          try:
              os.write(fd, item['password'].encode())
          finally:
              os.close(fd)
          with open(env_path, 'a') as env:
              env.write(f"EDP_VID={p['vid']}\n")
              env.write(f"EDP_PID={p['pid']}\n")
              env.write(f"EDP_DEVICE_SIZE={p['size_bytes']}\n")
              env.write("EDP_PARTITION_TYPE=2\n")
              env.write(f"PASSWORD_FILE={password_path}\n")
          print('RESULT=PRODUCT_REALMETA_VECTOR_READY')
          PY
          test "$(stat -f %Lp "${PASSWORD_FILE}")" = 600

      - name: Manufacture populated ExFAT and encrypt into synthetic physical EDP
        run: |
          set -euo pipefail
          PLAIN="${RUNNER_TEMP}/product-exfat.raw"
          truncate -s 201326592 "${PLAIN}"
          OUT="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${PLAIN}")"
          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${DISK}"
          sudo /sbin/newfs_exfat -v "${VOLNAME}" "/dev/r$(basename "${DISK}")"
          diskutil mount "${DISK}" >/dev/null
          MOUNT="/Volumes/${VOLNAME}"
          for _ in $(seq 1 20); do [[ -d "${MOUNT}" ]] && break; sleep 1; done
          test -d "${MOUNT}"
          printf '%s\n' 'EDP-PRODUCT-BASELINE' > "${MOUNT}/BASELINE.txt"
          mkdir -p "${MOUNT}/Seed Folder"
          printf '%s\n' 'seed-content' > "${MOUNT}/Seed Folder/seed.txt"
          sync
          hdiutil detach "${DISK}" -force >/dev/null

          PREPARE="${RUNNER_TEMP}/PrepareEDPFilesystemFixture"
          CONTAINER="${RUNNER_TEMP}/product-edp-device.raw"
          xcrun swiftc -swift-version 6 -warnings-as-errors \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/PrepareEDPFilesystemFixture.swift \
            -o "${PREPARE}"
          "${PREPARE}" \
            --lba11 "${REAL_LBA11}" --lba12 "${REAL_LBA12}" \
            --vid "${EDP_VID}" --pid "${EDP_PID}" --device-size "${EDP_DEVICE_SIZE}" \
            --partition-type "${EDP_PARTITION_TYPE}" --plaintext "${PLAIN}" \
            --output "${CONTAINER}" --password-file "${PASSWORD_FILE}" \
            | tee "${RUNNER_TEMP}/prepare.log"
          grep -Fq 'RESULT=EDP_REAL_METADATA_FILESYSTEM_FIXTURE_READY' "${RUNNER_TEMP}/prepare.log"
          START="$(awk -F= '/^PREPARED_PARTITION_START_SECTOR=/ {print $2}' "${RUNNER_TEMP}/prepare.log")"
          test -n "${START}"
          CIPHER_BEFORE="$(dd if="${CONTAINER}" bs=512 skip="${START}" count=393216 status=none | shasum -a 256 | awk '{print $1}')"
          chmod 0600 "${CONTAINER}"

          PHYSICAL_OUT="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${CONTAINER}")"
          PHYSICAL_DEV="$(printf '%s\n' "${PHYSICAL_OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${PHYSICAL_DEV}"
          PHYSICAL_RAW="/dev/r$(basename "${PHYSICAL_DEV}")"
          test -c "${PHYSICAL_RAW}"
          echo "PLAIN=${PLAIN}" >> "${GITHUB_ENV}"
          echo "CONTAINER=${CONTAINER}" >> "${GITHUB_ENV}"
          echo "PARTITION_START_SECTOR=${START}" >> "${GITHUB_ENV}"
          echo "CIPHER_BEFORE=${CIPHER_BEFORE}" >> "${GITHUB_ENV}"
          echo "PHYSICAL_DEV=${PHYSICAL_DEV}" >> "${GITHUB_ENV}"
          echo "PHYSICAL_RAW=${PHYSICAL_RAW}" >> "${GITHUB_ENV}"
          echo 'RESULT=SYNTHETIC_PHYSICAL_EDP_READY'

      - name: Build and stage exact product transport runtime
        run: |
          set -euo pipefail
          BIN="/Library/Application Support/EDP USB Vault/bin"
          BUILD="${RUNNER_TEMP}/product-bin"
          mkdir -p "${BUILD}"
          chmod +x installer/build-transport-backends.sh
          installer/build-transport-backends.sh "${BUILD}" | tee "${RUNNER_TEMP}/builder.txt"
          cc -O2 -Wall -Wextra -Werror product/EDPConsoleExec.c \
            product/EDPRawReadWriteAuthorization.c -framework Security \
            -o "${BUILD}/edp-console-exec"
          xcrun clang -fobjc-arc -fblocks native/EDPFSKitPoC/Tools/DiskImages2Attach.m \
            -framework Foundation -o "${BUILD}/diskimages2-attach"
          cc -std=c17 -Wall -Wextra -Werror \
            native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountUnmountHelper.c \
            -o "${BUILD}/transport-unmount"
          sudo mkdir -p "${BIN}"
          sudo cp "${BUILD}/edp-mfmount-local-readwrite" "${BUILD}/edp-console-exec" \
            "${BUILD}/diskimages2-attach" "${BIN}/"
          sudo chown root:wheel "${BIN}/edp-mfmount-local-readwrite" "${BIN}/edp-console-exec" "${BIN}/diskimages2-attach"
          sudo chmod 0755 "${BIN}/edp-mfmount-local-readwrite" "${BIN}/edp-console-exec" "${BIN}/diskimages2-attach"
          echo "PRODUCT_BIN=${BIN}" >> "${GITHUB_ENV}"
          echo "UNMOUNT_HELPER=${BUILD}/transport-unmount" >> "${GITHUB_ENV}"
          otool -L "${BIN}/edp-mfmount-local-readwrite" | tee "${RUNNER_TEMP}/local-otool.txt"
          grep -Fq 'MFMount.framework' "${RUNNER_TEMP}/local-otool.txt"
          ! grep -Eiq 'libfuse|libosxfuse|libmacfuse' "${RUNNER_TEMP}/local-otool.txt"

      - name: Verify formal provider selects staged macfuse-local product backend
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/ProviderE2E.swift" <<'SWIFT'
          import Foundation
          @main enum ProviderE2E {
              static func main() throws {
                  let root = CommandLine.arguments[1]
                  let raw = CommandLine.arguments[2]
                  let size = UInt64(CommandLine.arguments[3])!
                  let mountpoint = CommandLine.arguments[4]
                  let backend = try EDPTransportProvider.selectedBackend(environment: [:])
                  let request = EDPTransportRequest(
                      binaryRoot: root, rawDevice: raw, rawFD: 3,
                      vid: ProcessInfo.processInfo.environment["EDP_VID"]!,
                      pid: ProcessInfo.processInfo.environment["EDP_PID"]!,
                      deviceSize: size, partitionType: 2, controlFD: 0,
                      mountpoint: mountpoint, volumeName: "EDP Product Local Transport",
                      readOnly: false
                  )
                  let spec = try EDPTransportProvider.launchSpec(
                      for: backend, request: request, requireFinderHidden: true
                  )
                  precondition(backend == .macFUSELocal)
                  precondition(spec.executable == root + "/edp-mfmount-local-readwrite")
                  precondition(spec.capabilities.finderHidden && spec.capabilities.localVolume)
                  print("PROVIDER_BACKEND=\(backend.rawValue)")
                  print("PROVIDER_EXECUTABLE=\(spec.executable)")
                  print("RESULT=PRODUCT_PROVIDER_LOCAL_SELECTED")
              }
          }
          SWIFT
          xcrun swiftc -swift-version 6 -parse-as-library -warnings-as-errors \
            product/EDPTransportProvider.swift "${RUNNER_TEMP}/ProviderE2E.swift" \
            -o "${RUNNER_TEMP}/provider-e2e"
          HIDDEN="/Volumes/.edp-product-e2e"
          "${RUNNER_TEMP}/provider-e2e" "${PRODUCT_BIN}" "${PHYSICAL_RAW}" "${EDP_DEVICE_SIZE}" "${HIDDEN}" \
            | tee "${RUNNER_TEMP}/provider.txt"
          grep -Fq 'RESULT=PRODUCT_PROVIDER_LOCAL_SELECTED' "${RUNNER_TEMP}/provider.txt"
          echo "HIDDEN=${HIDDEN}" >> "${GITHUB_ENV}"

      - name: Build product DiskImages2 and Disk Arbitration lifecycle helper
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/BlockLifecycle.swift" <<'SWIFT'
          import Foundation
          @main enum BlockLifecycle {
              static func main() throws {
                  let command = CommandLine.arguments[1]
                  let controller = try EDPDiskArbitrationController()
                  let publisher = EDPDiskImages2Publisher(
                      binaryRoot: CommandLine.arguments[2], diskArbitration: controller
                  )
                  switch command {
                  case "publish":
                      let device = try publisher.publishWritableImage(at: CommandLine.arguments[3])
                      let mountpoint = try controller.mount(device.bsdName)
                      print("PUBLISHED_BSD=\(device.bsdName)")
                      print("USER_MOUNT=\(mountpoint)")
                  case "unmount":
                      try EDPNativeMountTable.unmountPath(CommandLine.arguments[3])
                      print("RESULT=PRODUCT_USER_FILESYSTEM_UNMOUNTED")
                  case "unpublish":
                      try publisher.unpublish(EDPPublishedBlockDevice(bsdName: CommandLine.arguments[3]))
                      print("RESULT=PRODUCT_DISKIMAGES2_UNPUBLISHED")
                  default:
                      fatalError("invalid command")
                  }
              }
          }
          SWIFT
          xcrun swiftc -swift-version 6 -parse-as-library -strict-concurrency=complete \
            native/EDPFSKitPoC/Extension/EDPRawIO.swift \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift \
            product/EDPNativeSystem.swift product/EDPBlockDevicePublisher.swift \
            "${RUNNER_TEMP}/BlockLifecycle.swift" -o "${RUNNER_TEMP}/block-lifecycle"
          echo "BLOCK_LIFECYCLE=${RUNNER_TEMP}/block-lifecycle" >> "${GITHUB_ENV}"

      - name: Product mount write Finder unmount remount persistence
        run: |
          set -euo pipefail
          sudo mkdir -p "${HIDDEN}"
          sudo chown "$(id -u):$(id -g)" "${HIDDEN}"
          start_transport() {
            : >"${RUNNER_TEMP}/transport.log"
            sudo "${PRODUCT_BIN}/edp-console-exec" "$(id -u)" "$(id -g)" \
              --raw-device "${PHYSICAL_RAW}" -- \
              "${PRODUCT_BIN}/edp-mfmount-local-readwrite" \
              --raw-device "${PHYSICAL_RAW}" --raw-fd 3 \
              --vid "${EDP_VID}" --pid "${EDP_PID}" --device-size "${EDP_DEVICE_SIZE}" \
              --partition-type 2 --control-fd 0 --mountpoint "${HIDDEN}" \
              --volume-name 'EDP Product Local Transport' \
              <"${PASSWORD_FILE}" >"${RUNNER_TEMP}/transport.log" 2>&1 &
            echo $! >"${RUNNER_TEMP}/transport-launcher.pid"
            for _ in $(seq 1 30); do
              mount | grep -Fq " on ${HIDDEN} " && return 0
              kill -0 "$(cat "${RUNNER_TEMP}/transport-launcher.pid")" 2>/dev/null || break
              sleep 1
            done
            cat "${RUNNER_TEMP}/transport.log" >&2 || true
            return 1
          }
          publish_filesystem() {
            "${BLOCK_LIFECYCLE}" publish "${PRODUCT_BIN}" "${HIDDEN}/volume.raw" \
              | tee "${RUNNER_TEMP}/publish.txt"
            PUBLISHED_BSD="$(awk -F= '/^PUBLISHED_BSD=/{print $2}' "${RUNNER_TEMP}/publish.txt")"
            USER_MOUNT="$(awk -F= '/^USER_MOUNT=/{print $2}' "${RUNNER_TEMP}/publish.txt")"
            test -n "${PUBLISHED_BSD}"; test -n "${USER_MOUNT}"; test -d "${USER_MOUNT}"
          }
          stop_product_stack() {
            "${BLOCK_LIFECYCLE}" unmount "${PRODUCT_BIN}" "${USER_MOUNT}"
            "${BLOCK_LIFECYCLE}" unpublish "${PRODUCT_BIN}" "${PUBLISHED_BSD}"
            SOURCE="$(mount | awk -v mp="${HIDDEN}" '$0 ~ " on " mp " " {print $1; exit}')"
            test -n "${SOURCE}"
            sudo "${UNMOUNT_HELPER}" "${HIDDEN}" 2>&1 | tee "${RUNNER_TEMP}/transport-unmount.txt"
            grep -Fq 'DIRECT_MFMOUNT_PRIVILEGED_UNMOUNT_RESULT=0 errno=0' "${RUNNER_TEMP}/transport-unmount.txt"
            for _ in $(seq 1 30); do
              ! mount | grep -Fq " on ${HIDDEN} " && [[ ! -e "${SOURCE}" ]] && break
              sleep 1
            done
            ! mount | grep -Fq " on ${HIDDEN} "
            test ! -e "${SOURCE}"
          }

          start_transport
          mount | grep -F " on ${HIDDEN} " | tee "${RUNNER_TEMP}/transport-mount-first.txt"
          grep -Fq 'local' "${RUNNER_TEMP}/transport-mount-first.txt"
          publish_filesystem
          diskutil info "/dev/${PUBLISHED_BSD}" | tee "${RUNNER_TEMP}/filesystem-first.txt"
          grep -Eiq 'File System Personality:[[:space:]]+ExFAT' "${RUNNER_TEMP}/filesystem-first.txt"
          test "$(cat "${USER_MOUNT}/BASELINE.txt")" = 'EDP-PRODUCT-BASELINE'
          mkdir "${USER_MOUNT}/Product Created"
          printf '%s\n' 'product-persist-v1' > "${USER_MOUNT}/Product Created/persist.txt"
          printf '%s\n' 'atomic-old' > "${USER_MOUNT}/atomic.txt"
          printf '%s\n' 'atomic-new' > "${USER_MOUNT}/atomic.tmp"
          mv -f "${USER_MOUNT}/atomic.tmp" "${USER_MOUNT}/atomic.txt"
          sync
          cat >"${RUNNER_TEMP}/finder.applescript" <<'OSA'
          on run argv
              set targetAlias to (POSIX file (item 1 of argv)) as alias
              tell application "Finder" to return name of every item of targetAlias as string
          end run
          OSA
          osacompile -o "${RUNNER_TEMP}/finder.scpt" "${RUNNER_TEMP}/finder.applescript"
          osascript "${RUNNER_TEMP}/finder.scpt" "${USER_MOUNT}" | tee "${RUNNER_TEMP}/finder.txt"
          grep -Fq 'Product Created' "${RUNNER_TEMP}/finder.txt"
          stop_product_stack

          CIPHER_AFTER="$(dd if="${CONTAINER}" bs=512 skip="${PARTITION_START_SECTOR}" count=393216 status=none | shasum -a 256 | awk '{print $1}')"
          test "${CIPHER_AFTER}" != "${CIPHER_BEFORE}"
          echo 'RESULT=PRODUCT_ENCRYPTED_BACKING_CHANGED'

          start_transport
          publish_filesystem
          test "$(cat "${USER_MOUNT}/Product Created/persist.txt")" = 'product-persist-v1'
          test "$(cat "${USER_MOUNT}/atomic.txt")" = 'atomic-new'
          echo 'RESULT=PRODUCT_FILES_PERSIST_AFTER_FULL_REMOUNT'
          stop_product_stack
          cat "${RUNNER_TEMP}/transport.log"
          grep -Fq 'DIRECT_MFMOUNT_DESTROY_REPLIED=1' "${RUNNER_TEMP}/transport.log"
          echo 'RESULT=MACFUSE_LOCAL_PRODUCT_LIFECYCLE_E2E_PASS'

      - name: Cleanup
        if: always()
        run: |
          set +e
          [[ -n "${USER_MOUNT:-}" ]] && sudo umount -f "${USER_MOUNT}" 2>/dev/null || true
          [[ -n "${PUBLISHED_BSD:-}" ]] && hdiutil detach "/dev/${PUBLISHED_BSD}" -force >/dev/null 2>&1 || true
          [[ -n "${HIDDEN:-}" ]] && sudo "${UNMOUNT_HELPER:-/usr/bin/false}" "${HIDDEN}" >/dev/null 2>&1 || true
          [[ -n "${PHYSICAL_DEV:-}" ]] && hdiutil detach "${PHYSICAL_DEV}" -force >/dev/null 2>&1 || true
          rm -f "${PASSWORD_FILE:-}"
          sudo rm -rf "/Library/Application Support/EDP USB Vault"
          exit 0

      - name: Upload product E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macfuse-local-product-e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/provider.txt
            ${{ runner.temp }}/builder.txt
            ${{ runner.temp }}/prepare.log
            ${{ runner.temp }}/transport.log
            ${{ runner.temp }}/transport-mount-first.txt
            ${{ runner.temp }}/filesystem-first.txt
            ${{ runner.temp }}/finder.txt
            ${{ runner.temp }}/transport-unmount.txt
          if-no-files-found: ignore
          retention-days: 14
