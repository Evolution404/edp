name: EDP Crypto + DiskImages2 Read/Write E2E

on:
  push:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - ".github/workflows/edp-crypto-diskimages2-readonly.yml"
      - "native/EDPFSKitPoC/Extension/EDPRawIO.swift"
      - "native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift"
      - "native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift"
      - "native/EDPFSKitPoC/Extension/EDPCrypto.swift"
      - "native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift"
      - "native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift"
      - "native/EDPFSKitPoC/Extension/EDPBlockDevice.swift"
      - "native/EDPFSKitPoC/Tools/DiskImages2Attach.m"
      - "native/EDPFSKitPoC/Tools/PrepareEncryptedDiskImage.swift"
      - "native/EDPFSKitPoC/Tools/EDPReadOnlyBlockCBridge.swift"
      - "native/EDPFSKitPoC/Tools/EDPReadOnlyFuseBridge.c"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteBlockCBridge.swift"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteFuseBridge.c"
      - "native/EDPFSKitPoC/Tools/probe-edp-device-unlock.sh"
      - "native/EDPFSKitPoC/Tools/probe-edp-crypto-diskimages2.sh"
      - "native/EDPFSKitPoC/Tools/probe-edp-crypto-diskimages2-readwrite.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  block-bridge-e2e:
    name: encrypted backing -> native filesystem read/write
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Record runtime
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          uname -m
          xcodebuild -version
          test -d /System/Library/PrivateFrameworks/DiskImages2.framework
          echo 'RESULT=DISKIMAGES2_PRESENT'

      - name: Install official macFUSE
        run: |
          set -euo pipefail
          brew install --cask macfuse
          brew list --cask --versions macfuse
          pkg-config --exists fuse
          pkg-config --modversion fuse
          test -d /Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app/Contents/Extensions/io.macfuse.app.fsmodule.macfuse.appex
          echo 'RESULT=OFFICIAL_MACFUSE_INSTALLED'

      - name: Enable macFUSE FSKit modules on ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/pluginkit -e use -i io.macfuse.app.fsmodule.macfuse || true
          /usr/bin/pluginkit -e use -i io.macfuse.app.fsmodule.macfuse-local || true

          SETTINGS_DIR="$HOME/Library/Group Containers/group.com.apple.fskit.settings"
          SETTINGS="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${SETTINGS}" <<'PY'
          import os
          import plistlib
          import sys
          path = sys.argv[1]
          enabled = []
          if os.path.exists(path):
              try:
                  with open(path, "rb") as handle:
                      value = plistlib.load(handle)
                  if isinstance(value, list):
                      enabled = value
              except Exception:
                  pass
          for identifier in (
              "io.macfuse.app.fsmodule.macfuse",
              "io.macfuse.app.fsmodule.macfuse-local",
          ):
              if identifier not in enabled:
                  enabled.append(identifier)
          with open(path, "wb") as handle:
              plistlib.dump(enabled, handle, fmt=plistlib.FMT_BINARY)
          PY
          plutil -p "${SETTINGS}"
          killall fskit_agent 2>/dev/null || true
          killall extensionkitservice 2>/dev/null || true
          sleep 2
          echo 'RESULT=CI_ONLY_MACFUSE_MODULE_STATE_SEEDED'

      - name: Run real-metadata product unlock smoke
        run: |
          set -euo pipefail
          bash native/EDPFSKitPoC/Tools/probe-edp-device-unlock.sh

      - name: Run encrypted-reader block bridge proof
        run: |
          set -euo pipefail
          bash native/EDPFSKitPoC/Tools/probe-edp-crypto-diskimages2.sh

      - name: Run encrypted-writer block bridge proof
        run: |
          set -euo pipefail
          sudo mkdir -p /Volumes/edp-crypto-readwrite
          sudo chown "$(id -u):$(id -g)" /Volumes/edp-crypto-readwrite
          chmod 700 /Volumes/edp-crypto-readwrite
          EDP_RW_MOUNT_POINT=/Volumes/edp-crypto-readwrite \
            bash native/EDPFSKitPoC/Tools/probe-edp-crypto-diskimages2-readwrite.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edp-crypto-diskimages2-readwrite-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/edp-crypto-di2/
            ${{ runner.temp }}/edp-crypto-di2-readwrite/
          if-no-files-found: ignore
          retention-days: 14
