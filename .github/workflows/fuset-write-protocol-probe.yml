name: FUSE-T Writable RPC Protocol Probe

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - ".github/workflows/fuset-write-protocol-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuset-write-protocol-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  writable-probe:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      FUSET_BUNDLE_ID: "org.fuset.fskit-srv.module"
      DIAG_PATH: "docs/diagnostics/fuset-writable-rpc-macos26-ci.txt"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage exact official FUSE-T and enable only on disposable runner
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          PKG="${RUNNER_TEMP}/fuse-t-${FUSET_VERSION}.pkg"
          EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl --fail --location --retry 3 --silent --show-error "${FUSET_PKG_URL}" -o "${PKG}"
          test "$(shasum -a 256 "${PKG}" | awk '{print $1}')" = "${FUSET_PKG_SHA256}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"
          SOURCE_APP="$(find "${EXPANDED}" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"
          test -n "${SOURCE_APP}"
          codesign --verify --deep --strict --verbose=2 "${SOURCE_APP}"
          sudo rm -rf /Applications/fuse-t.app
          sudo ditto "${SOURCE_APP}" /Applications/fuse-t.app
          APP=/Applications/fuse-t.app
          EXT="${APP}/Contents/Extensions/FskitSrvModule.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "${APP}"
          pluginkit -a "${EXT}" || true
          pluginkit -a "${APP}" || true
          pluginkit -e use -i "${FUSET_BUNDLE_ID}" || true
          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"
          ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${FUSET_BUNDLE_ID}" <<'PY'
          import os, plistlib, sys
          path, bundle_id = sys.argv[1:]
          enabled=[]
          if os.path.exists(path):
              try:
                  with open(path,'rb') as f: value=plistlib.load(f)
                  if isinstance(value,list): enabled=[x for x in value if isinstance(x,str)]
              except Exception: pass
          if bundle_id not in enabled: enabled.append(bundle_id)
          with open(path,'wb') as f: plistlib.dump(enabled,f,fmt=plistlib.FMT_XML,sort_keys=False)
          PY
          chmod 600 "${ENABLED_PLIST}"
          killall -9 fskit_agent 2>/dev/null || true
          killall -9 extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3

      - name: Build writable protocol probe server
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/writable_probe.py" <<'PY'
          #!/usr/bin/env python3
          import argparse, errno, json, os, socket, struct, subprocess, tempfile, uuid
          H=struct.Struct('>II'); ROOT=1; FILE=2; NAME='volume.raw'
          def rx(c,n):
              b=bytearray()
              while len(b)<n:
                  x=c.recv(n-len(b))
                  if not x: raise EOFError
                  b+=x
              return bytes(b)
          def frame(c):
              ml,pl=H.unpack(rx(c,8))
              if ml+pl>16*1024*1024: raise RuntimeError('oversize')
              return json.loads(rx(c,ml).decode()),rx(c,pl)
          def send(c,m,p=b''):
              mb=json.dumps(m,sort_keys=True,separators=(',',':')).encode(); c.sendall(H.pack(len(mb),len(p))+mb+p)
          def ok(r,**kw): d={'request_id':r,'ok':True}; d.update(kw); return d
          def er(r,e,s): return {'request_id':r,'ok':False,'errno':e,'error':s}
          def at(n,p,name,t,mode,size,links):
              return {'node_id':n,'parent_id':p,'name':name,'type':t,'mode':mode,'uid':os.getuid(),'gid':os.getgid(),'link_count':links,'size':size,'alloc_size':size,'modify_time_sec':0,'modify_time_nsec':0,'change_time_sec':0,'change_time_nsec':0,'access_time_sec':0,'access_time_nsec':0,'birth_time_sec':0,'birth_time_nsec':0}
          ap=argparse.ArgumentParser(); ap.add_argument('--backing',required=True); ap.add_argument('--mountpoint',required=True); ap.add_argument('--log',required=True); a=ap.parse_args()
          fd=os.open(a.backing,os.O_RDWR|getattr(os,'O_CLOEXEC',0)); size=os.fstat(fd).st_size
          sid='edp-fuset-rw-'+str(uuid.uuid4()); token=uuid.uuid4().hex
          group=os.path.expanduser('~/Library/Group Containers/group.org.fuset.fskit-srv/s'); os.makedirs(group,mode=0o700,exist_ok=True)
          sp=os.path.join(group,sid[:20]+'.sock'); sd=tempfile.mkdtemp(prefix=sid+'-'); sj=os.path.join(sd,'session.json')
          with open(sj,'w') as f: json.dump({'session_id':sid,'socket_path':sp,'auth_token':token,'namedattr':False,'readonly':False,'volume_name':'EDP Writable Probe'},f,sort_keys=True)
          os.chmod(sj,0o600); os.makedirs(a.mountpoint,exist_ok=True)
          try: os.unlink(sp)
          except FileNotFoundError: pass
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.bind(sp); os.chmod(sp,0o600); s.listen(1)
          subprocess.Popen(['/sbin/mount','-o','nobrowse','-t','fuset',sj,a.mountpoint])
          print('SESSION_JSON='+sj,flush=True); print('SOCKET='+sp,flush=True)
          c,_=s.accept(); nextdir=100
          with open(a.log,'a',buffering=1) as log:
              while True:
                  try: m,p=frame(c)
                  except EOFError: break
                  r=int(m.get('request_id',-1)); method=m.get('method'); q=dict(m); q['payload_length']=len(p); log.write('RPC='+json.dumps(q,sort_keys=True,separators=(',',':'))+'\n')
                  if method=='handshake': send(c,ok(r,session_id=sid) if m.get('auth_token')==token else er(r,errno.EACCES,'auth'))
                  elif method=='ping': send(c,ok(r))
                  elif method=='get_root_attributes': send(c,ok(r,root_attrs=at(ROOT,ROOT,'/','directory',0o755,0,2)))
                  elif method=='statfs':
                      blocks=max(1,(size+4095)//4096); send(c,ok(r,block_size=4096,io_size=1048576,blocks=blocks,free_blocks=blocks,files=2,free_files=1))
                  elif method=='lookup': send(c,ok(r,lookup_item=at(FILE,ROOT,NAME,'file',0o666,size,1)) if m.get('parent_id')==ROOT and m.get('name')==NAME else er(r,errno.ENOENT,'not found'))
                  elif method=='get_attributes':
                      n=m.get('node_id'); send(c,ok(r,item_attrs=at(ROOT,ROOT,'/','directory',0o755,0,2)) if n==ROOT else ok(r,item_attrs=at(FILE,ROOT,NAME,'file',0o666,size,1)) if n==FILE else er(r,errno.ENOENT,'not found'))
                  elif method=='open': send(c,ok(r,handle_id=200) if m.get('node_id')==FILE else er(r,errno.ENOENT,'not found'))
                  elif method=='read':
                      off=int(m.get('offset',-1)); ln=int(m.get('length',-1)); send(c,er(r,errno.EINVAL,'range')) if off<0 or ln<0 else send(c,ok(r),os.pread(fd,min(ln,max(0,size-off)),off) if off<size else b'')
                  elif method=='write':
                      off=int(m.get('offset',-1))
                      if off<0 or off+len(p)>size: send(c,er(r,errno.ENOSPC,'range'))
                      else:
                          n=os.pwrite(fd,p,off); send(c,ok(r) if n==len(p) else er(r,errno.EIO,'short write'))
                  elif method=='synchronize': os.fsync(fd); send(c,ok(r))
                  elif method=='set_attributes':
                      requested=m.get('size')
                      if requested is not None and int(requested)!=size: send(c,er(r,errno.EINVAL,'fixed size'))
                      else: send(c,ok(r,item_attrs=at(FILE,ROOT,NAME,'file',0o666,size,1)))
                  elif method=='close': send(c,ok(r))
                  elif method=='open_directory': h=nextdir; nextdir+=1; send(c,ok(r,handle_id=h))
                  elif method=='enumerate_directory':
                      cookie=int(m.get('cookie',0)); verifier=int(m.get('verifier',1))
                      if cookie==0:
                          item=at(FILE,ROOT,NAME,'file',0o666,size,1); item['cookie']=1; send(c,ok(r,dir_items=[item],next_cookie=1,verifier=verifier))
                      else: send(c,ok(r,dir_items=[],next_cookie=cookie,verifier=verifier))
                  elif method=='close_directory': send(c,ok(r))
                  elif method=='list_xattrs': send(c,ok(r,xattr_names=[]))
                  elif method=='get_xattr': send(c,er(r,getattr(errno,'ENOATTR',errno.ENODATA),'none'))
                  elif method in ('create','create_file','create_directory','create_symlink','remove','remove_file','remove_directory','remove_xattr','rename','set_xattr','truncate'): send(c,er(r,errno.EPERM,'single fixed transport node'))
                  else: send(c,er(r,errno.EOPNOTSUPP,'unsupported '+str(method)))
          PY
          chmod +x "${RUNNER_TEMP}/writable_probe.py"

      - name: Capture direct writable RPC and hdiutil writable block behavior
        run: |
          set -euo pipefail
          RAW="${RUNNER_TEMP}/rw-probe.raw"
          python3 - "${RAW}" <<'PY'
          import hashlib,sys
          with open(sys.argv[1],'wb') as f:
              for i in range(32768):
                  seed=hashlib.sha256(f'RW-PROBE:{i}'.encode()).digest(); f.write((seed*16)[:512])
          PY
          HIDDEN="${RUNNER_TEMP}/rw-hidden-$(uuidgen | tr '[:upper:]' '[:lower:]')"; RPCLOG="${RUNNER_TEMP}/rw-rpc.log"; SERVERLOG="${RUNNER_TEMP}/rw-server.log"; mkdir -p "${HIDDEN}"
          "${RUNNER_TEMP}/writable_probe.py" --backing "${RAW}" --mountpoint "${HIDDEN}" --log "${RPCLOG}" >"${SERVERLOG}" 2>&1 &
          SERVER_PID=$!; echo "SERVER_PID=${SERVER_PID}" >> "${GITHUB_ENV}"; echo "HIDDEN=${HIDDEN}" >> "${GITHUB_ENV}"; echo "RPCLOG=${RPCLOG}" >> "${GITHUB_ENV}"
          mounted=false
          for i in $(seq 1 30); do if mount | grep -Fq " on ${HIDDEN} "; then mounted=true; break; fi; if ! kill -0 "${SERVER_PID}" 2>/dev/null; then break; fi; sleep 1; done
          cat "${SERVERLOG}" || true; test "${mounted}" = true
          mount | grep -F " on ${HIDDEN} " | tee "${RUNNER_TEMP}/hidden-mount.txt"; ! grep -q 'read-only' "${RUNNER_TEMP}/hidden-mount.txt"
          EXPOSED="${HIDDEN}/volume.raw"; test -f "${EXPOSED}"
          python3 - "${RUNNER_TEMP}/direct-expected.bin" <<'PY'
          import hashlib,sys
          out=bytearray()
          for i in range(8192): out.extend(hashlib.sha256(f'DIRECT-WRITE:{i}'.encode()).digest())
          open(sys.argv[1],'wb').write(out[:262144])
          PY
          set +e
          dd if="${RUNNER_TEMP}/direct-expected.bin" of="${EXPOSED}" bs=1 seek=12345 conv=notrunc status=none 2>"${RUNNER_TEMP}/direct-write.err"
          DIRECT_RC=$?
          set -e
          sleep 1
          echo "DIRECT_WRITE_RC=${DIRECT_RC}" | tee "${RUNNER_TEMP}/direct-result.txt"; cat "${RUNNER_TEMP}/direct-write.err" | tee -a "${RUNNER_TEMP}/direct-result.txt" || true; cat "${RPCLOG}" | tee "${RUNNER_TEMP}/rpc-evidence.txt" || true
          if [[ "${DIRECT_RC}" -eq 0 ]]; then
            sync
            dd if="${EXPOSED}" of="${RUNNER_TEMP}/direct-actual.bin" bs=1 skip=12345 count=262144 status=none
            cmp "${RUNNER_TEMP}/direct-expected.bin" "${RUNNER_TEMP}/direct-actual.bin"
            dd if="${RAW}" of="${RUNNER_TEMP}/backing-actual.bin" bs=1 skip=12345 count=262144 status=none
            cmp "${RUNNER_TEMP}/direct-expected.bin" "${RUNNER_TEMP}/backing-actual.bin"
            echo 'RESULT=RW1_DIRECT_FSKIT_PWRITE_READBACK_OK' | tee -a "${RUNNER_TEMP}/direct-result.txt"

            OUT="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${EXPOSED}" 2>"${RUNNER_TEMP}/hdiutil.err")"
            printf '%s\n' "${OUT}" | tee "${RUNNER_TEMP}/hdiutil.out"; cat "${RUNNER_TEMP}/hdiutil.err" || true
            DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"; test -n "${DISK}"; echo "NESTED_DISK=${DISK}" >> "${GITHUB_ENV}"
            diskutil info "${DISK}" | tee "${RUNNER_TEMP}/diskutil.txt"; grep -Eq 'Media Read-Only:[[:space:]]+No' "${RUNNER_TEMP}/diskutil.txt"
            python3 - "${RUNNER_TEMP}/disk-expected.bin" <<'PY'
          import hashlib,sys
          out=bytearray()
          for i in range(2048): out.extend(hashlib.sha256(f'DISK-WRITE:{i}'.encode()).digest())
          open(sys.argv[1],'wb').write(out[:65536])
          PY
            RDISK="/dev/r$(basename "${DISK}")"; dd if="${RUNNER_TEMP}/disk-expected.bin" of="${RDISK}" bs=1 seek=2097152 conv=notrunc status=none; sync
            dd if="${RDISK}" of="${RUNNER_TEMP}/disk-actual.bin" bs=1 skip=2097152 count=65536 status=none; cmp "${RUNNER_TEMP}/disk-expected.bin" "${RUNNER_TEMP}/disk-actual.bin"
            dd if="${RAW}" of="${RUNNER_TEMP}/disk-backing.bin" bs=1 skip=2097152 count=65536 status=none; cmp "${RUNNER_TEMP}/disk-expected.bin" "${RUNNER_TEMP}/disk-backing.bin"
            echo 'RESULT=RW2_HDIUTIL_WRITABLE_BLOCK_PWRITE_OK'; hdiutil detach "${DISK}" -force; echo 'NESTED_DISK=' >> "${GITHUB_ENV}"
          fi
          grep -q '"method":"open"' "${RPCLOG}"
          test "${DIRECT_RC}" -eq 0
          grep -q '"method":"write"' "${RPCLOG}"; grep -q '"payload_length":' "${RPCLOG}"; echo 'RESULT=RW3_WRITE_RPC_SCHEMA_CAPTURED'

      - name: Collect deterministic writable protocol evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${DIAG_PATH}")"
          {
            echo '# FUSE-T writable RPC macOS 26 CI probe'; echo; echo 'generated_at_utc=<normalized>'; echo "runner_os=$(sw_vers -productVersion)"; echo "runner_build=$(sw_vers -buildVersion)"; echo "xcode=$(xcodebuild -version | tr '\n' ' ')"; echo
            echo '## hidden mount'; cat "${RUNNER_TEMP}/hidden-mount.txt" 2>/dev/null || true; echo
            echo '## direct write result'; cat "${RUNNER_TEMP}/direct-result.txt" 2>/dev/null || true; echo
            echo '## hdiutil / diskutil'; cat "${RUNNER_TEMP}/hdiutil.out" 2>/dev/null || true; cat "${RUNNER_TEMP}/diskutil.txt" 2>/dev/null || true; echo
            echo '## all RPC metadata'; cat "${RUNNER_TEMP}/rw-rpc.log" 2>/dev/null || true
          } > "${DIAG_PATH}"
          sed -n '1,500p' "${DIAG_PATH}"

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [[ -n "${NESTED_DISK:-}" ]]; then hdiutil detach "${NESTED_DISK}" -force >/dev/null 2>&1 || true; fi
          if [[ -n "${HIDDEN:-}" ]]; then umount "${HIDDEN}" >/dev/null 2>&1 || diskutil unmount force "${HIDDEN}" >/dev/null 2>&1 || true; fi
          if [[ -n "${SERVER_PID:-}" ]]; then kill "${SERVER_PID}" >/dev/null 2>&1 || true; fi
          sudo rm -rf /Applications/fuse-t.app
          exit 0

      - name: Commit deterministic writable diagnostic
        if: always() && github.ref_name == 'test/fuset-minimal-fskit-bridge'
        run: |
          set -euo pipefail
          test -f "${DIAG_PATH}"; git add "${DIAG_PATH}"
          if git diff --cached --quiet -- "${DIAG_PATH}"; then exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: capture FUSE-T writable RPC [skip ci]'; git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin "HEAD:${GITHUB_REF_NAME}"
