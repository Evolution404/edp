name: macFUSE 5.3.2 Runtime Policy Probe

on:
  push:
    branches: ["test/self-signed-standalone-distribution"]
    paths:
      - ".github/workflows/macfuse-532-runtime-policy-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install official 5.3.2 and capture signed runtime identity
        run: |
          set -euo pipefail
          URL=https://github.com/macfuse/macfuse/releases/download/macfuse-5.3.2/macfuse-5.3.2.dmg
          SHA=9328a8cd0b893b4347097270d6605408630dd764ddca275256959dc0e9a07936
          DMG="${RUNNER_TEMP}/macfuse-5.3.2.dmg"
          curl -fsSL --retry 3 "${URL}" -o "${DMG}"
          test "$(shasum -a 256 "${DMG}" | awk '{print $1}')" = "${SHA}"
          ATTACH="$(hdiutil attach -nobrowse -readonly "${DMG}")"
          VOL="$(printf '%s\n' "${ATTACH}" | awk -F '\t' '/\/Volumes\// {print $NF; exit}')"
          PKG="$(find "${VOL}" -maxdepth 2 \( -type f -o -type d \) -name '*.pkg' -print -quit)"
          pkgutil --check-signature "${PKG}"
          sudo installer -pkg "${PKG}" -target /
          hdiutil detach "${VOL}" >/dev/null

          APP=/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app
          test -d "${APP}"
          echo "APP=${APP}"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "${APP}"
          /usr/bin/codesign -dv --verbose=4 "${APP}" 2>&1 | tee "${RUNNER_TEMP}/app-sign.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Contents/Info.plist" | sed 's/^/APP_BUNDLE_ID=/'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Contents/Info.plist" | sed 's/^/APP_SHORT_VERSION=/'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP}/Contents/Info.plist" | sed 's/^/APP_BUNDLE_VERSION=/'
          APP_EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP}/Contents/Info.plist")"
          shasum -a 256 "${APP}/Contents/MacOS/${APP_EXE}" | awk '{print "APP_EXEC_SHA256=" $1}'

          find "${APP}/Contents/Extensions" -maxdepth 1 -type d -name '*.appex' -print | sort | while read -r EXT; do
            ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${EXT}/Contents/Info.plist")"
            case "${ID}" in
              io.macfuse.app.fsmodule.macfuse|io.macfuse.app.fsmodule.macfuse-local)
                echo "MODULE_PATH=${EXT}"
                echo "MODULE_BUNDLE_ID=${ID}"
                /usr/bin/codesign --verify --deep --strict --verbose=2 "${EXT}"
                /usr/bin/codesign -dv --verbose=4 "${EXT}" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Authority)=' || true
                EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${EXT}/Contents/Info.plist")"
                shasum -a 256 "${EXT}/Contents/MacOS/${EXE}" | awk -v id="${ID}" '{print "MODULE_EXEC_SHA256[" id "]=" $1}'
                ;;
            esac
          done | tee "${RUNNER_TEMP}/modules.txt"

          grep -Fq 'MODULE_BUNDLE_ID=io.macfuse.app.fsmodule.macfuse' "${RUNNER_TEMP}/modules.txt"
          grep -Fq 'MODULE_BUNDLE_ID=io.macfuse.app.fsmodule.macfuse-local' "${RUNNER_TEMP}/modules.txt"
          echo 'RESULT=MACFUSE_532_RUNTIME_IDENTITY_CAPTURED'
