name: FSKit mount diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - install/one-click-installer
    paths:
      - .github/workflows/fskit-mount-diagnostic.yml

jobs:
  direct-vs-diskarbitration:
    name: direct mount -F vs Disk Arbitration
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: System and LiveFS baseline
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/fskit-diag"
          OUT="$RUNNER_TEMP/fskit-diag/baseline.txt"
          {
            echo '=== sw_vers ==='
            sw_vers
            echo
            echo '=== uname ==='
            uname -a
            echo
            echo '=== arch ==='
            uname -m
            echo
            echo '=== component hashes ==='
            shasum -a 256 /sbin/mount /usr/libexec/fskitd
            echo
            echo '=== /sbin/mount signature ==='
            codesign -dv --verbose=4 /sbin/mount 2>&1 || true
            echo
            echo '=== /sbin/mount entitlements ==='
            codesign -d --entitlements :- /sbin/mount 2>&1 || true
            echo
            echo '=== fskitd signature ==='
            codesign -dv --verbose=4 /usr/libexec/fskitd 2>&1 || true
            echo
            echo '=== fskitd entitlements ==='
            codesign -d --entitlements :- /usr/libexec/fskitd 2>&1 || true
            echo
            echo '=== diskarbitrationd entitlements ==='
            codesign -d --entitlements :- /usr/libexec/diskarbitrationd 2>&1 || true
            echo
            echo '=== /sbin/mount dependencies ==='
            otool -L /sbin/mount || true
            echo
            echo '=== mount relevant strings ==='
            strings /sbin/mount | grep -E 'mountVolume:fileSystem|LiveFSMountClient|FSClient|switchToFSKit' | sort -u || true
          } | tee "$OUT"

      - name: Runtime LiveFS protocol contract
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/fskit-protocols.m"
          BIN="$RUNNER_TEMP/fskit-protocols"
          OUT="$RUNNER_TEMP/fskit-diag/protocols.txt"
          cat > "$SRC" <<'EOF'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdlib.h>

          static void dump_methods(Protocol *p, BOOL required, BOOL instance) {
              unsigned int count = 0;
              struct objc_method_description *methods =
                  protocol_copyMethodDescriptionList(p, required, instance, &count);
              printf("  %s %s count=%u\n",
                     required ? "required" : "optional",
                     instance ? "instance" : "class",
                     count);
              for (unsigned int i = 0; i < count; i++) {
                  if (methods[i].name) {
                      printf("    %s\n", sel_getName(methods[i].name));
                  }
              }
              free(methods);
          }

          static void dump_protocol(const char *name) {
              Protocol *p = objc_getProtocol(name);
              printf("PROTO %s: %s\n", name, p ? "FOUND" : "MISSING");
              if (!p) return;
              dump_methods(p, YES, YES);
              dump_methods(p, YES, NO);
              dump_methods(p, NO, YES);
              dump_methods(p, NO, NO);
          }

          int main(void) {
              const char *livefs = "/System/Library/PrivateFrameworks/LiveFS.framework/Versions/A/LiveFS";
              const char *fskit = "/System/Library/Frameworks/FSKit.framework/Versions/A/FSKit";
              void *h1 = dlopen(livefs, RTLD_LAZY | RTLD_LOCAL);
              printf("dlopen LiveFS: %s\n", h1 ? "OK" : dlerror());
              void *h2 = dlopen(fskit, RTLD_LAZY | RTLD_LOCAL);
              printf("dlopen FSKit: %s\n", h2 ? "OK" : dlerror());
              dump_protocol("LiveFSMounterUnentitled");
              dump_protocol("LiveFSMounter");
              return 0;
          }
          EOF
          clang -fobjc-arc -framework Foundation "$SRC" -o "$BIN"
          "$BIN" | tee "$OUT"

      - name: FAT16 direct FSKit mount A/B
        shell: bash
        run: |
          set -uo pipefail
          DIAG="$RUNNER_TEMP/fskit-diag"
          IMG="$RUNNER_TEMP/fskit-fat16.dmg"
          DIRECT_MP="$RUNNER_TEMP/fskit-direct"
          RESULT="$DIAG/result.txt"
          mkdir -p "$DIRECT_MP"
          : > "$RESULT"

          cleanup() {
            set +e
            if [[ -n "${DEVICE:-}" ]]; then
              /sbin/umount "$DEVICE" >/dev/null 2>&1 || true
            fi
            if [[ -n "${WHOLE:-}" ]]; then
              hdiutil detach -force "$WHOLE" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          echo '=== create FAT16 image ===' | tee -a "$RESULT"
          hdiutil create -quiet -size 32m -layout MBRSPUD -fs 'MS-DOS FAT16' -volname EDPFAT "$IMG"
          ATTACH="$(hdiutil attach -nomount "$IMG")"
          printf '%s\n' "$ATTACH" | tee -a "$RESULT"
          WHOLE="$(printf '%s\n' "$ATTACH" | awk '$1 ~ /^\/dev\/disk[0-9]+$/ {print $1; exit}')"
          DEVICE="$(printf '%s\n' "$ATTACH" | awk '$1 ~ /^\/dev\/disk[0-9]+s[0-9]+$/ {d=$1} END {print d}')"
          if [[ -z "$DEVICE" ]]; then
            DEVICE="$(printf '%s\n' "$ATTACH" | awk '$1 ~ /^\/dev\/disk[0-9]+$/ {d=$1} END {print d}')"
          fi
          echo "WHOLE=$WHOLE" | tee -a "$RESULT"
          echo "DEVICE=$DEVICE" | tee -a "$RESULT"
          diskutil info "$DEVICE" | tee -a "$RESULT"

          echo | tee -a "$RESULT"
          echo '=== direct /sbin/mount -F ===' | tee -a "$RESULT"
          set +e
          DIRECT_OUTPUT="$(/sbin/mount -F -t msdos "$DEVICE" "$DIRECT_MP" 2>&1)"
          DIRECT_RC=$?
          set -e
          printf '%s\n' "$DIRECT_OUTPUT" | tee -a "$RESULT"
          echo "DIRECT_RC=$DIRECT_RC" | tee -a "$RESULT"
          mount | grep -F "$DEVICE" | tee -a "$RESULT" || true

          if mount | grep -Fq "$DEVICE"; then
            echo 'DIRECT_MOUNTED=1' | tee -a "$RESULT"
            /sbin/umount "$DEVICE" || diskutil unmount "$DEVICE" || true
          else
            echo 'DIRECT_MOUNTED=0' | tee -a "$RESULT"
          fi

          echo | tee -a "$RESULT"
          echo '=== Disk Arbitration via diskutil ===' | tee -a "$RESULT"
          set +e
          DA_OUTPUT="$(diskutil mount "$DEVICE" 2>&1)"
          DA_RC=$?
          set -e
          printf '%s\n' "$DA_OUTPUT" | tee -a "$RESULT"
          echo "DA_RC=$DA_RC" | tee -a "$RESULT"
          mount | grep -F "$DEVICE" | tee -a "$RESULT" || true
          if mount | grep -Fq "$DEVICE"; then
            echo 'DA_MOUNTED=1' | tee -a "$RESULT"
          else
            echo 'DA_MOUNTED=0' | tee -a "$RESULT"
          fi

          echo | tee -a "$RESULT"
          echo '=== summary ===' | tee -a "$RESULT"
          echo "DIRECT_RC=$DIRECT_RC" | tee -a "$RESULT"
          echo "DA_RC=$DA_RC" | tee -a "$RESULT"

      - name: Unified logs
        if: always()
        shell: bash
        run: |
          set +e
          DIAG="$RUNNER_TEMP/fskit-diag"
          sudo /usr/bin/log show \
            --last 5m \
            --style compact \
            --info \
            --debug \
            --predicate '(process == "fskitd") OR (process == "diskarbitrationd") OR (process == "mount") OR (process == "diskutil")' \
            > "$DIAG/unified.log" 2>&1
          grep -E -i 'entitled 0|entitlement no|mountVolume:fileSystem|NSXPC|Couldn.t communicate|Unable to invoke|mounted disk|entitled 1|entitlement yes' "$DIAG/unified.log" | tail -n 160 || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fskit-mount-diagnostic-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/fskit-diag
          if-no-files-found: warn
