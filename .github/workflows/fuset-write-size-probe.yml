name: FUSE-T write_size Writable E2E

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths: [".github/workflows/fuset-write-size-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  writable:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      FUSET_BUNDLE_ID: "org.fuset.fskit-srv.module"
      DIAG_PATH: "docs/diagnostics/fuset-write-size-macos26-ci.txt"
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Stage official FUSE-T on disposable runner
        run: |
          set -euo pipefail
          P="${RUNNER_TEMP}/f.pkg"; E="${RUNNER_TEMP}/e"; curl -fL --retry 3 -sS "$FUSET_PKG_URL" -o "$P"; test "$(shasum -a256 "$P"|awk '{print $1}')" = "$FUSET_PKG_SHA256"; pkgutil --expand-full "$P" "$E"
          S="$(find "$E" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"; test -n "$S"; codesign --verify --deep --strict "$S"; sudo rm -rf /Applications/fuse-t.app; sudo ditto "$S" /Applications/fuse-t.app
          A=/Applications/fuse-t.app; X="$A/Contents/Extensions/FskitSrvModule.appex"; /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "$A"; pluginkit -a "$X"||true; pluginkit -e use -i "$FUSET_BUNDLE_ID"||true
          D="$HOME/Library/Group Containers/group.com.apple.fskit.settings"; F="$D/enabledModules.plist"; mkdir -p "$D"; python3 - "$F" "$FUSET_BUNDLE_ID" <<'PY'
          import os,plistlib,sys
          p,b=sys.argv[1:];a=[]
          if os.path.exists(p):
           try:
            with open(p,'rb') as f:v=plistlib.load(f)
            if isinstance(v,list):a=[x for x in v if isinstance(x,str)]
           except:pass
          if b not in a:a.append(b)
          with open(p,'wb') as f:plistlib.dump(a,f)
          PY
          killall -9 fskit_agent 2>/dev/null||true;sudo killall -9 fskitd 2>/dev/null||true;sleep 2
      - name: Build exact write_size server
        run: |
          cat > "${RUNNER_TEMP}/s.py" <<'PY'
          import errno,json,os,socket,struct,subprocess,tempfile,uuid,sys
          H=struct.Struct('>II');R=1;F=2;N='volume.raw';back,mnt,log=sys.argv[1:];fd=os.open(back,os.O_RDWR|os.O_CLOEXEC);size=os.fstat(fd).st_size
          def rx(c,n):
           b=b''
           while len(b)<n:
            x=c.recv(n-len(b));
            if not x:raise EOFError
            b+=x
           return b
          def get(c):a,b=H.unpack(rx(c,8));return json.loads(rx(c,a)),rx(c,b)
          def put(c,m,p=b''):q=json.dumps(m,separators=(',',':'),sort_keys=True).encode();c.sendall(H.pack(len(q),len(p))+q+p)
          def ok(i,**k):d={'request_id':i,'ok':True};d.update(k);return d
          def er(i,e,s):return {'request_id':i,'ok':False,'errno':e,'message':s}
          def at(n,p,name,t,mode,sz,l):return {'node_id':n,'parent_id':p,'name':name,'type':t,'mode':mode,'uid':os.getuid(),'gid':os.getgid(),'link_count':l,'size':sz,'alloc_size':sz,'modify_time_sec':0,'modify_time_nsec':0,'change_time_sec':0,'change_time_nsec':0,'access_time_sec':0,'access_time_nsec':0,'birth_time_sec':0,'birth_time_nsec':0}
          sid='edprw-'+str(uuid.uuid4());tok=uuid.uuid4().hex;g=os.path.expanduser('~/Library/Group Containers/group.org.fuset.fskit-srv/s');os.makedirs(g,exist_ok=True);sp=os.path.join(g,sid[:16]+'.sock');sd=tempfile.mkdtemp(prefix=sid);sj=os.path.join(sd,'session.json');json.dump({'session_id':sid,'socket_path':sp,'auth_token':tok,'namedattr':False,'readonly':False,'volume_name':'EDP RW'},open(sj,'w'))
          try:os.unlink(sp)
          except:pass
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM);s.bind(sp);s.listen(1);subprocess.Popen(['/sbin/mount','-o','nobrowse','-t','fuset',sj,mnt]);c,_=s.accept();dh=100
          with open(log,'a',buffering=1) as L:
           while True:
            try:m,p=get(c)
            except EOFError:break
            i=int(m.get('request_id',-1));z=m.get('method');q=dict(m);q['payload_length']=len(p);L.write(json.dumps(q,sort_keys=True)+'\n')
            if z=='handshake':resp=ok(i,session_id=sid) if m.get('auth_token')==tok else er(i,errno.EACCES,'auth')
            elif z=='ping':resp=ok(i)
            elif z=='get_root_attributes':resp=ok(i,root_attrs=at(R,R,'/','directory',0o755,0,2))
            elif z=='statfs':b=max(1,(size+4095)//4096);resp=ok(i,block_size=4096,io_size=1048576,blocks=b,free_blocks=b,files=2,free_files=1)
            elif z=='lookup':resp=ok(i,lookup_item=at(F,R,N,'file',0o666,size,1)) if m.get('parent_id')==R and m.get('name')==N else er(i,errno.ENOENT,'nf')
            elif z=='get_attributes':resp=ok(i,item_attrs=at(F,R,N,'file',0o666,size,1)) if m.get('node_id')==F else ok(i,item_attrs=at(R,R,'/','directory',0o755,0,2))
            elif z=='open':resp=ok(i,handle_id=200)
            elif z=='read':off=int(m['offset']);ln=int(m['length']);put(c,ok(i),os.pread(fd,min(ln,max(0,size-off)),off) if off<size else b'');continue
            elif z=='write':
             off=int(m['offset']);ln=int(m['length'])
             if ln!=len(p) or off<0 or off+ln>size:resp=er(i,errno.EINVAL,'range')
             else:
              n=os.pwrite(fd,p,off);resp=ok(i,write_size=n);L.write('WRITE_SIZE_RESPONSE='+str(n)+'\n')
            elif z=='synchronize':os.fsync(fd);resp=ok(i)
            elif z=='close':resp=ok(i)
            elif z=='open_directory':resp=ok(i,handle_id=dh);dh+=1
            elif z=='enumerate_directory':
             ck=int(m.get('cookie',0));vr=int(m.get('verifier',1))
             if ck==0:x=at(F,R,N,'file',0o666,size,1);x['cookie']=1;resp=ok(i,dir_items=[x],next_cookie=1,verifier=vr)
             else:resp=ok(i,dir_items=[],next_cookie=ck,verifier=vr)
            elif z=='close_directory':resp=ok(i)
            elif z=='list_xattrs':resp=ok(i,xattr_names=[])
            elif z=='get_xattr':resp=er(i,getattr(errno,'ENOATTR',errno.ENODATA),'none')
            elif z=='set_attributes':resp=ok(i,item_attrs=at(F,R,N,'file',0o666,size,1))
            else:resp=er(i,errno.EPERM,'fixed transport')
            put(c,resp)
          PY
      - name: Verify direct and nested block writes
        run: |
          set -euo pipefail
          RAW="${RUNNER_TEMP}/rw.raw";dd if=/dev/zero of="$RAW" bs=1m count=64 status=none;M="${RUNNER_TEMP}/m";mkdir -p "$M";L="${RUNNER_TEMP}/rpc";python3 "${RUNNER_TEMP}/s.py" "$RAW" "$M" "$L" & P=$!;echo "P=$P" >> "$GITHUB_ENV";echo "M=$M" >> "$GITHUB_ENV"
          for i in $(seq 1 20);do mount|grep -Fq " on $M "&&break;sleep 1;done;mount|grep -F " on $M "|tee "${RUNNER_TEMP}/mount"
          V="$M/volume.raw";printf 'unaligned-write-works' > "${RUNNER_TEMP}/small";dd if="${RUNNER_TEMP}/small" of="$V" bs=1 seek=12345 conv=notrunc status=none;sync;dd if="$V" of="${RUNNER_TEMP}/small.out" bs=1 skip=12345 count=21 status=none;cmp "${RUNNER_TEMP}/small" "${RUNNER_TEMP}/small.out";dd if="$RAW" of="${RUNNER_TEMP}/small.back" bs=1 skip=12345 count=21 status=none;cmp "${RUNNER_TEMP}/small" "${RUNNER_TEMP}/small.back";echo 'RESULT=I3_UNALIGNED_WRITE_SIZE_OK'|tee "${RUNNER_TEMP}/results"
          python3 - "${RUNNER_TEMP}/p64" <<'PY'
          import hashlib,sys
          b=b''.join(hashlib.sha256(str(i).encode()).digest() for i in range(2048));open(sys.argv[1],'wb').write(b)
          PY
          dd if="${RUNNER_TEMP}/p64" of="$V" bs=64k seek=16 conv=notrunc status=none;sync;dd if="$RAW" of="${RUNNER_TEMP}/p64.back" bs=64k skip=16 count=1 status=none;cmp "${RUNNER_TEMP}/p64" "${RUNNER_TEMP}/p64.back";echo 'RESULT=I3_64K_WRITE_SIZE_OK'|tee -a "${RUNNER_TEMP}/results"
          O="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "$V")";echo "$O"|tee "${RUNNER_TEMP}/hdi";D="$(echo "$O"|awk '/^\/dev\/disk/{print $1;exit}')";test -n "$D";echo "D=$D" >> "$GITHUB_ENV";diskutil info "$D"|tee "${RUNNER_TEMP}/di";grep -Eq 'Media Read-Only:[[:space:]]+No' "${RUNNER_TEMP}/di"
          RDEV="/dev/r$(basename "$D")";printf 'nested-rw-device' > "${RUNNER_TEMP}/nested";dd if="${RUNNER_TEMP}/nested" of="$RDEV" bs=1 seek=3145729 conv=notrunc status=none;sync;dd if="$RAW" of="${RUNNER_TEMP}/nested.back" bs=1 skip=3145729 count=16 status=none;cmp "${RUNNER_TEMP}/nested" "${RUNNER_TEMP}/nested.back";echo 'RESULT=I6_HDIUTIL_WRITABLE_BLOCK_OK'|tee -a "${RUNNER_TEMP}/results";cat "$L"|grep -E '"method": "write"|WRITE_SIZE_RESPONSE'|tail -n 40|tee "${RUNNER_TEMP}/writes"
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "$(dirname "$DIAG_PATH")";{ echo '# FUSE-T write_size writable E2E';echo;echo 'generated_at_utc=<normalized>';echo "runner_os=$(sw_vers -productVersion)";echo;cat "${RUNNER_TEMP}/results" 2>/dev/null||true;echo;cat "${RUNNER_TEMP}/mount" 2>/dev/null||true;echo;cat "${RUNNER_TEMP}/hdi" 2>/dev/null||true;cat "${RUNNER_TEMP}/di" 2>/dev/null||true;echo;cat "${RUNNER_TEMP}/writes" 2>/dev/null||true;} > "$DIAG_PATH";cat "$DIAG_PATH"
      - name: Cleanup
        if: always()
        run: |
          set +e;[[ -n "${D:-}" ]]&&hdiutil detach "$D" -force;[[ -n "${M:-}" ]]&&umount "$M";[[ -n "${P:-}" ]]&&kill "$P";sudo rm -rf /Applications/fuse-t.app;true
      - name: Commit diagnostic
        if: always() && github.ref_name == 'test/fuset-minimal-fskit-bridge'
        run: |
          set -euo pipefail;git add "$DIAG_PATH";git diff --cached --quiet -- "$DIAG_PATH"&&exit 0;git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git commit -m 'docs: capture FUSE-T write_size E2E [skip ci]';git pull --rebase origin "$GITHUB_REF_NAME";git push origin "HEAD:$GITHUB_REF_NAME"
