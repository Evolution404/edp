name: macFUSE Block Boundary

on:
  push:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - ".github/workflows/macfuse-block-boundary.yml"
      - "native/EDPFSKitPoC/Tools/probe-macfuse-block-boundary.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  boundary:
    name: FSKit transport vs block publication
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Record runtime
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          uname -m
          xcodebuild -version

      - name: Install official macFUSE
        run: |
          set -euo pipefail
          brew install --cask macfuse
          brew list --cask --versions macfuse
          pkg-config --exists fuse
          pkg-config --modversion fuse

          APP="/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app"
          GENERIC="${APP}/Contents/Extensions/io.macfuse.app.fsmodule.macfuse.appex"
          LOCAL="${APP}/Contents/Extensions/io.macfuse.app.fsmodule.macfuse-local.appex"
          test -d "${GENERIC}"
          test -d "${LOCAL}"
          "${APP}/Contents/MacOS/macfuse" install --force || true

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${GENERIC}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :EXAppExtensionAttributes:FSShortName' "${GENERIC}/Contents/Info.plist"
          echo 'RESULT=OFFICIAL_MACFUSE_FSKIT_MODULE_INSTALLED'

      - name: Enable official macFUSE FSKit modules on ephemeral runner
        run: |
          set -euo pipefail
          GENERIC_MODULE="io.macfuse.app.fsmodule.macfuse"
          LOCAL_MODULE="io.macfuse.app.fsmodule.macfuse-local"
          /usr/bin/pluginkit -e use -i "${GENERIC_MODULE}" || true
          /usr/bin/pluginkit -e use -i "${LOCAL_MODULE}" || true

          SETTINGS_DIR="$HOME/Library/Group Containers/group.com.apple.fskit.settings"
          SETTINGS="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${SETTINGS}" "${GENERIC_MODULE}" "${LOCAL_MODULE}" <<'PY'
          import os
          import plistlib
          import sys

          path = sys.argv[1]
          modules = sys.argv[2:]
          enabled = []
          if os.path.exists(path):
              try:
                  with open(path, "rb") as handle:
                      value = plistlib.load(handle)
                  if isinstance(value, list):
                      enabled = value
              except Exception:
                  pass
          for module in modules:
              if module not in enabled:
                  enabled.append(module)
          with open(path, "wb") as handle:
              plistlib.dump(enabled, handle, fmt=plistlib.FMT_BINARY)
          PY
          plutil -p "${SETTINGS}"

          killall fskit_agent 2>/dev/null || true
          killall extensionkitservice 2>/dev/null || true
          sleep 2
          echo 'RESULT=CI_ONLY_MACFUSE_MODULE_STATE_SEEDED'

      - name: Prove macFUSE FSKit does not publish a block device
        run: |
          set -euo pipefail
          bash native/EDPFSKitPoC/Tools/probe-macfuse-block-boundary.sh

      - name: Upload boundary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macfuse-block-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/edp-macfuse-boundary/
          if-no-files-found: ignore
          retention-days: 14
