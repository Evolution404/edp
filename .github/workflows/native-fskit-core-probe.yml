name: Native FSKit Swift Core Probe

on:
  push:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - "native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift"
      - "native/EDPFSKitPoC/Tools/ValidateEDPMetadataProbe.swift"
      - "fixtures/golden/disks.json"
      - "fixtures/real_disks/**/LBA4.bin"
      - "fixtures/real_disks/**/LBA7.bin"
      - ".github/workflows/native-fskit-core-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-fskit-swift-core-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Swift metadata parity
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Compile native Swift probe
        run: |
          set -euo pipefail
          xcrun swiftc \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Tools/ValidateEDPMetadataProbe.swift \
            -o "${RUNNER_TEMP}/validate-edp-probe"

      - name: Golden fixture regression
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/validate-edp-probe" fixtures/golden/disks.json \
            | tee "${RUNNER_TEMP}/swift-core-probe.txt"
          grep -F 'ALIGNMENT_512=OK' "${RUNNER_TEMP}/swift-core-probe.txt"
          grep -F 'ALIGNMENT_4096=OK' "${RUNNER_TEMP}/swift-core-probe.txt"
          grep -F 'RESERVED_PROBE_NEGATIVE_CONTROLS=OK' "${RUNNER_TEMP}/swift-core-probe.txt"
          grep -F 'RESULT=SWIFT_EDP_LBA7_GOLDEN_OK' "${RUNNER_TEMP}/swift-core-probe.txt"
          grep -F 'RESULT=SWIFT_EDP_RESERVED_PROBE_GOLDEN_OK' "${RUNNER_TEMP}/swift-core-probe.txt"
          echo 'RESULT=PURE_SWIFT_EDP_CORE_PROBE_OK'
