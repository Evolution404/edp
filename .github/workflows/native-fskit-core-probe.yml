name: Native Swift Fast Checks

on:
  push:
    branches: ["feat/macos26-native-fskit", "feat/macos26-fskit-*"]
    paths:
      - "native/EDPFSKitPoC/Extension/**/*.swift"
      - "native/EDPFSKitPoC/Host/**/*.swift"
      - "native/EDPFSKitPoC/Tools/InspectFSKit.swift"
      - "native/EDPFSKitPoC/Tools/ValidateEDPAlignedRead.swift"
      - "native/EDPFSKitPoC/Tools/ValidateEDPMetadataProbe.swift"
      - "native/EDPFSKitPoC/Tools/ValidateEDPNativeCore.swift"
      - "native/EDPFSKitPoC/Tools/probe-fskit-sdk.sh"
      - "native/EDPFSKitPoC/Tools/verify-approved-runtime.sh"
      - "fixtures/golden/disks.json"
      - "fixtures/real_disks/**/LBA4.bin"
      - "fixtures/real_disks/**/LBA7.bin"
      - ".github/workflows/native-fskit-core-probe.yml"
  pull_request:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - "native/EDPFSKitPoC/Extension/**/*.swift"
      - "native/EDPFSKitPoC/Host/**/*.swift"
      - "native/EDPFSKitPoC/Tools/InspectFSKit.swift"
      - "native/EDPFSKitPoC/Tools/ValidateEDPAlignedRead.swift"
      - "native/EDPFSKitPoC/Tools/ValidateEDPMetadataProbe.swift"
      - "native/EDPFSKitPoC/Tools/ValidateEDPNativeCore.swift"
      - "native/EDPFSKitPoC/Tools/probe-fskit-sdk.sh"
      - "native/EDPFSKitPoC/Tools/verify-approved-runtime.sh"
      - "fixtures/golden/disks.json"
      - "fixtures/real_disks/**/LBA4.bin"
      - "fixtures/real_disks/**/LBA7.bin"
      - ".github/workflows/native-fskit-core-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-swift-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Golden regressions and source typecheck
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Probe installed FSKit SDK capabilities
        run: |
          set -euo pipefail
          bash native/EDPFSKitPoC/Tools/probe-fskit-sdk.sh \
            | tee "${RUNNER_TEMP}/fskit-sdk-capabilities.txt"
          grep -F 'RESULT=FSKIT_SDK_CAPABILITIES_PROBED' "${RUNNER_TEMP}/fskit-sdk-capabilities.txt"
          if grep -Fq 'FSKIT_SDK_VOLUME_HANDLER=true' "${RUNNER_TEMP}/fskit-sdk-capabilities.txt"; then
            echo '::notice::This runner SDK exposes handler-style FSKit volume APIs; evaluate migration from FSVolume.Operations.'
          fi
          if grep -Fq 'FSKIT_SDK_CLIENT_DIRECT_SETTINGS=true' "${RUNNER_TEMP}/fskit-sdk-capabilities.txt"; then
            echo '::notice::This runner SDK exposes direct File System Extensions settings API; evaluate replacing the ServiceManagement fallback.'
          fi

      - name: Validate runtime verifier syntax
        run: bash -n native/EDPFSKitPoC/Tools/verify-approved-runtime.sh

      - name: Compile fast regression binaries in parallel
        run: |
          set -euo pipefail

          xcrun swiftc -O \
            native/EDPFSKitPoC/Extension/EDPAlignedRead.swift \
            native/EDPFSKitPoC/Tools/ValidateEDPAlignedRead.swift \
            -o "${RUNNER_TEMP}/validate-aligned-read" &
          aligned_pid=$!

          xcrun swiftc \
            native/EDPFSKitPoC/Extension/EDPRawIO.swift \
            native/EDPFSKitPoC/Extension/EDPAlignedRead.swift \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Tools/ValidateEDPMetadataProbe.swift \
            -o "${RUNNER_TEMP}/validate-edp-probe" &
          metadata_pid=$!

          xcrun swiftc \
            native/EDPFSKitPoC/Extension/EDPRawIO.swift \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift \
            native/EDPFSKitPoC/Tools/ValidateEDPNativeCore.swift \
            -o "${RUNNER_TEMP}/validate-native-core" &
          core_pid=$!

          wait "${aligned_pid}"
          wait "${metadata_pid}"
          wait "${core_pid}"

      - name: Execute production aligned read-loop regression
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/validate-aligned-read" \
            | tee "${RUNNER_TEMP}/aligned-read.txt"
          grep -F 'ALIGNED_READ_SEGMENTED_PROGRESS=OK' "${RUNNER_TEMP}/aligned-read.txt"
          grep -F 'ALIGNED_READ_SEGMENTED_PROPERTIES=OK:cases=512' "${RUNNER_TEMP}/aligned-read.txt"
          grep -F 'ALIGNED_READ_INVALID_RESULTS=OK' "${RUNNER_TEMP}/aligned-read.txt"
          grep -F 'ALIGNED_READ_OFFSET_OVERFLOW=OK' "${RUNNER_TEMP}/aligned-read.txt"
          grep -F 'RESULT=ALIGNED_READ_LOOP_OK' "${RUNNER_TEMP}/aligned-read.txt"

      - name: Reserved-sector and alignment regressions
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/validate-edp-probe" fixtures/golden/disks.json \
            | tee "${RUNNER_TEMP}/swift-metadata-probe.txt"
          grep -F 'ALIGNMENT_512=OK' "${RUNNER_TEMP}/swift-metadata-probe.txt"
          grep -F 'ALIGNMENT_4096=OK' "${RUNNER_TEMP}/swift-metadata-probe.txt"
          grep -F 'ALIGNED_WINDOW_PROPERTIES=OK:cases=1280' "${RUNNER_TEMP}/swift-metadata-probe.txt"
          grep -F 'ALIGNED_WINDOW_NEGATIVE_CONTROLS=OK' "${RUNNER_TEMP}/swift-metadata-probe.txt"
          grep -F 'ALIGNED_SHORT_READ_CONTINUATION=OK' "${RUNNER_TEMP}/swift-metadata-probe.txt"
          grep -F 'ALIGNED_CONTINUATION_PROPERTIES=OK:cases=384' "${RUNNER_TEMP}/swift-metadata-probe.txt"
          grep -F 'LBA4_SERIAL_NEGATIVE_CONTROLS=OK' "${RUNNER_TEMP}/swift-metadata-probe.txt"
          grep -F 'LBA7_SHAPE_GUARDS=OK' "${RUNNER_TEMP}/swift-metadata-probe.txt"
          grep -F 'RESERVED_PROBE_NEGATIVE_CONTROLS=OK' "${RUNNER_TEMP}/swift-metadata-probe.txt"
          grep -F 'RESULT=SWIFT_EDP_RESERVED_PROBE_GOLDEN_OK' "${RUNNER_TEMP}/swift-metadata-probe.txt"

      - name: Crypto, metadata, and encrypted-reader regressions
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/validate-native-core" fixtures/golden/disks.json \
            | tee "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'NATIVE_CRC32_GOLDEN=OK' "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'NATIVE_SM4_GOLDEN=OK' "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'NATIVE_CRYPTO_NEGATIVE_PATHS=OK' "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'NATIVE_ENCRYPTED_READER_BOUNDARIES=OK' "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'NATIVE_METADATA_NEGATIVE_PATHS=OK' "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'NATIVE_REAL_KEY_RANDOM_READS=OK:disk4_real_lexar:cases=512' "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'NATIVE_REAL_KEY_RANDOM_READS=OK:disk5_real_sandisk:cases=512' "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'NATIVE_REAL_KEY_RANDOM_READS=OK:disks=2:cases=1024' "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'RESULT=SWIFT_NATIVE_CRYPTO_CORE_OK' "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'RESULT=SWIFT_NATIVE_LBA11_LBA12_OK' "${RUNNER_TEMP}/swift-native-core.txt"
          grep -F 'RESULT=SWIFT_NATIVE_ENCRYPTED_READER_OK' "${RUNNER_TEMP}/swift-native-core.txt"

      - name: Validate production Swift source graph in parallel
        run: |
          set -euo pipefail

          xcrun swiftc -parse-as-library -typecheck native/EDPFSKitPoC/Extension/*.swift &
          extension_pid=$!
          xcrun swiftc -parse-as-library -typecheck native/EDPFSKitPoC/Host/EDPFSKitPoCApp.swift &
          host_pid=$!
          xcrun swiftc -framework FSKit native/EDPFSKitPoC/Tools/InspectFSKit.swift \
            -o "${RUNNER_TEMP}/inspect-fskit-compile-check" &
          inspect_pid=$!

          wait "${extension_pid}"
          wait "${host_pid}"
          wait "${inspect_pid}"
          echo 'RESULT=NATIVE_SWIFT_SOURCE_GRAPH_TYPECHECKED'
