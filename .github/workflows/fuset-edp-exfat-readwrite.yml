name: FUSE-T Encrypted EDP ExFAT Read-Write E2E

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift"
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTEDPReadWriteFixtureBridge.swift"
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/PrepareEDPFilesystemFixture.swift"
      - "native/EDPFSKitPoC/Extension/EDPBlockDevice.swift"
      - "native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift"
      - "native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift"
      - ".github/workflows/fuset-edp-exfat-readwrite.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuset-edp-exfat-readwrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exfat-rw:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      FUSET_BUNDLE_ID: "org.fuset.fskit-srv.module"
      GOLDEN_NAME: "disk4_real_lexar"
      REAL_LBA11: "fixtures/real_disks/disk4/LBA11.bin"
      REAL_LBA12: "fixtures/real_disks/disk4/LBA12.bin"
      VOLNAME: "EDP-EXFAT-RW"
      DIAG_PATH: "docs/diagnostics/fuset-edp-exfat-readwrite-macos26-ci.txt"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve captured EDP metadata without logging password
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test ! -e /Library/Filesystems/macfuse.fs
          test ! -e /Library/Application\ Support/fuse-t
          test ! -e /usr/local/bin/go-nfsv4
          PASSWORD_FILE="${RUNNER_TEMP}/edp-rw-password"
          python3 - fixtures/golden/disks.json "${GOLDEN_NAME}" "${PASSWORD_FILE}" "${GITHUB_ENV}" <<'PY'
          import json, os, sys
          source, wanted, pw_path, env_path = sys.argv[1:]
          item = next(x for x in json.load(open(source))['disks'] if x['name'] == wanted)
          p = item['lba11_params']; password = item['password'].encode()
          fd = os.open(pw_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          try: os.write(fd, password)
          finally: os.close(fd)
          with open(env_path, 'a') as env:
              env.write(f"EDP_VID={p['vid']}\nEDP_PID={p['pid']}\nEDP_DEVICE_SIZE={p['size_bytes']}\nEDP_PARTITION_TYPE=2\nPASSWORD_FILE={pw_path}\n")
          print('RESULT=I5_REALMETA_VECTOR_READY_WITHOUT_SECRET_LOGGING')
          PY
          test "$(stat -f %Lp "${PASSWORD_FILE}")" = 600
          test "$(stat -f %z "${REAL_LBA11}")" -eq 512
          test "$(stat -f %z "${REAL_LBA12}")" -eq 512

      - name: Manufacture writable ExFAT raw filesystem through a block device
        run: |
          set -euo pipefail
          PLAIN="${RUNNER_TEMP}/exfat-plain.raw"
          SENTINEL='EDP-EXFAT-RW-BASELINE-v1'
          truncate -s 201326592 "${PLAIN}"
          RAW_OUT="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${PLAIN}")"
          RAW_DISK="$(printf '%s\n' "${RAW_OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${RAW_DISK}"
          diskutil info "${RAW_DISK}" | tee "${RUNNER_TEMP}/manufacture-block.txt"
          grep -Eq 'Media Read-Only:[[:space:]]+No' "${RUNNER_TEMP}/manufacture-block.txt"
          sudo /sbin/newfs_exfat -v "${VOLNAME}" "/dev/r$(basename "${RAW_DISK}")"
          diskutil mount "${RAW_DISK}"
          MOUNT="/Volumes/${VOLNAME}"
          for i in $(seq 1 15); do [[ -d "${MOUNT}" ]] && break; sleep 1; done
          test -d "${MOUNT}"
          printf '%s\n' "${SENTINEL}" > "${MOUNT}/BASELINE.txt"
          mkdir -p "${MOUNT}/Seed Folder"
          printf '%s\n' 'seed-content' > "${MOUNT}/Seed Folder/seed.txt"
          sync
          hdiutil detach "${RAW_DISK}" -force
          test "$(stat -f %z "${PLAIN}")" -eq 201326592
          echo "PLAIN=${PLAIN}" >> "${GITHUB_ENV}"
          echo "SENTINEL=${SENTINEL}" >> "${GITHUB_ENV}"
          echo 'RESULT=I7_NATIVE_EXFAT_PLAINTEXT_FIXTURE_READY'

      - name: Encrypt ExFAT into real-metadata sparse EDP container
        run: |
          set -euo pipefail
          PREPARE="${RUNNER_TEMP}/PrepareEDPFilesystemFixture"
          CONTAINER="${RUNNER_TEMP}/edp-exfat-whole-device.raw"
          xcrun swiftc -swift-version 6 -warnings-as-errors \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/PrepareEDPFilesystemFixture.swift \
            -o "${PREPARE}"
          "${PREPARE}" \
            --lba11 "${REAL_LBA11}" --lba12 "${REAL_LBA12}" \
            --vid "${EDP_VID}" --pid "${EDP_PID}" --device-size "${EDP_DEVICE_SIZE}" \
            --partition-type "${EDP_PARTITION_TYPE}" --plaintext "${PLAIN}" \
            --output "${CONTAINER}" --password-file "${PASSWORD_FILE}" \
            | tee "${RUNNER_TEMP}/prepare.log"
          grep -Fq 'RESULT=EDP_REAL_METADATA_FILESYSTEM_FIXTURE_READY' "${RUNNER_TEMP}/prepare.log"
          START="$(awk -F= '/^PREPARED_PARTITION_START_SECTOR=/ {print $2}' "${RUNNER_TEMP}/prepare.log")"
          PSIZE="$(awk -F= '/^PREPARED_PARTITION_SIZE_BYTES=/ {print $2}' "${RUNNER_TEMP}/prepare.log")"
          test -n "${START}"; test -n "${PSIZE}"
          chmod 0600 "${CONTAINER}"
          BEFORE="$(dd if="${CONTAINER}" bs=512 skip="${START}" count=393216 status=none | shasum -a 256 | awk '{print $1}')"
          echo "CONTAINER=${CONTAINER}" >> "${GITHUB_ENV}"
          echo "PARTITION_START_SECTOR=${START}" >> "${GITHUB_ENV}"
          echo "PARTITION_SIZE=${PSIZE}" >> "${GITHUB_ENV}"
          echo "CIPHER_SHA_BEFORE=${BEFORE}" >> "${GITHUB_ENV}"
          du -h "${CONTAINER}" | tee "${RUNNER_TEMP}/sparse-size.txt"
          echo 'RESULT=I5_ENCRYPTED_EXFAT_EDP_FIXTURE_READY'

      - name: Stage exact official FUSE-T only on disposable runner
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/fuse-t.pkg"; EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl --fail --location --retry 3 --silent --show-error "${FUSET_PKG_URL}" -o "${PKG}"
          test "$(shasum -a 256 "${PKG}" | awk '{print $1}')" = "${FUSET_PKG_SHA256}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"
          SOURCE_APP="$(find "${EXPANDED}" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"
          test -n "${SOURCE_APP}"; codesign --verify --deep --strict "${SOURCE_APP}"
          sudo rm -rf /Applications/fuse-t.app; sudo ditto "${SOURCE_APP}" /Applications/fuse-t.app
          APP=/Applications/fuse-t.app; EXT="${APP}/Contents/Extensions/FskitSrvModule.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "${APP}"
          pluginkit -a "${EXT}" || true; pluginkit -a "${APP}" || true; pluginkit -e use -i "${FUSET_BUNDLE_ID}" || true
          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"; ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"; mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${FUSET_BUNDLE_ID}" <<'PY'
          import os, plistlib, sys
          path, bundle_id = sys.argv[1:]; enabled = []
          if os.path.exists(path):
              try:
                  with open(path, 'rb') as f: value = plistlib.load(f)
                  if isinstance(value, list): enabled = [x for x in value if isinstance(x, str)]
              except Exception: pass
          if bundle_id not in enabled: enabled.append(bundle_id)
          with open(path, 'wb') as f: plistlib.dump(enabled, f)
          PY
          chmod 600 "${ENABLED_PLIST}"
          killall -9 fskit_agent 2>/dev/null || true; killall -9 extensionkitservice 2>/dev/null || true; sudo killall -9 fskitd 2>/dev/null || true; sleep 3

      - name: Compile formal Swift EDP read-write thin bridge
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library -swift-version 6 -warnings-as-errors -D FUSET_BRIDGE_LIBRARY \
            native/EDPFSKitPoC/Extension/EDPRawIO.swift \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift \
            native/EDPFSKitPoC/Extension/EDPBlockDevice.swift \
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTEDPReadWriteFixtureBridge.swift \
            -o "${RUNNER_TEMP}/edp-fuset-rw-fixture"
          otool -L "${RUNNER_TEMP}/edp-fuset-rw-fixture" | tee "${RUNNER_TEMP}/otool.txt"
          ! grep -Eiq 'macfuse|libfuse|go-nfsv4' "${RUNNER_TEMP}/otool.txt"
          grep -Fq 'write_size' native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift
          echo 'RESULT=I4_FORMAL_SWIFT_RW_THIN_BRIDGE_BUILT'

      - name: Native ExFAT CRUD Finder persistence over encrypted EDP transport
        run: |
          set -euo pipefail
          HIDDEN="${RUNNER_TEMP}/edp-exfat-hidden-$(uuidgen | tr '[:upper:]' '[:lower:]')"; BLOG="${RUNNER_TEMP}/bridge.log"; mkdir -p "${HIDDEN}"
          "${RUNNER_TEMP}/edp-fuset-rw-fixture" \
            --container "${CONTAINER}" --vid "${EDP_VID}" --pid "${EDP_PID}" \
            --device-size "${EDP_DEVICE_SIZE}" --partition-type "${EDP_PARTITION_TYPE}" \
            --password-file "${PASSWORD_FILE}" --mountpoint "${HIDDEN}" \
            --volume-name 'EDP Encrypted Writable Transport' >"${BLOG}" 2>&1 &
          BPID=$!; echo "BPID=${BPID}" >> "${GITHUB_ENV}"; echo "HIDDEN=${HIDDEN}" >> "${GITHUB_ENV}"; echo "BLOG=${BLOG}" >> "${GITHUB_ENV}"
          for i in $(seq 1 30); do mount | grep -Fq " on ${HIDDEN} " && break; kill -0 "${BPID}"; sleep 1; done
          cat "${BLOG}"; mount | grep -F " on ${HIDDEN} " | tee "${RUNNER_TEMP}/hidden-mount.txt"; ! grep -q 'read-only' "${RUNNER_TEMP}/hidden-mount.txt"
          grep -Fq 'BACKING_MODE=EDP_FILE_FIXTURE_READWRITE_RANDOM_ACCESS' "${BLOG}"; grep -Fq 'PLAINTEXT_CACHE=none' "${BLOG}"
          lsof -p "${BPID}" | tee "${RUNNER_TEMP}/bridge-lsof.txt"; grep -Fq "${CONTAINER}" "${RUNNER_TEMP}/bridge-lsof.txt"; ! grep -Fq "${PLAIN}" "${RUNNER_TEMP}/bridge-lsof.txt"

          EXPOSED="${HIDDEN}/volume.raw"; test -f "${EXPOSED}"
          OUT="$(hdiutil attach -imagekey diskimage-class=CRawDiskImage "${EXPOSED}" 2>"${RUNNER_TEMP}/attach.err")"; printf '%s\n' "${OUT}" | tee "${RUNNER_TEMP}/attach.txt"
          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"; test -n "${DISK}"; MOUNT="/Volumes/${VOLNAME}"
          for i in $(seq 1 20); do [[ -d "${MOUNT}" ]] && break; sleep 1; done; test -d "${MOUNT}"
          echo "OUTER_DISK=${DISK}" >> "${GITHUB_ENV}"; echo "OUTER_MOUNT=${MOUNT}" >> "${GITHUB_ENV}"
          diskutil info "${DISK}" | tee "${RUNNER_TEMP}/diskutil-first.txt"
          grep -Eiq 'File System Personality:[[:space:]]+ExFAT' "${RUNNER_TEMP}/diskutil-first.txt"
          grep -Eq 'Media Read-Only:[[:space:]]+No' "${RUNNER_TEMP}/diskutil-first.txt"
          grep -Eq 'Volume Read-Only:[[:space:]]+No' "${RUNNER_TEMP}/diskutil-first.txt"
          test "$(cat "${MOUNT}/BASELINE.txt")" = "${SENTINEL}"

          mkdir "${MOUNT}/Created Directory"
          printf '%s\n' first-version > "${MOUNT}/replace-target.txt"; printf '%s\n' replacement-version > "${MOUNT}/replace-temp.txt"; mv -f "${MOUNT}/replace-temp.txt" "${MOUNT}/replace-target.txt"
          test "$(cat "${MOUNT}/replace-target.txt")" = replacement-version
          printf '%s\n' rename-me > "${MOUNT}/rename-source.txt"; mv "${MOUNT}/rename-source.txt" "${MOUNT}/Created Directory/renamed.txt"
          printf '%s\n' delete-me > "${MOUNT}/delete-me.txt"; rm "${MOUNT}/delete-me.txt"
          python3 - "${MOUNT}/large-random.bin" <<'PY'
          import hashlib, sys
          with open(sys.argv[1], 'wb') as f:
              for i in range(16384): f.write(hashlib.sha256(f'EDP-EXFAT-LARGE:{i}'.encode()).digest() * 128)
          PY
          LARGE_SHA="$(shasum -a 256 "${MOUNT}/large-random.bin" | awk '{print $1}')"; test "$(stat -f %z "${MOUNT}/large-random.bin")" -eq 67108864
          set +e; xattr -w com.edp.usbvault.test rw-xattr "${MOUNT}/replace-target.txt" 2>"${RUNNER_TEMP}/xattr.err"; XATTR_RC=$?; set -e
          if [[ ${XATTR_RC} -eq 0 ]]; then xattr -p com.edp.usbvault.test "${MOUNT}/replace-target.txt" | grep -Fq rw-xattr; echo XATTR_RESULT=supported > "${RUNNER_TEMP}/xattr-result.txt"; else echo "XATTR_RESULT=provider-rejected-rc-${XATTR_RC}" > "${RUNNER_TEMP}/xattr-result.txt"; fi
          sync

          cat > "${RUNNER_TEMP}/finder.applescript" <<'OSA'
          on run argv
              set targetAlias to (POSIX file (item 1 of argv)) as alias
              tell application "Finder" to return name of every item of targetAlias as string
          end run
          OSA
          osacompile -o "${RUNNER_TEMP}/finder.scpt" "${RUNNER_TEMP}/finder.applescript"; osascript "${RUNNER_TEMP}/finder.scpt" "${MOUNT}" | tee "${RUNNER_TEMP}/finder.txt"; grep -Fq large-random.bin "${RUNNER_TEMP}/finder.txt"
          echo 'RESULT=I7_EXFAT_CRUD_RENAME_LARGEFILE_FINDER_OK'

          hdiutil detach "${DISK}" -force; echo 'OUTER_DISK=' >> "${GITHUB_ENV}"
          AFTER="$(dd if="${CONTAINER}" bs=512 skip="${PARTITION_START_SECTOR}" count=393216 status=none | shasum -a 256 | awk '{print $1}')"; test "${AFTER}" != "${CIPHER_SHA_BEFORE}"; echo "CIPHER_SHA_AFTER=${AFTER}" >> "${GITHUB_ENV}"
          echo 'RESULT=I5_ENCRYPTED_BACKING_CHANGED_AFTER_FILESYSTEM_WRITES'

          OUT2="$(hdiutil attach -imagekey diskimage-class=CRawDiskImage "${EXPOSED}")"; DISK2="$(printf '%s\n' "${OUT2}" | awk '/^\/dev\/disk/ {print $1; exit}')"; test -n "${DISK2}"; echo "OUTER_DISK=${DISK2}" >> "${GITHUB_ENV}"
          for i in $(seq 1 20); do [[ -d "${MOUNT}" ]] && break; sleep 1; done
          test "$(cat "${MOUNT}/replace-target.txt")" = replacement-version; test "$(cat "${MOUNT}/Created Directory/renamed.txt")" = rename-me; test ! -e "${MOUNT}/delete-me.txt"; test "$(shasum -a 256 "${MOUNT}/large-random.bin" | awk '{print $1}')" = "${LARGE_SHA}"
          diskutil info "${DISK2}" | tee "${RUNNER_TEMP}/diskutil-remount.txt"; grep -Eq 'Volume Read-Only:[[:space:]]+No' "${RUNNER_TEMP}/diskutil-remount.txt"
          echo 'RESULT=I7_EXFAT_WRITES_PERSIST_AFTER_DETACH_REMOUNT'
          hdiutil detach "${DISK2}" -force; echo 'OUTER_DISK=' >> "${GITHUB_ENV}"

      - name: Collect deterministic evidence
        if: always()
        run: |
          set -euo pipefail; mkdir -p "$(dirname "${DIAG_PATH}")"
          { echo '# FUSE-T encrypted EDP ExFAT read-write macOS 26 CI'; echo; echo 'generated_at_utc=<normalized>'; echo "runner_os=$(sw_vers -productVersion)"; echo "cipher_sha_before=${CIPHER_SHA_BEFORE:-unknown}"; echo "cipher_sha_after=${CIPHER_SHA_AFTER:-unknown}"; echo; cat "${RUNNER_TEMP}/manufacture-block.txt" 2>/dev/null || true; echo; cat "${RUNNER_TEMP}/hidden-mount.txt" 2>/dev/null || true; echo; cat "${RUNNER_TEMP}/diskutil-first.txt" 2>/dev/null || true; echo; cat "${RUNNER_TEMP}/finder.txt" 2>/dev/null || true; cat "${RUNNER_TEMP}/xattr-result.txt" 2>/dev/null || true; cat "${RUNNER_TEMP}/xattr.err" 2>/dev/null || true; echo; cat "${RUNNER_TEMP}/diskutil-remount.txt" 2>/dev/null || true; echo; cat "${BLOG:-/dev/null}" 2>/dev/null || true; } > "${DIAG_PATH}"
          sed -n '1,600p' "${DIAG_PATH}"

      - name: Cleanup
        if: always()
        run: |
          set +e; [[ -n "${OUTER_DISK:-}" ]] && hdiutil detach "${OUTER_DISK}" -force >/dev/null 2>&1 || true; [[ -n "${HIDDEN:-}" ]] && umount "${HIDDEN}" >/dev/null 2>&1 || true; [[ -n "${BPID:-}" ]] && kill "${BPID}" >/dev/null 2>&1 || true; rm -f "${PASSWORD_FILE:-}"; sudo rm -rf /Applications/fuse-t.app; true

      - name: Commit diagnostic
        if: always() && github.ref_name == 'test/fuset-minimal-fskit-bridge'
        run: |
          set -euo pipefail; git add "${DIAG_PATH}"; git diff --cached --quiet -- "${DIAG_PATH}" && exit 0; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git commit -m 'docs: capture encrypted ExFAT RW E2E [skip ci]'; git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin "HEAD:${GITHUB_REF_NAME}"
