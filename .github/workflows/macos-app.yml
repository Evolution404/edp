name: macOS App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Tests and lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache Rust build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            gui/src-tauri/target
          key: cargo-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-quality-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Test frontend
        working-directory: gui
        run: npm test

      - name: Build frontend
        working-directory: gui
        run: npm run build

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Tauri backend
        run: cargo test --manifest-path gui/src-tauri/Cargo.toml --locked

      - name: Lint Tauri backend
        run: cargo clippy --manifest-path gui/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  build-app:
    name: Build ${{ matrix.arch }} app
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            gui/src-tauri/target
          key: cargo-build-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build bundled usbcore
        run: cargo build -p usbcore --release --locked

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri -- build --bundles app

      - name: Sign and package app
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APP_PATH="gui/src-tauri/target/release/bundle/macos/EDP USB Client.app"
          ARTIFACT_DIR="artifacts"
          APP_VERSION="$(node -p "require('./gui/package.json').version")"
          ARCHIVE_BASE="EDP-USB-Client-${APP_VERSION}-${BUILD_ARCH}"
          PACKAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/edp-dmg.XXXXXX")"

          test -x "${APP_PATH}/Contents/Resources/usbcore"
          codesign --force --deep --sign - --identifier com.edp.usbcore "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

          mkdir -p "${ARTIFACT_DIR}"
          ditto -c -k --sequesterRsrc --keepParent \
            "${APP_PATH}" "${ARTIFACT_DIR}/${ARCHIVE_BASE}.app.zip"

          ditto "${APP_PATH}" "${PACKAGE_DIR}/EDP USB Client.app"
          ln -s /Applications "${PACKAGE_DIR}/Applications"
          hdiutil create -quiet -ov -format UDZO \
            -volname "EDP USB Client" \
            -srcfolder "${PACKAGE_DIR}" \
            "${ARTIFACT_DIR}/${ARCHIVE_BASE}.dmg"

          shasum -a 256 "${ARTIFACT_DIR}/${ARCHIVE_BASE}.app.zip" \
            "${ARTIFACT_DIR}/${ARCHIVE_BASE}.dmg" \
            > "${ARTIFACT_DIR}/SHA256SUMS-${BUILD_ARCH}.txt"

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edp-usb-client-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: edp-usb-client-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes
          fi
