name: macOS App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Tests and lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache Rust build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            gui/src-tauri/target
          key: cargo-quality-edp-usb-vault-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-quality-edp-usb-vault-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Install macFUSE build libraries
        run: |
          set -euo pipefail
          MACFUSE_VERSION="5.2.0"
          MACFUSE_DMG="${RUNNER_TEMP}/macfuse-${MACFUSE_VERSION}.dmg"
          MACFUSE_VOLUME="${RUNNER_TEMP}/macfuse-volume"
          curl -fsSL \
            "https://github.com/macfuse/macfuse/releases/download/macfuse-${MACFUSE_VERSION}/macfuse-${MACFUSE_VERSION}.dmg" \
            -o "${MACFUSE_DMG}"
          mkdir -p "${MACFUSE_VOLUME}"
          hdiutil attach -quiet -nobrowse -readonly \
            -mountpoint "${MACFUSE_VOLUME}" "${MACFUSE_DMG}"
          MACFUSE_PKG="$(find "${MACFUSE_VOLUME}" -maxdepth 2 -name '*.pkg' -print -quit)"
          test -n "${MACFUSE_PKG}"
          sudo installer -pkg "${MACFUSE_PKG}" -target /
          hdiutil detach -quiet "${MACFUSE_VOLUME}"
          pkg-config --modversion fuse

      - name: Test frontend
        working-directory: gui
        run: npm test

      - name: Build frontend
        working-directory: gui
        run: npm run build

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build bundled usbcore for Tauri checks
        run: cargo build -p usbcore --release --locked

      - name: Test Tauri backend
        run: cargo test --manifest-path gui/src-tauri/Cargo.toml --locked

      - name: Lint Tauri backend
        run: cargo clippy --manifest-path gui/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  build-app:
    name: Build arm64 app
    needs: quality
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            gui/src-tauri/target
          key: cargo-build-edp-usb-vault-v2-${{ runner.os }}-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-edp-usb-vault-v2-${{ runner.os }}-arm64-

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Install macFUSE build libraries
        run: |
          set -euo pipefail
          MACFUSE_VERSION="5.2.0"
          MACFUSE_DMG="${RUNNER_TEMP}/macfuse-${MACFUSE_VERSION}.dmg"
          MACFUSE_VOLUME="${RUNNER_TEMP}/macfuse-volume"
          curl -fsSL \
            "https://github.com/macfuse/macfuse/releases/download/macfuse-${MACFUSE_VERSION}/macfuse-${MACFUSE_VERSION}.dmg" \
            -o "${MACFUSE_DMG}"
          mkdir -p "${MACFUSE_VOLUME}"
          hdiutil attach -quiet -nobrowse -readonly \
            -mountpoint "${MACFUSE_VOLUME}" "${MACFUSE_DMG}"
          MACFUSE_PKG="$(find "${MACFUSE_VOLUME}" -maxdepth 2 -name '*.pkg' -print -quit)"
          test -n "${MACFUSE_PKG}"
          sudo installer -pkg "${MACFUSE_PKG}" -target /
          hdiutil detach -quiet "${MACFUSE_VOLUME}"
          pkg-config --modversion fuse

      - name: Build bundled usbcore
        run: cargo build -p usbcore --release --locked

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri -- build --bundles app

      - name: Sign and package app
        env:
          BUILD_ARCH: arm64
        run: |
          set -euo pipefail
          APP_PATH="gui/src-tauri/target/release/bundle/macos/EDP USB Vault.app"
          ARTIFACT_DIR="artifacts"
          APP_VERSION="$(node -p "require('./gui/package.json').version")"
          ARCHIVE_BASE="EDP-USB-Vault-${APP_VERSION}-${BUILD_ARCH}"
          PACKAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/edp-dmg.XXXXXX")"

          test -x "${APP_PATH}/Contents/Resources/usbcore"
          test -f "${APP_PATH}/Contents/Library/LaunchDaemons/com.edp.usbvault.daemon.plist"
          codesign --force --options runtime --sign - \
            --entitlements gui/src-tauri/embedded/usbcore.entitlements.plist \
            --identifier com.edp.usbvault.daemon.v2 \
            "${APP_PATH}/Contents/Resources/usbcore"
          codesign --force --options runtime --sign - \
            --identifier com.edp.usbvault "${APP_PATH}"
          codesign -d --entitlements :- \
            "${APP_PATH}/Contents/Resources/usbcore" 2>&1 \
            | grep -Fq 'com.apple.security.cs.disable-library-validation'
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

          mkdir -p "${ARTIFACT_DIR}"
          ditto -c -k --sequesterRsrc --keepParent \
            "${APP_PATH}" "${ARTIFACT_DIR}/${ARCHIVE_BASE}.app.zip"

          ditto "${APP_PATH}" "${PACKAGE_DIR}/EDP USB Vault.app"
          ln -s /Applications "${PACKAGE_DIR}/Applications"
          hdiutil create -quiet -ov -format UDZO \
            -volname "EDP USB Vault" \
            -srcfolder "${PACKAGE_DIR}" \
            "${ARTIFACT_DIR}/${ARCHIVE_BASE}.dmg"

          shasum -a 256 "${ARTIFACT_DIR}/${ARCHIVE_BASE}.app.zip" \
            "${ARTIFACT_DIR}/${ARCHIVE_BASE}.dmg" \
            > "${ARTIFACT_DIR}/SHA256SUMS-${BUILD_ARCH}.txt"

      - name: Upload app artifacts
        uses: actions/upload-artifact@v7
        with:
          name: edp-usb-vault-arm64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: edp-usb-vault-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes
          fi
