name: FUSE-T Minimal FSKit hdiutil Probe

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift"
      - ".github/workflows/fuset-minimal-fskit-hdiutil.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuset-minimal-fskit-hdiutil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-to-block-device:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      DIAG_PATH: "docs/diagnostics/fuset-hdiutil-macos26-ci.txt"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify macOS 26 / Xcode 26
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test "$(xcodebuild -version | awk '/Xcode/ {print int($2); exit}')" -ge 26

      - name: Build deterministic raw fixture
        run: |
          set -euo pipefail
          RAW="${RUNNER_TEMP}/edp-fuset-hdiutil.raw"
          python3 - "${RAW}" <<'PY'
          import hashlib
          import os
          import sys

          path = sys.argv[1]
          sectors = 16384  # 8 MiB at 512 bytes/sector
          with open(path, "wb") as f:
              for lba in range(sectors):
                  seed = hashlib.sha256(f"EDP-FUSET-LBA:{lba}".encode()).digest()
                  sector = (seed * 16)[:512]
                  f.write(sector)
          print(f"RAW_SIZE={os.path.getsize(path)}")
          print(f"RAW_SHA256={hashlib.sha256(open(path, 'rb').read()).hexdigest()}")
          PY
          test "$(stat -f %z "${RAW}")" -eq 8388608
          echo "RAW=${RAW}" >> "${GITHUB_ENV}"

      - name: E1 baseline - hdiutil attaches ordinary raw fixture read-only
        run: |
          set -euo pipefail
          OUT="$(hdiutil attach -readonly -nomount -imagekey diskimage-class=CRawDiskImage "${RAW}")"
          printf '%s\n' "${OUT}"
          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${DISK}"
          test -b "${DISK}"
          RDISK="/dev/r$(basename "${DISK}")"
          trap 'hdiutil detach "${DISK}" -force >/dev/null 2>&1 || true' EXIT

          for LBA in 0 1 7 4095 16383; do
            dd if="${RAW}" of="${RUNNER_TEMP}/expected-${LBA}.bin" bs=512 skip="${LBA}" count=1 status=none
            dd if="${RDISK}" of="${RUNNER_TEMP}/actual-${LBA}.bin" bs=512 skip="${LBA}" count=1 status=none
            cmp "${RUNNER_TEMP}/expected-${LBA}.bin" "${RUNNER_TEMP}/actual-${LBA}.bin"
          done
          diskutil info "${DISK}" | tee "${RUNNER_TEMP}/direct-diskutil.txt"
          echo "DIRECT_DISK=${DISK}"
          echo 'RESULT=E1_RAW_HDIUTIL_READONLY_BASELINE_OK'
          hdiutil detach "${DISK}" -force
          trap - EXIT

      - name: Expand and stage only official signed FUSE-T FSKit app
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/fuse-t-${FUSET_VERSION}.pkg"
          EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl --fail --location --retry 3 --silent --show-error "${FUSET_PKG_URL}" -o "${PKG}"
          ACTUAL="$(shasum -a 256 "${PKG}" | awk '{print $1}')"
          test "${ACTUAL}" = "${FUSET_PKG_SHA256}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"
          SOURCE_APP="$(find "${EXPANDED}" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"
          test -n "${SOURCE_APP}"
          SOURCE_EXT="${SOURCE_APP}/Contents/Extensions/FskitSrvModule.appex"
          test -d "${SOURCE_EXT}"
          codesign --verify --deep --strict --verbose=2 "${SOURCE_APP}"
          codesign -dvvv --entitlements :- "${SOURCE_EXT}" 2>&1 | tee "${RUNNER_TEMP}/fuset-signature.txt"
          grep -F 'com.apple.developer.fskit.fsmodule' "${RUNNER_TEMP}/fuset-signature.txt"

          sudo rm -rf /Applications/fuse-t.app
          sudo ditto "${SOURCE_APP}" /Applications/fuse-t.app
          APP=/Applications/fuse-t.app
          EXT="${APP}/Contents/Extensions/FskitSrvModule.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "${APP}"
          pluginkit -a "${EXT}" || true
          pluginkit -a "${APP}" || true
          pluginkit -e use -i org.fuset.fskit-srv.module || true
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/pluginkit.txt" || true

          if grep -Fq 'org.fuset.fskit-srv.module' "${RUNNER_TEMP}/pluginkit.txt"; then
            echo 'FUSET_PLUGIN_INDEXED=true' >> "${GITHUB_ENV}"
            echo 'RESULT=FUSET_PLUGIN_INDEXED'
          else
            echo 'FUSET_PLUGIN_INDEXED=false' >> "${GITHUB_ENV}"
            echo 'RESULT=FUSET_PLUGIN_NOT_INDEXED'
          fi

      - name: Compile native minimal bridge
        run: |
          set -euo pipefail
          xcrun swiftc \
            -swift-version 6 \
            -warnings-as-errors \
            native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift \
            -o "${RUNNER_TEMP}/FuseTMinimalBridge"
          test -x "${RUNNER_TEMP}/FuseTMinimalBridge"
          otool -L "${RUNNER_TEMP}/FuseTMinimalBridge"

      - name: E2-E4 probe - hidden FUSE-T volume to hdiutil block device
        id: bridge_probe
        run: |
          set -euo pipefail
          HIDDEN="${RUNNER_TEMP}/edp-fuset-hidden-mnt"
          LOG="${RUNNER_TEMP}/bridge.log"
          mkdir -p "${HIDDEN}"

          "${RUNNER_TEMP}/FuseTMinimalBridge" \
            --backing "${RAW}" \
            --mountpoint "${HIDDEN}" \
            --volume-name 'EDP Hidden Raw Transport' \
            >"${LOG}" 2>&1 &
          BRIDGE_PID=$!
          echo "BRIDGE_PID=${BRIDGE_PID}" >> "${GITHUB_ENV}"
          echo "HIDDEN=${HIDDEN}" >> "${GITHUB_ENV}"
          echo "BRIDGE_LOG=${LOG}" >> "${GITHUB_ENV}"

          mounted=false
          for attempt in $(seq 1 20); do
            if mount | grep -Fq " on ${HIDDEN} "; then
              mounted=true
              break
            fi
            if ! kill -0 "${BRIDGE_PID}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat "${LOG}" || true
          mount | grep -F "${HIDDEN}" || true

          if [[ "${mounted}" != true ]]; then
            echo 'BRIDGE_MOUNTED=false' >> "${GITHUB_ENV}"
            echo 'RESULT=HOSTED_RUNNER_FUSET_MOUNT_UNAVAILABLE'
            exit 0
          fi
          echo 'BRIDGE_MOUNTED=true' >> "${GITHUB_ENV}"

          EXPOSED="${HIDDEN}/volume.raw"
          test -f "${EXPOSED}"
          test "$(stat -f %z "${EXPOSED}")" -eq 8388608
          cmp <(dd if="${RAW}" bs=512 skip=4095 count=2 status=none) <(dd if="${EXPOSED}" bs=512 skip=4095 count=2 status=none)
          echo 'RESULT=E2_FUSET_VOLUME_RAW_VISIBLE_AND_MATCHES'

          set +e
          OUT="$(hdiutil attach -readonly -nomount -imagekey diskimage-class=CRawDiskImage "${EXPOSED}" 2>"${RUNNER_TEMP}/nested-hdiutil.err")"
          RC=$?
          set -e
          echo "NESTED_HDIUTIL_RC=${RC}"
          cat "${RUNNER_TEMP}/nested-hdiutil.err" || true
          printf '%s\n' "${OUT}"
          if [[ ${RC} -ne 0 ]]; then
            echo 'NESTED_HDIUTIL_ATTACHED=false' >> "${GITHUB_ENV}"
            echo 'RESULT=E2_HDIUTIL_OVER_FUSET_FAILED'
            exit 0
          fi

          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${DISK}"
          test -b "${DISK}"
          RDISK="/dev/r$(basename "${DISK}")"
          echo "NESTED_DISK=${DISK}" >> "${GITHUB_ENV}"
          echo 'NESTED_HDIUTIL_ATTACHED=true' >> "${GITHUB_ENV}"
          echo "RESULT=E3_BLOCK_DEVICE_READY:${DISK}"

          for LBA in 0 7 4095 8192 16383; do
            dd if="${RAW}" of="${RUNNER_TEMP}/expected-nested-${LBA}.bin" bs=512 skip="${LBA}" count=1 status=none
            dd if="${RDISK}" of="${RUNNER_TEMP}/actual-nested-${LBA}.bin" bs=512 skip="${LBA}" count=1 status=none
            cmp "${RUNNER_TEMP}/expected-nested-${LBA}.bin" "${RUNNER_TEMP}/actual-nested-${LBA}.bin"
          done
          diskutil info "${DISK}" | tee "${RUNNER_TEMP}/nested-diskutil.txt"
          echo 'RESULT=E4_RANDOM_LBA_MATCH'
          hdiutil detach "${DISK}" -force

      - name: Collect hosted-runner evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${DIAG_PATH}")"
          {
            echo '# FUSE-T minimal bridge -> hdiutil macOS 26 CI probe'
            echo
            echo 'generated_at_utc=<normalized>'
            echo "runner_os=$(sw_vers -productVersion)"
            echo "runner_build=$(sw_vers -buildVersion)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "fuset_plugin_indexed=${FUSET_PLUGIN_INDEXED:-unknown}"
            echo "bridge_mounted=${BRIDGE_MOUNTED:-unknown}"
            echo "nested_hdiutil_attached=${NESTED_HDIUTIL_ATTACHED:-unknown}"
            echo "nested_disk=${NESTED_DISK:-none}"
            echo
            echo '## bridge log'
            cat "${BRIDGE_LOG:-/dev/null}" 2>/dev/null || true
            echo
            echo '## pluginkit'
            cat "${RUNNER_TEMP}/pluginkit.txt" 2>/dev/null || true
            echo
            echo '## nested hdiutil stderr'
            cat "${RUNNER_TEMP}/nested-hdiutil.err" 2>/dev/null || true
            echo
            echo '## mount snapshot'
            mount || true
            echo
            echo '## FSKit/FUSE-T log snapshot'
            log show --last 4m --style compact \
              --predicate 'process == "fskitd" OR process == "FskitSrvModule" OR eventMessage CONTAINS[c] "org.fuset.fskit-srv.module" OR eventMessage CONTAINS[c] "fuse-t"' \
              2>/dev/null | tail -n 1200 || true
          } > "${DIAG_PATH}"
          sed -n '1,320p' "${DIAG_PATH}"

      - name: Cleanup mounts and bridge
        if: always()
        run: |
          set +e
          if [[ -n "${NESTED_DISK:-}" ]]; then hdiutil detach "${NESTED_DISK}" -force; fi
          if [[ -n "${HIDDEN:-}" ]]; then /sbin/umount "${HIDDEN}"; fi
          if [[ -n "${BRIDGE_PID:-}" ]]; then kill "${BRIDGE_PID}" 2>/dev/null; fi
          sudo rm -rf /Applications/fuse-t.app
          exit 0

      - name: Commit deterministic diagnostic
        if: always() && github.ref_name == 'test/fuset-minimal-fskit-bridge'
        run: |
          set -euo pipefail
          test -f "${DIAG_PATH}"
          git add "${DIAG_PATH}"
          if git diff --cached --quiet -- "${DIAG_PATH}"; then
            echo 'RESULT=HDIUTIL_DIAGNOSTIC_UNCHANGED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: capture FUSE-T hdiutil CI probe [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
