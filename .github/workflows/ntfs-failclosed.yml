name: NTFS Fail-Closed Safety

on:
  push:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - ".github/workflows/ntfs-failclosed.yml"
      - "scripts/build-ntfs3g-runtime.sh"
      - "patches/ntfs-3g-2026.7.7-macfuse-fskit-create-mode.patch"
      - "patches/ntfs-3g-2026.7.7-macfuse-fskit-renamex.patch"
      - "native/EDPFSKitPoC/Tools/probe-ntfs-failclosed.sh"
      - "native/EDPFSKitPoC/Tools/ValidateNTFSWriteSafety.swift"
      - "product/EDPNTFSWriteSafety.swift"
      - "product/EDPVaultRuntime.swift"
      - "installer/build-clean-installer.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Record runtime
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version

      - name: Install official macFUSE 5.3.3
        run: |
          set -euo pipefail
          VERSION='5.3.3'
          SHA256='7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15'
          DMG="${RUNNER_TEMP}/macfuse-${VERSION}.dmg"
          MOUNT="${RUNNER_TEMP}/macfuse-${VERSION}-mount"
          mkdir -p "${MOUNT}"
          curl --fail --location --retry 3 \
            --output "${DMG}" \
            "https://github.com/macfuse/macfuse/releases/download/macfuse-${VERSION}/macfuse-${VERSION}.dmg"
          printf '%s  %s\n' "${SHA256}" "${DMG}" | shasum -a 256 -c -
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "${MOUNT}" "${DMG}"
          PACKAGE="$(find "${MOUNT}" -maxdepth 2 -name 'Install macFUSE*.pkg' -print -quit)"
          test -n "${PACKAGE}"
          sudo /usr/sbin/installer -pkg "${PACKAGE}" -target /
          hdiutil detach -quiet "${MOUNT}"
          pkg-config --exists fuse
          echo 'RESULT=OFFICIAL_MACFUSE_5_3_3_INSTALLED'

      - name: Enable macFUSE FSKit module on ephemeral runner
        run: |
          set -euo pipefail
          /usr/bin/pluginkit -a /Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app/Contents/Extensions/io.macfuse.app.fsmodule.macfuse.appex
          /usr/bin/pluginkit -e use -i io.macfuse.app.fsmodule.macfuse
          sleep 2
          /usr/bin/pluginkit -mAvvv -i io.macfuse.app.fsmodule.macfuse
          echo 'RESULT=CI_ONLY_MACFUSE_MODULE_STATE_SEEDED'

      - name: Build pinned NTFS-3G runtime
        run: |
          set -euo pipefail
          /bin/bash scripts/build-ntfs3g-runtime.sh "${RUNNER_TEMP}/ntfs-runtime"
          test -x "${RUNNER_TEMP}/ntfs-runtime/ntfs-3g/test-tools/mkntfs"
          echo 'RESULT=NTFS_FAIL_CLOSED_TOOLS_READY'

      - name: Validate product status mapping
        run: |
          set -euo pipefail
          xcrun swiftc \
            product/EDPNTFSWriteSafety.swift \
            native/EDPFSKitPoC/Tools/ValidateNTFSWriteSafety.swift \
            -o "${RUNNER_TEMP}/validate-ntfs-safety"
          "${RUNNER_TEMP}/validate-ntfs-safety"

      - name: Verify product never opts into unsafe recovery
        run: |
          set -euo pipefail
          ! grep -F '"-o", "recover"' product/EDPVaultRuntime.swift
          ! grep -F 'remove_hiberfile' product/EDPVaultRuntime.swift
          ! grep -F '"-o", "force"' product/EDPVaultRuntime.swift
          grep -F '"-o", "norecover"' product/EDPVaultRuntime.swift
          echo 'RESULT=PRODUCT_NTFS_UNSAFE_RECOVERY_OPTIONS_ABSENT'

      - name: Probe dirty and hibernated fixtures
        run: |
          set -euo pipefail
          /bin/bash native/EDPFSKitPoC/Tools/probe-ntfs-failclosed.sh \
            "${RUNNER_TEMP}/ntfs-runtime/ntfs-3g"
