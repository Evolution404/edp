name: Clean ExFAT + NTFS Installer

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/macos26-native-fskit"
      - "test/fuset-minimal-fskit-bridge"
    paths:
      - "product/**"
      - "installer/build-clean-installer.sh"
      - "installer/build-transport-backends.sh"
      - "scripts/build-ntfs3g-runtime.sh"
      - "scripts/verify-clean-installer.sh"
      - "native/EDPFSKitPoC/Extension/**"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteBlockCBridge.swift"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteFuseBridge.c"
      - "native/EDPFSKitPoC/Tools/DiskImages2Attach.m"
      - ".github/workflows/clean-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Create ephemeral certificate signing identity for CI
        timeout-minutes: 2
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/edp-ci-signing.keychain-db"
          KEYCHAIN_PASSWORD="edp-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CERT="${RUNNER_TEMP}/edp-ci-codesign.pem"
          KEY="${RUNNER_TEMP}/edp-ci-codesign.key"
          P12="${RUNNER_TEMP}/edp-ci-codesign.p12"
          OPENSSL_CONFIG="${RUNNER_TEMP}/edp-ci-openssl.cnf"
          PROBE="${RUNNER_TEMP}/edp-ci-signing-probe"
          IDENTITY='EDP CI Code Signing'

          cat > "${OPENSSL_CONFIG}" <<'EOF'
          [ req ]
          distinguished_name = dn
          x509_extensions = v3
          prompt = no
          [ dn ]
          CN = EDP CI Code Signing
          OU = EDPCI00001
          O = EDP CI
          [ v3 ]
          basicConstraints = critical,CA:TRUE
          keyUsage = critical,digitalSignature,keyCertSign
          extendedKeyUsage = codeSigning
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid:always,issuer
          EOF

          /usr/bin/openssl req -new -x509 -newkey rsa:2048 -nodes -days 1 \
            -config "${OPENSSL_CONFIG}" \
            -keyout "${KEY}" -out "${CERT}"
          /usr/bin/openssl pkcs12 -export \
            -inkey "${KEY}" -in "${CERT}" -out "${P12}" \
            -passout "pass:${KEYCHAIN_PASSWORD}"

          /usr/bin/security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          /usr/bin/security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          /usr/bin/security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          /usr/bin/security import "${P12}" -k "${KEYCHAIN}" \
            -P "${KEYCHAIN_PASSWORD}" -T /usr/bin/codesign
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          /usr/bin/security list-keychains -d user -s "${KEYCHAIN}"
          /usr/bin/security default-keychain -d user -s "${KEYCHAIN}"
          /usr/bin/security find-certificate -c "${IDENTITY}" "${KEYCHAIN}" >/dev/null

          printf 'int main(void) { return 0; }\n' \
            | /usr/bin/cc -x c - -o "${PROBE}"
          /usr/bin/codesign --force --sign "${IDENTITY}" \
            --identifier com.edp.ci.signing-probe "${PROBE}"
          /usr/bin/codesign -dv --verbose=4 "${PROBE}" 2>&1 \
            | tee "${RUNNER_TEMP}/edp-ci-signing-probe.txt"
          /usr/bin/grep -F 'Authority=EDP CI Code Signing' \
            "${RUNNER_TEMP}/edp-ci-signing-probe.txt"
          /usr/bin/grep -F 'TeamIdentifier=not set' \
            "${RUNNER_TEMP}/edp-ci-signing-probe.txt"

          echo "EDP_APP_SIGN_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"
          echo 'EDP_SERVICE_MODE=legacy' >> "${GITHUB_ENV}"
          echo 'EDP_LEGACY_DIAGNOSTIC=1' >> "${GITHUB_ENV}"
          echo 'RESULT=CI_CERTIFICATE_SIGNING_IDENTITY_READY'

      - name: Download and install pinned macFUSE
        run: |
          set -euo pipefail
          brew install pkgconf
          DMG="${RUNNER_TEMP}/macfuse-5.3.3.dmg"
          MOUNT="${RUNNER_TEMP}/macfuse"
          curl --fail --location --retry 3 \
            --output "${DMG}" \
            https://github.com/macfuse/macfuse/releases/download/macfuse-5.3.3/macfuse-5.3.3.dmg
          printf '%s  %s\n' \
            7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15 \
            "${DMG}" | shasum -a 256 -c -
          mkdir -p "${MOUNT}"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "${MOUNT}" "${DMG}"
          sudo installer -pkg "${MOUNT}/Install macFUSE.pkg" -target /
          hdiutil detach -quiet "${MOUNT}"
          echo "MACFUSE_DMG=${DMG}" >> "${GITHUB_ENV}"

      - name: Build clean combined installer
        run: |
          set -euo pipefail
          ./installer/build-clean-installer.sh artifacts | tee "${RUNNER_TEMP}/build.txt"
          grep -F 'RESULT=EDP_CLEAN_COMBINED_INSTALLER_BUILT' "${RUNNER_TEMP}/build.txt"
          grep -F 'RESULT=CI_ONLY_LEGACY_DIAGNOSTIC_PACKAGE' "${RUNNER_TEMP}/build.txt"

      - name: Verify package and writable DiskImages2 mode
        env:
          EDP_INSTALLER_SYSTEM_TESTS: "1"
        run: |
          set -euo pipefail
          ./scripts/verify-clean-installer.sh \
            artifacts/EDP-USB-Vault-0.5.0-arm64-Clean.pkg \
            | tee "${RUNNER_TEMP}/verify.txt"
          grep -F 'RESULT=NATIVE_SWIFTUI_XPC_APP_PACKAGED' "${RUNNER_TEMP}/verify.txt"
          grep -Eq 'RESULT=(SMAPPSERVICE_DAEMON_EMBEDDED|LEGACY_XPC_DAEMON_PACKAGED)' "${RUNNER_TEMP}/verify.txt"
          grep -F 'RESULT=EDP_CLEAN_INSTALLER_VERIFIED' "${RUNNER_TEMP}/verify.txt"

      - name: Install product and register ServiceManagement daemon
        timeout-minutes: 3
        run: |
          set -euo pipefail
          EXPANDED="${RUNNER_TEMP}/edp-product-expanded"
          COMPONENT="${RUNNER_TEMP}/edp-runtime-component.pkg"
          /usr/sbin/pkgutil --expand \
            artifacts/EDP-USB-Vault-0.5.0-arm64-Clean.pkg \
            "${EXPANDED}"
          /usr/sbin/pkgutil --flatten \
            "${EXPANDED}/ZZ-EDP-USB-Vault.pkg" \
            "${COMPONENT}"
          set +e
          sudo /usr/sbin/installer -pkg "${COMPONENT}" -target /
          INSTALL_RC=$?
          set -e
          if [[ "${INSTALL_RC}" -ne 0 ]]; then
            echo "EDP_COMPONENT_INSTALL_RC=${INSTALL_RC}"
            sudo /usr/bin/tail -n 200 /var/log/install.log || true
            exit "${INSTALL_RC}"
          fi
          APP='/Applications/EDP USB Vault.app'
          DAEMON='/Library/Application Support/EDP USB Vault/bin/edp-vaultctl'
          test -x "${APP}/Contents/MacOS/EDP USB Vault"
          test -x "${DAEMON}"
          test "$(stat -f '%u' "${APP}")" -eq 0

          APP_SIGNING="${RUNNER_TEMP}/installed-app-signing.txt"
          DAEMON_SIGNING="${RUNNER_TEMP}/installed-daemon-signing.txt"
          /usr/bin/codesign -dv --verbose=4 "${APP}" 2>&1 | tee "${APP_SIGNING}"
          /usr/bin/codesign -dv --verbose=4 "${DAEMON}" 2>&1 | tee "${DAEMON_SIGNING}"
          /usr/bin/grep -F 'Authority=EDP CI Code Signing' "${APP_SIGNING}"
          /usr/bin/grep -F 'Authority=EDP CI Code Signing' "${DAEMON_SIGNING}"
          /usr/bin/grep -F 'TeamIdentifier=not set' "${APP_SIGNING}"
          /usr/bin/grep -F 'TeamIdentifier=not set' "${DAEMON_SIGNING}"
          echo 'RESULT=CLEAN_INSTALL_CERTIFICATE_FALLBACK_READY'

          "${APP}/Contents/MacOS/EDP USB Vault" --register-service \
            | tee "${RUNNER_TEMP}/service-registration.txt"
          MODE="$(awk -F= '/^EDP_SERVICE_MODE=/{print $2}' "${RUNNER_TEMP}/service-registration.txt" | tail -1)"
          STATUS="$(awk -F= '/^EDP_SERVICE_STATUS=/{print $2}' "${RUNNER_TEMP}/service-registration.txt" | tail -1)"
          if [[ "${MODE}" == "legacy" ]]; then
            [[ "${STATUS}" == "enabled" ]]
            "${APP}/Contents/MacOS/EDP USB Vault" --xpc-smoke \
              | tee "${RUNNER_TEMP}/xpc-smoke.txt"
            grep -F 'RESULT=PRIVILEGED_XPC_ROUNDTRIP_OK' "${RUNNER_TEMP}/xpc-smoke.txt"
            echo 'RESULT=LEGACY_XPC_SERVICE_SMOKE_OK'
          else
            [[ "${MODE}" == "smappservice" ]]
            [[ "${STATUS}" == "enabled" || "${STATUS}" == "requiresApproval" ]]
            if [[ "${STATUS}" == "enabled" ]]; then
              "${APP}/Contents/MacOS/EDP USB Vault" --xpc-smoke \
                | tee "${RUNNER_TEMP}/xpc-smoke.txt"
              grep -F 'RESULT=PRIVILEGED_XPC_ROUNDTRIP_OK' "${RUNNER_TEMP}/xpc-smoke.txt"
            fi
            echo 'RESULT=SMAPPSERVICE_REGISTRATION_ACCEPTED'
          fi

      - name: Label legacy package as CI contract only
        run: |
          set -euo pipefail
          mv artifacts/EDP-USB-Vault-0.5.0-arm64-Clean.pkg \
            artifacts/EDP-USB-Vault-0.5.0-arm64-CI-Legacy-Contract-Only.pkg
          shasum -a 256 \
            artifacts/EDP-USB-Vault-0.5.0-arm64-CI-Legacy-Contract-Only.pkg \
            > artifacts/EDP-USB-Vault-0.5.0-arm64-CI-Legacy-Contract-Only.pkg.sha256
          printf '%s\n' \
            'This package exercises legacy XPC packaging on hosted CI only.' \
            'It cannot access physical raw USB media on macOS 26.' \
            'Build the SMAppService product with an Apple signing identity for physical-device use.' \
            > artifacts/CI-LEGACY-CONTRACT-ONLY.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EDP-USB-Vault-0.5.0-arm64-CI-Legacy-Contract-Only
          path: |
            artifacts/EDP-USB-Vault-0.5.0-arm64-CI-Legacy-Contract-Only.pkg
            artifacts/EDP-USB-Vault-0.5.0-arm64-CI-Legacy-Contract-Only.pkg.sha256
            artifacts/CI-LEGACY-CONTRACT-ONLY.txt
          if-no-files-found: error
