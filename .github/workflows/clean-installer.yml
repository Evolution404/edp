name: Clean ExFAT + NTFS Installer

on:
  workflow_dispatch:
  push:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - "product/**"
      - "installer/build-clean-installer.sh"
      - "scripts/build-ntfs3g-runtime.sh"
      - "scripts/verify-clean-installer.sh"
      - "native/EDPFSKitPoC/Extension/**"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteBlockCBridge.swift"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteFuseBridge.c"
      - "native/EDPFSKitPoC/Tools/DiskImages2Attach.m"
      - ".github/workflows/clean-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Download and install pinned macFUSE
        run: |
          set -euo pipefail
          brew install pkgconf
          DMG="${RUNNER_TEMP}/macfuse-5.3.3.dmg"
          MOUNT="${RUNNER_TEMP}/macfuse"
          curl --fail --location --retry 3 \
            --output "${DMG}" \
            https://github.com/macfuse/macfuse/releases/download/macfuse-5.3.3/macfuse-5.3.3.dmg
          printf '%s  %s\n' \
            7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15 \
            "${DMG}" | shasum -a 256 -c -
          mkdir -p "${MOUNT}"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "${MOUNT}" "${DMG}"
          sudo installer -pkg "${MOUNT}/Install macFUSE.pkg" -target /
          hdiutil detach -quiet "${MOUNT}"
          echo "MACFUSE_DMG=${DMG}" >> "${GITHUB_ENV}"

      - name: Build clean combined installer
        run: |
          set -euo pipefail
          ./installer/build-clean-installer.sh artifacts | tee "${RUNNER_TEMP}/build.txt"
          grep -F 'RESULT=EDP_CLEAN_COMBINED_INSTALLER_BUILT' "${RUNNER_TEMP}/build.txt"

      - name: Verify package and writable DiskImages2 mode
        env:
          EDP_INSTALLER_SYSTEM_TESTS: "1"
        run: |
          set -euo pipefail
          ./scripts/verify-clean-installer.sh \
            artifacts/EDP-USB-Vault-0.5.0-arm64-Clean.pkg \
            | tee "${RUNNER_TEMP}/verify.txt"
          grep -F 'RESULT=NATIVE_SWIFTUI_XPC_APP_PACKAGED' "${RUNNER_TEMP}/verify.txt"
          grep -Eq 'RESULT=(SMAPPSERVICE_DAEMON_EMBEDDED|LEGACY_XPC_DAEMON_PACKAGED)' "${RUNNER_TEMP}/verify.txt"
          grep -F 'RESULT=EDP_CLEAN_INSTALLER_VERIFIED' "${RUNNER_TEMP}/verify.txt"

      - name: Install product and register ServiceManagement daemon
        timeout-minutes: 3
        run: |
          set -euo pipefail
          EXPANDED="${RUNNER_TEMP}/edp-product-expanded"
          COMPONENT="${RUNNER_TEMP}/edp-runtime-component.pkg"
          /usr/sbin/pkgutil --expand \
            artifacts/EDP-USB-Vault-0.5.0-arm64-Clean.pkg \
            "${EXPANDED}"
          /usr/sbin/pkgutil --flatten \
            "${EXPANDED}/ZZ-EDP-USB-Vault.pkg" \
            "${COMPONENT}"
          set +e
          sudo /usr/sbin/installer -pkg "${COMPONENT}" -target /
          INSTALL_RC=$?
          set -e
          if [[ "${INSTALL_RC}" -ne 0 ]]; then
            echo "EDP_COMPONENT_INSTALL_RC=${INSTALL_RC}"
            sudo /usr/bin/tail -n 200 /var/log/install.log || true
            exit "${INSTALL_RC}"
          fi
          APP='/Applications/EDP USB Vault.app'
          test -x "${APP}/Contents/MacOS/EDP USB Vault"
          test "$(stat -f '%u' "${APP}")" -eq 0
          "${APP}/Contents/MacOS/EDP USB Vault" --register-service \
            | tee "${RUNNER_TEMP}/service-registration.txt"
          MODE="$(awk -F= '/^EDP_SERVICE_MODE=/{print $2}' "${RUNNER_TEMP}/service-registration.txt" | tail -1)"
          STATUS="$(awk -F= '/^EDP_SERVICE_STATUS=/{print $2}' "${RUNNER_TEMP}/service-registration.txt" | tail -1)"
          if [[ "${MODE}" == "legacy" ]]; then
            [[ "${STATUS}" == "enabled" ]]
            "${APP}/Contents/MacOS/EDP USB Vault" --xpc-smoke \
              | tee "${RUNNER_TEMP}/xpc-smoke.txt"
            grep -F 'RESULT=PRIVILEGED_XPC_ROUNDTRIP_OK' "${RUNNER_TEMP}/xpc-smoke.txt"
            echo 'RESULT=LEGACY_XPC_SERVICE_SMOKE_OK'
          else
            [[ "${MODE}" == "smappservice" ]]
            [[ "${STATUS}" == "enabled" || "${STATUS}" == "requiresApproval" ]]
            if [[ "${STATUS}" == "enabled" ]]; then
              "${APP}/Contents/MacOS/EDP USB Vault" --xpc-smoke \
                | tee "${RUNNER_TEMP}/xpc-smoke.txt"
              grep -F 'RESULT=PRIVILEGED_XPC_ROUNDTRIP_OK' "${RUNNER_TEMP}/xpc-smoke.txt"
            fi
            echo 'RESULT=SMAPPSERVICE_REGISTRATION_ACCEPTED'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: EDP-USB-Vault-0.5.0-arm64-Clean
          path: |
            artifacts/EDP-USB-Vault-0.5.0-arm64-Clean.pkg
            artifacts/EDP-USB-Vault-0.5.0-arm64-Clean.pkg.sha256
          if-no-files-found: error
