name: EDP Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Apps/Studio/**"
      - "Packages/EDPCore/**"
      - ".github/workflows/studio.yml"
  pull_request:
    paths:
      - "Apps/Studio/**"
      - "Packages/EDPCore/**"
      - ".github/workflows/studio.yml"

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify pure-native source contract
        run: |
          set -euo pipefail
          test ! -e Apps/Studio/src-tauri
          test ! -e Apps/Studio/core
          test ! -e Apps/Studio/src
          ! grep -R -E 'edpopen_ffi|Build Rust EDP Core|build-rust-core.sh' \
            Apps/Studio/native/EDPStudioNative/Sources \
            Apps/Studio/native/EDPStudioNative/project.yml \
            Apps/Studio/native/EDPStudioNative/EDPStudioNative.xcodeproj/project.pbxproj
          grep -Fq 'EDP Studio' Apps/Studio/native/EDPStudioNative/Sources/EDPStudioApp.swift
          grep -Fq '../../../../Shared/UI/EDPDesignSystem.swift' Apps/Studio/native/EDPStudioNative/project.yml
          grep -Fq 'HSplitView' Apps/Studio/native/EDPStudioNative/Sources/RootView.swift
          ! grep -Fq '.inspector(' Apps/Studio/native/EDPStudioNative/Sources/RootView.swift
          grep -Fq '.padding(8)' Apps/Studio/native/EDPStudioNative/Sources/RootView.swift
          grep -Fq 'NativeSidebarMaterial' Apps/Studio/native/EDPStudioNative/Sources/RootView.swift
          grep -Fq 'view.material = .sidebar' Apps/Studio/native/EDPStudioNative/Sources/RootView.swift
          grep -Fq 'view.blendingMode = .behindWindow' Apps/Studio/native/EDPStudioNative/Sources/RootView.swift
          ! grep -Fq '.background(.ultraThinMaterial' Apps/Studio/native/EDPStudioNative/Sources/RootView.swift
          ! grep -Fq '.background(.background)' Apps/Studio/native/EDPStudioNative/Sources/RootView.swift
          grep -Fq 'diskMapLayout' Apps/Studio/native/EDPStudioNative/Sources/DiskMapView.swift
          grep -Fq '.frame(width: layout.totalWidth' Apps/Studio/native/EDPStudioNative/Sources/DiskMapView.swift
          grep -Fq 'com.edp.studio' Apps/Studio/native/EDPStudioNative/project.yml
          grep -Fq 'com.edp.studio.rawbroker' Apps/Studio/native/EDPStudioNative/Shared/RawBrokerProtocol.swift
          grep -Fq 'Build EDP Studio App Icon' Apps/Studio/native/EDPStudioNative/project.yml
          grep -Fq 'Assets.xcassets' Apps/Studio/native/EDPStudioNative/project.yml
          test -f Apps/Studio/native/EDPStudioNative/Resources/EDPStudioIcon.svg
          test -f Apps/Studio/native/EDPStudioNative/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json
          test -x Tools/build-macos-icon.sh
          bash -n Tools/build-macos-icon.sh
          grep -qx '  EDPStudio:' Apps/Studio/native/EDPStudioNative/project.yml
          grep -qx '  EDPStudioRawBroker:' Apps/Studio/native/EDPStudioNative/project.yml
          test -f Apps/Studio/native/EDPStudioNative/EDPStudioNative.xcodeproj/xcshareddata/xcschemes/EDPStudio.xcscheme
          ! grep -R -E 'EDPOpenRawBroker|EDPOpenNativeApp|container:EDPOpenNative.xcodeproj' \
            Apps/Studio/native/EDPStudioNative/project.yml \
            Apps/Studio/native/EDPStudioNative/EDPStudioNative.xcodeproj/project.pbxproj \
            Apps/Studio/native/EDPStudioNative/EDPStudioNative.xcodeproj/xcshareddata/xcschemes
          ! grep -R -F 'com.evolution404.edpopen' \
            Apps/Studio/native/EDPStudioNative/Sources \
            Apps/Studio/native/EDPStudioNative/BrokerSources \
            Apps/Studio/native/EDPStudioNative/Shared \
            Apps/Studio/native/EDPStudioNative/Installer \
            Apps/Studio/native/EDPStudioNative/project.yml
          grep -Fq 'OLD_BROKER="/Library/PrivilegedHelperTools/com.evolution404.edpopen.rawbroker"' \
            Apps/Studio/native/EDPStudioNative/Scripts/install-native.sh
          echo 'RESULT=EDP_STUDIO_PURE_NATIVE_CONTRACT_OK'
      - name: Build shared core
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          Apps/Studio/native/EDPStudioNative/Scripts/build-shared-core.sh
      - name: Compile native Studio without signing
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcodebuild \
            -project Apps/Studio/native/EDPStudioNative/EDPStudioNative.xcodeproj \
            -scheme EDPStudio \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/edp-studio-derived" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -x "${RUNNER_TEMP}/edp-studio-derived/Build/Products/Release/EDP Studio.app/Contents/MacOS/EDP Studio"
          test -x "${RUNNER_TEMP}/edp-studio-derived/Build/Products/Release/EDPStudioRawBroker"
          APP="${RUNNER_TEMP}/edp-studio-derived/Build/Products/Release/EDP Studio.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Contents/Info.plist")" = 'com.edp.studio'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "${APP}/Contents/Info.plist")" = 'AppIcon'
          test -s "${APP}/Contents/Resources/AppIcon.icns"
          test -s "${APP}/Contents/Resources/Assets.car"
          /usr/bin/file "${APP}/Contents/Resources/AppIcon.icns" | grep -Fq 'Mac OS X icon'
          echo 'RESULT=EDP_STUDIO_APP_ICON_PACKAGED'
          echo 'RESULT=EDP_STUDIO_NATIVE_BUILD_OK'
