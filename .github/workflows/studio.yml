name: EDP Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Apps/Studio/**"
      - "Packages/EDPCore/**"
      - ".github/workflows/studio.yml"
  pull_request:
    paths:
      - "Apps/Studio/**"
      - "Packages/EDPCore/**"
      - ".github/workflows/studio.yml"

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify pure-native source contract
        run: |
          set -euo pipefail
          test ! -e Apps/Studio/src-tauri
          test ! -e Apps/Studio/core
          test ! -e Apps/Studio/src
          ! grep -R -E 'edpopen_ffi|Build Rust EDP Core|build-rust-core.sh' \
            Apps/Studio/native/EDPStudioNative/Sources \
            Apps/Studio/native/EDPStudioNative/project.yml \
            Apps/Studio/native/EDPStudioNative/EDPStudioNative.xcodeproj/project.pbxproj
          grep -Fq 'EDP Studio' Apps/Studio/native/EDPStudioNative/Sources/EDPStudioApp.swift
          grep -Fq 'com.edp.studio' Apps/Studio/native/EDPStudioNative/project.yml
          grep -Fq 'com.edp.studio.rawbroker' Apps/Studio/native/EDPStudioNative/Shared/RawBrokerProtocol.swift
          grep -qx '  EDPStudio:' Apps/Studio/native/EDPStudioNative/project.yml
          grep -qx '  EDPStudioRawBroker:' Apps/Studio/native/EDPStudioNative/project.yml
          test -f Apps/Studio/native/EDPStudioNative/EDPStudioNative.xcodeproj/xcshareddata/xcschemes/EDPStudio.xcscheme
          ! grep -R -E 'EDPOpenRawBroker|EDPOpenNativeApp|container:EDPOpenNative.xcodeproj' \
            Apps/Studio/native/EDPStudioNative/project.yml \
            Apps/Studio/native/EDPStudioNative/EDPStudioNative.xcodeproj/project.pbxproj \
            Apps/Studio/native/EDPStudioNative/EDPStudioNative.xcodeproj/xcshareddata/xcschemes
          ! grep -R -F 'com.evolution404.edpopen' \
            Apps/Studio/native/EDPStudioNative/Sources \
            Apps/Studio/native/EDPStudioNative/BrokerSources \
            Apps/Studio/native/EDPStudioNative/Shared \
            Apps/Studio/native/EDPStudioNative/Installer \
            Apps/Studio/native/EDPStudioNative/project.yml
          grep -Fq 'OLD_BROKER="/Library/PrivilegedHelperTools/com.evolution404.edpopen.rawbroker"' \
            Apps/Studio/native/EDPStudioNative/Scripts/install-native.sh
          echo 'RESULT=EDP_STUDIO_PURE_NATIVE_CONTRACT_OK'
      - name: Build shared core
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          Apps/Studio/native/EDPStudioNative/Scripts/build-shared-core.sh
      - name: Compile native Studio without signing
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcodebuild \
            -project Apps/Studio/native/EDPStudioNative/EDPStudioNative.xcodeproj \
            -scheme EDPStudio \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/edp-studio-derived" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -x "${RUNNER_TEMP}/edp-studio-derived/Build/Products/Release/EDP Studio.app/Contents/MacOS/EDP Studio"
          test -x "${RUNNER_TEMP}/edp-studio-derived/Build/Products/Release/EDPStudioRawBroker"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${RUNNER_TEMP}/edp-studio-derived/Build/Products/Release/EDP Studio.app/Contents/Info.plist")" = 'com.edp.studio'
          echo 'RESULT=EDP_STUDIO_NATIVE_BUILD_OK'
