name: Native FSKit Signing A-B

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-fskit-signing-ab-${{ github.ref }}
  cancel-in-progress: true

env:
  MACFUSE_VERSION: "5.3.3"

jobs:
  compare:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Compile FSClient inventory probe
        run: |
          set -euo pipefail
          xcrun swiftc -framework FSKit \
            native/EDPFSKitPoC/Tools/ListFSKit.swift \
            -o "${RUNNER_TEMP}/list-fskit"

      - name: Baseline FSClient inventory
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/list-fskit" | tee "${RUNNER_TEMP}/baseline.txt"

      - name: Install official macFUSE 5.3.3
        run: |
          set -euo pipefail
          DMG="${RUNNER_TEMP}/macfuse-${MACFUSE_VERSION}.dmg"
          VOL="${RUNNER_TEMP}/macfuse-volume"
          curl -fsSL \
            "https://github.com/macfuse/macfuse/releases/download/macfuse-${MACFUSE_VERSION}/macfuse-${MACFUSE_VERSION}.dmg" \
            -o "${DMG}"
          mkdir -p "${VOL}"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "${VOL}" "${DMG}"
          PKG="$(find "${VOL}" -maxdepth 2 -name 'Install macFUSE*.pkg' -print -quit)"
          if [[ -z "${PKG}" ]]; then
            PKG="$(find "${VOL}" -maxdepth 2 -name '*.pkg' -print -quit)"
          fi
          test -n "${PKG}"
          sudo installer -pkg "${PKG}" -target /
          hdiutil detach -quiet "${VOL}"
          sleep 3

      - name: Inspect official macFUSE identity
        run: |
          set -euo pipefail
          HOST="/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app"
          EXT="${HOST}/Contents/Extensions/io.macfuse.app.fsmodule.macfuse.appex"
          test -d "${EXT}"
          echo '--- macFUSE signature ---'
          codesign -dvvv --entitlements :- "${EXT}" || true
          echo '--- macFUSE PluginKit ---'
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv \
            | tee "${RUNNER_TEMP}/pluginkit-macfuse.txt"
          grep -F 'io.macfuse.app.fsmodule.macfuse' "${RUNNER_TEMP}/pluginkit-macfuse.txt"
          echo '--- FSClient after official signed macFUSE ---'
          "${RUNNER_TEMP}/list-fskit" | tee "${RUNNER_TEMP}/after-macfuse.txt"

      - name: Build EDP native FSKit PoC
        working-directory: native/EDPFSKitPoC
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild \
            -project EDPFSKitPoC.xcodeproj \
            -scheme EDPFSKitHost \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/EDPFSKitDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign and register EDP module
        run: |
          set -euo pipefail
          SOURCE_APP="${RUNNER_TEMP}/EDPFSKitDerivedData/Build/Products/Release/EDPFSKitPoC.app"
          SOURCE_EXT="${SOURCE_APP}/Contents/Extensions/EDPFSKitExtension.appex"
          codesign --force --sign - --generate-entitlement-der \
            --entitlements native/EDPFSKitPoC/Extension/EDPFSKitExtension.entitlements \
            "${SOURCE_EXT}"
          codesign --force --sign - "${SOURCE_APP}"
          sudo rm -rf /Applications/EDPFSKitPoC.app
          sudo ditto "${SOURCE_APP}" /Applications/EDPFSKitPoC.app
          APP="/Applications/EDPFSKitPoC.app"
          EXT="${APP}/Contents/Extensions/EDPFSKitExtension.appex"
          pluginkit -a "${EXT}"
          pluginkit -a "${APP}"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister \
            -f -R -trusted "${APP}"
          sleep 3
          echo '--- EDP signature ---'
          codesign -dvvv --entitlements :- "${EXT}" || true
          echo '--- EDP PluginKit ---'
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv \
            | tee "${RUNNER_TEMP}/pluginkit-edp.txt"
          grep -F 'com.edp.usbvault.fskit-poc.extension' "${RUNNER_TEMP}/pluginkit-edp.txt"

      - name: Compare PluginKit and FSClient inventories
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/list-fskit" | tee "${RUNNER_TEMP}/after-edp.txt"
          echo '--- verdict ---'

          MACFUSE_INDEXED=0
          EDP_INDEXED=0
          MACFUSE_SEEN=0
          EDP_SEEN=0

          grep -Fq 'io.macfuse.app.fsmodule.macfuse' "${RUNNER_TEMP}/pluginkit-macfuse.txt" && MACFUSE_INDEXED=1 || true
          grep -Fq 'com.edp.usbvault.fskit-poc.extension' "${RUNNER_TEMP}/pluginkit-edp.txt" && EDP_INDEXED=1 || true
          grep -Fq 'bundle=io.macfuse.app.fsmodule.macfuse ' "${RUNNER_TEMP}/after-edp.txt" && MACFUSE_SEEN=1 || true
          grep -Fq 'bundle=com.edp.usbvault.fskit-poc.extension ' "${RUNNER_TEMP}/after-edp.txt" && EDP_SEEN=1 || true

          echo "MACFUSE_PLUGINKIT_INDEXED=${MACFUSE_INDEXED}"
          echo "EDP_PLUGINKIT_INDEXED=${EDP_INDEXED}"
          echo "MACFUSE_FSCLIENT_SEEN=${MACFUSE_SEEN}"
          echo "EDP_FSCLIENT_SEEN=${EDP_SEEN}"

          if [[ "${MACFUSE_INDEXED}" == 1 && "${EDP_INDEXED}" == 1 && "${MACFUSE_SEEN}" == 0 && "${EDP_SEEN}" == 0 ]]; then
            echo 'RESULT=HOSTED_RUNNER_THIRD_PARTY_FSCLIENT_HIDDEN'
          elif [[ "${MACFUSE_SEEN}" == 1 && "${EDP_SEEN}" == 0 ]]; then
            echo 'RESULT=SIGNED_IDENTITY_FILTER_POSSIBLE'
          elif [[ "${EDP_SEEN}" == 1 ]]; then
            echo 'RESULT=ADHOC_EDP_ACCEPTED'
          else
            echo 'RESULT=INCONCLUSIVE'
          fi

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-fskit-signing-ab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/baseline.txt
            ${{ runner.temp }}/after-macfuse.txt
            ${{ runner.temp }}/after-edp.txt
            ${{ runner.temp }}/pluginkit-macfuse.txt
            ${{ runner.temp }}/pluginkit-edp.txt
          if-no-files-found: ignore
          retention-days: 14
