name: FUSE-T Encrypted EDP APFS Read-Write E2E

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift"
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTEDPReadWriteFixtureBridge.swift"
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/PrepareEDPFilesystemFixture.swift"
      - "native/EDPFSKitPoC/Extension/EDPBlockDevice.swift"
      - "native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift"
      - "native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift"
      - ".github/workflows/fuset-edp-apfs-readwrite.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuset-edp-apfs-readwrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apfs-rw:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      FUSET_BUNDLE_ID: "org.fuset.fskit-srv.module"
      GOLDEN_NAME: "disk4_real_lexar"
      REAL_LBA11: "fixtures/real_disks/disk4/LBA11.bin"
      REAL_LBA12: "fixtures/real_disks/disk4/LBA12.bin"
      VOLNAME: "EDP-APFS-RW"

    steps:
      - uses: actions/checkout@v6

      - name: Resolve captured EDP metadata without logging password
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test ! -e /Library/Filesystems/macfuse.fs
          test ! -e /Library/Application\ Support/fuse-t
          test ! -e /usr/local/bin/go-nfsv4
          PASSWORD_FILE="${RUNNER_TEMP}/edp-apfs-rw-password"
          python3 - fixtures/golden/disks.json "${GOLDEN_NAME}" "${PASSWORD_FILE}" "${GITHUB_ENV}" <<'PY'
          import json, os, sys
          source, wanted, pw_path, env_path = sys.argv[1:]
          item = next(x for x in json.load(open(source))['disks'] if x['name'] == wanted)
          p = item['lba11_params']; password = item['password'].encode()
          fd = os.open(pw_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          try: os.write(fd, password)
          finally: os.close(fd)
          with open(env_path, 'a') as env:
              env.write(f"EDP_VID={p['vid']}\nEDP_PID={p['pid']}\nEDP_DEVICE_SIZE={p['size_bytes']}\nEDP_PARTITION_TYPE=2\nPASSWORD_FILE={pw_path}\n")
          print('RESULT=APFS_REALMETA_VECTOR_READY_WITHOUT_SECRET_LOGGING')
          PY
          test "$(stat -f %Lp "${PASSWORD_FILE}")" = 600

      - name: Build populated raw APFS partition fixture
        run: |
          set -euo pipefail
          TEMPLATE="${RUNNER_TEMP}/apfs-template.dmg"
          PLAIN="${RUNNER_TEMP}/apfs-plain.raw"
          SENTINEL='EDP-APFS-RW-BASELINE-v1'
          hdiutil create -size 256m -fs APFS -volname "${VOLNAME}" "${TEMPLATE}"
          OUT="$(hdiutil attach "${TEMPLATE}")"
          printf '%s\n' "${OUT}" | tee "${RUNNER_TEMP}/apfs-template-attach.txt"
          TEMPLATE_DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          MOUNT="/Volumes/${VOLNAME}"
          test -n "${TEMPLATE_DISK}"
          for i in $(seq 1 20); do [[ -d "${MOUNT}" ]] && break; sleep 1; done
          test -d "${MOUNT}"
          printf '%s\n' "${SENTINEL}" > "${MOUNT}/BASELINE.txt"
          mkdir -p "${MOUNT}/Seed Folder"
          printf '%s\n' seed-content > "${MOUNT}/Seed Folder/seed.txt"
          sync
          hdiutil detach "${TEMPLATE_DISK}" -force

          RAW_OUT="$(hdiutil attach -nomount "${TEMPLATE}")"
          printf '%s\n' "${RAW_OUT}" | tee "${RUNNER_TEMP}/apfs-template-nomount.txt"
          APFS_PART="$(printf '%s\n' "${RAW_OUT}" | awk '$0 ~ /Apple_APFS/ {print $1; exit}')"
          ROOT_DISK="$(printf '%s\n' "${RAW_OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${APFS_PART}"; test -n "${ROOT_DISK}"
          dd if="/dev/r$(basename "${APFS_PART}")" of="${PLAIN}" bs=1048576 status=progress
          hdiutil detach "${ROOT_DISK}" -force
          test $(( $(stat -f %z "${PLAIN}") % 512 )) -eq 0
          echo "PLAIN=${PLAIN}" >> "${GITHUB_ENV}"
          echo "SENTINEL=${SENTINEL}" >> "${GITHUB_ENV}"
          echo 'RESULT=APFS_RAW_PARTITION_FIXTURE_READY'

      - name: Encrypt APFS into real-metadata sparse EDP container
        run: |
          set -euo pipefail
          PREPARE="${RUNNER_TEMP}/PrepareEDPFilesystemFixture"
          CONTAINER="${RUNNER_TEMP}/edp-apfs-whole-device.raw"
          xcrun swiftc -parse-as-library -swift-version 6 -warnings-as-errors \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/PrepareEDPFilesystemFixture.swift \
            -o "${PREPARE}"
          "${PREPARE}" \
            --lba11 "${REAL_LBA11}" --lba12 "${REAL_LBA12}" \
            --vid "${EDP_VID}" --pid "${EDP_PID}" --device-size "${EDP_DEVICE_SIZE}" \
            --partition-type "${EDP_PARTITION_TYPE}" --plaintext "${PLAIN}" \
            --output "${CONTAINER}" --password-file "${PASSWORD_FILE}" \
            | tee "${RUNNER_TEMP}/prepare-apfs.log"
          grep -Fq 'RESULT=EDP_REAL_METADATA_FILESYSTEM_FIXTURE_READY' "${RUNNER_TEMP}/prepare-apfs.log"
          START="$(awk -F= '/^PREPARED_PARTITION_START_SECTOR=/ {print $2}' "${RUNNER_TEMP}/prepare-apfs.log")"
          PSIZE="$(awk -F= '/^PREPARED_PARTITION_SIZE_BYTES=/ {print $2}' "${RUNNER_TEMP}/prepare-apfs.log")"
          test -n "${START}"; test -n "${PSIZE}"
          chmod 0600 "${CONTAINER}"
          BEFORE="$(dd if="${CONTAINER}" bs=512 skip="${START}" count="$((PSIZE / 512))" status=none | shasum -a 256 | awk '{print $1}')"
          echo "CONTAINER=${CONTAINER}" >> "${GITHUB_ENV}"
          echo "PARTITION_START_SECTOR=${START}" >> "${GITHUB_ENV}"
          echo "PARTITION_SIZE=${PSIZE}" >> "${GITHUB_ENV}"
          echo "CIPHER_SHA_BEFORE=${BEFORE}" >> "${GITHUB_ENV}"
          echo 'RESULT=APFS_ENCRYPTED_EDP_FIXTURE_READY'

      - name: Stage exact official FUSE-T only on disposable runner
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/fuse-t.pkg"; EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl --fail --location --retry 3 --silent --show-error "${FUSET_PKG_URL}" -o "${PKG}"
          test "$(shasum -a 256 "${PKG}" | awk '{print $1}')" = "${FUSET_PKG_SHA256}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"
          SOURCE_APP="$(find "${EXPANDED}" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"
          test -n "${SOURCE_APP}"; codesign --verify --deep --strict "${SOURCE_APP}"
          sudo rm -rf /Applications/fuse-t.app; sudo ditto "${SOURCE_APP}" /Applications/fuse-t.app
          APP=/Applications/fuse-t.app; EXT="${APP}/Contents/Extensions/FskitSrvModule.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "${APP}"
          pluginkit -a "${EXT}" || true; pluginkit -a "${APP}" || true; pluginkit -e use -i "${FUSET_BUNDLE_ID}" || true
          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"; ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"; mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${FUSET_BUNDLE_ID}" <<'PY'
          import os, plistlib, sys
          path, bundle_id = sys.argv[1:]; enabled = []
          if os.path.exists(path):
              try:
                  with open(path, 'rb') as f: value = plistlib.load(f)
                  if isinstance(value, list): enabled = [x for x in value if isinstance(x, str)]
              except Exception: pass
          if bundle_id not in enabled: enabled.append(bundle_id)
          with open(path, 'wb') as f: plistlib.dump(enabled, f)
          PY
          chmod 600 "${ENABLED_PLIST}"
          killall -9 fskit_agent 2>/dev/null || true; killall -9 extensionkitservice 2>/dev/null || true; sudo killall -9 fskitd 2>/dev/null || true; sleep 3

      - name: Compile formal Swift EDP read-write thin bridge
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library -swift-version 6 -warnings-as-errors -D FUSET_BRIDGE_LIBRARY \
            native/EDPFSKitPoC/Extension/EDPRawIO.swift \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift \
            native/EDPFSKitPoC/Extension/EDPBlockDevice.swift \
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTEDPReadWriteFixtureBridge.swift \
            -o "${RUNNER_TEMP}/edp-fuset-apfs-rw"
          otool -L "${RUNNER_TEMP}/edp-fuset-apfs-rw" | tee "${RUNNER_TEMP}/apfs-rw-otool.txt"
          ! grep -Eiq 'macfuse|libfuse|go-nfsv4|ntfs' "${RUNNER_TEMP}/apfs-rw-otool.txt"
          echo 'RESULT=APFS_FORMAL_RW_THIN_BRIDGE_BUILT'

      - name: APFS CRUD Finder and detach-remount persistence over encrypted EDP
        run: |
          set -euo pipefail
          HIDDEN="${RUNNER_TEMP}/edp-apfs-hidden-$(uuidgen | tr '[:upper:]' '[:lower:]')"; BLOG="${RUNNER_TEMP}/apfs-bridge.log"; mkdir -p "${HIDDEN}"
          "${RUNNER_TEMP}/edp-fuset-apfs-rw" \
            --container "${CONTAINER}" --vid "${EDP_VID}" --pid "${EDP_PID}" \
            --device-size "${EDP_DEVICE_SIZE}" --partition-type "${EDP_PARTITION_TYPE}" \
            --password-file "${PASSWORD_FILE}" --mountpoint "${HIDDEN}" \
            --volume-name 'EDP Encrypted Writable APFS Transport' >"${BLOG}" 2>&1 &
          BPID=$!
          cleanup() {
            set +e
            [[ -n "${OUTER_DISK:-}" ]] && hdiutil detach "${OUTER_DISK}" -force >/dev/null 2>&1 || true
            [[ -n "${HIDDEN:-}" ]] && umount "${HIDDEN}" >/dev/null 2>&1 || true
            [[ -n "${BPID:-}" ]] && kill "${BPID}" >/dev/null 2>&1 || true
            rm -f "${PASSWORD_FILE:-}"
            sudo rm -rf /Applications/fuse-t.app
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do mount | grep -Fq " on ${HIDDEN} " && break; kill -0 "${BPID}"; sleep 1; done
          cat "${BLOG}"
          grep -Fq 'ACCESS_MODE=read-write' "${BLOG}"
          grep -Fq 'PLAINTEXT_CACHE=none' "${BLOG}"

          EXPOSED="${HIDDEN}/volume.raw"
          OUT="$(hdiutil attach -imagekey diskimage-class=CRawDiskImage "${EXPOSED}")"
          printf '%s\n' "${OUT}" | tee "${RUNNER_TEMP}/apfs-final-attach.txt"
          OUTER_DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          MOUNT="/Volumes/${VOLNAME}"
          test -n "${OUTER_DISK}"
          for i in $(seq 1 25); do [[ -d "${MOUNT}" ]] && break; sleep 1; done
          test -d "${MOUNT}"
          diskutil info "${MOUNT}" | tee "${RUNNER_TEMP}/apfs-info-first.txt"
          grep -Eiq 'File System Personality:[[:space:]]+APFS' "${RUNNER_TEMP}/apfs-info-first.txt"
          grep -Eq 'Volume Read-Only:[[:space:]]+No' "${RUNNER_TEMP}/apfs-info-first.txt"
          test "$(cat "${MOUNT}/BASELINE.txt")" = "${SENTINEL}"

          mkdir "${MOUNT}/Created Directory"
          printf '%s\n' first-version > "${MOUNT}/replace-target.txt"
          printf '%s\n' replacement-version > "${MOUNT}/replace-temp.txt"
          mv -f "${MOUNT}/replace-temp.txt" "${MOUNT}/replace-target.txt"
          test "$(cat "${MOUNT}/replace-target.txt")" = replacement-version
          printf '%s\n' rename-me > "${MOUNT}/rename-source.txt"
          mv "${MOUNT}/rename-source.txt" "${MOUNT}/Created Directory/renamed.txt"
          printf '%s\n' delete-me > "${MOUNT}/delete-me.txt"
          rm "${MOUNT}/delete-me.txt"
          python3 - "${MOUNT}/large-random.bin" <<'PY'
          import hashlib, sys
          with open(sys.argv[1], 'wb') as f:
              for i in range(8192): f.write(hashlib.sha256(f'EDP-APFS-LARGE:{i}'.encode()).digest() * 128)
          PY
          LARGE_SHA="$(shasum -a 256 "${MOUNT}/large-random.bin" | awk '{print $1}')"
          test "$(stat -f %z "${MOUNT}/large-random.bin")" -eq 33554432
          xattr -w com.edp.usbvault.test rw-xattr "${MOUNT}/replace-target.txt"
          test "$(xattr -p com.edp.usbvault.test "${MOUNT}/replace-target.txt")" = rw-xattr
          sync

          cat > "${RUNNER_TEMP}/finder-apfs.applescript" <<'OSA'
          on run argv
              set targetAlias to (POSIX file (item 1 of argv)) as alias
              tell application "Finder" to return name of every item of targetAlias as string
          end run
          OSA
          osacompile -o "${RUNNER_TEMP}/finder-apfs.scpt" "${RUNNER_TEMP}/finder-apfs.applescript"
          osascript "${RUNNER_TEMP}/finder-apfs.scpt" "${MOUNT}" | tee "${RUNNER_TEMP}/finder-apfs.txt"
          grep -Fq large-random.bin "${RUNNER_TEMP}/finder-apfs.txt"
          echo 'RESULT=APFS_CRUD_ATOMIC_REPLACE_XATTR_LARGEFILE_FINDER_OK'

          hdiutil detach "${OUTER_DISK}" -force
          OUTER_DISK=''
          AFTER="$(dd if="${CONTAINER}" bs=512 skip="${PARTITION_START_SECTOR}" count="$((PARTITION_SIZE / 512))" status=none | shasum -a 256 | awk '{print $1}')"
          test "${AFTER}" != "${CIPHER_SHA_BEFORE}"
          echo 'RESULT=APFS_ENCRYPTED_BACKING_CHANGED_AFTER_WRITES'

          OUT2="$(hdiutil attach -imagekey diskimage-class=CRawDiskImage "${EXPOSED}")"
          OUTER_DISK="$(printf '%s\n' "${OUT2}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${OUTER_DISK}"
          for i in $(seq 1 25); do [[ -d "${MOUNT}" ]] && break; sleep 1; done
          test "$(cat "${MOUNT}/replace-target.txt")" = replacement-version
          test "$(cat "${MOUNT}/Created Directory/renamed.txt")" = rename-me
          test ! -e "${MOUNT}/delete-me.txt"
          test "$(shasum -a 256 "${MOUNT}/large-random.bin" | awk '{print $1}')" = "${LARGE_SHA}"
          test "$(xattr -p com.edp.usbvault.test "${MOUNT}/replace-target.txt")" = rw-xattr
          diskutil info "${MOUNT}" | tee "${RUNNER_TEMP}/apfs-info-remount.txt"
          grep -Eq 'Volume Read-Only:[[:space:]]+No' "${RUNNER_TEMP}/apfs-info-remount.txt"
          echo 'RESULT=APFS_WRITES_PERSIST_AFTER_DETACH_REMOUNT'
