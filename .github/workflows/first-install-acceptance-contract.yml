name: First-Install Acceptance Contract

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/first-install-acceptance.sh"
      - "docs/FIRST-INSTALL-ACCEPTANCE.md"
      - "product/App/EDPUSBVaultApp.swift"
      - "product/EDPXPCProtocol.swift"
      - "product/EDPVaultRuntime.swift"
      - "native/EDPFSKitPoC/Extension/EDPBlockDevice.swift"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteBlockCBridge.swift"
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountEDPAdapter.c"
      - ".github/workflows/first-install-acceptance-contract.yml"

permissions:
  contents: read

concurrency:
  group: first-install-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Verify acceptance harness syntax and mandatory stages
        run: |
          set -euo pipefail
          bash -n scripts/first-install-acceptance.sh
          HELP="$(scripts/first-install-acceptance.sh --help)"
          for stage in \
            preflight \
            user-cleanup \
            factory-first-install \
            clean-install \
            verify-clean \
            verify-installed \
            open-fda \
            verify-fda-device \
            credential-checkpoint \
            policy-smoke \
            functional-all \
            safe-eject \
            restart-app \
            restart-daemon \
            final-check; do
            grep -Fq "${stage}" <<<"${HELP}"
          done
          grep -Fq 'tccutil reset SystemPolicyAllFiles' scripts/first-install-acceptance.sh
          grep -Fq 'com.edp.usbvault.rawaccess' scripts/first-install-acceptance.sh
          grep -Fq 'diskutil list external physical' scripts/first-install-acceptance.sh
          grep -Fq 'expected="saved"' scripts/first-install-acceptance.sh
          grep -Fq 'Passwords must never be passed to this script or written to logs.' scripts/first-install-acceptance.sh
          grep -Fq -- '--xpc-policy-smoke' scripts/first-install-acceptance.sh
          grep -Fq -- '--xpc-eject-smoke' scripts/first-install-acceptance.sh
          grep -Fq '0700' scripts/first-install-acceptance.sh
          grep -Fq 'USER_TCC_SCOPED_STATE_REMOVED' scripts/first-install-acceptance.sh
          grep -Fq 'USER_CLEANUP_PREPARED' scripts/first-install-acceptance.sh
          echo 'RESULT=FIRST_INSTALL_ACCEPTANCE_STAGES_PRESENT'

      - name: Reject destructive raw-media operations and secret transport
        run: |
          set -euo pipefail
          if grep -Ein 'diskutil[[:space:]]+(erase|partition|zero)|newfs_|mkfs|dd[^[:cntrl:]]*of=/dev/' scripts/first-install-acceptance.sh; then
            echo 'destructive raw-media operation found in first-install acceptance harness' >&2
            exit 1
          fi
          if grep -Ein 'password-file|PASSWORD=|--password|read[[:space:]]+-s' scripts/first-install-acceptance.sh; then
            echo 'secret transport found in first-install acceptance harness' >&2
            exit 1
          fi
          if grep -Ein 'default-keychain[[:space:]]+-s|sqlite3[^[:cntrl:]]*TCC\.db' scripts/first-install-acceptance.sh; then
            echo 'forbidden keychain/TCC mutation found in first-install acceptance harness' >&2
            exit 1
          fi
          grep -Fq 'Passwords must never be passed to this script or written to logs' scripts/first-install-acceptance.sh
          echo 'RESULT=FIRST_INSTALL_ACCEPTANCE_DESTRUCTIVE_OPS_ABSENT'

      - name: Enforce macFUSE-only production architecture
        run: |
          set -euo pipefail
          RETIRED_TRANSPORT_PATTERN="$(printf '%s%s|%s%s' 'fuse' '-t' 'fuse' 't')"
          if grep -R -Ein "${RETIRED_TRANSPORT_PATTERN}" product installer scripts native/EDPFSKitPoC/Tools .github/workflows README.md docs/FIRST-INSTALL-ACCEPTANCE.md; then
            echo 'retired transport reference found in production/contract sources' >&2
            exit 1
          fi
          test ! -e product/EDPTransportExec.c
          RETIRED_POLICY="product/EDP""Fuse""T""RuntimePolicy.swift"
          test ! -e "${RETIRED_POLICY}"
          test -f product/EDPMacFUSERuntimePolicy.swift
          grep -Fq 'edp-mfmount-local-readwrite' installer/build-transport-backends.sh
          echo 'RESULT=MACFUSE_ONLY_PRODUCT_CONTRACT_OK'

      - name: Strict Swift 6 build of App acceptance CLI
        run: |
          set -euo pipefail
          xcrun swiftc \
            -swift-version 6 \
            -strict-concurrency=complete \
            -warnings-as-errors \
            -framework AppKit \
            -framework FSKit \
            -framework SwiftUI \
            -framework ServiceManagement \
            product/EDPXPCProtocol.swift \
            product/App/EDPUSBVaultApp.swift \
            -o "${RUNNER_TEMP}/EDPUSBVaultAcceptanceApp"
          strings "${RUNNER_TEMP}/EDPUSBVaultAcceptanceApp" > "${RUNNER_TEMP}/acceptance-app.strings"
          grep -Fq 'RESULT=XPC_POLICY_SMOKE_OK' "${RUNNER_TEMP}/acceptance-app.strings"
          grep -Fq 'SNAPSHOT_PARTITION=' "${RUNNER_TEMP}/acceptance-app.strings"
          echo 'RESULT=FIRST_INSTALL_ACCEPTANCE_APP_STRICT_BUILD_OK'

      - name: Verify documented canonical order
        run: |
          set -euo pipefail
          DOC=docs/FIRST-INSTALL-ACCEPTANCE.md
          for phrase in \
            'user-cleanup' \
            'factory-first-install' \
            'credential-checkpoint' \
            'policy-smoke' \
            'functional-all' \
            'safe-eject' \
            'restart-daemon' \
            'reboot Mac'; do
            grep -Fq "${phrase}" "${DOC}"
          done
          echo 'RESULT=FIRST_INSTALL_ACCEPTANCE_DOCUMENTED'
