name: FSKit macOS 15 version scan

on:
  workflow_dispatch:
  push:
    branches:
      - install/one-click-installer
    paths:
      - .github/workflows/fskit-15-version-scan.yml

jobs:
  scan:
    name: ${{ matrix.runner }} mount -F probe
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: OS identity
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_LABEL=${{ matrix.runner }}"
          sw_vers
          uname -a
          uname -m
          echo "ImageOS=${ImageOS:-}"
          echo "ImageVersion=${ImageVersion:-}"

      - name: FAT16 direct mount -F vs Disk Arbitration
        shell: bash
        run: |
          set -uo pipefail
          IMG="$RUNNER_TEMP/fskit-fat16.dmg"
          MP="$RUNNER_TEMP/fskit-direct"
          mkdir -p "$MP"

          cleanup() {
            set +e
            if [[ -n "${DEVICE:-}" ]]; then
              /sbin/umount "$DEVICE" >/dev/null 2>&1 || true
            fi
            if [[ -n "${WHOLE:-}" ]]; then
              hdiutil detach -force "$WHOLE" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          hdiutil create -quiet -size 32m -layout MBRSPUD -fs 'MS-DOS FAT16' -volname EDPFAT "$IMG"
          ATTACH="$(hdiutil attach -nomount "$IMG")"
          printf '%s\n' "$ATTACH"
          WHOLE="$(printf '%s\n' "$ATTACH" | awk '$1 ~ /^\/dev\/disk[0-9]+$/ {print $1; exit}')"
          DEVICE="$(printf '%s\n' "$ATTACH" | awk '$1 ~ /^\/dev\/disk[0-9]+s[0-9]+$/ {d=$1} END {print d}')"
          test -n "$DEVICE"

          echo '=== DIRECT ==='
          set +e
          /sbin/mount -F -t msdos "$DEVICE" "$MP"
          DIRECT_RC=$?
          set -e
          echo "DIRECT_RC=$DIRECT_RC"
          mount | grep -F "$DEVICE" || true
          if mount | grep -Fq "$DEVICE"; then
            echo 'DIRECT_MOUNTED=1'
            /sbin/umount "$DEVICE" || true
          else
            echo 'DIRECT_MOUNTED=0'
          fi

          echo '=== DISK ARBITRATION ==='
          set +e
          diskutil mount "$DEVICE"
          DA_RC=$?
          set -e
          echo "DA_RC=$DA_RC"
          mount | grep -F "$DEVICE" || true
          if mount | grep -Fq "$DEVICE"; then
            echo 'DA_MOUNTED=1'
          else
            echo 'DA_MOUNTED=0'
          fi
