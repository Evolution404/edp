name: macFUSE FSKit FinderInfo Visibility A/B

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/MacFUSERawTransport.c"
      - ".github/workflows/macfuse-fskit-transport-nobrowse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macfuse-fskit-finderinfo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finderinfo-ab:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MACFUSE_VERSION: "5.3.3"
      MACFUSE_DMG_SHA256: "7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15"
      MACFUSE_DMG_URL: "https://github.com/macfuse/macfuse/releases/download/macfuse-5.3.3/macfuse-5.3.3.dmg"
      MACFUSE_FSKIT_GENERIC_BUNDLE_ID: "io.macfuse.app.fsmodule.macfuse"
      MACFUSE_FSKIT_LOCAL_BUNDLE_ID: "io.macfuse.app.fsmodule.macfuse-local"

    steps:
      - uses: actions/checkout@v6

      - name: Verify hosted runtime
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Install exact official macFUSE 5.3.3
        run: |
          set -euo pipefail
          DMG="${RUNNER_TEMP}/macfuse-${MACFUSE_VERSION}.dmg"
          curl --fail --location --retry 3 --silent --show-error "${MACFUSE_DMG_URL}" -o "${DMG}"
          test "$(shasum -a 256 "${DMG}" | awk '{print $1}')" = "${MACFUSE_DMG_SHA256}"
          ATTACH="$(hdiutil attach -nobrowse -readonly "${DMG}")"
          VOL="$(printf '%s\n' "${ATTACH}" | awk -F '\t' '/\/Volumes\// {print $NF; exit}')"
          test -n "${VOL}"
          PKG="$(find "${VOL}" -maxdepth 2 \( -type f -o -type d \) -name '*.pkg' -print -quit)"
          test -n "${PKG}"
          pkgutil --check-signature "${PKG}"
          sudo installer -pkg "${PKG}" -target /
          hdiutil detach "${VOL}" >/dev/null
          test -f /usr/local/lib/pkgconfig/fuse3.pc

      - name: Enable generic and local FSKit modules
        run: |
          set -euo pipefail
          APP="$(find /Applications /Library/Filesystems -type d -iname 'macfuse.app' -print -quit 2>/dev/null || true)"
          echo "MACFUSE_APP=${APP}"
          test -n "${APP}"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "${APP}"
          while IFS= read -r ext; do pluginkit -a "${ext}" || true; done < <(find "${APP}/Contents" -maxdepth 5 -type d -name '*.appex' -print)
          pluginkit -a "${APP}" || true
          pluginkit -e use -i "${MACFUSE_FSKIT_GENERIC_BUNDLE_ID}" || true
          pluginkit -e use -i "${MACFUSE_FSKIT_LOCAL_BUNDLE_ID}" || true

          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"
          ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${MACFUSE_FSKIT_GENERIC_BUNDLE_ID}" "${MACFUSE_FSKIT_LOCAL_BUNDLE_ID}" <<'PY'
          import os, plistlib, sys
          path = sys.argv[1]
          ids = sys.argv[2:]
          enabled = []
          if os.path.exists(path):
              try:
                  with open(path, "rb") as f:
                      value = plistlib.load(f)
                  if isinstance(value, list):
                      enabled = [x for x in value if isinstance(x, str)]
              except Exception:
                  pass
          for bundle_id in ids:
              if bundle_id not in enabled:
                  enabled.append(bundle_id)
          with open(path, "wb") as f:
              plistlib.dump(enabled, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          chmod 600 "${ENABLED_PLIST}"
          killall -9 fskit_agent 2>/dev/null || true
          killall -9 extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/pluginkit.txt" || true
          grep -Fq "+    ${MACFUSE_FSKIT_GENERIC_BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit.txt"
          grep -Fq "+    ${MACFUSE_FSKIT_LOCAL_BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit.txt"

      - name: Build transport and metadata probes
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          test "$(pkg-config --modversion fuse3)" = "3.18.2"
          xcrun clang -std=c17 -Wall -Wextra -Werror \
            native/EDPFSKitPoC/Tools/MacFUSEMinimal/MacFUSERawTransport.c \
            $(pkg-config --cflags --libs fuse3) \
            -o "${RUNNER_TEMP}/raw_transport"

          cat >"${RUNNER_TEMP}/InspectPath.swift" <<'SWIFT'
          import Foundation

          @main
          struct InspectPath {
              static func main() throws {
                  guard CommandLine.arguments.count == 2 else { exit(64) }
                  let url = URL(fileURLWithPath: CommandLine.arguments[1], isDirectory: true)
                  let values = try url.resourceValues(forKeys: [
                      .isHiddenKey,
                      .volumeIsBrowsableKey,
                      .volumeNameKey,
                      .volumeIsLocalKey,
                      .volumeTypeNameKey,
                  ])
                  print("ITEM_HIDDEN=\(values.isHidden == true ? 1 : 0)")
                  print("BROWSABLE=\(values.volumeIsBrowsable == true ? 1 : 0)")
                  print("VOLUME_NAME=\(values.volumeName ?? "<nil>")")
                  print("LOCAL=\(values.volumeIsLocal == true ? 1 : 0)")
                  print("TYPE=\(values.volumeTypeName ?? "<nil>")")
              }
          }
          SWIFT
          xcrun swiftc -swift-version 6 -parse-as-library -warnings-as-errors \
            "${RUNNER_TEMP}/InspectPath.swift" -o "${RUNNER_TEMP}/InspectPath"

      - name: Compare visible control against FinderInfo invisible root
        run: |
          set -euo pipefail
          RAW="${RUNNER_TEMP}/finderinfo-ab.raw"
          dd if=/dev/zero of="${RAW}" bs=1m count=8 status=none
          printf 'EDP-FINDERINFO-AB' | dd of="${RAW}" bs=1 seek=4096 conv=notrunc status=none

          run_variant() {
            local tag="$1"
            local expose="$2"
            local volume_name="EDP P0 ${tag}"
            local mountpoint="/Volumes/EDP-P0-${tag}-$(uuidgen | tr '[:upper:]' '[:lower:]')"
            local log_file="${RUNNER_TEMP}/${tag}.transport.log"

            sudo mkdir -p "${mountpoint}"
            sudo chown "$(id -u):$(id -g)" "${mountpoint}"
            EDP_INVISIBLE_FINDERINFO="${expose}" \
              "${RUNNER_TEMP}/raw_transport" "${RAW}" -f -d \
              -o "backend=fskit,local,volname=${volume_name}" \
              "${mountpoint}" >"${log_file}" 2>&1 &
            local pid=$!

            local mounted=false
            for attempt in $(seq 1 30); do
              if mount | grep -Fq " on ${mountpoint} "; then mounted=true; break; fi
              if ! kill -0 "${pid}" 2>/dev/null; then break; fi
              sleep 1
            done
            cat "${log_file}" || true
            test "${mounted}" = true
            echo "${tag}_MOUNTED=1"

            local inspect
            inspect="$(${RUNNER_TEMP}/InspectPath "${mountpoint}")"
            printf '%s\n' "${inspect}"
            local item_hidden
            item_hidden="$(printf '%s\n' "${inspect}" | sed -n 's/^ITEM_HIDDEN=//p')"
            local browsable
            browsable="$(printf '%s\n' "${inspect}" | sed -n 's/^BROWSABLE=//p')"
            echo "${tag}_ITEM_HIDDEN=${item_hidden}"
            echo "${tag}_BROWSABLE=${browsable}"

            set +e
            local finder_hex
            finder_hex="$(xattr -px com.apple.FinderInfo "${mountpoint}" 2>/dev/null | tr -d '[:space:]')"
            local xattr_status=$?
            set -e
            echo "${tag}_FINDERINFO_XATTR_STATUS=${xattr_status}"
            echo "${tag}_FINDERINFO_HEX=${finder_hex:-<none>}"

            if [[ "${expose}" = 0 ]]; then
              test "${xattr_status}" -ne 0
              test "${item_hidden}" = 0
            else
              test "${xattr_status}" -eq 0
              test "${#finder_hex}" -eq 64
              test "${finder_hex:16:4}" = "4000"
            fi

            if xcrun --find GetFileInfo >/dev/null 2>&1; then
              echo "${tag}_GETFILEINFO=$(xcrun GetFileInfo -a "${mountpoint}" 2>/dev/null || true)"
            fi
            echo "${tag}_MDITEM_FSINVISIBLE=$(mdls -raw -name kMDItemFSInvisible "${mountpoint}" 2>/dev/null || true)"

            killall Finder 2>/dev/null || true
            open -a Finder
            sleep 2
            osascript -e 'tell application "Finder" to get name of every disk' >"${RUNNER_TEMP}/${tag}.finder.txt"
            cat "${RUNNER_TEMP}/${tag}.finder.txt"
            if grep -Fq "${volume_name}" "${RUNNER_TEMP}/${tag}.finder.txt"; then
              echo "${tag}_FINDER_VISIBLE=1"
              printf '1' >"${RUNNER_TEMP}/${tag}.finder-visible"
            else
              echo "${tag}_FINDER_VISIBLE=0"
              printf '0' >"${RUNNER_TEMP}/${tag}.finder-visible"
            fi
            printf '%s' "${item_hidden}" >"${RUNNER_TEMP}/${tag}.item-hidden"

            if [[ "${expose}" = 1 ]]; then
              local exposed="${mountpoint}/volume.raw"
              test -f "${exposed}"
              printf 'RW' | dd of="${exposed}" bs=1 seek=8192 conv=notrunc status=none
              cmp <(dd if="${RAW}" bs=1 skip=8192 count=2 status=none) <(printf 'RW')
              echo 'RW_OK=1'
              local out disk
              out="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${exposed}")"
              printf '%s\n' "${out}"
              disk="$(printf '%s\n' "${out}" | awk '/^\/dev\/disk/ {print $1; exit}')"
              test -n "${disk}"
              hdiutil detach "${disk}" -force >/dev/null
              echo 'DISKIMAGES2_RAW_ATTACH_OK=1'
            fi

            /sbin/umount "${mountpoint}" 2>/dev/null || sudo /sbin/umount "${mountpoint}"
            kill "${pid}" 2>/dev/null || true
            rmdir "${mountpoint}" 2>/dev/null || sudo rmdir "${mountpoint}" 2>/dev/null || true
          }

          run_variant CONTROL 0
          run_variant FINDERINFO 1

          CONTROL_HIDDEN="$(cat "${RUNNER_TEMP}/CONTROL.item-hidden")"
          FINDERINFO_HIDDEN="$(cat "${RUNNER_TEMP}/FINDERINFO.item-hidden")"
          CONTROL_FINDER="$(cat "${RUNNER_TEMP}/CONTROL.finder-visible")"
          FINDERINFO_FINDER="$(cat "${RUNNER_TEMP}/FINDERINFO.finder-visible")"
          echo "AB_CONTROL_ITEM_HIDDEN=${CONTROL_HIDDEN}"
          echo "AB_FINDERINFO_ITEM_HIDDEN=${FINDERINFO_HIDDEN}"
          echo "AB_CONTROL_FINDER_VISIBLE=${CONTROL_FINDER}"
          echo "AB_FINDERINFO_FINDER_VISIBLE=${FINDERINFO_FINDER}"

          test "${CONTROL_HIDDEN}" = 0
          test "${FINDERINFO_HIDDEN}" = 1
          if [[ "${CONTROL_FINDER}" = 1 && "${FINDERINFO_FINDER}" = 0 ]]; then
            echo 'RESULT=FINDERINFO_HIDES_FSKIT_TRANSPORT_IN_FINDER'
            exit 0
          fi
          echo 'RESULT=FINDERINFO_METADATA_RECOGNIZED_BUT_HOSTED_FINDER_INCONCLUSIVE'
          exit 1

      - name: Cleanup
        if: always()
        run: |
          set +e
          pkill -f "${RUNNER_TEMP}/raw_transport" 2>/dev/null || true
          mount | awk '/\/Volumes\/EDP-P0-(CONTROL|FINDERINFO)-/ {print $3}' | while read -r mp; do
            /sbin/umount "${mp}" 2>/dev/null || sudo /sbin/umount "${mp}" 2>/dev/null || true
            sudo rmdir "${mp}" 2>/dev/null || true
          done
          exit 0
