name: macFUSE Local FSKit Hidden RW Transport

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/MacFUSERawTransport.c"
      - ".github/workflows/macfuse-fskit-transport-nobrowse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macfuse-fskit-hidden-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hidden-rw-transport:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MACFUSE_VERSION: "5.3.3"
      MACFUSE_DMG_SHA256: "7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15"
      MACFUSE_DMG_URL: "https://github.com/macfuse/macfuse/releases/download/macfuse-5.3.3/macfuse-5.3.3.dmg"
      MACFUSE_FSKIT_GENERIC_BUNDLE_ID: "io.macfuse.app.fsmodule.macfuse"
      MACFUSE_FSKIT_LOCAL_BUNDLE_ID: "io.macfuse.app.fsmodule.macfuse-local"

    steps:
      - uses: actions/checkout@v6

      - name: Verify hosted runtime
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Install exact official macFUSE 5.3.3
        run: |
          set -euo pipefail
          DMG="${RUNNER_TEMP}/macfuse-${MACFUSE_VERSION}.dmg"
          curl --fail --location --retry 3 --silent --show-error "${MACFUSE_DMG_URL}" -o "${DMG}"
          test "$(shasum -a 256 "${DMG}" | awk '{print $1}')" = "${MACFUSE_DMG_SHA256}"
          ATTACH="$(hdiutil attach -nobrowse -readonly "${DMG}")"
          printf '%s\n' "${ATTACH}"
          VOL="$(printf '%s\n' "${ATTACH}" | awk -F '\t' '/\/Volumes\// {print $NF; exit}')"
          test -n "${VOL}"
          PKG="$(find "${VOL}" -maxdepth 2 \( -type f -o -type d \) -name '*.pkg' -print -quit)"
          test -n "${PKG}"
          pkgutil --check-signature "${PKG}"
          sudo installer -pkg "${PKG}" -target /
          hdiutil detach "${VOL}" >/dev/null
          test -f /usr/local/lib/pkgconfig/fuse3.pc

      - name: Enable generic and local FSKit modules
        run: |
          set -euo pipefail
          APP="$(find /Applications /Library/Filesystems -type d -iname 'macfuse.app' -print -quit 2>/dev/null || true)"
          echo "MACFUSE_APP=${APP}"
          test -n "${APP}"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "${APP}"
          while IFS= read -r ext; do pluginkit -a "${ext}" || true; done < <(find "${APP}/Contents" -maxdepth 5 -type d -name '*.appex' -print)
          pluginkit -a "${APP}" || true
          pluginkit -e use -i "${MACFUSE_FSKIT_GENERIC_BUNDLE_ID}" || true
          pluginkit -e use -i "${MACFUSE_FSKIT_LOCAL_BUNDLE_ID}" || true

          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"
          ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${MACFUSE_FSKIT_GENERIC_BUNDLE_ID}" "${MACFUSE_FSKIT_LOCAL_BUNDLE_ID}" <<'PY'
          import os, plistlib, sys
          path = sys.argv[1]
          bundle_ids = sys.argv[2:]
          enabled = []
          if os.path.exists(path):
              try:
                  with open(path, "rb") as f:
                      value = plistlib.load(f)
                  if isinstance(value, list):
                      enabled = [x for x in value if isinstance(x, str)]
              except Exception:
                  pass
          for bundle_id in bundle_ids:
              if bundle_id not in enabled:
                  enabled.append(bundle_id)
          with open(path, "wb") as f:
              plistlib.dump(enabled, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          chmod 600 "${ENABLED_PLIST}"
          killall -9 fskit_agent 2>/dev/null || true
          killall -9 extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/pluginkit.txt" || true
          grep -Fq "+    ${MACFUSE_FSKIT_GENERIC_BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit.txt"
          grep -Fq "+    ${MACFUSE_FSKIT_LOCAL_BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit.txt"

      - name: Build Darwin-compatible one-file RW transport
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          test "$(pkg-config --modversion fuse3)" = "3.18.2"
          xcrun clang -std=c17 -Wall -Wextra -Werror \
            native/EDPFSKitPoC/Tools/MacFUSEMinimal/MacFUSERawTransport.c \
            $(pkg-config --cflags --libs fuse3) \
            -o "${RUNNER_TEMP}/raw_transport"

          cat >"${RUNNER_TEMP}/inspect.c" <<'EOF'
          #include <stdio.h>
          #include <sys/mount.h>
          int main(int argc, char **argv) {
              if (argc != 2) return 64;
              struct statfs st;
              if (statfs(argv[1], &st) != 0) return 65;
              printf("FSTYPE=%s FLAGS=0x%08x MNT_DONTBROWSE=%d\n",
                     st.f_fstypename, st.f_flags, (st.f_flags & MNT_DONTBROWSE) != 0);
              return 0;
          }
          EOF
          xcrun clang -std=c17 -Wall -Wextra -Werror "${RUNNER_TEMP}/inspect.c" -o "${RUNNER_TEMP}/inspect"

      - name: Prove local FSKit nobrowse transport
        run: |
          set -euo pipefail
          RAW="${RUNNER_TEMP}/macfuse-hidden.raw"
          MOUNTPOINT="/Volumes/.edp-macfuse-hidden-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          FINDER_DISK_NAME="$(basename "${MOUNTPOINT}")"
          dd if=/dev/zero of="${RAW}" bs=1m count=8 status=none
          printf 'EDP-MACFUSE-HIDDEN' | dd of="${RAW}" bs=1 seek=4096 conv=notrunc status=none
          sudo mkdir -p "${MOUNTPOINT}"
          sudo chown "$(id -u):$(id -g)" "${MOUNTPOINT}"
          echo "MOUNTPOINT=${MOUNTPOINT}" >> "${GITHUB_ENV}"

          "${RUNNER_TEMP}/raw_transport" "${RAW}" -f -d \
            -o "backend=fskit,local,nobrowse,volname=EDP macFUSE Hidden Transport" \
            "${MOUNTPOINT}" >"${RUNNER_TEMP}/transport.log" 2>&1 &
          TRANSPORT_PID=$!
          echo "TRANSPORT_PID=${TRANSPORT_PID}" >> "${GITHUB_ENV}"

          mounted=false
          for attempt in $(seq 1 30); do
            if mount | grep -Fq " on ${MOUNTPOINT} "; then mounted=true; break; fi
            if ! kill -0 "${TRANSPORT_PID}" 2>/dev/null; then break; fi
            sleep 1
          done

          echo '=== transport log ==='
          cat "${RUNNER_TEMP}/transport.log" || true
          echo '=== process state ==='
          ps aux | grep -Ei 'raw_transport|fskit|macfuse|MFMount' | grep -v grep || true
          echo '=== matching mounts ==='
          mount | grep -Ei 'macfuse|fskit|edp-macfuse' || true

          if [[ "${mounted}" != true ]]; then
            echo 'MOUNTED=0'
            echo '=== FSKit/macFUSE unified log ==='
            log show --last 3m --style compact \
              --predicate '(process == "fskitd") OR (process CONTAINS[c] "macfuse") OR (subsystem CONTAINS[c] "fskit") OR (subsystem CONTAINS[c] "macfuse")' \
              2>/dev/null | tail -n 400 || true
            exit 2
          fi
          echo 'MOUNTED=1'

          FLAGS="$(${RUNNER_TEMP}/inspect "${MOUNTPOINT}")"
          printf '%s\n' "${FLAGS}"
          printf '%s\n' "${FLAGS}" | grep -Fq 'MNT_DONTBROWSE=1'

          open -a Finder
          finder_ok=false
          for attempt in $(seq 1 15); do
            if osascript -e 'tell application "Finder" to get name of every disk' >"${RUNNER_TEMP}/finder.txt" 2>/dev/null; then finder_ok=true; break; fi
            sleep 1
          done
          test "${finder_ok}" = true
          cat "${RUNNER_TEMP}/finder.txt"
          if grep -Fq "${FINDER_DISK_NAME}" "${RUNNER_TEMP}/finder.txt"; then
            echo 'FINDER_TRANSPORT_VISIBLE=1'
            exit 1
          fi
          echo 'FINDER_TRANSPORT_VISIBLE=0'

          EXPOSED="${MOUNTPOINT}/volume.raw"
          test -f "${EXPOSED}"
          cmp <(dd if="${RAW}" bs=1 skip=4096 count=18 status=none) \
              <(dd if="${EXPOSED}" bs=1 skip=4096 count=18 status=none)
          printf 'RW' | dd of="${EXPOSED}" bs=1 seek=8192 conv=notrunc status=none
          cmp <(dd if="${RAW}" bs=1 skip=8192 count=2 status=none) <(printf 'RW')
          echo 'RW_OK=1'

          OUT="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${EXPOSED}")"
          printf '%s\n' "${OUT}"
          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${DISK}"
          hdiutil detach "${DISK}" -force >/dev/null
          echo 'DISKIMAGES2_RAW_ATTACH_OK=1'
          echo 'RESULT=MACFUSE_LOCAL_FSKIT_HIDDEN_RW_TRANSPORT_OK'

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [[ -n "${MOUNTPOINT:-}" ]]; then /sbin/umount "${MOUNTPOINT}" 2>/dev/null || sudo /sbin/umount "${MOUNTPOINT}" 2>/dev/null; fi
          if [[ -n "${TRANSPORT_PID:-}" ]]; then kill "${TRANSPORT_PID}" 2>/dev/null || true; fi
          sudo find /Volumes -maxdepth 1 -type d -name '.edp-macfuse-hidden-*' -exec rmdir {} \; 2>/dev/null || true
          exit 0
