name: Native Production Path

on:
  workflow_dispatch:
  push:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - "product/**"
      - "installer/build-clean-installer.sh"
      - "native/EDPFSKitPoC/Extension/**"
      - "native/EDPFSKitPoC/Tools/ValidateNativeProductionPath.swift"
      - ".github/workflows/native-production-path.yml"

permissions:
  contents: read

jobs:
  native-production-path:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Verify production source has no legacy discovery or mount CLI
        run: |
          set -euo pipefail
          ! grep -R -F '/usr/sbin/ioreg' product
          ! grep -R -F '/usr/sbin/diskutil' product
          ! grep -R -F '/sbin/mount' product
          ! grep -R -F '/sbin/umount' product
          ! grep -R -F '/bin/launchctl' product
          ! grep -R -F 'sleep(2)' product
          echo 'RESULT=PRODUCTION_LEGACY_DISCOVERY_MOUNT_CLI_ABSENT'

      - name: Strict Swift 6 production runtime build
        run: |
          set -euo pipefail
          CORE=(
            native/EDPFSKitPoC/Extension/EDPRawIO.swift
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift
            native/EDPFSKitPoC/Extension/EDPCrypto.swift
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift
            native/EDPFSKitPoC/Extension/EDPBlockDevice.swift
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift
          )
          xcrun swiftc -swift-version 6 -strict-concurrency=complete -framework CryptoKit -framework Security \
            "${CORE[@]}" \
            product/EDPNTFSWriteSafety.swift \
            product/EDPNTFSMountPolicy.swift \
            product/EDPCredentialStore.swift \
            product/EDPDevicePolicyStore.swift \
            product/EDPFuseTRuntimePolicy.swift \
            product/EDPMacFUSERuntimePolicy.swift \
            product/EDPTransportProvider.swift \
            product/EDPTransportRuntimePolicy.swift \
            product/EDPNativeSystem.swift \
            product/EDPBlockDevicePublisher.swift \
            product/EDPXPCProtocol.swift \
            product/EDPXPCSecurity.swift \
            product/EDPVaultRuntime.swift \
            -o "${RUNNER_TEMP}/edp-vaultctl"
          echo 'RESULT=NATIVE_PRODUCTION_STRICT_SWIFT6_BUILD_OK'

      - name: Validate SwiftUI XPC product surface and private adapter boundary
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 6 -strict-concurrency=complete \
            -framework AppKit -framework SwiftUI -framework ServiceManagement -framework Security \
            product/EDPXPCProtocol.swift \
            product/App/EDPUSBVaultApp.swift \
            -o "${RUNNER_TEMP}/edp-usb-vault-app"
          grep -F 'EDPXPCPeerValidator.isTrusted' product/EDPVaultRuntime.swift
          grep -F 'com.edp.usbvault.app' product/EDPXPCSecurity.swift
          grep -F 'EDPBlockDevicePublisher' product/EDPVaultRuntime.swift
          grep -F 'EDPDiskImages2Publisher' product/EDPVaultRuntime.swift
          ! grep -F 'run(binaryRoot + "/diskimages2-attach"' product/EDPVaultRuntime.swift
          grep -F 'diskimages2-attach' product/EDPBlockDevicePublisher.swift
          cc -Wall -Wextra product/EDPRawMetadataHelper.c -o "${RUNNER_TEMP}/edp-raw-metadata"
          cc -Wall -Wextra -c product/EDPRawReadAuthorization.c -o "${RUNNER_TEMP}/edp-raw-read-authorization.o"
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete \
            -framework CryptoKit -framework Security \
            product/EDPRawSparseBackup.swift "${RUNNER_TEMP}/edp-raw-read-authorization.o" \
            -o "${RUNNER_TEMP}/edp-raw-sparse"
          if grep -F 'O_RDWR' product/EDPRawReadAuthorization.c; then exit 1; fi
          "${RUNNER_TEMP}/edp-raw-sparse" help | grep -F 'backup-authorized obtains an O_RDONLY fd'
          grep -F 'authopen' native/EDPFSKitPoC/Tools/EDPReadWriteFuseBridge.c
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete \
            -framework CryptoKit native/EDPFSKitPoC/Tools/EDPFilesystemManifest.swift \
            -o "${RUNNER_TEMP}/edp-filesystem-manifest"
          grep -F 'O_RDONLY | O_CLOEXEC' native/EDPFSKitPoC/Tools/EDPReadOnlyFuseBridge.c
          if grep -F 'O_RDWR' native/EDPFSKitPoC/Tools/EDPReadOnlyFuseBridge.c; then exit 1; fi
          bash -n native/EDPFSKitPoC/Tools/probe-real-edp-backup-readonly.sh
          echo 'RESULT=RAW_DEVICE_AUTHORIZATION_SURFACE_OK'
          echo 'RESULT=SWIFTUI_XPC_PRODUCT_SURFACE_OK'
          echo 'RESULT=DISKIMAGES2_PRIVATE_API_ISOLATED_TO_ADAPTER'

      - name: Validate IOKit Disk Arbitration and native mount table APIs
        run: |
          set -euo pipefail
          CORE=(
            native/EDPFSKitPoC/Extension/EDPRawIO.swift
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift
            native/EDPFSKitPoC/Extension/EDPCrypto.swift
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift
            native/EDPFSKitPoC/Extension/EDPBlockDevice.swift
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift
          )
          xcrun swiftc -swift-version 6 -strict-concurrency=complete \
            "${CORE[@]}" \
            product/EDPNativeSystem.swift \
            native/EDPFSKitPoC/Tools/ValidateNativeProductionPath.swift \
            -o "${RUNNER_TEMP}/validate-native-production"
          "${RUNNER_TEMP}/validate-native-production" | tee "${RUNNER_TEMP}/native-production.txt"
          grep -F 'RESULT=NATIVE_MOUNT_TABLE_API_OK' "${RUNNER_TEMP}/native-production.txt"
          grep -F 'RESULT=NATIVE_IOKIT_DISCOVERY_API_OK' "${RUNNER_TEMP}/native-production.txt"
          grep -F 'RESULT=NATIVE_DISK_ARBITRATION_API_OK' "${RUNNER_TEMP}/native-production.txt"
          grep -F 'RESULT=NATIVE_PRODUCTION_PATH_API_OK' "${RUNNER_TEMP}/native-production.txt"

      - name: Validate Keychain credential storage
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 6 -strict-concurrency=complete \
            product/EDPCredentialStore.swift \
            native/EDPFSKitPoC/Tools/ValidateCredentialStore.swift \
            -o "${RUNNER_TEMP}/validate-credential-store"
          "${RUNNER_TEMP}/validate-credential-store" | tee "${RUNNER_TEMP}/credential-store.txt"
          grep -F 'RESULT=KEYCHAIN_PASSWORD_ROUNDTRIP_OK' "${RUNNER_TEMP}/credential-store.txt"
          grep -F 'RESULT=CREDENTIAL_INDEX_CONTAINS_NO_SECRET_OK' "${RUNNER_TEMP}/credential-store.txt"
          grep -F 'RESULT=SELF_MANAGED_MASTER_KEY_ABSENT_OK' "${RUNNER_TEMP}/credential-store.txt"
          grep -F 'RESULT=KEYCHAIN_REVOKE_OK' "${RUNNER_TEMP}/credential-store.txt"
          grep -F 'RESULT=KEYCHAIN_CREDENTIAL_STORE_E2E_OK' "${RUNNER_TEMP}/credential-store.txt"
