name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS（全 workspace）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 单元测试
        run: cargo test --workspace
      - name: rustdoc 构建
        run: cargo doc --workspace --no-deps

  ubuntu:
    name: Ubuntu（edp-core 算法层跨平台回归）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: edp-core 单元测试
        run: cargo test -p edp-core

  frontend:
    name: GUI（Vue 前端 + Tauri 后端）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: 前端构建（vue-tsc + vite）
        run: cd gui && npm ci && npm run build
      - name: GUI 后端 Clippy
        run: cargo clippy --manifest-path gui/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: GUI 后端构建
        run: cargo build --manifest-path gui/src-tauri/Cargo.toml
      - name: usbcore release 构建（装入 .app）
        run: cargo build --release -p usbcore
      - name: GUI 打包 .app
        run: |
          cd gui && npx tauri build
          cp ../target/release/usbcore "src-tauri/target/release/bundle/macos/EDP USB Vault.app/Contents/MacOS/usbcore"
