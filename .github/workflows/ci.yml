name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: macOS 26 / Rust + frontend checks
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend syntax
        run: node --check src/app.js

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust build
        run: cargo build --manifest-path src-tauri/Cargo.toml
