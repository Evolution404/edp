name: FUSE-T Minimal FSKit EDP Unlock E2E

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "fixtures/golden/disks.json"
      - "fixtures/real_disks/disk4/LBA11.bin"
      - "fixtures/real_disks/disk4/LBA12.bin"
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift"
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTEDPUnlockBridge.swift"
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/PrepareEDPFilesystemFixture.swift"
      - "native/EDPFSKitPoC/Extension/EDPRawIO.swift"
      - "native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift"
      - "native/EDPFSKitPoC/Extension/EDPCrypto.swift"
      - "native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift"
      - "native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift"
      - "native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift"
      - "native/EDPFSKitPoC/Extension/EDPBlockDevice.swift"
      - ".github/workflows/fuset-minimal-fskit-edp-unlock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuset-minimal-fskit-edp-unlock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edp-unlock:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      FUSET_BUNDLE_ID: "org.fuset.fskit-srv.module"
      GOLDEN_NAME: "disk4_real_lexar"
      REAL_LBA11: "fixtures/real_disks/disk4/LBA11.bin"
      REAL_LBA12: "fixtures/real_disks/disk4/LBA12.bin"
      VOLNAME: "EDP_REALMETA_FINAL"
      DIAG_PATH: "docs/diagnostics/fuset-edp-unlock-realmeta-macos26-ci.txt"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify clean macOS 26 runtime
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test "$(xcodebuild -version | awk '/Xcode/ {print int($2); exit}')" -ge 26
          test ! -e /Library/Filesystems/macfuse.fs
          test ! -e /Library/Application\ Support/fuse-t
          test ! -e /usr/local/bin/go-nfsv4
          echo 'RESULT=G_REALMETA_RUNTIME_HAS_NO_MACFUSE_OR_FUSET_CORE'

      - name: Resolve captured real-device metadata vector without logging secrets
        run: |
          set -euo pipefail
          PREPARE_PASSWORD_FILE="${RUNNER_TEMP}/edp-prepare-password"
          BRIDGE_PASSWORD_FILE="${RUNNER_TEMP}/edp-bridge-password"
          python3 - \
            fixtures/golden/disks.json \
            "${GOLDEN_NAME}" \
            "${PREPARE_PASSWORD_FILE}" \
            "${BRIDGE_PASSWORD_FILE}" \
            "${GITHUB_ENV}" <<'PY'
          import json, os, sys
          source, wanted, prepare_pw, bridge_pw, env_path = sys.argv[1:]
          with open(source, 'r', encoding='utf-8') as f:
              document = json.load(f)
          item = next(d for d in document['disks'] if d['name'] == wanted)
          params = item['lba11_params']
          password = item['password'].encode('utf-8')
          for path in (prepare_pw, bridge_pw):
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              try:
                  os.write(fd, password)
              finally:
                  os.close(fd)
          with open(env_path, 'a', encoding='utf-8') as env:
              env.write(f"EDP_VID={params['vid']}\n")
              env.write(f"EDP_PID={params['pid']}\n")
              env.write(f"EDP_DEVICE_SIZE={params['size_bytes']}\n")
              env.write("EDP_PARTITION_TYPE=2\n")
              env.write(f"PREPARE_PASSWORD_FILE={prepare_pw}\n")
              env.write(f"BRIDGE_PASSWORD_FILE={bridge_pw}\n")
          print('RESULT=G_REALMETA_VECTOR_RESOLVED_WITHOUT_SECRET_LOGGING')
          PY
          test -s "${PREPARE_PASSWORD_FILE}"
          test -s "${BRIDGE_PASSWORD_FILE}"
          test "$(stat -f %Lp "${PREPARE_PASSWORD_FILE}")" = 600
          test "$(stat -f %Lp "${BRIDGE_PASSWORD_FILE}")" = 600
          test "$(stat -f %z "${REAL_LBA11}")" -eq 512
          test "$(stat -f %z "${REAL_LBA12}")" -eq 512

      - name: Build populated Apple filesystem plaintext oracle
        run: |
          set -euo pipefail
          TEMPLATE="${RUNNER_TEMP}/edp-realmeta-template.dmg"
          PLAIN="${RUNNER_TEMP}/edp-realmeta-plain.raw"
          SENTINEL='EDP-REAL-METADATA-UNLOCK-SENTINEL-v1'

          hdiutil create -size 64m -fs HFS+ -volname "${VOLNAME}" -layout NONE "${TEMPLATE}"
          OUT="$(hdiutil attach "${TEMPLATE}")"
          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          MOUNT="$(printf '%s\n' "${OUT}" | awk -v v="${VOLNAME}" '$0 ~ ("/Volumes/" v) {print $NF; exit}')"
          test -n "${DISK}"
          test -d "${MOUNT}"
          printf '%s\n' "${SENTINEL}" > "${MOUNT}/EDP_SENTINEL.txt"
          mkdir -p "${MOUNT}/EDP Folder"
          python3 - "${MOUNT}/EDP Folder/payload.bin" <<'PY'
          import hashlib, sys
          path = sys.argv[1]
          with open(path, 'wb') as f:
              for block in range(2048):
                  seed = hashlib.sha256(f'EDP-REALMETA-PAYLOAD:{block}'.encode()).digest()
                  f.write(seed * 128)
          PY
          PAYLOAD_SHA="$(shasum -a 256 "${MOUNT}/EDP Folder/payload.bin" | awk '{print $1}')"
          sync
          hdiutil detach "${DISK}"

          RAW_OUT="$(hdiutil attach -nomount "${TEMPLATE}")"
          RAW_DISK="$(printf '%s\n' "${RAW_OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${RAW_DISK}"
          dd if="/dev/r$(basename "${RAW_DISK}")" of="${PLAIN}" bs=1048576 status=none
          hdiutil detach "${RAW_DISK}"
          test "$(stat -f %z "${PLAIN}")" -eq 67108864

          PLAIN_SHA="$(shasum -a 256 "${PLAIN}" | awk '{print $1}')"
          echo "PLAIN=${PLAIN}" >> "${GITHUB_ENV}"
          echo "PLAIN_SHA=${PLAIN_SHA}" >> "${GITHUB_ENV}"
          echo "PAYLOAD_SHA=${PAYLOAD_SHA}" >> "${GITHUB_ENV}"
          echo "SENTINEL=${SENTINEL}" >> "${GITHUB_ENV}"
          echo 'RESULT=G_REALMETA_PLAINTEXT_ORACLE_READY'

      - name: Build sparse whole-device EDP fixture from captured LBA11 and LBA12
        run: |
          set -euo pipefail
          PREPARE_BIN="${RUNNER_TEMP}/PrepareEDPFilesystemFixture"
          CONTAINER="${RUNNER_TEMP}/edp-realmeta-whole-device.raw"
          xcrun swiftc -swift-version 6 -warnings-as-errors \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/PrepareEDPFilesystemFixture.swift \
            -o "${PREPARE_BIN}"
          "${PREPARE_BIN}" \
            --lba11 "${REAL_LBA11}" \
            --lba12 "${REAL_LBA12}" \
            --vid "${EDP_VID}" \
            --pid "${EDP_PID}" \
            --device-size "${EDP_DEVICE_SIZE}" \
            --partition-type "${EDP_PARTITION_TYPE}" \
            --plaintext "${PLAIN}" \
            --output "${CONTAINER}" \
            --password-file "${PREPARE_PASSWORD_FILE}" \
            | tee "${RUNNER_TEMP}/prepare-realmeta.log"
          rm -f "${PREPARE_PASSWORD_FILE}"
          test ! -e "${PREPARE_PASSWORD_FILE}"
          grep -Fq 'RESULT=EDP_REAL_METADATA_FILESYSTEM_FIXTURE_READY' "${RUNNER_TEMP}/prepare-realmeta.log"
          grep -Fq 'PREPARED_SECRET_OUTPUT=false' "${RUNNER_TEMP}/prepare-realmeta.log"
          PARTITION_START_SECTOR="$(awk -F= '/^PREPARED_PARTITION_START_SECTOR=/ {print $2}' "${RUNNER_TEMP}/prepare-realmeta.log")"
          PARTITION_SIZE="$(awk -F= '/^PREPARED_PARTITION_SIZE_BYTES=/ {print $2}' "${RUNNER_TEMP}/prepare-realmeta.log")"
          DEVICE_ID="$(awk -F= '/^PREPARED_DEVICE_ID=/ {print substr($0,index($0,"=")+1)}' "${RUNNER_TEMP}/prepare-realmeta.log")"
          test -n "${PARTITION_START_SECTOR}"
          test -n "${PARTITION_SIZE}"
          test -n "${DEVICE_ID}"
          test "$(stat -f %z "${CONTAINER}")" -eq "${EDP_DEVICE_SIZE}"
          chmod 0444 "${CONTAINER}"
          test ! -w "${CONTAINER}"
          du -h "${CONTAINER}" | tee "${RUNNER_TEMP}/sparse-size.txt"

          CONTAINER_META_BEFORE="$(stat -f '%z:%m:%p' "${CONTAINER}")"
          python3 - "${CONTAINER}" "${PARTITION_START_SECTOR}" "${RUNNER_TEMP}/container-before.txt" <<'PY'
          import hashlib, os, sys
          path, start_sector, out = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          start = start_sector * 512
          samples = [
              ('lba11', 11 * 512, 512),
              ('lba12', 12 * 512, 512),
              ('data_head', start, 1024 * 1024),
              ('data_tail', start + 64 * 1024 * 1024 - 1024 * 1024, 1024 * 1024),
          ]
          with open(path, 'rb', buffering=0) as f, open(out, 'w', encoding='utf-8') as dest:
              for name, offset, length in samples:
                  f.seek(offset)
                  data = f.read(length)
                  assert len(data) == length, (name, len(data), length)
                  dest.write(f'{name}={hashlib.sha256(data).hexdigest()}\n')
          PY
          echo "CONTAINER=${CONTAINER}" >> "${GITHUB_ENV}"
          echo "CONTAINER_META_BEFORE=${CONTAINER_META_BEFORE}" >> "${GITHUB_ENV}"
          echo "PARTITION_START_SECTOR=${PARTITION_START_SECTOR}" >> "${GITHUB_ENV}"
          echo "PARTITION_SIZE=${PARTITION_SIZE}" >> "${GITHUB_ENV}"
          echo "REALMETA_DEVICE_ID=${DEVICE_ID}" >> "${GITHUB_ENV}"
          echo 'RESULT=G_REALMETA_SPARSE_WHOLE_DEVICE_READY'

      - name: Stage and enable only official signed FUSE-T FSKit app
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/fuse-t-${FUSET_VERSION}.pkg"
          EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl --fail --location --retry 3 --silent --show-error "${FUSET_PKG_URL}" -o "${PKG}"
          test "$(shasum -a 256 "${PKG}" | awk '{print $1}')" = "${FUSET_PKG_SHA256}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"
          SOURCE_APP="$(find "${EXPANDED}" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"
          test -n "${SOURCE_APP}"
          codesign --verify --deep --strict --verbose=2 "${SOURCE_APP}"
          sudo rm -rf /Applications/fuse-t.app
          sudo ditto "${SOURCE_APP}" /Applications/fuse-t.app
          APP=/Applications/fuse-t.app
          EXT="${APP}/Contents/Extensions/FskitSrvModule.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "${APP}"
          pluginkit -a "${EXT}" || true
          pluginkit -a "${APP}" || true
          pluginkit -e use -i "${FUSET_BUNDLE_ID}" || true
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/pluginkit-realmeta.txt" || true
          grep -Fq "${FUSET_BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit-realmeta.txt"

          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"
          ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${FUSET_BUNDLE_ID}" <<'PY'
          import os, plistlib, sys
          path, bundle_id = sys.argv[1:]
          enabled = []
          if os.path.exists(path):
              try:
                  with open(path, 'rb') as f:
                      value = plistlib.load(f)
                  if isinstance(value, list):
                      enabled = [x for x in value if isinstance(x, str)]
              except Exception:
                  pass
          if bundle_id not in enabled:
              enabled.append(bundle_id)
          with open(path, 'wb') as f:
              plistlib.dump(enabled, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          chmod 600 "${ENABLED_PLIST}"
          plutil -lint "${ENABLED_PLIST}"
          grep -Fq "${FUSET_BUNDLE_ID}" "${ENABLED_PLIST}"
          killall -9 fskit_agent 2>/dev/null || true
          killall -9 extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3

      - name: Compile product-style EDP unlock bridge
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 6 -warnings-as-errors -D FUSET_BRIDGE_LIBRARY \
            native/EDPFSKitPoC/Extension/EDPRawIO.swift \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift \
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift \
            native/EDPFSKitPoC/Extension/EDPBlockDevice.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTEDPUnlockBridge.swift \
            -o "${RUNNER_TEMP}/FuseTEDPUnlockBridge"
          test -x "${RUNNER_TEMP}/FuseTEDPUnlockBridge"
          echo 'RESULT=G4_PRODUCT_EDP_UNLOCK_READER_LINKED'

      - name: G4 real captured metadata unlock through hidden FUSE-T transport
        run: |
          set -euo pipefail
          HIDDEN="${RUNNER_TEMP}/edp-realmeta-hidden-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          LOG="${RUNNER_TEMP}/edp-realmeta-bridge.log"
          mkdir -p "${HIDDEN}"
          echo "HIDDEN=${HIDDEN}" >> "${GITHUB_ENV}"
          echo "BRIDGE_LOG=${LOG}" >> "${GITHUB_ENV}"

          "${RUNNER_TEMP}/FuseTEDPUnlockBridge" \
            --backing "${CONTAINER}" \
            --vid "${EDP_VID}" \
            --pid "${EDP_PID}" \
            --device-size "${EDP_DEVICE_SIZE}" \
            --partition-type "${EDP_PARTITION_TYPE}" \
            --password-file "${BRIDGE_PASSWORD_FILE}" \
            --mountpoint "${HIDDEN}" \
            --volume-name 'EDP Real Metadata Hidden Raw Transport' \
            >"${LOG}" 2>&1 &
          BRIDGE_PID=$!
          echo "BRIDGE_PID=${BRIDGE_PID}" >> "${GITHUB_ENV}"

          for attempt in $(seq 1 30); do
            if mount | grep -Fq " on ${HIDDEN} "; then break; fi
            kill -0 "${BRIDGE_PID}" 2>/dev/null
            sleep 1
          done
          mount | grep -F " on ${HIDDEN} " | tee "${RUNNER_TEMP}/hidden-realmeta-mount.txt"
          test ! -e "${BRIDGE_PASSWORD_FILE}"
          grep -Fq 'BACKING_MODE=EDP_UNLOCK_RANDOM_ACCESS' "${LOG}"
          grep -Fq 'RAW_ACCESS=O_RDONLY|O_CLOEXEC' "${LOG}"
          grep -Fq 'PLAINTEXT_CACHE=none' "${LOG}"
          grep -Fq "DEVICE_ID=${REALMETA_DEVICE_ID}" "${LOG}"
          grep -Fq "PARTITION_START_SECTOR=${PARTITION_START_SECTOR}" "${LOG}"
          grep -Fq "PARTITION_SIZE=${PARTITION_SIZE}" "${LOG}"

          EXPOSED="${HIDDEN}/volume.raw"
          test -f "${EXPOSED}"
          test "$(stat -f %z "${EXPOSED}")" -eq "${PARTITION_SIZE}"
          python3 - "${PLAIN}" "${EXPOSED}" <<'PY'
          import sys
          plain, exposed = sys.argv[1:]
          windows = [
              (0, 1), (1, 31), (15, 33), (4095, 4097),
              (65531, 7777), (3 * 1024 * 1024 + 5, 65519),
              (64 * 1024 * 1024 - 1, 1),
          ]
          with open(plain, 'rb', buffering=0) as lhs, open(exposed, 'rb', buffering=0) as rhs:
              for offset, length in windows:
                  lhs.seek(offset); rhs.seek(offset)
                  a, b = lhs.read(length), rhs.read(length)
                  assert a == b, (offset, length, len(a), len(b))
          print('RESULT=G4_REAL_METADATA_RANDOM_WINDOWS_MATCH')
          PY

          lsof -p "${BRIDGE_PID}" | tee "${RUNNER_TEMP}/bridge-realmeta-lsof.txt"
          grep -Fq "${CONTAINER}" "${RUNNER_TEMP}/bridge-realmeta-lsof.txt"
          if grep -Fq "${PLAIN}" "${RUNNER_TEMP}/bridge-realmeta-lsof.txt"; then
            echo 'product unlock bridge unexpectedly opened the plaintext oracle' >&2
            exit 1
          fi
          echo 'RESULT=G4_REAL_METADATA_UNLOCK_PATH_OK'

      - name: G5 Apple filesystem and Finder over real-metadata unlocked partition
        run: |
          set -euo pipefail
          EXPOSED="${HIDDEN}/volume.raw"
          OUT="$(hdiutil attach -readonly -imagekey diskimage-class=CRawDiskImage "${EXPOSED}" 2>"${RUNNER_TEMP}/hdiutil-realmeta.err")"
          printf '%s\n' "${OUT}" | tee "${RUNNER_TEMP}/attach-realmeta.txt"
          FINAL_DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          FINAL_MOUNT="$(printf '%s\n' "${OUT}" | awk -v v="${VOLNAME}" '$0 ~ ("/Volumes/" v) {print $NF; exit}')"
          test -n "${FINAL_DISK}"
          test -d "${FINAL_MOUNT}"
          echo "FINAL_DISK=${FINAL_DISK}" >> "${GITHUB_ENV}"
          echo "FINAL_MOUNT=${FINAL_MOUNT}" >> "${GITHUB_ENV}"

          test "$(cat "${FINAL_MOUNT}/EDP_SENTINEL.txt")" = "${SENTINEL}"
          test "$(shasum -a 256 "${FINAL_MOUNT}/EDP Folder/payload.bin" | awk '{print $1}')" = "${PAYLOAD_SHA}"
          diskutil info "${FINAL_DISK}" | tee "${RUNNER_TEMP}/diskutil-realmeta.txt"
          grep -Eq 'File System Personality:[[:space:]]+HFS\+' "${RUNNER_TEMP}/diskutil-realmeta.txt"
          grep -Eq 'Type \(Bundle\):[[:space:]]+hfs' "${RUNNER_TEMP}/diskutil-realmeta.txt"
          grep -Eq 'Media Read-Only:[[:space:]]+Yes' "${RUNNER_TEMP}/diskutil-realmeta.txt"
          grep -Eq 'Volume Read-Only:[[:space:]]+Yes' "${RUNNER_TEMP}/diskutil-realmeta.txt"

          FINDER_SCRIPT="${RUNNER_TEMP}/finder-realmeta.applescript"
          cat > "${FINDER_SCRIPT}" <<'OSA'
          on run argv
              set targetAlias to (POSIX file (item 1 of argv)) as alias
              tell application "Finder"
                  return (name of every item of targetAlias) as string
              end tell
          end run
          OSA
          osacompile -o "${RUNNER_TEMP}/finder-realmeta.scpt" "${FINDER_SCRIPT}"
          osascript "${RUNNER_TEMP}/finder-realmeta.scpt" "${FINAL_MOUNT}" | tee "${RUNNER_TEMP}/finder-realmeta.txt"
          grep -Fq 'EDP_SENTINEL.txt' "${RUNNER_TEMP}/finder-realmeta.txt"
          echo 'RESULT=G5_REAL_METADATA_APPLE_FS_FINDER_OK'

          hdiutil detach "${FINAL_DISK}" -force
          echo 'FINAL_DISK=' >> "${GITHUB_ENV}"

      - name: G6 prove captured-metadata backing remains unchanged
        run: |
          set -euo pipefail
          CONTAINER_META_AFTER="$(stat -f '%z:%m:%p' "${CONTAINER}")"
          echo "CONTAINER_META_AFTER=${CONTAINER_META_AFTER}" >> "${GITHUB_ENV}"
          test "${CONTAINER_META_AFTER}" = "${CONTAINER_META_BEFORE}"
          python3 - "${CONTAINER}" "${PARTITION_START_SECTOR}" "${RUNNER_TEMP}/container-after.txt" <<'PY'
          import hashlib, sys
          path, start_sector, out = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          start = start_sector * 512
          samples = [
              ('lba11', 11 * 512, 512),
              ('lba12', 12 * 512, 512),
              ('data_head', start, 1024 * 1024),
              ('data_tail', start + 64 * 1024 * 1024 - 1024 * 1024, 1024 * 1024),
          ]
          with open(path, 'rb', buffering=0) as f, open(out, 'w', encoding='utf-8') as dest:
              for name, offset, length in samples:
                  f.seek(offset)
                  data = f.read(length)
                  assert len(data) == length, (name, len(data), length)
                  dest.write(f'{name}={hashlib.sha256(data).hexdigest()}\n')
          PY
          cmp "${RUNNER_TEMP}/container-before.txt" "${RUNNER_TEMP}/container-after.txt"
          echo 'RESULT=G6_REAL_METADATA_BACKING_UNCHANGED'
          echo 'RESULT=G4_G5_G6_REAL_METADATA_PASS'

      - name: Collect G4-G6 real-metadata evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${DIAG_PATH}")"
          {
            echo '# FUSE-T minimal FSKit + captured EDP metadata unlock macOS 26 CI'
            echo
            echo 'generated_at_utc=<normalized>'
            echo "runner_os=$(sw_vers -productVersion)"
            echo "runner_build=$(sw_vers -buildVersion)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "device_id=${REALMETA_DEVICE_ID:-unknown}"
            echo "device_size=${EDP_DEVICE_SIZE:-unknown}"
            echo "partition_type=${EDP_PARTITION_TYPE:-unknown}"
            echo "partition_start_sector=${PARTITION_START_SECTOR:-unknown}"
            echo "partition_size=${PARTITION_SIZE:-unknown}"
            echo "plain_sha=${PLAIN_SHA:-unknown}"
            echo "container_meta_before=${CONTAINER_META_BEFORE:-unknown}"
            echo "container_meta_after=${CONTAINER_META_AFTER:-unknown}"
            echo "final_mount=${FINAL_MOUNT:-none}"
            echo 'password_logged=false'
            echo 'derived_file_key_logged=false'
            echo
            echo '## fixture preparation'
            cat "${RUNNER_TEMP}/prepare-realmeta.log" 2>/dev/null || true
            cat "${RUNNER_TEMP}/sparse-size.txt" 2>/dev/null || true
            echo
            echo '## backing sample hashes before'
            cat "${RUNNER_TEMP}/container-before.txt" 2>/dev/null || true
            echo
            echo '## backing sample hashes after'
            cat "${RUNNER_TEMP}/container-after.txt" 2>/dev/null || true
            echo
            echo '## hidden transport'
            cat "${RUNNER_TEMP}/hidden-realmeta-mount.txt" 2>/dev/null || true
            echo
            echo '## bridge log'
            cat "${BRIDGE_LOG:-/dev/null}" 2>/dev/null || true
            echo
            echo '## bridge open files'
            cat "${RUNNER_TEMP}/bridge-realmeta-lsof.txt" 2>/dev/null || true
            echo
            echo '## final attach'
            cat "${RUNNER_TEMP}/attach-realmeta.txt" 2>/dev/null || true
            cat "${RUNNER_TEMP}/hdiutil-realmeta.err" 2>/dev/null || true
            echo
            echo '## final diskutil'
            cat "${RUNNER_TEMP}/diskutil-realmeta.txt" 2>/dev/null || true
            echo
            echo '## Finder'
            cat "${RUNNER_TEMP}/finder-realmeta.txt" 2>/dev/null || true
          } > "${DIAG_PATH}"
          sed -n '1,500p' "${DIAG_PATH}"

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [[ -n "${FINAL_DISK:-}" ]]; then hdiutil detach "${FINAL_DISK}" -force; fi
          if [[ -n "${HIDDEN:-}" ]]; then /sbin/umount "${HIDDEN}"; fi
          if [[ -n "${BRIDGE_PID:-}" ]]; then kill "${BRIDGE_PID}" 2>/dev/null; fi
          rm -f "${PREPARE_PASSWORD_FILE:-}" "${BRIDGE_PASSWORD_FILE:-}"
          sudo rm -rf /Applications/fuse-t.app
          exit 0

      - name: Commit deterministic G4-G6 diagnostic
        if: always() && github.ref_name == 'test/fuset-minimal-fskit-bridge'
        run: |
          set -euo pipefail
          test -f "${DIAG_PATH}"
          git add "${DIAG_PATH}"
          if git diff --cached --quiet -- "${DIAG_PATH}"; then
            echo 'RESULT=G_REALMETA_DIAGNOSTIC_UNCHANGED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: capture FUSE-T EDP real-metadata probe [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
