name: Native FSKit Hosted Contract

on:
  push:
    branches: ["feat/macos26-native-fskit", "feat/macos26-fskit-*"]
    paths:
      - "native/EDPFSKitPoC/project.yml"
      - "native/EDPFSKitPoC/Host/Info.plist"
      - "native/EDPFSKitPoC/Host/EDPFSKitPoCApp.swift"
      - "native/EDPFSKitPoC/Extension/Info.plist"
      - "native/EDPFSKitPoC/Extension/EDPFSKitExtension.entitlements"
      - "native/EDPFSKitPoC/Extension/EDPFSKitExtension.swift"
      - ".github/workflows/native-fskit-poc.yml"
  pull_request:
    branches: ["feat/macos26-native-fskit"]
    paths:
      - "native/EDPFSKitPoC/project.yml"
      - "native/EDPFSKitPoC/Host/Info.plist"
      - "native/EDPFSKitPoC/Host/EDPFSKitPoCApp.swift"
      - "native/EDPFSKitPoC/Extension/Info.plist"
      - "native/EDPFSKitPoC/Extension/EDPFSKitExtension.entitlements"
      - "native/EDPFSKitPoC/Extension/EDPFSKitExtension.swift"
      - ".github/workflows/native-fskit-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

concurrency:
  group: native-fskit-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-contract:
    name: Bundle, registration, and approval boundary
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Runtime and SDK contract
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Generate and build native project once
        working-directory: native/EDPFSKitPoC
        run: |
          set -euo pipefail

          install_started="$(date +%s)"
          if command -v xcodegen >/dev/null 2>&1; then
            echo 'XCODEGEN_PREINSTALLED=true'
          else
            brew install xcodegen
            echo 'XCODEGEN_PREINSTALLED=false'
          fi
          install_finished="$(date +%s)"

          generate_started="${install_finished}"
          xcodegen generate
          generate_finished="$(date +%s)"

          build_started="${generate_finished}"
          xcodebuild -quiet \
            -project EDPFSKitPoC.xcodeproj \
            -scheme EDPFSKitHost \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${RUNNER_TEMP}/EDPFSKitDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_PREVIEWS=NO \
            ENABLE_DEBUG_DYLIB=NO \
            SWIFT_EMIT_LOC_STRINGS=NO \
            build
          build_finished="$(date +%s)"

          echo "CI_TIMING_XCODEGEN_INSTALL_S=$((install_finished - install_started))"
          echo "CI_TIMING_XCODEGEN_GENERATE_S=$((generate_finished - generate_started))"
          echo "CI_TIMING_XCODEBUILD_S=$((build_finished - build_started))"
          echo "CI_TIMING_BUILD_PIPELINE_S=$((build_finished - install_started))"

      - name: Verify FSKit bundle contract
        run: |
          set -euo pipefail
          APP="${RUNNER_TEMP}/EDPFSKitDerivedData/Build/Products/Debug/EDPFSKitPoC.app"
          EXT="${APP}/Contents/Extensions/EDPFSKitExtension.appex"
          test -d "${APP}"
          test -d "${EXT}"

          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "${EXT}/Contents/Info.plist")"
          EXT_POINT="$(/usr/libexec/PlistBuddy -c 'Print :EXAppExtensionAttributes:EXExtensionPointIdentifier' "${EXT}/Contents/Info.plist")"
          SHORT_NAME="$(/usr/libexec/PlistBuddy -c 'Print :EXAppExtensionAttributes:FSShortName' "${EXT}/Contents/Info.plist")"
          BLOCKS="$(/usr/libexec/PlistBuddy -c 'Print :EXAppExtensionAttributes:FSSupportsBlockResources' "${EXT}/Contents/Info.plist")"
          SOURCE_EXT_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' native/EDPFSKitPoC/Extension/Info.plist)"
          BUILT_EXT_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${EXT}/Contents/Info.plist")"
          SOURCE_HOST_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' native/EDPFSKitPoC/Host/Info.plist)"
          BUILT_HOST_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP}/Contents/Info.plist")"

          echo "MIN_OS=${MIN_OS}"
          echo "EXTENSION_POINT=${EXT_POINT}"
          echo "FS_SHORT_NAME=${SHORT_NAME}"
          echo "SUPPORTS_BLOCK_RESOURCES=${BLOCKS}"
          echo "SOURCE_EXT_BUILD=${SOURCE_EXT_BUILD}"
          echo "BUILT_EXT_BUILD=${BUILT_EXT_BUILD}"
          echo "SOURCE_HOST_BUILD=${SOURCE_HOST_BUILD}"
          echo "BUILT_HOST_BUILD=${BUILT_HOST_BUILD}"

          test "${MIN_OS}" = "26.0"
          test "${EXT_POINT}" = "com.apple.fskit.fsmodule"
          test "${SHORT_NAME}" = "edpvault"
          test "${BLOCKS}" = "true"
          test "${BUILT_EXT_BUILD}" = "${SOURCE_EXT_BUILD}"
          test "${BUILT_HOST_BUILD}" = "${SOURCE_HOST_BUILD}"
          echo "EDP_EXPECTED_BUILD_VERSION=${SOURCE_EXT_BUILD}" >> "${GITHUB_ENV}"
          echo "RESULT=EDP_FSKIT_BUILD_VERSION_MATCH:${SOURCE_EXT_BUILD}"

      - name: Verify native extension independence
        run: |
          set -euo pipefail
          EXT_BIN="${RUNNER_TEMP}/EDPFSKitDerivedData/Build/Products/Debug/EDPFSKitPoC.app/Contents/Extensions/EDPFSKitExtension.appex/Contents/MacOS/EDPFSKitExtension"
          test -x "${EXT_BIN}"
          if nm -gU "${EXT_BIN}" | grep -E 'edp_probe_reserved_sectors|edp_raw_io_'; then
            echo 'unexpected Rust C ABI symbol in native extension' >&2
            exit 1
          fi
          ! grep -Fq 'cargo build' native/EDPFSKitPoC/project.yml
          ! grep -Fq 'edp_fskit_bridge' native/EDPFSKitPoC/project.yml
          echo 'RESULT=PURE_SWIFT_NATIVE_FSKIT'

      - name: Ad-hoc sign, install, and register once
        run: |
          set -euo pipefail
          SOURCE_APP="${RUNNER_TEMP}/EDPFSKitDerivedData/Build/Products/Debug/EDPFSKitPoC.app"
          SOURCE_EXT="${SOURCE_APP}/Contents/Extensions/EDPFSKitExtension.appex"

          codesign --force --sign - --generate-entitlement-der \
            --entitlements native/EDPFSKitPoC/Extension/EDPFSKitExtension.entitlements \
            "${SOURCE_EXT}"
          codesign --force --sign - "${SOURCE_APP}"
          codesign --verify --deep --strict --verbose=2 "${SOURCE_APP}"

          sudo rm -rf /Applications/EDPFSKitPoC.app
          sudo ditto "${SOURCE_APP}" /Applications/EDPFSKitPoC.app
          APP=/Applications/EDPFSKitPoC.app
          EXT="${APP}/Contents/Extensions/EDPFSKitExtension.appex"

          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister \
            -f -R -trusted "${APP}"
          pluginkit -a "${EXT}"
          pluginkit -a "${APP}"

          codesign -dvvv --entitlements :- "${EXT}" 2>&1 \
            | tee "${RUNNER_TEMP}/signature.txt"
          grep -F 'com.apple.developer.fskit.fsmodule' "${RUNNER_TEMP}/signature.txt"
          grep -F 'com.apple.security.app-sandbox' "${RUNNER_TEMP}/signature.txt"

      - name: Require PluginKit indexing
        run: |
          set -euo pipefail
          indexed=false
          for attempt in 1 2 3 4 5; do
            echo "PLUGIN_KIT_INDEX_ATTEMPT=${attempt}"
            pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv \
              | tee "${RUNNER_TEMP}/pluginkit.txt"
            if grep -Fq 'com.edp.usbvault.fskit-poc.extension' "${RUNNER_TEMP}/pluginkit.txt"; then
              indexed=true
              break
            fi
            sleep 1
          done
          test "${indexed}" = "true"
          echo 'RESULT=PLUGIN_KIT_FSKIT_INDEXED'

      - name: Classify hosted FSClient visibility
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          xcrun swiftc -framework FSKit \
            native/EDPFSKitPoC/Tools/InspectFSKit.swift \
            -o "${RUNNER_TEMP}/inspect-fskit"

          set +e
          "${RUNNER_TEMP}/inspect-fskit" >"${RUNNER_TEMP}/fsclient.txt" 2>&1
          RC=$?
          set -e
          cat "${RUNNER_TEMP}/fsclient.txt"
          echo "FSCLIENT_INSPECT_RC=${RC}"

          if grep -Fq 'FSKIT_MODULE_FOUND=com.edp.usbvault.fskit-poc.extension' "${RUNNER_TEMP}/fsclient.txt"; then
            echo 'RESULT=FSCLIENT_VISIBLE'
          else
            echo 'RESULT=HOSTED_RUNNER_THIRD_PARTY_FSCLIENT_HIDDEN'
          fi

      - name: Classify hosted EDP-seeded raw-block approval boundary
        run: |
          set -euo pipefail
          RAW="${RUNNER_TEMP}/probe.raw"
          LBA4="fixtures/real_disks/disk4/LBA4.bin"
          LBA7="fixtures/real_disks/disk4/LBA7.bin"
          MP="${RUNNER_TEMP}/mnt"

          test "$(stat -f %z "${LBA4}")" -eq 512
          test "$(stat -f %z "${LBA7}")" -eq 512
          mkfile 16m "${RAW}"
          dd if="${LBA4}" of="${RAW}" bs=512 seek=4 conv=notrunc status=none
          dd if="${LBA7}" of="${RAW}" bs=512 seek=7 conv=notrunc status=none
          echo 'RESULT=EDP_RESERVED_FIXTURE_SEEDED:disk4'
          mkdir -p "${MP}"

          OUT="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${RAW}")"
          echo "${OUT}"
          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${DISK}"
          test -b "${DISK}"
          BSD_NAME="$(basename "${DISK}")"
          trap 'hdiutil detach "${DISK}" -force >/dev/null 2>&1 || true' EXIT
          echo "RESULT=RAW_BLOCK_DEVICE_READY:${DISK}"

          set +e
          /sbin/mount -t edpvault "${DISK}" "${MP}" \
            >"${RUNNER_TEMP}/mount.out" 2>"${RUNNER_TEMP}/mount.err"
          RC=$?
          set -e
          echo "MOUNT_RC=${RC}"
          cat "${RUNNER_TEMP}/mount.out" || true
          cat "${RUNNER_TEMP}/mount.err" || true
          sleep 1

          log show --last 2m --style compact \
            --predicate 'subsystem == "com.edp.usbvault.fskit-poc.extension" OR eventMessage CONTAINS[c] "com.edp.usbvault.fskit-poc.extension" OR process == "fskitd"' \
            >"${RUNNER_TEMP}/runtime.log" 2>&1 || true
          cat "${RUNNER_TEMP}/runtime.log" || true

          if grep -Fq "PROBE_BLOCK_DEVICE=${BSD_NAME}" "${RUNNER_TEMP}/runtime.log"; then
            grep -Fq "PROBE_BUILD_VERSION=${EDP_EXPECTED_BUILD_VERSION}" "${RUNNER_TEMP}/runtime.log" \
              || { echo 'RESULT=NATIVE_FSKIT_PROBE_WRONG_BUILD_VERSION'; exit 1; }
            grep -Fq 'PROBE_RESERVED_SECTORS_READ=true' "${RUNNER_TEMP}/runtime.log" \
              || { echo 'RESULT=NATIVE_FSKIT_PROBE_MISSING_RESERVED_READ'; exit 1; }
            grep -Fq 'PROBE_CORE=swift-native' "${RUNNER_TEMP}/runtime.log" \
              || { echo 'RESULT=NATIVE_FSKIT_PROBE_WRONG_CORE'; exit 1; }
            grep -Fq 'PROBE_EDP_RESERVED_SIGNATURE=true' "${RUNNER_TEMP}/runtime.log" \
              || { echo 'RESULT=NATIVE_FSKIT_PROBE_DID_NOT_RECOGNIZE_EDP'; exit 1; }
            grep -Fq 'PROBE_MATCH=recognized' "${RUNNER_TEMP}/runtime.log" \
              || { echo 'RESULT=NATIVE_FSKIT_PROBE_MATCH_NOT_RECOGNIZED'; exit 1; }
            echo "RESULT=NATIVE_FSKIT_SWIFT_CORE_RECOGNIZED:${BSD_NAME}:build=${EDP_EXPECTED_BUILD_VERSION}"
            exit 0
          fi

          if grep -Fq 'Module com.edp.usbvault.fskit-poc.extension is disabled!' "${RUNNER_TEMP}/mount.err"; then
            echo 'RESULT=HOSTED_RUNNER_FSKIT_APPROVAL_REQUIRED'
            exit 0
          fi

          echo 'RESULT=NATIVE_FSKIT_BLOCK_PROBE_UNEXPECTED_FAILURE'
          exit 1

      - name: Upload hosted diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-fskit-hosted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/signature.txt
            ${{ runner.temp }}/pluginkit.txt
            ${{ runner.temp }}/fsclient.txt
            ${{ runner.temp }}/mount.out
            ${{ runner.temp }}/mount.err
            ${{ runner.temp }}/runtime.log
          if-no-files-found: ignore
          retention-days: 7