name: FUSE-T Minimal FSKit Apple FS E2E

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift"
      - ".github/workflows/fuset-minimal-fskit-applefs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuset-minimal-fskit-applefs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-filesystem:
    runs-on: macos-26
    timeout-minutes: 18
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      FUSET_BUNDLE_ID: "org.fuset.fskit-srv.module"
      VOLNAME: "EDP_FUSET_FINAL"
      DIAG_PATH: "docs/diagnostics/fuset-applefs-macos26-ci.txt"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build populated raw HFS fixture
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          TEMPLATE="${RUNNER_TEMP}/applefs-template.dmg"
          RAW="${RUNNER_TEMP}/applefs-fixture.raw"
          SENTINEL='EDP-FUSET-APPLE-FS-SENTINEL-v1'
          hdiutil create -size 64m -fs HFS+ -volname "${VOLNAME}" -layout NONE "${TEMPLATE}"
          OUT="$(hdiutil attach "${TEMPLATE}")"
          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          MOUNT="/Volumes/${VOLNAME}"
          test -n "${DISK}"; test -d "${MOUNT}"
          printf '%s\n' "${SENTINEL}" > "${MOUNT}/EDP_SENTINEL.txt"
          mkdir -p "${MOUNT}/EDP Folder"; printf '%s\n' nested-file-visible > "${MOUNT}/EDP Folder/NESTED.txt"
          sync; hdiutil detach "${DISK}"
          RAW_OUT="$(hdiutil attach -nomount "${TEMPLATE}")"
          RAW_DISK="$(printf '%s\n' "${RAW_OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          dd if="/dev/r$(basename "${RAW_DISK}")" of="${RAW}" bs=1048576 status=none
          hdiutil detach "${RAW_DISK}"
          chmod 0444 "${RAW}"
          echo "RAW=${RAW}" >> "${GITHUB_ENV}"
          echo "RAW_SHA_BEFORE=$(shasum -a256 "${RAW}" | awk '{print $1}')" >> "${GITHUB_ENV}"
          echo "RAW_META_BEFORE=$(stat -f '%z:%m:%p' "${RAW}")" >> "${GITHUB_ENV}"
          echo "SENTINEL=${SENTINEL}" >> "${GITHUB_ENV}"
          echo 'RESULT=F0_RAW_APPLE_FS_FIXTURE_READY'

      - name: Stage exact FUSE-T on disposable runner
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/fuse-t.pkg"; EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl -fL --retry 3 -sS "${FUSET_PKG_URL}" -o "${PKG}"
          test "$(shasum -a256 "${PKG}" | awk '{print $1}')" = "${FUSET_PKG_SHA256}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"
          SOURCE_APP="$(find "${EXPANDED}" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"
          codesign --verify --deep --strict "${SOURCE_APP}"
          sudo rm -rf /Applications/fuse-t.app; sudo ditto "${SOURCE_APP}" /Applications/fuse-t.app
          APP=/Applications/fuse-t.app; EXT="${APP}/Contents/Extensions/FskitSrvModule.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "${APP}"
          pluginkit -a "${EXT}" || true; pluginkit -e use -i "${FUSET_BUNDLE_ID}" || true
          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"; ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"; mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${FUSET_BUNDLE_ID}" <<'PY'
          import os,plistlib,sys
          p,b=sys.argv[1:];a=[]
          if os.path.exists(p):
              try:
                  with open(p,'rb') as f:v=plistlib.load(f)
                  if isinstance(v,list):a=[x for x in v if isinstance(x,str)]
              except Exception:pass
          if b not in a:a.append(b)
          with open(p,'wb') as f:plistlib.dump(a,f)
          PY
          killall -9 fskit_agent 2>/dev/null || true; sudo killall -9 fskitd 2>/dev/null || true; sleep 3

      - name: Compile type-agnostic bridge and verify RO Apple filesystem
        run: |
          set -euo pipefail
          SOURCE=native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift
          xcrun swiftc -parse-as-library -swift-version 6 -warnings-as-errors "${SOURCE}" -o "${RUNNER_TEMP}/FuseTMinimalBridge"
          if grep -Eiq 'HFS\+|Apple_HFS|APFS|ExFAT|MSDOS|FAT32|NTFS' "${SOURCE}"; then echo 'filesystem knowledge leaked into transport' >&2; exit 1; fi
          HIDDEN="${RUNNER_TEMP}/hidden-$(uuidgen | tr '[:upper:]' '[:lower:]')"; BLOG="${RUNNER_TEMP}/bridge.log"; mkdir -p "${HIDDEN}"
          "${RUNNER_TEMP}/FuseTMinimalBridge" --backing "${RAW}" --mountpoint "${HIDDEN}" --volume-name 'EDP Hidden Raw Transport' >"${BLOG}" 2>&1 &
          BPID=$!; echo "BPID=${BPID}" >> "${GITHUB_ENV}"; echo "HIDDEN=${HIDDEN}" >> "${GITHUB_ENV}"; echo "BLOG=${BLOG}" >> "${GITHUB_ENV}"
          for i in $(seq 1 25); do mount | grep -Fq " on ${HIDDEN} " && break; kill -0 "${BPID}"; sleep 1; done
          mount | grep -F " on ${HIDDEN} " | tee "${RUNNER_TEMP}/hidden-mount.txt"
          grep -Fq 'ACCESS_MODE=read-only' "${BLOG}"
          EXPOSED="${HIDDEN}/volume.raw"
          OUT="$(hdiutil attach -readonly -imagekey diskimage-class=CRawDiskImage "${EXPOSED}")"; printf '%s\n' "${OUT}" | tee "${RUNNER_TEMP}/attach.txt"
          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"; MOUNT="/Volumes/${VOLNAME}"; test -n "${DISK}"
          for i in $(seq 1 15); do [[ -d "${MOUNT}" ]] && break; sleep 1; done; test -d "${MOUNT}"
          echo "FINAL_DISK=${DISK}" >> "${GITHUB_ENV}"; echo "FINAL_MOUNT=${MOUNT}" >> "${GITHUB_ENV}"
          test "$(cat "${MOUNT}/EDP_SENTINEL.txt")" = "${SENTINEL}"; test "$(cat "${MOUNT}/EDP Folder/NESTED.txt")" = nested-file-visible
          diskutil info "${DISK}" | tee "${RUNNER_TEMP}/diskutil.txt"
          grep -Eq 'File System Personality:[[:space:]]+HFS\+' "${RUNNER_TEMP}/diskutil.txt"; grep -Eq 'Media Read-Only:[[:space:]]+Yes' "${RUNNER_TEMP}/diskutil.txt"; grep -Eq 'Volume Read-Only:[[:space:]]+Yes' "${RUNNER_TEMP}/diskutil.txt"
          set +e; touch "${MOUNT}/SHOULD_NOT_WRITE" 2>"${RUNNER_TEMP}/write.err"; WRITE_RC=$?; set -e; test "${WRITE_RC}" -ne 0; test ! -e "${MOUNT}/SHOULD_NOT_WRITE"
          cat > "${RUNNER_TEMP}/finder.applescript" <<'OSA'
          on run argv
              set targetAlias to (POSIX file (item 1 of argv)) as alias
              tell application "Finder" to return name of every item of targetAlias as string
          end run
          OSA
          osacompile -o "${RUNNER_TEMP}/finder.scpt" "${RUNNER_TEMP}/finder.applescript"; osascript "${RUNNER_TEMP}/finder.scpt" "${MOUNT}" | tee "${RUNNER_TEMP}/finder.txt"; grep -Fq EDP_SENTINEL.txt "${RUNNER_TEMP}/finder.txt"
          hdiutil detach "${DISK}" -force; echo 'FINAL_DISK=' >> "${GITHUB_ENV}"
          test "$(shasum -a256 "${RAW}" | awk '{print $1}')" = "${RAW_SHA_BEFORE}"; test "$(stat -f '%z:%m:%p' "${RAW}")" = "${RAW_META_BEFORE}"
          echo 'RESULT=F1_F5_RO_APPLE_FS_REGRESSION_PASS'

      - name: Collect deterministic evidence
        if: always()
        run: |
          mkdir -p "$(dirname "${DIAG_PATH}")"
          { echo '# FUSE-T minimal bridge -> Apple filesystem macOS 26 CI'; echo; echo 'generated_at_utc=<normalized>'; echo "runner_os=$(sw_vers -productVersion)"; echo; cat "${RUNNER_TEMP}/hidden-mount.txt" 2>/dev/null || true; echo; cat "${RUNNER_TEMP}/diskutil.txt" 2>/dev/null || true; echo; cat "${RUNNER_TEMP}/finder.txt" 2>/dev/null || true; echo; cat "${RUNNER_TEMP}/write.err" 2>/dev/null || true; echo; cat "${BLOG:-/dev/null}" 2>/dev/null || true; } > "${DIAG_PATH}"
          cat "${DIAG_PATH}"

      - name: Cleanup
        if: always()
        run: |
          set +e; [[ -n "${FINAL_DISK:-}" ]] && hdiutil detach "${FINAL_DISK}" -force >/dev/null 2>&1 || true; [[ -n "${HIDDEN:-}" ]] && umount "${HIDDEN}" >/dev/null 2>&1 || true; [[ -n "${BPID:-}" ]] && kill "${BPID}" >/dev/null 2>&1 || true; sudo rm -rf /Applications/fuse-t.app; true

      - name: Commit diagnostic
        if: always() && github.ref_name == 'test/fuset-minimal-fskit-bridge'
        run: |
          set -euo pipefail; git add "${DIAG_PATH}"; git diff --cached --quiet -- "${DIAG_PATH}" && exit 0; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git commit -m 'docs: capture FUSE-T Apple FS probe [skip ci]'; git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin "HEAD:${GITHUB_REF_NAME}"
