name: FUSE-T Minimal FSKit Apple FS E2E

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift"
      - ".github/workflows/fuset-minimal-fskit-applefs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuset-minimal-fskit-applefs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-filesystem:
    runs-on: macos-26
    timeout-minutes: 18
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      FUSET_BUNDLE_ID: "org.fuset.fskit-srv.module"
      VOLNAME: "EDP_FUSET_FINAL"
      DIAG_PATH: "docs/diagnostics/fuset-applefs-macos26-ci.txt"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify macOS 26 / Xcode 26
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test "$(xcodebuild -version | awk '/Xcode/ {print int($2); exit}')" -ge 26
          command -v hdiutil
          command -v diskutil

      - name: F0 build populated HFS+ raw fixture
        run: |
          set -euo pipefail
          TEMPLATE="${RUNNER_TEMP}/applefs-template.dmg"
          RAW="${RUNNER_TEMP}/applefs-fixture.raw"
          SENTINEL='EDP-FUSET-APPLE-FS-SENTINEL-v1'

          # HFS+ is used only to manufacture a deterministic Apple-readable
          # filesystem fixture. The EDP bridge never receives this type name.
          # macOS 26 rejects -format UDRW for a size-created image unless a
          # source folder/device is supplied; the default create format here is
          # writable and sufficient for populate -> raw-device extraction.
          hdiutil create \
            -size 64m \
            -fs HFS+ \
            -volname "${VOLNAME}" \
            -layout NONE \
            "${TEMPLATE}"

          ATTACH_OUT="$(hdiutil attach "${TEMPLATE}")"
          printf '%s\n' "${ATTACH_OUT}"
          TEMPLATE_DISK="$(printf '%s\n' "${ATTACH_OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          TEMPLATE_MOUNT="$(printf '%s\n' "${ATTACH_OUT}" | awk -v v="${VOLNAME}" '$0 ~ ("/Volumes/" v) {print $NF; exit}')"
          test -n "${TEMPLATE_DISK}"
          test -d "${TEMPLATE_MOUNT}"

          printf '%s\n' "${SENTINEL}" > "${TEMPLATE_MOUNT}/EDP_SENTINEL.txt"
          mkdir -p "${TEMPLATE_MOUNT}/EDP Folder"
          printf '%s\n' 'nested-file-visible' > "${TEMPLATE_MOUNT}/EDP Folder/NESTED.txt"
          sync
          test "$(cat "${TEMPLATE_MOUNT}/EDP_SENTINEL.txt")" = "${SENTINEL}"
          hdiutil detach "${TEMPLATE_DISK}"

          RAW_OUT="$(hdiutil attach -nomount "${TEMPLATE}")"
          printf '%s\n' "${RAW_OUT}"
          RAW_SOURCE_DISK="$(printf '%s\n' "${RAW_OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${RAW_SOURCE_DISK}"
          RAW_SOURCE_RDISK="/dev/r$(basename "${RAW_SOURCE_DISK}")"
          dd if="${RAW_SOURCE_RDISK}" of="${RAW}" bs=1048576 status=none
          hdiutil detach "${RAW_SOURCE_DISK}"

          RAW_SIZE="$(stat -f %z "${RAW}")"
          RAW_SHA="$(shasum -a 256 "${RAW}" | awk '{print $1}')"
          test "${RAW_SIZE}" -gt 33554432
          echo "RAW_SIZE=${RAW_SIZE}"
          echo "RAW_SHA256=${RAW_SHA}"

          # Prove the extracted bytes are a standalone raw filesystem before
          # involving FUSE-T. No filesystem type is passed to this attach.
          BASELINE_OUT="$(hdiutil attach -readonly -imagekey diskimage-class=CRawDiskImage "${RAW}")"
          printf '%s\n' "${BASELINE_OUT}"
          BASELINE_DISK="$(printf '%s\n' "${BASELINE_OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          BASELINE_MOUNT="$(printf '%s\n' "${BASELINE_OUT}" | awk -v v="${VOLNAME}" '$0 ~ ("/Volumes/" v) {print $NF; exit}')"
          test -n "${BASELINE_DISK}"
          test -d "${BASELINE_MOUNT}"
          test "$(cat "${BASELINE_MOUNT}/EDP_SENTINEL.txt")" = "${SENTINEL}"
          test "$(cat "${BASELINE_MOUNT}/EDP Folder/NESTED.txt")" = 'nested-file-visible'
          diskutil info "${BASELINE_DISK}" | tee "${RUNNER_TEMP}/baseline-diskutil.txt"
          hdiutil detach "${BASELINE_DISK}"

          chmod 0444 "${RAW}"
          test ! -w "${RAW}"
          META_BEFORE="$(stat -f '%z:%m:%p' "${RAW}")"
          SHA_BEFORE="$(shasum -a 256 "${RAW}" | awk '{print $1}')"
          test "${SHA_BEFORE}" = "${RAW_SHA}"

          echo "RAW=${RAW}" >> "${GITHUB_ENV}"
          echo "EXPECTED_RAW_SIZE=${RAW_SIZE}" >> "${GITHUB_ENV}"
          echo "BACKING_SHA_BEFORE=${SHA_BEFORE}" >> "${GITHUB_ENV}"
          echo "BACKING_META_BEFORE=${META_BEFORE}" >> "${GITHUB_ENV}"
          echo "SENTINEL=${SENTINEL}" >> "${GITHUB_ENV}"
          echo 'RESULT=F0_RAW_APPLE_FS_FIXTURE_READY'

      - name: Stage only official signed FUSE-T FSKit app
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/fuse-t-${FUSET_VERSION}.pkg"
          EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl --fail --location --retry 3 --silent --show-error "${FUSET_PKG_URL}" -o "${PKG}"
          ACTUAL="$(shasum -a 256 "${PKG}" | awk '{print $1}')"
          test "${ACTUAL}" = "${FUSET_PKG_SHA256}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"
          SOURCE_APP="$(find "${EXPANDED}" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"
          test -n "${SOURCE_APP}"
          codesign --verify --deep --strict --verbose=2 "${SOURCE_APP}"
          sudo rm -rf /Applications/fuse-t.app
          sudo ditto "${SOURCE_APP}" /Applications/fuse-t.app
          APP=/Applications/fuse-t.app
          EXT="${APP}/Contents/Extensions/FskitSrvModule.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "${APP}"
          pluginkit -a "${EXT}" || true
          pluginkit -a "${APP}" || true
          pluginkit -e use -i "${FUSET_BUNDLE_ID}" || true
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/pluginkit.txt" || true
          grep -Fq "${FUSET_BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit.txt"

      - name: Enable FUSE-T FSKit module on disposable runner
        run: |
          set -euo pipefail
          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"
          ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${FUSET_BUNDLE_ID}" <<'PY'
          import os, plistlib, sys
          path, bundle_id = sys.argv[1:]
          enabled = []
          if os.path.exists(path):
              try:
                  with open(path, 'rb') as f:
                      value = plistlib.load(f)
                  if isinstance(value, list):
                      enabled = [x for x in value if isinstance(x, str)]
              except Exception:
                  pass
          if bundle_id not in enabled:
              enabled.append(bundle_id)
          with open(path, 'wb') as f:
              plistlib.dump(enabled, f, fmt=plistlib.FMT_XML, sort_keys=False)
          print(enabled)
          PY
          chmod 600 "${ENABLED_PLIST}"
          plutil -lint "${ENABLED_PLIST}"
          plutil -p "${ENABLED_PLIST}" | tee "${RUNNER_TEMP}/enabled-state.txt"
          grep -Fq "${FUSET_BUNDLE_ID}" "${ENABLED_PLIST}"
          killall -9 fskit_agent 2>/dev/null || true
          killall -9 extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3

      - name: Compile native minimal bridge and assert type agnosticism
        run: |
          set -euo pipefail
          SOURCE=native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift
          xcrun swiftc -swift-version 6 -warnings-as-errors "${SOURCE}" -o "${RUNNER_TEMP}/FuseTMinimalBridge"
          test -x "${RUNNER_TEMP}/FuseTMinimalBridge"

          # Runtime bridge must not know the fixture's filesystem personality.
          if grep -Eiq 'HFS\+|Apple_HFS|APFS|ExFAT|MSDOS|FAT32|NTFS' "${SOURCE}"; then
            echo 'unexpected filesystem-type knowledge in transport bridge' >&2
            exit 1
          fi
          echo 'RESULT=F2_BRIDGE_HAS_NO_FILESYSTEM_TYPE_KNOWLEDGE'

      - name: F1-F5 Apple filesystem auto-detection over hidden volume.raw
        run: |
          set -euo pipefail
          HIDDEN="${RUNNER_TEMP}/edp-applefs-hidden-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          BRIDGE_LOG="${RUNNER_TEMP}/applefs-bridge.log"
          mkdir -p "${HIDDEN}"
          echo "HIDDEN=${HIDDEN}" >> "${GITHUB_ENV}"
          echo "BRIDGE_LOG=${BRIDGE_LOG}" >> "${GITHUB_ENV}"

          "${RUNNER_TEMP}/FuseTMinimalBridge" \
            --backing "${RAW}" \
            --mountpoint "${HIDDEN}" \
            --volume-name 'EDP Hidden Raw Transport' \
            >"${BRIDGE_LOG}" 2>&1 &
          BRIDGE_PID=$!
          echo "BRIDGE_PID=${BRIDGE_PID}" >> "${GITHUB_ENV}"

          for attempt in $(seq 1 25); do
            if mount | grep -Fq " on ${HIDDEN} "; then break; fi
            kill -0 "${BRIDGE_PID}" 2>/dev/null
            sleep 1
          done
          mount | grep -F " on ${HIDDEN} " | tee "${RUNNER_TEMP}/hidden-mount.txt"
          grep -Eiq 'fuse-t|fuset' "${RUNNER_TEMP}/hidden-mount.txt"

          EXPOSED="${HIDDEN}/volume.raw"
          test -f "${EXPOSED}"
          test "$(stat -f %z "${EXPOSED}")" = "${EXPECTED_RAW_SIZE}"

          # Deliberately no filesystem type hint: DiskImages + Disk Arbitration
          # must inspect the raw bytes and select the Apple filesystem stack.
          ATTACH_OUT="$(hdiutil attach -readonly -imagekey diskimage-class=CRawDiskImage "${EXPOSED}" 2>"${RUNNER_TEMP}/applefs-hdiutil.err")"
          printf '%s\n' "${ATTACH_OUT}" | tee "${RUNNER_TEMP}/applefs-attach.txt"
          cat "${RUNNER_TEMP}/applefs-hdiutil.err" || true
          FINAL_DISK="$(printf '%s\n' "${ATTACH_OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          FINAL_MOUNT="$(printf '%s\n' "${ATTACH_OUT}" | awk -v v="${VOLNAME}" '$0 ~ ("/Volumes/" v) {print $NF; exit}')"
          test -n "${FINAL_DISK}"

          if [[ -z "${FINAL_MOUNT}" ]]; then
            for attempt in $(seq 1 15); do
              if [[ -d "/Volumes/${VOLNAME}" ]]; then FINAL_MOUNT="/Volumes/${VOLNAME}"; break; fi
              sleep 1
            done
          fi
          test -d "${FINAL_MOUNT}"
          echo "FINAL_DISK=${FINAL_DISK}" >> "${GITHUB_ENV}"
          echo "FINAL_MOUNT=${FINAL_MOUNT}" >> "${GITHUB_ENV}"

          test "$(cat "${FINAL_MOUNT}/EDP_SENTINEL.txt")" = "${SENTINEL}"
          test "$(cat "${FINAL_MOUNT}/EDP Folder/NESTED.txt")" = 'nested-file-visible'
          echo 'RESULT=F1_DISK_ARBITRATION_AUTO_MOUNT_AND_SENTINEL_OK'
          echo 'RESULT=F2_NO_FILESYSTEM_TYPE_HINT_AT_RUNTIME'

          diskutil info "${FINAL_DISK}" | tee "${RUNNER_TEMP}/final-diskutil.txt"
          MOUNT_LINE="$(mount | grep -F " on ${FINAL_MOUNT} " | head -n 1)"
          printf '%s\n' "${MOUNT_LINE}" | tee "${RUNNER_TEMP}/final-mount.txt"

          grep -Eq 'Media Read-Only:[[:space:]]+Yes' "${RUNNER_TEMP}/final-diskutil.txt"
          grep -Eq 'Volume Read-Only:[[:space:]]+Yes' "${RUNNER_TEMP}/final-diskutil.txt"
          printf '%s\n' "${MOUNT_LINE}" | grep -Eiq 'read-only|rdonly'
          set +e
          touch "${FINAL_MOUNT}/SHOULD_NOT_WRITE" 2>"${RUNNER_TEMP}/readonly-write.err"
          WRITE_RC=$?
          set -e
          test "${WRITE_RC}" -ne 0
          test ! -e "${FINAL_MOUNT}/SHOULD_NOT_WRITE"
          echo 'RESULT=F3_FINAL_MOUNT_READ_ONLY'

          # POSIX browsing is mandatory. Finder automation is attempted as an
          # additional CI signal; a hosted-runner AppleEvents/TCC denial is
          # recorded separately rather than misclassified as a filesystem bug.
          find "${FINAL_MOUNT}" -maxdepth 2 -print | tee "${RUNNER_TEMP}/final-find.txt"
          FINDER_ENUM_OK=false
          set +e
          osascript - "${FINAL_MOUNT}" >"${RUNNER_TEMP}/finder-enum.txt" 2>"${RUNNER_TEMP}/finder-enum.err" <<'OSA'
          on run argv
              set p to item 1 of argv
              tell application "Finder"
                  set namesList to name of every item of folder (POSIX file p as alias)
              end tell
              return namesList as string
          end run
          OSA_RC=$?
          set -e
          if [[ ${OSA_RC} -eq 0 ]] && grep -Fq 'EDP_SENTINEL.txt' "${RUNNER_TEMP}/finder-enum.txt"; then
            FINDER_ENUM_OK=true
            echo 'RESULT=F4_FINDER_ENUMERATION_OK'
          else
            echo "RESULT=F4_FINDER_AUTOMATION_UNAVAILABLE:rc=${OSA_RC}"
            cat "${RUNNER_TEMP}/finder-enum.err" || true
          fi
          echo "FINDER_ENUM_OK=${FINDER_ENUM_OK}" >> "${GITHUB_ENV}"

          if printf '%s\n' "${MOUNT_LINE}" | grep -Eiq 'fuse-t|fuset'; then
            echo 'final user-visible filesystem unexpectedly mounted as FUSE-T' >&2
            exit 1
          fi
          grep -Eiq 'File System Personality:|Type \(Bundle\):|File System:' "${RUNNER_TEMP}/final-diskutil.txt"
          echo 'RESULT=F5_FINAL_FILESYSTEM_IS_NOT_FUSET'

          hdiutil detach "${FINAL_DISK}" -force
          echo 'FINAL_DISK=' >> "${GITHUB_ENV}"

          SHA_AFTER="$(shasum -a 256 "${RAW}" | awk '{print $1}')"
          META_AFTER="$(stat -f '%z:%m:%p' "${RAW}")"
          echo "BACKING_SHA_AFTER=${SHA_AFTER}" >> "${GITHUB_ENV}"
          echo "BACKING_META_AFTER=${META_AFTER}" >> "${GITHUB_ENV}"
          test "${SHA_AFTER}" = "${BACKING_SHA_BEFORE}"
          test "${META_AFTER}" = "${BACKING_META_BEFORE}"
          echo 'RESULT=F_BACKING_UNCHANGED_AFTER_APPLE_FS_MOUNT'

      - name: Collect Phase F evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${DIAG_PATH}")"
          {
            echo '# FUSE-T minimal bridge -> Apple filesystem macOS 26 CI'
            echo
            echo 'generated_at_utc=<normalized>'
            echo "runner_os=$(sw_vers -productVersion)"
            echo "runner_build=$(sw_vers -buildVersion)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "raw_size=${EXPECTED_RAW_SIZE:-unknown}"
            echo "backing_sha_before=${BACKING_SHA_BEFORE:-unknown}"
            echo "backing_sha_after=${BACKING_SHA_AFTER:-unknown}"
            echo "backing_meta_before=${BACKING_META_BEFORE:-unknown}"
            echo "backing_meta_after=${BACKING_META_AFTER:-unknown}"
            echo "final_mount=${FINAL_MOUNT:-none}"
            echo "finder_enum_ok=${FINDER_ENUM_OK:-unknown}"
            echo
            echo '## baseline raw diskutil'
            cat "${RUNNER_TEMP}/baseline-diskutil.txt" 2>/dev/null || true
            echo
            echo '## hidden transport mount'
            cat "${RUNNER_TEMP}/hidden-mount.txt" 2>/dev/null || true
            echo
            echo '## hdiutil attach'
            cat "${RUNNER_TEMP}/applefs-attach.txt" 2>/dev/null || true
            cat "${RUNNER_TEMP}/applefs-hdiutil.err" 2>/dev/null || true
            echo
            echo '## final diskutil'
            cat "${RUNNER_TEMP}/final-diskutil.txt" 2>/dev/null || true
            echo
            echo '## final mount'
            cat "${RUNNER_TEMP}/final-mount.txt" 2>/dev/null || true
            echo
            echo '## final POSIX listing'
            cat "${RUNNER_TEMP}/final-find.txt" 2>/dev/null || true
            echo
            echo '## Finder enumeration'
            cat "${RUNNER_TEMP}/finder-enum.txt" 2>/dev/null || true
            cat "${RUNNER_TEMP}/finder-enum.err" 2>/dev/null || true
            echo
            echo '## read-only write attempt'
            cat "${RUNNER_TEMP}/readonly-write.err" 2>/dev/null || true
            echo
            echo '## bridge log'
            cat "${BRIDGE_LOG:-/dev/null}" 2>/dev/null || true
          } > "${DIAG_PATH}"
          sed -n '1,520p' "${DIAG_PATH}"

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [[ -n "${FINAL_DISK:-}" ]]; then hdiutil detach "${FINAL_DISK}" -force; fi
          if [[ -n "${HIDDEN:-}" ]]; then /sbin/umount "${HIDDEN}"; fi
          if [[ -n "${BRIDGE_PID:-}" ]]; then kill "${BRIDGE_PID}" 2>/dev/null; fi
          sudo rm -rf /Applications/fuse-t.app
          exit 0

      - name: Commit deterministic Phase F diagnostic
        if: always() && github.ref_name == 'test/fuset-minimal-fskit-bridge'
        run: |
          set -euo pipefail
          test -f "${DIAG_PATH}"
          git add "${DIAG_PATH}"
          if git diff --cached --quiet -- "${DIAG_PATH}"; then
            echo 'RESULT=APPLEFS_DIAGNOSTIC_UNCHANGED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: capture FUSE-T Apple FS probe [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
