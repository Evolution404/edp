name: EDP Transport Provider Switch Contract

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "product/EDPTransportProvider.swift"
      - ".github/workflows/transport-provider-switch-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch-contract:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Compile transport abstraction
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/TransportProbe.swift" <<'SWIFT'
          import Foundation

          @main enum TransportProbe {
              static func main() throws {
                  let request = EDPTransportRequest(
                      binaryRoot: "/opt/edp/bin",
                      rawDevice: "/dev/rdisk9",
                      rawFD: 3,
                      vid: "21c4",
                      pid: "0cd1",
                      deviceSize: 124736503808,
                      partitionType: 2,
                      controlFD: 0,
                      mountpoint: "/Volumes/.edp-switch-contract",
                      volumeName: "EDP Exchange Transport",
                      readOnly: false
                  )

                  for backend in EDPTransportBackend.allCases {
                      let spec = try EDPTransportProvider.launchSpec(
                          for: backend,
                          request: request,
                          requireFinderHidden: false
                      )
                      print("BACKEND=\(backend.rawValue)")
                      print("EXEC=\(spec.executable)")
                      print("ARGS=\(spec.arguments.joined(separator: "|"))")
                      print("HIDDEN=\(spec.capabilities.finderHidden ? 1 : 0)")
                      print("WRITABLE=\(spec.capabilities.writable ? 1 : 0)")
                      print("DISKIMAGES=\(spec.capabilities.diskImagesCompatible ? 1 : 0)")
                      print("LOCAL=\(spec.capabilities.localVolume ? 1 : 0)")
                      print("MFMOUNT_OPTIONS=\(spec.environment["EDP_MFMOUNT_OPTIONS"] ?? "<none>")")
                  }

                  let selectedFuseT = try EDPTransportProvider.selectedBackend(
                      environment: [EDPTransportProvider.environmentKey: "fuset"]
                  )
                  let selectedLocal = try EDPTransportProvider.selectedBackend(
                      environment: [EDPTransportProvider.environmentKey: "macfuse-local"]
                  )
                  let selectedDefault = try EDPTransportProvider.selectedBackend(environment: [:])
                  print("SELECT_FUSET=\(selectedFuseT.rawValue)")
                  print("SELECT_LOCAL=\(selectedLocal.rawValue)")
                  print("SELECT_DEFAULT=\(selectedDefault.rawValue)")

                  do {
                      _ = try EDPTransportProvider.launchSpec(
                          for: .fuseT,
                          request: request,
                          requireFinderHidden: true
                      )
                      fatalError("FUSE-T must fail closed when Finder-hidden transport is required")
                  } catch EDPTransportSelectionError.backendCannotHideTransport(.fuseT) {
                      print("FUSET_PRODUCT_FAIL_CLOSED=1")
                  }

                  let localProduct = try EDPTransportProvider.launchSpec(
                      for: .macFUSELocal,
                      request: request,
                      requireFinderHidden: true
                  )
                  precondition(localProduct.capabilities.finderHidden)
                  print("LOCAL_PRODUCT_ACCEPTED=1")
              }
          }
          SWIFT
          xcrun swiftc -swift-version 6 -parse-as-library -warnings-as-errors \
            product/EDPTransportProvider.swift "${RUNNER_TEMP}/TransportProbe.swift" \
            -o "${RUNNER_TEMP}/transport-probe"
          "${RUNNER_TEMP}/transport-probe" | tee "${RUNNER_TEMP}/transport.txt"

      - name: Verify both backend launch models
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/transport.txt"
          grep -Fq 'BACKEND=fuset' "${OUT}"
          grep -Fq 'EXEC=/opt/edp/bin/edp-fuset-readwrite' "${OUT}"
          grep -Fq 'BACKEND=macfuse-local' "${OUT}"
          grep -Fq 'EXEC=/opt/edp/bin/edp-mfmount-local-readwrite' "${OUT}"
          grep -Fq 'MFMOUNT_OPTIONS=local,nobrowse' "${OUT}"
          grep -Fq 'SELECT_FUSET=fuset' "${OUT}"
          grep -Fq 'SELECT_LOCAL=macfuse-local' "${OUT}"
          grep -Fq 'SELECT_DEFAULT=macfuse-local' "${OUT}"
          grep -Fq 'FUSET_PRODUCT_FAIL_CLOSED=1' "${OUT}"
          grep -Fq 'LOCAL_PRODUCT_ACCEPTED=1' "${OUT}"
          grep -Fq -- '--raw-device|/dev/rdisk9|--raw-fd|3' "${OUT}"
          grep -Fq -- '--partition-type|2|--control-fd|0' "${OUT}"
          echo 'RESULT=TRANSPORT_PROVIDER_SWITCH_CONTRACT_OK'
