name: Direct MFMount Internal Unmount Matrix

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountEDPFixtureAdapter.c"
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountAsyncShim.c"
      - ".github/workflows/direct-mfmount-internal-unmount-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-mfmount-internal-unmount-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - version: "5.3.2"
            sha256: "9328a8cd0b893b4347097270d6605408630dd764ddca275256959dc0e9a07936"
          - version: "5.3.3"
            sha256: "7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15"
    steps:
      - uses: actions/checkout@v6
      - name: Install and enable macFUSE ${{ matrix.runtime.version }}
        run: |
          set -euo pipefail
          VERSION='${{ matrix.runtime.version }}'
          DMG="${RUNNER_TEMP}/macfuse.dmg"
          curl -fsSL --retry 3 "https://github.com/macfuse/macfuse/releases/download/macfuse-${VERSION}/macfuse-${VERSION}.dmg" -o "${DMG}"
          test "$(shasum -a 256 "${DMG}" | awk '{print $1}')" = '${{ matrix.runtime.sha256 }}'
          ATTACH="$(hdiutil attach -nobrowse -readonly "${DMG}")"
          VOL="$(printf '%s\n' "${ATTACH}" | awk -F '\t' '/\/Volumes\// {print $NF; exit}')"
          PKG="$(find "${VOL}" -maxdepth 2 \( -type f -o -type d \) -name '*.pkg' -print -quit)"
          sudo installer -pkg "${PKG}" -target /
          hdiutil detach "${VOL}" >/dev/null
          APP=/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app
          LS=/System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister
          "${LS}" -f -R -trusted "${APP}"
          while IFS= read -r EXT; do pluginkit -a "${EXT}" || true; done < <(find "${APP}/Contents" -maxdepth 5 -type d -name '*.appex' -print)
          pluginkit -a "${APP}" || true
          for ID in io.macfuse.app.fsmodule.macfuse io.macfuse.app.fsmodule.macfuse-local; do pluginkit -e use -i "${ID}" || true; done
          SETTINGS="${HOME}/Library/Group Containers/group.com.apple.fskit.settings/enabledModules.plist"
          mkdir -p "$(dirname "${SETTINGS}")"
          python3 - "${SETTINGS}" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],'wb') as f: plistlib.dump(['io.macfuse.app.fsmodule.macfuse','io.macfuse.app.fsmodule.macfuse-local'],f)
          PY
          killall -9 fskit_agent extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3
      - name: Build encrypted Direct Local fixture
        run: |
          set -euo pipefail
          FRAMEWORKS=/Library/Filesystems/macfuse.fs/Contents/Frameworks
          INC="${RUNNER_TEMP}/include"; SRC="${RUNNER_TEMP}/src"
          mkdir -p "${INC}/MFMount" "${SRC}"
          curl -fsSL https://raw.githubusercontent.com/macfuse/mount/313b9c68d04cd779bffc9f8bd9f32a4e1f5baf70/Mount/MFMount.h -o "${INC}/MFMount/MFMount.h"
          curl -fsSL https://raw.githubusercontent.com/macfuse/library/9a3db24bf7e3896d69a514a70e91dc41eefb948b/include/fuse_kernel.h -o "${INC}/fuse_kernel.h"
          cp native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c "${SRC}/DirectMFMountRawTransport.c"
          cp native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountEDPFixtureAdapter.c "${SRC}/DirectMFMountEDPFixtureAdapter.c"
          python3 - "${SRC}/DirectMFMountRawTransport.c" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); old='"nobrowse,volname=%s"'; assert old in s; p.write_text(s.replace(old,'"local,nobrowse,volname=%s"',1))
          PY
          xcrun clang -std=c17 -Wall -Wextra -Werror -I"${INC}" -I"${SRC}" -F"${FRAMEWORKS}" -DMFMount=EDPAsyncMFMount -c "${SRC}/DirectMFMountEDPFixtureAdapter.c" -o "${RUNNER_TEMP}/adapter.o"
          xcrun clang -std=c17 -Wall -Wextra -Werror -I"${INC}" -F"${FRAMEWORKS}" -c native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountAsyncShim.c -o "${RUNNER_TEMP}/shim.o"
          CORE=(
            native/EDPFSKitPoC/Extension/EDPRawIO.swift
            native/EDPFSKitPoC/Extension/EDPCrypto.swift
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift
            native/EDPFSKitPoC/Extension/EDPBlockDevice.swift
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift
            native/EDPFSKitPoC/Tools/EDPReadWriteBlockCBridge.swift
          )
          xcrun swiftc -parse-as-library -O -swift-version 6 -warnings-as-errors "${CORE[@]}" "${RUNNER_TEMP}/adapter.o" "${RUNNER_TEMP}/shim.o" -F"${FRAMEWORKS}" -Xlinker -rpath -Xlinker "${FRAMEWORKS}" -framework MFMount -framework CoreFoundation -framework DiskArbitration -o "${RUNNER_TEMP}/bridge"
      - name: Prove system-volume unmount and remount persistence
        run: |
          set -euo pipefail
          VERSION='${{ matrix.runtime.version }}'
          CIPHER="${RUNNER_TEMP}/cipher.raw"; KEY=00112233445566778899aabbccddeeff
          MP="/Volumes/EDP-Internal-${VERSION}-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          dd if=/dev/zero of="${CIPHER}" bs=1m count=16 status=none
          sudo mkdir -p "${MP}"; sudo chown "$(id -u):$(id -g)" "${MP}"
          echo "${MP}" >"${RUNNER_TEMP}/mp"
          start() {
            : >"${RUNNER_TEMP}/server.log"
            "${RUNNER_TEMP}/bridge" "${CIPHER}" "${KEY}" "${MP}" "EDP Internal ${VERSION}" >"${RUNNER_TEMP}/server.log" 2>&1 &
            echo $! >"${RUNNER_TEMP}/pid"
            for _ in $(seq 1 30); do mount | grep -Fq " on ${MP} " && return 0; kill -0 "$(cat "${RUNNER_TEMP}/pid")" 2>/dev/null || break; sleep 1; done
            cat "${RUNNER_TEMP}/server.log" >&2 || true; return 1
          }
          stop() {
            P="$(cat "${RUNNER_TEMP}/pid")"
            kill -TERM "${P}"
            MOUNT_GONE=0
            EXITED=0
            for _ in $(seq 1 40); do
              if ! mount | grep -Fq " on ${MP} "; then MOUNT_GONE=1; break; fi
              if ! kill -0 "${P}" 2>/dev/null; then EXITED=1; fi
              sleep 1
            done
            if [[ "${MOUNT_GONE}" -ne 1 ]]; then
              echo "MOUNT_TABLE_STILL_PRESENT=1"
              mount | grep -F " on ${MP} " || true
              cat "${RUNNER_TEMP}/server.log" || true
              return 1
            fi
            for _ in $(seq 1 10); do
              if ! kill -0 "${P}" 2>/dev/null; then EXITED=1; break; fi
              sleep 1
            done
            if [[ "${EXITED}" != 1 ]]; then
              echo "SERVER_STILL_RUNNING_AFTER_UNMOUNT=1"
              cat "${RUNNER_TEMP}/server.log" || true
              return 1
            fi
            wait "${P}" || PRC=$?; PRC="${PRC:-0}"
            cat "${RUNNER_TEMP}/server.log" || true
            test "${PRC}" -eq 0
            grep -Eq 'DIRECT_MFMOUNT_SOURCE=/dev/disk[0-9]+' "${RUNNER_TEMP}/server.log"
            grep -Fq 'DIRECT_MFMOUNT_DA_VOLUME_MATCH=1' "${RUNNER_TEMP}/server.log"
            grep -Fq 'DIRECT_MFMOUNT_DA_UNMOUNT_REQUESTED=1' "${RUNNER_TEMP}/server.log"
            grep -Fq 'DIRECT_MFMOUNT_DA_DEACTIVATION_STATUS=0' "${RUNNER_TEMP}/server.log"
            grep -Fq 'DIRECT_MFMOUNT_CHANNEL_CLOSE_RESULT=1 errno=0' "${RUNNER_TEMP}/server.log"
            grep -Fq 'DIRECT_MFMOUNT_MOUNT_TABLE_GONE=1' "${RUNNER_TEMP}/server.log"
            grep -Fq 'DIRECT_MFMOUNT_TEARDOWN_COMPLETE=1' "${RUNNER_TEMP}/server.log"
            grep -Fq 'DIRECT_MFMOUNT_EXIT=0' "${RUNNER_TEMP}/server.log"
            echo "SOURCE_DADISK_UNMOUNT_OK=1"
          }
          start
          MARKER="EDP-INTERNAL-${VERSION}-PERSIST"; OFFSET=1048579
          printf '%s' "${MARKER}" | dd of="${MP}/volume.raw" bs=1 seek="${OFFSET}" conv=notrunc status=none
          sync
          test "$(dd if="${MP}/volume.raw" bs=1 skip="${OFFSET}" count="${#MARKER}" status=none)" = "${MARKER}"
          stop
          start
          test "$(dd if="${MP}/volume.raw" bs=1 skip="${OFFSET}" count="${#MARKER}" status=none)" = "${MARKER}"
          stop
          echo "RESULT=DIRECT_SYSTEM_UNMOUNT_REMOUNT_${VERSION//./_}_PASS"
      - name: Cleanup
        if: always()
        run: |
          set +e
          [[ -f "${RUNNER_TEMP}/pid" ]] && kill -9 "$(cat "${RUNNER_TEMP}/pid")" 2>/dev/null || true
          if [[ -f "${RUNNER_TEMP}/mp" ]]; then MP="$(cat "${RUNNER_TEMP}/mp")"; sudo rmdir "${MP}" 2>/dev/null || true; fi
          exit 0
