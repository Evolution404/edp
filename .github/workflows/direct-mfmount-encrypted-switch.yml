name: Direct MFMount Encrypted Local Transport

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c"
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountAsyncShim.c"
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountEDPFixtureAdapter.c"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteBlockCBridge.swift"
      - "native/EDPFSKitPoC/Extension/**"
      - ".github/workflows/direct-mfmount-encrypted-switch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-mfmount-encrypted-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encrypted-local:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      MACFUSE_DMG_SHA256: "7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15"
      MACFUSE_DMG_URL: "https://github.com/macfuse/macfuse/releases/download/macfuse-5.3.3/macfuse-5.3.3.dmg"
      GENERIC_ID: "io.macfuse.app.fsmodule.macfuse"
      LOCAL_ID: "io.macfuse.app.fsmodule.macfuse-local"
      MOUNT_COMMIT: "313b9c68d04cd779bffc9f8bd9f32a4e1f5baf70"
      LIBRARY3_COMMIT: "9a3db24bf7e3896d69a514a70e91dc41eefb948b"

    steps:
      - uses: actions/checkout@v6

      - name: Install and enable official macFUSE FSKit runtime
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          DMG="${RUNNER_TEMP}/macfuse.dmg"
          curl -fsSL --retry 3 "${MACFUSE_DMG_URL}" -o "${DMG}"
          test "$(shasum -a 256 "${DMG}" | awk '{print $1}')" = "${MACFUSE_DMG_SHA256}"
          ATTACH="$(hdiutil attach -nobrowse -readonly "${DMG}")"
          VOL="$(printf '%s\n' "${ATTACH}" | awk -F '\t' '/\/Volumes\// {print $NF; exit}')"
          PKG="$(find "${VOL}" -maxdepth 2 \( -type f -o -type d \) -name '*.pkg' -print -quit)"
          pkgutil --check-signature "${PKG}"
          sudo installer -pkg "${PKG}" -target /
          hdiutil detach "${VOL}" >/dev/null

          APP="/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app"
          LSREGISTER="/System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister"
          "${LSREGISTER}" -f -R -trusted "${APP}"
          while IFS= read -r EXT; do pluginkit -a "${EXT}" || true; done < <(find "${APP}/Contents" -maxdepth 5 -type d -name '*.appex' -print)
          pluginkit -a "${APP}" || true
          pluginkit -e use -i "${GENERIC_ID}" || true
          pluginkit -e use -i "${LOCAL_ID}" || true
          SETTINGS="${HOME}/Library/Group Containers/group.com.apple.fskit.settings/enabledModules.plist"
          mkdir -p "$(dirname "${SETTINGS}")"
          python3 - "${SETTINGS}" "${GENERIC_ID}" "${LOCAL_ID}" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'wb') as f:
              plistlib.dump(sys.argv[2:], f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          chmod 600 "${SETTINGS}"
          killall -9 fskit_agent extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/plugins.txt" || true
          grep -Fq "+    ${LOCAL_ID}" "${RUNNER_TEMP}/plugins.txt"

      - name: Build encrypted Direct MFMount Local binary without libfuse
        run: |
          set -euo pipefail
          FRAMEWORKS="/Library/Filesystems/macfuse.fs/Contents/Frameworks"
          INC="${RUNNER_TEMP}/include"
          SRC="${RUNNER_TEMP}/direct-src"
          mkdir -p "${INC}/MFMount" "${SRC}"
          curl -fsSL "https://raw.githubusercontent.com/macfuse/mount/${MOUNT_COMMIT}/Mount/MFMount.h" -o "${INC}/MFMount/MFMount.h"
          curl -fsSL "https://raw.githubusercontent.com/macfuse/library/${LIBRARY3_COMMIT}/include/fuse_kernel.h" -o "${INC}/fuse_kernel.h"
          cp native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c "${SRC}/DirectMFMountRawTransport.c"
          cp native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountEDPFixtureAdapter.c "${SRC}/DirectMFMountEDPFixtureAdapter.c"
          python3 - "${SRC}/DirectMFMountRawTransport.c" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); old='"nobrowse,volname=%s"'; assert old in s
          p.write_text(s.replace(old,'"local,nobrowse,volname=%s"',1))
          PY

          xcrun clang -std=c17 -Wall -Wextra -Werror -I"${INC}" -I"${SRC}" -F"${FRAMEWORKS}" \
            -DMFMount=EDPAsyncMFMount -c "${SRC}/DirectMFMountEDPFixtureAdapter.c" -o "${RUNNER_TEMP}/adapter.o"
          xcrun clang -std=c17 -Wall -Wextra -Werror -I"${INC}" -F"${FRAMEWORKS}" \
            -c native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountAsyncShim.c -o "${RUNNER_TEMP}/shim.o"

          CORE=(
            native/EDPFSKitPoC/Extension/EDPRawIO.swift
            native/EDPFSKitPoC/Extension/EDPCrypto.swift
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift
            native/EDPFSKitPoC/Extension/EDPBlockDevice.swift
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift
            native/EDPFSKitPoC/Tools/EDPReadWriteBlockCBridge.swift
          )
          xcrun swiftc -parse-as-library -O -swift-version 6 -warnings-as-errors \
            "${CORE[@]}" "${RUNNER_TEMP}/adapter.o" "${RUNNER_TEMP}/shim.o" \
            -F"${FRAMEWORKS}" -Xlinker -rpath -Xlinker "${FRAMEWORKS}" \
            -framework MFMount -framework CoreFoundation \
            -o "${RUNNER_TEMP}/edp-mfmount-local-fixture"
          otool -L "${RUNNER_TEMP}/edp-mfmount-local-fixture" | tee "${RUNNER_TEMP}/otool.txt"
          grep -Fq 'MFMount.framework' "${RUNNER_TEMP}/otool.txt"
          ! grep -Eiq 'libfuse|libosxfuse|libmacfuse' "${RUNNER_TEMP}/otool.txt"
          echo 'RESULT=DIRECT_ENCRYPTED_LOCAL_NO_LIBFUSE=1'

      - name: Exercise encrypted write, persistence and DiskImages2
        run: |
          set -euo pipefail
          CIPHER="${RUNNER_TEMP}/cipher.raw"
          KEY="00112233445566778899aabbccddeeff"
          MP="/Volumes/.edp-direct-encrypted-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          dd if=/dev/zero of="${CIPHER}" bs=1m count=32 status=none
          sudo mkdir -p "${MP}" && sudo chown "$(id -u):$(id -g)" "${MP}"
          echo "${MP}" > "${RUNNER_TEMP}/mp"

          start_bridge() {
            : >"${RUNNER_TEMP}/bridge.log"
            "${RUNNER_TEMP}/edp-mfmount-local-fixture" "${CIPHER}" "${KEY}" "${MP}" "EDP Direct Encrypted Local" \
              >"${RUNNER_TEMP}/bridge.log" 2>&1 &
            echo $! > "${RUNNER_TEMP}/pid"
            for _ in $(seq 1 30); do
              mount | grep -Fq " on ${MP} " && return 0
              kill -0 "$(cat "${RUNNER_TEMP}/pid")" 2>/dev/null || break
              sleep 1
            done
            cat "${RUNNER_TEMP}/bridge.log" >&2 || true
            return 1
          }
          stop_bridge() {
            local P
            P="$(cat "${RUNNER_TEMP}/pid")"
            if mount | grep -Fq " on ${MP} "; then
              echo 'DIRECT_LIFECYCLE_UNMOUNT_REQUESTED=1'
              set +e
              perl -e 'alarm shift; exec @ARGV' 20 diskutil unmount force "${MP}" \
                >"${RUNNER_TEMP}/unmount.txt" 2>&1
              URC=$?
              set -e
              cat "${RUNNER_TEMP}/unmount.txt" || true
              test "${URC}" -eq 0
            fi
            for _ in $(seq 1 20); do
              mount | grep -Fq " on ${MP} " || break
              sleep 1
            done
            ! mount | grep -Fq " on ${MP} "
            echo 'DIRECT_LIFECYCLE_VFS_UNMOUNTED=1'
            for _ in $(seq 1 10); do
              kill -0 "${P}" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "${P}" 2>/dev/null; then
              kill "${P}" 2>/dev/null || true
              for _ in $(seq 1 5); do kill -0 "${P}" 2>/dev/null || break; sleep 1; done
            fi
            kill -9 "${P}" 2>/dev/null || true
          }

          start_bridge
          LINE="$(mount | grep -F " on ${MP} ")"
          echo "DIRECT_ENCRYPTED_MOUNT=${LINE}"
          echo "${LINE}" | grep -Fq 'fskit'
          echo "${LINE}" | grep -Fq 'local'
          test -f "${MP}/volume.raw"

          MARKER='EDP-DIRECT-ENCRYPTED-RW-PERSIST'
          OFFSET=1048579
          printf '%s' "${MARKER}" | dd of="${MP}/volume.raw" bs=1 seek="${OFFSET}" conv=notrunc status=none
          sync
          test "$(dd if="${MP}/volume.raw" bs=1 skip="${OFFSET}" count="${#MARKER}" status=none)" = "${MARKER}"
          CIPHER_HEX="$(dd if="${CIPHER}" bs=1 skip="${OFFSET}" count="${#MARKER}" status=none | xxd -p | tr -d '\n')"
          PLAIN_HEX="$(printf '%s' "${MARKER}" | xxd -p | tr -d '\n')"
          test "${CIPHER_HEX}" != "${PLAIN_HEX}"
          echo 'RESULT=DIRECT_ENCRYPTED_WRITE_THROUGH_CIPHERTEXT_DIFFERS=1'

          ATTACH="$(perl -e 'alarm shift; exec @ARGV' 30 hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${MP}/volume.raw")"
          DISK="$(printf '%s\n' "${ATTACH}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${DISK}"
          perl -e 'alarm shift; exec @ARGV' 20 hdiutil detach "${DISK}" -force >/dev/null
          echo 'RESULT=DIRECT_ENCRYPTED_DISKIMAGES2_ATTACH_OK=1'

          stop_bridge
          start_bridge
          test "$(dd if="${MP}/volume.raw" bs=1 skip="${OFFSET}" count="${#MARKER}" status=none)" = "${MARKER}"
          echo 'RESULT=DIRECT_ENCRYPTED_REMOUNT_PERSISTENCE_OK=1'
          echo 'RESULT=DIRECT_MFMOUNT_LOCAL_ENCRYPTED_TRANSPORT_PASS'
          stop_bridge

      - name: Cleanup
        if: always()
        run: |
          set +e
          cat "${RUNNER_TEMP}/bridge.log" 2>/dev/null || true
          if [[ -f "${RUNNER_TEMP}/mp" ]]; then
            MP="$(cat "${RUNNER_TEMP}/mp")"
            if mount | grep -Fq " on ${MP} "; then
              perl -e 'alarm shift; exec @ARGV' 10 diskutil unmount force "${MP}" >/dev/null 2>&1 || true
            fi
            sudo rmdir "${MP}" 2>/dev/null || true
          fi
          if [[ -f "${RUNNER_TEMP}/pid" ]]; then P="$(cat "${RUNNER_TEMP}/pid")"; kill "${P}" 2>/dev/null; sleep 1; kill -9 "${P}" 2>/dev/null; fi
          exit 0
