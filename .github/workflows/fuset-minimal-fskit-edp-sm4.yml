name: FUSE-T Minimal FSKit EDP SM4 E2E

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift"
      - "native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTEDPSM4Bridge.swift"
      - "native/EDPFSKitPoC/Extension/EDPRawIO.swift"
      - "native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift"
      - "native/EDPFSKitPoC/Extension/EDPCrypto.swift"
      - "native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift"
      - "native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift"
      - "native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift"
      - "native/EDPFSKitPoC/Tools/PrepareEncryptedDiskImage.swift"
      - ".github/workflows/fuset-minimal-fskit-edp-sm4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuset-minimal-fskit-edp-sm4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edp-sm4:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      FUSET_VERSION: "1.2.7"
      FUSET_PKG_SHA256: "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654"
      FUSET_PKG_URL: "https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.7/fuse-t-macos-installer-1.2.7.pkg"
      FUSET_BUNDLE_ID: "org.fuset.fskit-srv.module"
      SM4_KEY_HEX: "0123456789abcdeffedcba9876543210"
      VOLNAME: "EDP_SM4_FINAL"
      DIAG_PATH: "docs/diagnostics/fuset-edp-sm4-macos26-ci.txt"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify clean macOS 26 runtime
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test "$(xcodebuild -version | awk '/Xcode/ {print int($2); exit}')" -ge 26
          test ! -e /Library/Filesystems/macfuse.fs
          test ! -e /Library/Application\ Support/fuse-t
          test ! -e /usr/local/bin/go-nfsv4
          echo 'RESULT=G_RUNTIME_HAS_NO_MACFUSE_OR_FUSET_CORE'

      - name: Build populated raw filesystem oracle
        run: |
          set -euo pipefail
          TEMPLATE="${RUNNER_TEMP}/edp-sm4-template.dmg"
          PLAIN="${RUNNER_TEMP}/edp-sm4-plain.raw"
          SENTINEL='EDP-SM4-RANDOM-ACCESS-SENTINEL-v1'

          hdiutil create -size 64m -fs HFS+ -volname "${VOLNAME}" -layout NONE "${TEMPLATE}"
          OUT="$(hdiutil attach "${TEMPLATE}")"
          DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          MOUNT="$(printf '%s\n' "${OUT}" | awk -v v="${VOLNAME}" '$0 ~ ("/Volumes/" v) {print $NF; exit}')"
          test -n "${DISK}"
          test -d "${MOUNT}"
          printf '%s\n' "${SENTINEL}" > "${MOUNT}/EDP_SENTINEL.txt"
          mkdir -p "${MOUNT}/EDP Folder"
          python3 - "${MOUNT}/EDP Folder/payload.bin" <<'PY'
          import hashlib, sys
          path = sys.argv[1]
          with open(path, 'wb') as f:
              for block in range(2048):
                  seed = hashlib.sha256(f'EDP-SM4-PAYLOAD:{block}'.encode()).digest()
                  f.write(seed * 128)
          PY
          PAYLOAD_SHA="$(shasum -a 256 "${MOUNT}/EDP Folder/payload.bin" | awk '{print $1}')"
          sync
          hdiutil detach "${DISK}"

          RAW_OUT="$(hdiutil attach -nomount "${TEMPLATE}")"
          RAW_DISK="$(printf '%s\n' "${RAW_OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${RAW_DISK}"
          dd if="/dev/r$(basename "${RAW_DISK}")" of="${PLAIN}" bs=1048576 status=none
          hdiutil detach "${RAW_DISK}"
          test "$(stat -f %z "${PLAIN}")" -eq 67108864

          PLAIN_SHA="$(shasum -a 256 "${PLAIN}" | awk '{print $1}')"
          echo "PLAIN=${PLAIN}" >> "${GITHUB_ENV}"
          echo "PLAIN_SHA=${PLAIN_SHA}" >> "${GITHUB_ENV}"
          echo "PAYLOAD_SHA=${PAYLOAD_SHA}" >> "${GITHUB_ENV}"
          echo "SENTINEL=${SENTINEL}" >> "${GITHUB_ENV}"
          echo 'RESULT=G1_PLAINTEXT_ORACLE_READY'

      - name: Encrypt raw oracle with existing native SM4
        run: |
          set -euo pipefail
          ENCRYPT_BIN="${RUNNER_TEMP}/PrepareEncryptedDiskImage"
          CIPHER="${RUNNER_TEMP}/edp-sm4-cipher.raw"
          xcrun swiftc -O \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Tools/PrepareEncryptedDiskImage.swift \
            -o "${ENCRYPT_BIN}"
          "${ENCRYPT_BIN}" "${PLAIN}" "${CIPHER}" "${SM4_KEY_HEX}" | tee "${RUNNER_TEMP}/encrypt.log"
          test "$(stat -f %z "${CIPHER}")" -eq 67108864
          ! cmp -s "${PLAIN}" "${CIPHER}"
          chmod 0444 "${CIPHER}"
          test ! -w "${CIPHER}"
          CIPHER_SHA="$(shasum -a 256 "${CIPHER}" | awk '{print $1}')"
          CIPHER_META="$(stat -f '%z:%m:%p' "${CIPHER}")"
          echo "CIPHER=${CIPHER}" >> "${GITHUB_ENV}"
          echo "CIPHER_SHA_BEFORE=${CIPHER_SHA}" >> "${GITHUB_ENV}"
          echo "CIPHER_META_BEFORE=${CIPHER_META}" >> "${GITHUB_ENV}"
          echo 'RESULT=G1_OFFLINE_EDP_SM4_FIXTURE_READY'

      - name: Stage and enable only official signed FUSE-T FSKit app
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/fuse-t-${FUSET_VERSION}.pkg"
          EXPANDED="${RUNNER_TEMP}/fuse-t-expanded"
          curl --fail --location --retry 3 --silent --show-error "${FUSET_PKG_URL}" -o "${PKG}"
          test "$(shasum -a 256 "${PKG}" | awk '{print $1}')" = "${FUSET_PKG_SHA256}"
          pkgutil --expand-full "${PKG}" "${EXPANDED}"
          SOURCE_APP="$(find "${EXPANDED}" -type d -path '*fuse-t-fskit.pkg/Payload/Applications/fuse-t.app' -print -quit)"
          test -n "${SOURCE_APP}"
          codesign --verify --deep --strict --verbose=2 "${SOURCE_APP}"
          sudo rm -rf /Applications/fuse-t.app
          sudo ditto "${SOURCE_APP}" /Applications/fuse-t.app
          APP=/Applications/fuse-t.app
          EXT="${APP}/Contents/Extensions/FskitSrvModule.appex"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f -R -trusted "${APP}"
          pluginkit -a "${EXT}" || true
          pluginkit -a "${APP}" || true
          pluginkit -e use -i "${FUSET_BUNDLE_ID}" || true
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/pluginkit.txt" || true
          grep -Fq "${FUSET_BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit.txt"

          SETTINGS_DIR="${HOME}/Library/Group Containers/group.com.apple.fskit.settings"
          ENABLED_PLIST="${SETTINGS_DIR}/enabledModules.plist"
          mkdir -p "${SETTINGS_DIR}"
          python3 - "${ENABLED_PLIST}" "${FUSET_BUNDLE_ID}" <<'PY'
          import os, plistlib, sys
          path, bundle_id = sys.argv[1:]
          enabled = []
          if os.path.exists(path):
              try:
                  with open(path, 'rb') as f:
                      value = plistlib.load(f)
                  if isinstance(value, list):
                      enabled = [x for x in value if isinstance(x, str)]
              except Exception:
                  pass
          if bundle_id not in enabled:
              enabled.append(bundle_id)
          with open(path, 'wb') as f:
              plistlib.dump(enabled, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          chmod 600 "${ENABLED_PLIST}"
          plutil -lint "${ENABLED_PLIST}"
          grep -Fq "${FUSET_BUNDLE_ID}" "${ENABLED_PLIST}"
          killall -9 fskit_agent 2>/dev/null || true
          killall -9 extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3

      - name: Compile EDP SM4 bridge from existing native reader
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 6 -warnings-as-errors -D FUSET_BRIDGE_LIBRARY \
            native/EDPFSKitPoC/Extension/EDPRawIO.swift \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift \
            native/EDPFSKitPoC/Extension/EDPFileRawDevice.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTMinimalBridge.swift \
            native/EDPFSKitPoC/Tools/FuseTMinimal/FuseTEDPSM4Bridge.swift \
            -o "${RUNNER_TEMP}/FuseTEDPSM4Bridge"
          test -x "${RUNNER_TEMP}/FuseTEDPSM4Bridge"
          echo 'RESULT=G2_EXISTING_EDP_RANDOM_ACCESS_READER_LINKED'

      - name: G1-G3 random-access decrypt through FUSE-T
        run: |
          set -euo pipefail
          HIDDEN="${RUNNER_TEMP}/edp-sm4-hidden-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          LOG="${RUNNER_TEMP}/edp-sm4-bridge.log"
          mkdir -p "${HIDDEN}"
          echo "HIDDEN=${HIDDEN}" >> "${GITHUB_ENV}"
          echo "BRIDGE_LOG=${LOG}" >> "${GITHUB_ENV}"

          "${RUNNER_TEMP}/FuseTEDPSM4Bridge" \
            --backing "${CIPHER}" \
            --sm4-key "${SM4_KEY_HEX}" \
            --mountpoint "${HIDDEN}" \
            --volume-name 'EDP SM4 Hidden Raw Transport' \
            >"${LOG}" 2>&1 &
          BRIDGE_PID=$!
          echo "BRIDGE_PID=${BRIDGE_PID}" >> "${GITHUB_ENV}"

          for attempt in $(seq 1 25); do
            if mount | grep -Fq " on ${HIDDEN} "; then break; fi
            kill -0 "${BRIDGE_PID}" 2>/dev/null
            sleep 1
          done
          mount | grep -F " on ${HIDDEN} " | tee "${RUNNER_TEMP}/hidden-mount.txt"
          grep -Fq 'BACKING_MODE=EDP_SM4_RANDOM_ACCESS' "${LOG}"
          grep -Fq 'PLAINTEXT_CACHE=none' "${LOG}"

          EXPOSED="${HIDDEN}/volume.raw"
          test -f "${EXPOSED}"
          test "$(stat -f %z "${EXPOSED}")" -eq 67108864

          python3 - "${PLAIN}" "${EXPOSED}" <<'PY'
          import sys
          plain, exposed = sys.argv[1:]
          windows = [
              (0, 1), (1, 31), (15, 33), (4095, 4097),
              (65531, 7777), (3 * 1024 * 1024 + 5, 65519),
              (64 * 1024 * 1024 - 1, 1),
          ]
          with open(plain, 'rb', buffering=0) as lhs, open(exposed, 'rb', buffering=0) as rhs:
              for offset, length in windows:
                  lhs.seek(offset); rhs.seek(offset)
                  a, b = lhs.read(length), rhs.read(length)
                  assert a == b, (offset, length, len(a), len(b))
          print('RESULT=G2_RANDOM_WINDOWS_MATCH_PLAINTEXT')
          PY
          test "$(shasum -a 256 "${EXPOSED}" | awk '{print $1}')" = "${PLAIN_SHA}"
          echo 'RESULT=G2_FULL_VIRTUAL_PLAINTEXT_SHA_MATCH'

          lsof -p "${BRIDGE_PID}" | tee "${RUNNER_TEMP}/bridge-lsof.txt"
          grep -Fq "${CIPHER}" "${RUNNER_TEMP}/bridge-lsof.txt"
          if grep -Fq "${PLAIN}" "${RUNNER_TEMP}/bridge-lsof.txt"; then
            echo 'bridge unexpectedly opened the plaintext oracle' >&2
            exit 1
          fi
          echo 'RESULT=G3_BRIDGE_OPENS_CIPHER_NOT_PLAINTEXT_ORACLE'

      - name: Prove Apple filesystem and Finder over decrypted virtual raw
        run: |
          set -euo pipefail
          EXPOSED="${HIDDEN}/volume.raw"
          OUT="$(hdiutil attach -readonly -imagekey diskimage-class=CRawDiskImage "${EXPOSED}" 2>"${RUNNER_TEMP}/hdiutil.err")"
          printf '%s\n' "${OUT}" | tee "${RUNNER_TEMP}/attach.txt"
          FINAL_DISK="$(printf '%s\n' "${OUT}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          FINAL_MOUNT="$(printf '%s\n' "${OUT}" | awk -v v="${VOLNAME}" '$0 ~ ("/Volumes/" v) {print $NF; exit}')"
          test -n "${FINAL_DISK}"
          test -d "${FINAL_MOUNT}"
          echo "FINAL_DISK=${FINAL_DISK}" >> "${GITHUB_ENV}"
          echo "FINAL_MOUNT=${FINAL_MOUNT}" >> "${GITHUB_ENV}"

          test "$(cat "${FINAL_MOUNT}/EDP_SENTINEL.txt")" = "${SENTINEL}"
          test "$(shasum -a 256 "${FINAL_MOUNT}/EDP Folder/payload.bin" | awk '{print $1}')" = "${PAYLOAD_SHA}"
          diskutil info "${FINAL_DISK}" | tee "${RUNNER_TEMP}/diskutil.txt"
          grep -Eq 'File System Personality:[[:space:]]+HFS\+' "${RUNNER_TEMP}/diskutil.txt"
          grep -Eq 'Type \(Bundle\):[[:space:]]+hfs' "${RUNNER_TEMP}/diskutil.txt"
          grep -Eq 'Media Read-Only:[[:space:]]+Yes' "${RUNNER_TEMP}/diskutil.txt"
          grep -Eq 'Volume Read-Only:[[:space:]]+Yes' "${RUNNER_TEMP}/diskutil.txt"
          echo 'RESULT=G_SYNTHETIC_SM4_APPLE_FS_READ_OK'

          FINDER_SCRIPT="${RUNNER_TEMP}/finder-sm4.applescript"
          cat > "${FINDER_SCRIPT}" <<'OSA'
          on run argv
              set targetAlias to (POSIX file (item 1 of argv)) as alias
              tell application "Finder"
                  return (name of every item of targetAlias) as string
              end tell
          end run
          OSA
          osacompile -o "${RUNNER_TEMP}/finder-sm4.scpt" "${FINDER_SCRIPT}"
          osascript "${RUNNER_TEMP}/finder-sm4.scpt" "${FINAL_MOUNT}" | tee "${RUNNER_TEMP}/finder.txt"
          grep -Fq 'EDP_SENTINEL.txt' "${RUNNER_TEMP}/finder.txt"
          echo 'RESULT=G_SYNTHETIC_SM4_FINDER_ENUMERATION_OK'

          hdiutil detach "${FINAL_DISK}" -force
          echo 'FINAL_DISK=' >> "${GITHUB_ENV}"

          CIPHER_SHA_AFTER="$(shasum -a 256 "${CIPHER}" | awk '{print $1}')"
          CIPHER_META_AFTER="$(stat -f '%z:%m:%p' "${CIPHER}")"
          echo "CIPHER_SHA_AFTER=${CIPHER_SHA_AFTER}" >> "${GITHUB_ENV}"
          echo "CIPHER_META_AFTER=${CIPHER_META_AFTER}" >> "${GITHUB_ENV}"
          test "${CIPHER_SHA_AFTER}" = "${CIPHER_SHA_BEFORE}"
          test "${CIPHER_META_AFTER}" = "${CIPHER_META_BEFORE}"
          echo 'RESULT=G_CIPHER_BACKING_UNCHANGED'
          echo 'RESULT=G1_G2_G3_PASS'

      - name: Collect G1-G3 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${DIAG_PATH}")"
          {
            echo '# FUSE-T minimal FSKit + EDP SM4 random-access macOS 26 CI'
            echo
            echo 'generated_at_utc=<normalized>'
            echo "runner_os=$(sw_vers -productVersion)"
            echo "runner_build=$(sw_vers -buildVersion)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "plain_sha=${PLAIN_SHA:-unknown}"
            echo "cipher_sha_before=${CIPHER_SHA_BEFORE:-unknown}"
            echo "cipher_sha_after=${CIPHER_SHA_AFTER:-unknown}"
            echo "cipher_meta_before=${CIPHER_META_BEFORE:-unknown}"
            echo "cipher_meta_after=${CIPHER_META_AFTER:-unknown}"
            echo "final_mount=${FINAL_MOUNT:-none}"
            echo
            echo '## encryption'
            cat "${RUNNER_TEMP}/encrypt.log" 2>/dev/null || true
            echo
            echo '## hidden transport'
            cat "${RUNNER_TEMP}/hidden-mount.txt" 2>/dev/null || true
            echo
            echo '## bridge log'
            cat "${BRIDGE_LOG:-/dev/null}" 2>/dev/null || true
            echo
            echo '## bridge open files'
            cat "${RUNNER_TEMP}/bridge-lsof.txt" 2>/dev/null || true
            echo
            echo '## final attach'
            cat "${RUNNER_TEMP}/attach.txt" 2>/dev/null || true
            cat "${RUNNER_TEMP}/hdiutil.err" 2>/dev/null || true
            echo
            echo '## final diskutil'
            cat "${RUNNER_TEMP}/diskutil.txt" 2>/dev/null || true
            echo
            echo '## Finder'
            cat "${RUNNER_TEMP}/finder.txt" 2>/dev/null || true
          } > "${DIAG_PATH}"
          sed -n '1,500p' "${DIAG_PATH}"

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [[ -n "${FINAL_DISK:-}" ]]; then hdiutil detach "${FINAL_DISK}" -force; fi
          if [[ -n "${HIDDEN:-}" ]]; then /sbin/umount "${HIDDEN}"; fi
          if [[ -n "${BRIDGE_PID:-}" ]]; then kill "${BRIDGE_PID}" 2>/dev/null; fi
          sudo rm -rf /Applications/fuse-t.app
          exit 0

      - name: Commit deterministic G diagnostic
        if: always() && github.ref_name == 'test/fuset-minimal-fskit-bridge'
        run: |
          set -euo pipefail
          test -f "${DIAG_PATH}"
          git add "${DIAG_PATH}"
          if git diff --cached --quiet -- "${DIAG_PATH}"; then
            echo 'RESULT=G_DIAGNOSTIC_UNCHANGED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: capture FUSE-T EDP SM4 probe [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
