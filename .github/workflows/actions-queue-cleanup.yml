name: Actions Queue Cleanup

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - ".github/workflows/actions-queue-cleanup.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-queued-runs:
    name: cancel stale queued runs on test branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel every queued run on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          API: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          url="${API}/repos/${REPO}/actions/runs?branch=${BRANCH}&status=queued&per_page=100"
          payload="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${url}")"

          mapfile -t run_ids < <(PAYLOAD="${payload}" python3 -c 'import json,os; data=json.loads(os.environ["PAYLOAD"]); [print(r["id"]) for r in data.get("workflow_runs", [])]')
          echo "QUEUED_BEFORE=${#run_ids[@]}"

          for run_id in "${run_ids[@]}"; do
            echo "Cancelling queued run ${run_id}"
            code="$(curl --silent --show-error --output /tmp/cancel-response --write-out '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/repos/${REPO}/actions/runs/${run_id}/cancel")"
            if [[ "${code}" != "202" && "${code}" != "409" ]]; then
              cat /tmp/cancel-response >&2 || true
              echo "unexpected cancel status ${code} for run ${run_id}" >&2
              exit 1
            fi
          done

          remaining=-1
          for attempt in {1..12}; do
            sleep 5
            check="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${url}")"
            remaining="$(PAYLOAD="${check}" python3 -c 'import json,os; print(json.loads(os.environ["PAYLOAD"]).get("total_count", 0))')"
            echo "QUEUED_REMAINING=${remaining} attempt=${attempt}"
            [[ "${remaining}" == "0" ]] && break
          done

          [[ "${remaining}" == "0" ]]
          echo 'RESULT=ACTIONS_STALE_QUEUE_CLEARED'
