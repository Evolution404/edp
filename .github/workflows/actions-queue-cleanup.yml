name: Actions Queue Cleanup

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - ".github/workflows/actions-queue-cleanup.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-queue-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purge-stale-queued-runs:
    name: purge stale queued runs on test branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel, force-cancel, then delete zombie queued runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          API: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          list_url="${API}/repos/${REPO}/actions/runs?branch=${BRANCH}&status=queued&per_page=100"

          request() {
            local method="$1"
            local url="$2"
            curl --silent --show-error --output /tmp/api-response --write-out '%{http_code}' \
              -X "${method}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${url}"
          }

          queued_ids() {
            local payload
            payload="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${list_url}")"
            PAYLOAD="${payload}" python3 -c 'import json,os; data=json.loads(os.environ["PAYLOAD"]); [print(r["id"]) for r in data.get("workflow_runs", [])]'
          }

          mapfile -t initial < <(queued_ids)
          echo "QUEUED_BEFORE=${#initial[@]}"

          for run_id in "${initial[@]}"; do
            run_url="${API}/repos/${REPO}/actions/runs/${run_id}"
            code="$(request POST "${run_url}/cancel")"
            echo "NORMAL_CANCEL run=${run_id} http=${code}"

            if [[ "${code}" != "202" ]]; then
              code="$(request POST "${run_url}/force-cancel")"
              echo "FORCE_CANCEL run=${run_id} http=${code}"
            fi

            if [[ "${code}" != "202" ]]; then
              code="$(request DELETE "${run_url}")"
              echo "DELETE_RUN run=${run_id} http=${code}"
              if [[ "${code}" != "204" ]]; then
                echo "DELETE_RESPONSE_BEGIN run=${run_id}"
                cat /tmp/api-response || true
                echo
                echo "DELETE_RESPONSE_END run=${run_id}"
              fi
            fi
          done

          sleep 5
          mapfile -t remaining < <(queued_ids)
          echo "QUEUED_AFTER_PURGE=${#remaining[@]}"
          printf 'STILL_QUEUED_ID=%s\n' "${remaining[@]}"
          (( ${#remaining[@]} == 0 ))
          echo 'RESULT=ACTIONS_STALE_QUEUE_PURGED'
