name: Actions Queue Cleanup

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - ".github/workflows/actions-queue-cleanup.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-queue-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale-queued-runs:
    name: cancel stale queued runs on test branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel and force-cancel every queued run on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          API: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          list_url="${API}/repos/${REPO}/actions/runs?branch=${BRANCH}&status=queued&per_page=100"

          api_get() {
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          queued_ids() {
            local payload
            payload="$(api_get "${list_url}")"
            PAYLOAD="${payload}" python3 -c 'import json,os; data=json.loads(os.environ["PAYLOAD"]); [print(r["id"]) for r in data.get("workflow_runs", [])]'
          }

          cancel_run() {
            local run_id="$1"
            local mode="$2"
            local suffix="cancel"
            [[ "${mode}" == "force" ]] && suffix="force-cancel"
            local code
            code="$(curl --silent --show-error --output /tmp/cancel-response --write-out '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/repos/${REPO}/actions/runs/${run_id}/${suffix}")"
            echo "${mode^^}_CANCEL run=${run_id} http=${code}"
            if [[ "${code}" != "202" && "${code}" != "409" ]]; then
              cat /tmp/cancel-response >&2 || true
              return 1
            fi
          }

          mapfile -t initial < <(queued_ids)
          echo "QUEUED_BEFORE=${#initial[@]}"
          printf 'QUEUED_ID=%s\n' "${initial[@]}"

          for run_id in "${initial[@]}"; do
            cancel_run "${run_id}" normal
          done

          sleep 10
          mapfile -t stubborn < <(queued_ids)
          echo "QUEUED_AFTER_NORMAL_CANCEL=${#stubborn[@]}"

          for run_id in "${stubborn[@]}"; do
            cancel_run "${run_id}" force
          done

          remaining=-1
          for attempt in {1..12}; do
            sleep 5
            mapfile -t current < <(queued_ids)
            remaining="${#current[@]}"
            echo "QUEUED_REMAINING=${remaining} attempt=${attempt}"
            if (( remaining == 0 )); then
              break
            fi
            printf 'STILL_QUEUED_ID=%s\n' "${current[@]}"
          done

          (( remaining == 0 ))
          echo 'RESULT=ACTIONS_STALE_QUEUE_CLEARED'
