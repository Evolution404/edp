name: Native FSKit Registration Debug

on:
  push:
    branches: ["feat/macos26-native-fskit"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Build native ExtensionKit FSKit bundle
        working-directory: native/EDPFSKitPoC
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild \
            -project EDPFSKitPoC.xcodeproj \
            -scheme EDPFSKitHost \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/EDPFSKitDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Sign and install PoC
        run: |
          set -euo pipefail
          SOURCE_APP="${RUNNER_TEMP}/EDPFSKitDerivedData/Build/Products/Release/EDPFSKitPoC.app"
          SOURCE_EXT="${SOURCE_APP}/Contents/Extensions/EDPFSKitExtension.appex"

          echo '--- requested extension entitlements ---'
          plutil -p native/EDPFSKitPoC/Extension/EDPFSKitExtension.entitlements

          codesign --force --sign - \
            --generate-entitlement-der \
            --entitlements native/EDPFSKitPoC/Extension/EDPFSKitExtension.entitlements \
            "${SOURCE_EXT}"
          codesign --force --sign - "${SOURCE_APP}"

          sudo rm -rf "/Applications/EDPFSKitPoC.app"
          sudo /usr/bin/ditto "${SOURCE_APP}" "/Applications/EDPFSKitPoC.app"

          codesign --verify --deep --strict --verbose=4 "/Applications/EDPFSKitPoC.app"

      - name: Diagnose signing and runtime registration
        id: diagnose
        run: |
          set -u
          APP="/Applications/EDPFSKitPoC.app"
          EXT="${APP}/Contents/Extensions/EDPFSKitExtension.appex"
          BUNDLE_ID="com.edp.usbvault.fskit-poc.extension"
          DIAG="${RUNNER_TEMP}/fskit-registration-diagnostics.txt"
          SUMMARY="${GITHUB_STEP_SUMMARY}"
          : > "${DIAG}"

          section() {
            printf '\n===== %s =====\n' "$1" | tee -a "${DIAG}"
          }

          capture() {
            echo "+ $*" | tee -a "${DIAG}"
            "$@" >>"${DIAG}" 2>&1
            local rc=$?
            echo "[exit=${rc}]" | tee -a "${DIAG}"
            return ${rc}
          }

          section "SYSTEM"
          sw_vers | tee -a "${DIAG}"
          xcodebuild -version | tee -a "${DIAG}"

          section "BUNDLE LAYOUT"
          find "${APP}/Contents" -maxdepth 3 -print | sort | tee -a "${DIAG}"
          if [[ -d "${EXT}" ]]; then
            EMBEDDED=yes
          else
            EMBEDDED=no
          fi

          section "HOST SIGNATURE"
          capture codesign -dvvv --entitlements :- "${APP}" || true
          capture codesign -d --requirements :- "${APP}" || true

          section "EXTENSION SIGNATURE"
          capture codesign -dvvv --entitlements :- "${EXT}" || true
          capture codesign -d --requirements :- "${EXT}" || true

          section "TEAM IDENTIFIER"
          HOST_TEAM="$(codesign -dvvv "${APP}" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -1)"
          EXT_TEAM="$(codesign -dvvv "${EXT}" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -1)"
          echo "HOST_TEAM_IDENTIFIER=${HOST_TEAM:-<missing>}" | tee -a "${DIAG}"
          echo "EXT_TEAM_IDENTIFIER=${EXT_TEAM:-<missing>}" | tee -a "${DIAG}"

          section "PROVISIONING PROFILE"
          for bundle in "${APP}" "${EXT}"; do
            profile="${bundle}/Contents/embedded.provisionprofile"
            echo "bundle=${bundle}" | tee -a "${DIAG}"
            if [[ -f "${profile}" ]]; then
              echo "embedded_provisionprofile=yes" | tee -a "${DIAG}"
              security cms -D -i "${profile}" >>"${DIAG}" 2>&1 || true
            else
              echo "embedded_provisionprofile=no" | tee -a "${DIAG}"
            fi
          done

          section "PRE-REGISTRATION FSKIT MODULES"
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv >"${RUNNER_TEMP}/fskit-pre.txt" 2>&1 || true
          cat "${RUNNER_TEMP}/fskit-pre.txt" | tee -a "${DIAG}"

          section "EXPLICIT REGISTRATION"
          capture pluginkit -a "${EXT}" || true
          capture pluginkit -a "${APP}" || true
          capture /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister \
            -f -R -trusted "${APP}" || true
          capture open -a "${APP}" || true
          sleep 3

          section "PLUGIN KIT ALL RECORD"
          pluginkit -m -A -D -vv >"${RUNNER_TEMP}/pluginkit-all.txt" 2>&1 || true
          grep -A16 -B8 "${BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit-all.txt" | tee -a "${DIAG}" || true
          if grep -q "${BUNDLE_ID}" "${RUNNER_TEMP}/pluginkit-all.txt"; then
            PLUGINKIT_INDEXED=yes
          else
            PLUGINKIT_INDEXED=no
          fi

          section "FSKIT EXTENSION POINT RECORD"
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv >"${RUNNER_TEMP}/fskit-modules.txt" 2>&1 || true
          cat "${RUNNER_TEMP}/fskit-modules.txt" | tee -a "${DIAG}"
          if grep -q "${BUNDLE_ID}" "${RUNNER_TEMP}/fskit-modules.txt"; then
            FSKIT_POINT_INDEXED=yes
          else
            FSKIT_POINT_INDEXED=no
          fi

          section "LAUNCH SERVICES RECORD"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister \
            -dump >"${RUNNER_TEMP}/lsregister.txt" 2>&1 || true
          grep -A20 -B8 "${BUNDLE_ID}" "${RUNNER_TEMP}/lsregister.txt" | tee -a "${DIAG}" || true

          section "FSCLIENT"
          xcrun swiftc \
            -framework FSKit \
            native/EDPFSKitPoC/Tools/InspectFSKit.swift \
            -o "${RUNNER_TEMP}/inspect-fskit"
          "${RUNNER_TEMP}/inspect-fskit" >"${RUNNER_TEMP}/fsclient.txt" 2>&1
          FSCLIENT_RC=$?
          cat "${RUNNER_TEMP}/fsclient.txt" | tee -a "${DIAG}"
          if grep -q '^FSKIT_MODULE_FOUND=' "${RUNNER_TEMP}/fsclient.txt"; then
            FSCLIENT_VISIBLE=yes
          else
            FSCLIENT_VISIBLE=no
          fi
          echo "FSCLIENT_RC=${FSCLIENT_RC}" | tee -a "${DIAG}"

          section "SYSTEM REGISTRATION LOGS"
          log show --last 10m --style compact \
            --predicate 'process == "pkd" OR process == "extensionkitservice" OR process == "fskitd" OR process == "lsd" OR eventMessage CONTAINS[c] "com.edp.usbvault.fskit-poc"' \
            >"${RUNNER_TEMP}/registration.log" 2>&1 || true
          cat "${RUNNER_TEMP}/registration.log" >>"${DIAG}"

          section "SUSPICIOUS REGISTRATION LOG LINES"
          grep -Ei 'com\.edp\.usbvault|fskit|entitle|signature|signing|team|provision|sandbox|reject|denied|invalid|error|fail' \
            "${RUNNER_TEMP}/registration.log" | tail -n 300 | tee -a "${DIAG}" || true

          section "VERDICT"
          {
            echo "EMBEDDED=${EMBEDDED}"
            echo "PLUGINKIT_INDEXED=${PLUGINKIT_INDEXED}"
            echo "FSKIT_POINT_INDEXED=${FSKIT_POINT_INDEXED}"
            echo "FSCLIENT_VISIBLE=${FSCLIENT_VISIBLE}"
            echo "HOST_TEAM_IDENTIFIER=${HOST_TEAM:-<missing>}"
            echo "EXT_TEAM_IDENTIFIER=${EXT_TEAM:-<missing>}"
          } | tee -a "${DIAG}"

          {
            echo "## Native FSKit registration verdict"
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo "| Extension embedded in Contents/Extensions | ${EMBEDDED} |"
            echo "| PluginKit indexed bundle ID | ${PLUGINKIT_INDEXED} |"
            echo "| PluginKit indexed as com.apple.fskit.fsmodule | ${FSKIT_POINT_INDEXED} |"
            echo "| FSClient.fetchInstalledExtensions sees module | ${FSCLIENT_VISIBLE} |"
            echo "| Host TeamIdentifier | \`${HOST_TEAM:-<missing>}\` |"
            echo "| Extension TeamIdentifier | \`${EXT_TEAM:-<missing>}\` |"
            echo
            echo "Full evidence is attached as the fskit-registration-diagnostics artifact."
          } >>"${SUMMARY}"

          cp "${DIAG}" "${GITHUB_WORKSPACE}/fskit-registration-diagnostics.txt"

      - name: Upload FSKit registration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fskit-registration-diagnostics
          path: fskit-registration-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
