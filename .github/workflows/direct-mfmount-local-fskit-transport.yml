name: Direct MFMount Local FSKit P0 Probe

on:
  push:
    branches: ["test/fuset-minimal-fskit-bridge"]
    paths:
      - ".github/workflows/direct-mfmount-local-fskit-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-mfmount-local-fskit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-mfmount-local:
    runs-on: macos-26
    timeout-minutes: 12
    env:
      MACFUSE_DMG_SHA256: "7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15"
      MACFUSE_DMG_URL: "https://github.com/macfuse/macfuse/releases/download/macfuse-5.3.3/macfuse-5.3.3.dmg"
      GENERIC_ID: "io.macfuse.app.fsmodule.macfuse"
      LOCAL_ID: "io.macfuse.app.fsmodule.macfuse-local"
      MOUNT_COMMIT: "313b9c68d04cd779bffc9f8bd9f32a4e1f5baf70"
      LIBRARY3_COMMIT: "9a3db24bf7e3896d69a514a70e91dc41eefb948b"

    steps:
      - uses: actions/checkout@v6

      - name: Verify macOS 26 runtime
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26

      - name: Install exact official macFUSE 5.3.3
        run: |
          set -euo pipefail
          DMG="${RUNNER_TEMP}/macfuse.dmg"
          curl -fsSL --retry 3 "${MACFUSE_DMG_URL}" -o "${DMG}"
          test "$(shasum -a 256 "${DMG}" | awk '{print $1}')" = "${MACFUSE_DMG_SHA256}"
          ATTACH="$(hdiutil attach -nobrowse -readonly "${DMG}")"
          VOL="$(printf '%s\n' "${ATTACH}" | awk -F '\t' '/\/Volumes\// {print $NF; exit}')"
          PKG="$(find "${VOL}" -maxdepth 2 \( -type f -o -type d \) -name '*.pkg' -print -quit)"
          test -n "${PKG}"
          pkgutil --check-signature "${PKG}"
          sudo installer -pkg "${PKG}" -target /
          hdiutil detach "${VOL}" >/dev/null
          test -f /Library/Filesystems/macfuse.fs/Contents/Frameworks/MFMount.framework/Versions/A/MFMount
          echo 'MFMOUNT_FRAMEWORK_INSTALLED=1'

      - name: Enable Generic and Local FSKit modules
        run: |
          set -euo pipefail
          APP="/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app"
          for ID in "${GENERIC_ID}" "${LOCAL_ID}"; do
            test -d "${APP}/Contents/Extensions/${ID}.appex"
          done
          LSREGISTER="/System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister"
          "${LSREGISTER}" -f -R -trusted "${APP}"
          while IFS= read -r EXT; do pluginkit -a "${EXT}" || true; done < <(find "${APP}/Contents" -maxdepth 5 -type d -name '*.appex' -print)
          pluginkit -a "${APP}" || true
          pluginkit -e use -i "${GENERIC_ID}" || true
          pluginkit -e use -i "${LOCAL_ID}" || true
          SETTINGS="${HOME}/Library/Group Containers/group.com.apple.fskit.settings/enabledModules.plist"
          mkdir -p "$(dirname "${SETTINGS}")"
          python3 - "${SETTINGS}" "${GENERIC_ID}" "${LOCAL_ID}" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'wb') as f:
              plistlib.dump(sys.argv[2:], f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          chmod 600 "${SETTINGS}"
          killall -9 fskit_agent extensionkitservice 2>/dev/null || true
          sudo killall -9 fskitd 2>/dev/null || true
          sleep 3
          pluginkit -m -p com.apple.fskit.fsmodule -A -D -vv | tee "${RUNNER_TEMP}/pluginkit.txt" || true
          grep -Fq "+    ${GENERIC_ID}" "${RUNNER_TEMP}/pluginkit.txt"
          grep -Fq "+    ${LOCAL_ID}" "${RUNNER_TEMP}/pluginkit.txt"
          echo 'FSKIT_MODULES_ENABLED=1'

      - name: Build libfuse-free Direct MFMount local transport
        run: |
          set -euo pipefail
          FRAMEWORKS="/Library/Filesystems/macfuse.fs/Contents/Frameworks"
          INC="${RUNNER_TEMP}/include"
          mkdir -p "${INC}/MFMount"
          curl -fsSL "https://raw.githubusercontent.com/macfuse/mount/${MOUNT_COMMIT}/Mount/MFMount.h" -o "${INC}/MFMount/MFMount.h"
          curl -fsSL "https://raw.githubusercontent.com/macfuse/library/${LIBRARY3_COMMIT}/include/fuse_kernel.h" -o "${INC}/fuse_kernel.h"

          # Keep the proven Direct implementation unchanged in the repository.
          # This diagnostic copy changes only MFMount options to add `local`.
          cp native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountRawTransport.c "${RUNNER_TEMP}/DirectLocal.c"
          python3 - "${RUNNER_TEMP}/DirectLocal.c" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          text = p.read_text()
          old = '"nobrowse,volname=%s"'
          new = '"local,nobrowse,volname=%s"'
          assert old in text
          p.write_text(text.replace(old, new, 1))
          PY
          grep -Fq '"local,nobrowse,volname=%s"' "${RUNNER_TEMP}/DirectLocal.c"

          xcrun clang -std=c17 -Wall -Wextra -Werror -I"${INC}" -F"${FRAMEWORKS}" \
            -DMFMount=EDPAsyncMFMount -c "${RUNNER_TEMP}/DirectLocal.c" -o "${RUNNER_TEMP}/main.o"
          xcrun clang -std=c17 -Wall -Wextra -Werror -I"${INC}" -F"${FRAMEWORKS}" \
            -c native/EDPFSKitPoC/Tools/MacFUSEMinimal/DirectMFMountAsyncShim.c -o "${RUNNER_TEMP}/shim.o"
          xcrun clang "${RUNNER_TEMP}/main.o" "${RUNNER_TEMP}/shim.o" \
            -F"${FRAMEWORKS}" -framework MFMount -framework CoreFoundation -framework DiskArbitration \
            -Wl,-rpath,"${FRAMEWORKS}" -o "${RUNNER_TEMP}/direct_local"
          otool -L "${RUNNER_TEMP}/direct_local" | tee "${RUNNER_TEMP}/otool.txt"
          grep -Fq 'MFMount.framework' "${RUNNER_TEMP}/otool.txt"
          ! grep -Eiq 'libfuse|libosxfuse|libmacfuse' "${RUNNER_TEMP}/otool.txt"
          echo 'DIRECT_LOCAL_NO_LIBFUSE_DEPENDENCY=1'

          cat >"${RUNNER_TEMP}/flags.c" <<'C'
          #include <sys/mount.h>
          #include <stdio.h>
          int main(int c,char**v){struct statfs s;if(c!=2||statfs(v[1],&s))return 1;printf("FSTYPE=%s\nFLAGS=0x%08x\nMNT_DONTBROWSE=%d\nMNT_LOCAL=%d\n",s.f_fstypename,(unsigned)s.f_flags,!!(s.f_flags&MNT_DONTBROWSE),!!(s.f_flags&MNT_LOCAL));return 0;}
          C
          xcrun clang -Wall -Wextra -Werror "${RUNNER_TEMP}/flags.c" -o "${RUNNER_TEMP}/flags"
          cat >"${RUNNER_TEMP}/inspect.swift" <<'SWIFT'
          import Foundation
          @main struct I { static func main() throws { let u=URL(fileURLWithPath:CommandLine.arguments[1],isDirectory:true); let v=try u.resourceValues(forKeys:[.volumeIsBrowsableKey,.volumeNameKey,.volumeIsLocalKey,.volumeTypeNameKey]); print("BROWSABLE=\(v.volumeIsBrowsable == true ? 1:0)"); print("VOLUME_NAME=\(v.volumeName ?? "<nil>")"); print("LOCAL=\(v.volumeIsLocal == true ? 1:0)"); print("TYPE=\(v.volumeTypeName ?? "<nil>")") } }
          SWIFT
          xcrun swiftc -swift-version 6 -parse-as-library -warnings-as-errors "${RUNNER_TEMP}/inspect.swift" -o "${RUNNER_TEMP}/inspect"

      - name: Validate Direct local FSKit P0 contract
        run: |
          set -euo pipefail
          RAW="${RUNNER_TEMP}/local.raw"
          VOLUME_NAME="EDP Direct Local"
          MP="/Volumes/EDP-Direct-Local-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          LOG="${RUNNER_TEMP}/local.log"
          echo -n "${MP}" > "${RUNNER_TEMP}/mp"
          dd if=/dev/zero of="${RAW}" bs=1m count=16 status=none
          printf 'EDP-DIRECT-LOCAL' | dd of="${RAW}" bs=1 seek=4096 conv=notrunc status=none
          sudo mkdir -p "${MP}" && sudo chown "$(id -u):$(id -g)" "${MP}"
          "${RUNNER_TEMP}/direct_local" "${RAW}" "${MP}" "${VOLUME_NAME}" >"${LOG}" 2>&1 &
          echo $! > "${RUNNER_TEMP}/pid"
          MOUNTED=0
          for _ in $(seq 1 30); do
            if mount | grep -Fq " on ${MP} "; then MOUNTED=1; break; fi
            kill -0 "$(cat "${RUNNER_TEMP}/pid")" 2>/dev/null || break
            sleep 1
          done
          cat "${LOG}" || true
          test "${MOUNTED}" = 1
          echo 'DIRECT_LOCAL_MOUNTED=1'
          MOUNT_LINE="$(mount | grep -F " on ${MP} ")"
          printf '%s\n' "${MOUNT_LINE}"
          echo "${MOUNT_LINE}" | grep -Fq 'fskit'
          echo 'DIRECT_LOCAL_IS_FSKIT=1'

          FLAGS="$(${RUNNER_TEMP}/flags "${MP}")"; printf '%s\n' "${FLAGS}"
          INSPECT="$(${RUNNER_TEMP}/inspect "${MP}")"; printf '%s\n' "${INSPECT}"
          DONTBROWSE="$(printf '%s\n' "${FLAGS}" | sed -n 's/^MNT_DONTBROWSE=//p')"
          BROWSABLE="$(printf '%s\n' "${INSPECT}" | sed -n 's/^BROWSABLE=//p')"
          LOCAL_FLAG="$(printf '%s\n' "${FLAGS}" | sed -n 's/^MNT_LOCAL=//p')"

          EXPOSED="${MP}/volume.raw"
          test -f "${EXPOSED}"
          test "$(dd if="${EXPOSED}" bs=1 skip=4096 count=16 status=none)" = 'EDP-DIRECT-LOCAL'
          echo 'DIRECT_LOCAL_READ_OK=1'
          printf 'RW' | dd of="${EXPOSED}" bs=1 seek=8192 conv=notrunc status=none
          test "$(dd if="${RAW}" bs=1 skip=8192 count=2 status=none)" = 'RW'
          echo 'DIRECT_LOCAL_RW_OK=1'

          ATTACH="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "${EXPOSED}")"
          printf '%s\n' "${ATTACH}"
          DISK="$(printf '%s\n' "${ATTACH}" | awk '/^\/dev\/disk/ {print $1; exit}')"
          test -n "${DISK}"
          echo -n "${DISK}" > "${RUNNER_TEMP}/disk"
          hdiutil detach "${DISK}" -force >/dev/null
          rm -f "${RUNNER_TEMP}/disk"
          echo 'DIRECT_LOCAL_DISKIMAGES2_OK=1'

          killall Finder 2>/dev/null || true
          open -a Finder
          sleep 2
          FINDER="$(osascript -e 'tell application "Finder" to get name of every disk' 2>/dev/null || true)"
          printf 'FINDER_DISKS=%s\n' "${FINDER}"
          if printf '%s\n' "${FINDER}" | grep -Fq "${VOLUME_NAME}"; then
            FINDER_VISIBLE=1
          else
            FINDER_VISIBLE=0
          fi
          echo "DIRECT_LOCAL_FINDER_VISIBLE=${FINDER_VISIBLE}"

          echo "DIRECT_LOCAL_SUMMARY DONTBROWSE=${DONTBROWSE} BROWSABLE=${BROWSABLE} MNT_LOCAL=${LOCAL_FLAG} FINDER_VISIBLE=${FINDER_VISIBLE}"
          if [[ "${DONTBROWSE}" = 1 && "${BROWSABLE}" = 0 && "${FINDER_VISIBLE}" = 0 ]]; then
            echo 'RESULT=DIRECT_LOCAL_P0_PASS'
          else
            echo 'RESULT=DIRECT_LOCAL_P0_FAIL'
            exit 1
          fi

      - name: Cleanup without blocking
        if: always()
        run: |
          set +e
          echo '--- final local log ---'; cat "${RUNNER_TEMP}/local.log" 2>/dev/null || true
          [[ -f "${RUNNER_TEMP}/disk" ]] && hdiutil detach "$(cat "${RUNNER_TEMP}/disk")" -force >/dev/null 2>&1 || true
          if [[ -f "${RUNNER_TEMP}/pid" ]]; then P="$(cat "${RUNNER_TEMP}/pid")"; kill "${P}" 2>/dev/null; sleep 1; kill -9 "${P}" 2>/dev/null; fi
          if [[ -f "${RUNNER_TEMP}/mp" ]]; then
            MP="$(cat "${RUNNER_TEMP}/mp")"
            if mount | grep -Fq " on ${MP} "; then
              sudo /sbin/umount -f "${MP}" >/dev/null 2>&1 & U=$!
              for _ in $(seq 1 8); do kill -0 "${U}" 2>/dev/null || break; sleep 1; done
              kill -9 "${U}" 2>/dev/null || true
            fi
            sudo rmdir "${MP}" 2>/dev/null || true
          fi
          exit 0
