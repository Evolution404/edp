name: EDP Crypto Direct vs Encrypted I/O

on:
  push:
    branches: ["test/self-signed-standalone-distribution"]
    paths:
      - "native/EDPFSKitPoC/Extension/EDPRawIO.swift"
      - "native/EDPFSKitPoC/Extension/EDPCrypto.swift"
      - "native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift"
      - "native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift"
      - "native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift"
      - "native/EDPFSKitPoC/Extension/EDPBlockDevice.swift"
      - "native/EDPFSKitPoC/Tools/PrepareEncryptedDiskImage.swift"
      - "native/EDPFSKitPoC/Tools/EDPCryptoIOBenchmark.swift"
      - ".github/workflows/edp-crypto-io-overhead.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edp-crypto-io-overhead-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SPAN_BYTES: "268435456"
      SM4_KEY: "0123456789abcdeffedcba9876543210"

    steps:
      - uses: actions/checkout@v6

      - name: Verify benchmark runtime
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          sysctl -n hw.ncpu
          sysctl -n hw.memsize
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test "${SPAN_BYTES}" -eq 268435456
          test "${#SM4_KEY}" -eq 32
          echo 'RESULT=PERF_CRYPTO_RUNTIME_READY'

      - name: Build optimized benchmark and fixture encryptor
        run: |
          set -euo pipefail
          xcrun swiftc -O -parse-as-library -swift-version 6 -warnings-as-errors \
            native/EDPFSKitPoC/Extension/EDPRawIO.swift \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Extension/EDPMetadataProbe.swift \
            native/EDPFSKitPoC/Extension/EDPVolumeMetadata.swift \
            native/EDPFSKitPoC/Extension/EDPEncryptedPartitionReader.swift \
            native/EDPFSKitPoC/Extension/EDPBlockDevice.swift \
            native/EDPFSKitPoC/Tools/EDPCryptoIOBenchmark.swift \
            -o "${RUNNER_TEMP}/EDPCryptoIOBenchmark"
          xcrun swiftc -O -parse-as-library -swift-version 6 -warnings-as-errors \
            native/EDPFSKitPoC/Extension/EDPCrypto.swift \
            native/EDPFSKitPoC/Tools/PrepareEncryptedDiskImage.swift \
            -o "${RUNNER_TEMP}/PrepareEncryptedDiskImage"
          test -x "${RUNNER_TEMP}/EDPCryptoIOBenchmark"
          test -x "${RUNNER_TEMP}/PrepareEncryptedDiskImage"
          echo 'RESULT=PERF_CRYPTO_BINARIES_OPTIMIZED'

      - name: Prepare equally-sized allocated plain and encrypted fixtures
        run: |
          set -euo pipefail
          PLAIN="${RUNNER_TEMP}/crypto-perf-plain.raw"
          CIPHER="${RUNNER_TEMP}/crypto-perf-cipher.raw"
          DIRECT_WRITE="${RUNNER_TEMP}/crypto-perf-direct-write.raw"
          CIPHER_WRITE="${RUNNER_TEMP}/crypto-perf-cipher-write.raw"
          dd if=/dev/urandom of="${PLAIN}" bs=1048576 count=256 status=progress
          "${RUNNER_TEMP}/PrepareEncryptedDiskImage" "${PLAIN}" "${CIPHER}" "${SM4_KEY}" | tee "${RUNNER_TEMP}/encrypt-fixture.txt"
          test "$(stat -f %z "${PLAIN}")" -eq "${SPAN_BYTES}"
          test "$(stat -f %z "${CIPHER}")" -eq "${SPAN_BYTES}"
          cp "${PLAIN}" "${DIRECT_WRITE}"
          cp "${CIPHER}" "${CIPHER_WRITE}"
          test "$(stat -f %z "${DIRECT_WRITE}")" -eq "${SPAN_BYTES}"
          test "$(stat -f %z "${CIPHER_WRITE}")" -eq "${SPAN_BYTES}"
          echo "PLAIN=${PLAIN}" >> "${GITHUB_ENV}"
          echo "CIPHER=${CIPHER}" >> "${GITHUB_ENV}"
          echo "DIRECT_WRITE=${DIRECT_WRITE}" >> "${GITHUB_ENV}"
          echo "CIPHER_WRITE=${CIPHER_WRITE}" >> "${GITHUB_ENV}"
          du -h "${PLAIN}" "${CIPHER}" "${DIRECT_WRITE}" "${CIPHER_WRITE}"
          echo 'RESULT=PERF_CRYPTO_EQUAL_SIZE_FIXTURES_READY'

      - name: Read and write direct/encrypted benchmark matrix
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP}/crypto-io-results"
          mkdir -p "${OUTDIR}"

          operations_for() {
            case "$1" in
              4096) echo 16384 ;;
              65536) echo 1024 ;;
              1048576) echo 64 ;;
              4097) echo 4096 ;;
              *) return 1 ;;
            esac
          }

          path_for() {
            case "$1:$2" in
              direct:read) echo "${PLAIN}" ;;
              encrypted:read) echo "${CIPHER}" ;;
              direct:write) echo "${DIRECT_WRITE}" ;;
              encrypted:write) echo "${CIPHER_WRITE}" ;;
              *) return 1 ;;
            esac
          }

          run_one() {
            mode="$1"; operation="$2"; pattern="$3"; block="$4"; trial="$5"
            operations="$(operations_for "${block}")"
            if [[ "${pattern}:${block}" == 'sequential:1048576' ]]; then operations=256; fi
            path="$(path_for "${mode}" "${operation}")"
            stem="${operation}-${pattern}-${block}-trial${trial}-${mode}"
            /usr/bin/time -lp \
              "${RUNNER_TEMP}/EDPCryptoIOBenchmark" \
              --path "${path}" \
              --mode "${mode}" \
              --operation "${operation}" \
              --pattern "${pattern}" \
              --block-size "${block}" \
              --operations "${operations}" \
              --span-bytes "${SPAN_BYTES}" \
              --key "${SM4_KEY}" \
              >"${OUTDIR}/${stem}.out" 2>"${OUTDIR}/${stem}.time"
            cat "${OUTDIR}/${stem}.out"
            cat "${OUTDIR}/${stem}.time"
          }

          for operation in read write; do
            for pattern in random sequential; do
              for block in 4096 65536 1048576; do
                for trial in 1 2 3; do
                  if [[ $((trial % 2)) -eq 1 ]]; then
                    run_one direct "${operation}" "${pattern}" "${block}" "${trial}"
                    run_one encrypted "${operation}" "${pattern}" "${block}" "${trial}"
                  else
                    run_one encrypted "${operation}" "${pattern}" "${block}" "${trial}"
                    run_one direct "${operation}" "${pattern}" "${block}" "${trial}"
                  fi
                done
              done
            done
          done

          # Explicit partial-block RMW tax: random 4097-byte writes only.
          for trial in 1 2 3; do
            if [[ $((trial % 2)) -eq 1 ]]; then
              run_one direct write random 4097 "${trial}"
              run_one encrypted write random 4097 "${trial}"
            else
              run_one encrypted write random 4097 "${trial}"
              run_one direct write random 4097 "${trial}"
            fi
          done
          echo "OUTDIR=${OUTDIR}" >> "${GITHUB_ENV}"
          echo 'RESULT=PERF_CRYPTO_RAW_MATRIX_CAPTURED'

      - name: Summarize medians, CPU cost, slowdown and efficiency
        run: |
          set -euo pipefail
          SUMMARY="${RUNNER_TEMP}/crypto-io-summary.txt"
          CSV="${RUNNER_TEMP}/crypto-io-summary.csv"
          python3 - "${OUTDIR}" "${SUMMARY}" "${CSV}" <<'PY'
          import csv, glob, os, re, statistics, sys
          source, summary_path, csv_path = sys.argv[1:]
          rx = re.compile(
              r'CRYPTO_IO_BENCH mode=(\w+) operation=(\w+) pattern=(\w+) '
              r'block_bytes=(\d+) operations=(\d+) span_bytes=(\d+) total_bytes=(\d+) '
              r'nocache=1 rdahead=0 durable_sync=(\d+) seconds=([0-9.]+) '
              r'mib_per_s=([0-9.]+) iops=([0-9.]+) checksum=(\d+)'
          )
          def time_value(text, label):
              patterns = [
                  rf'([0-9.]+)\s+{label}\b',
                  rf'\b{label}\s+([0-9.]+)',
              ]
              for pattern in patterns:
                  m = re.search(pattern, text)
                  if m: return float(m.group(1))
              return 0.0
          rows = []
          for out_path in sorted(glob.glob(os.path.join(source, '*.out'))):
              text = open(out_path, encoding='utf-8').read()
              match = rx.search(text)
              if not match:
                  raise SystemExit(f'missing benchmark row in {out_path}')
              mode, operation, pattern = match.group(1, 2, 3)
              block = int(match.group(4))
              time_path = out_path[:-4] + '.time'
              time_text = open(time_path, encoding='utf-8', errors='replace').read()
              user = time_value(time_text, 'user')
              system = time_value(time_text, 'sys')
              trial_match = re.search(r'-trial(\d+)-', os.path.basename(out_path))
              rows.append({
                  'mode': mode,
                  'operation': operation,
                  'pattern': pattern,
                  'block': block,
                  'trial': int(trial_match.group(1)),
                  'mib_s': float(match.group(11)),
                  'iops': float(match.group(12)),
                  'wall_s': float(match.group(10)),
                  'cpu_s': user + system,
              })
          grouped = {}
          for row in rows:
              key = (row['operation'], row['pattern'], row['block'], row['mode'])
              grouped.setdefault(key, []).append(row)
          medians = {}
          for key, items in grouped.items():
              medians[key] = {
                  'mib_s': statistics.median(x['mib_s'] for x in items),
                  'iops': statistics.median(x['iops'] for x in items),
                  'wall_s': statistics.median(x['wall_s'] for x in items),
                  'cpu_s': statistics.median(x['cpu_s'] for x in items),
              }
          comparisons = []
          for operation, pattern, block, mode in sorted(medians):
              if mode != 'direct': continue
              direct = medians[(operation, pattern, block, 'direct')]
              encrypted = medians[(operation, pattern, block, 'encrypted')]
              slowdown = direct['mib_s'] / encrypted['mib_s'] if encrypted['mib_s'] else float('inf')
              efficiency = encrypted['mib_s'] / direct['mib_s'] if direct['mib_s'] else 0.0
              cpu_ratio = encrypted['cpu_s'] / direct['cpu_s'] if direct['cpu_s'] else float('inf')
              comparisons.append({
                  'operation': operation,
                  'pattern': pattern,
                  'block': block,
                  'direct_mib_s': direct['mib_s'],
                  'encrypted_mib_s': encrypted['mib_s'],
                  'direct_iops': direct['iops'],
                  'encrypted_iops': encrypted['iops'],
                  'direct_cpu_s': direct['cpu_s'],
                  'encrypted_cpu_s': encrypted['cpu_s'],
                  'slowdown_x': slowdown,
                  'efficiency_pct': efficiency * 100.0,
                  'cpu_ratio_x': cpu_ratio,
              })
          with open(summary_path, 'w', encoding='utf-8') as out:
              out.write('# Direct vs EDP SM4 encrypted I/O median comparison\n')
              out.write('# F_NOCACHE=1, F_RDAHEAD=0; writes include one durability sync per run\n')
              for row in comparisons:
                  label = 'RMW-tax' if row['block'] == 4097 else 'matrix'
                  out.write(
                      f"PERF_COMPARE kind={label} operation={row['operation']} pattern={row['pattern']} block_bytes={row['block']} "
                      f"direct_mib_s={row['direct_mib_s']:.3f} encrypted_mib_s={row['encrypted_mib_s']:.3f} "
                      f"direct_iops={row['direct_iops']:.1f} encrypted_iops={row['encrypted_iops']:.1f} "
                      f"slowdown_x={row['slowdown_x']:.3f} efficiency_pct={row['efficiency_pct']:.1f} "
                      f"direct_cpu_s={row['direct_cpu_s']:.3f} encrypted_cpu_s={row['encrypted_cpu_s']:.3f} cpu_ratio_x={row['cpu_ratio_x']:.3f}\n"
                  )
          with open(csv_path, 'w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=list(comparisons[0].keys()))
              writer.writeheader(); writer.writerows(comparisons)
          print(open(summary_path, encoding='utf-8').read(), end='')
          if len(comparisons) != 13:
              raise SystemExit(f'expected 13 comparisons, got {len(comparisons)}')
          if any(x['direct_mib_s'] <= 0 or x['encrypted_mib_s'] <= 0 for x in comparisons):
              raise SystemExit('non-positive throughput')
          print('RESULT=PERF_DIRECT_VS_ENCRYPTED_READ_WRITE_COMPARISON_PASS')
          PY
          cat "${SUMMARY}" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo 'CSV artifact contains the same comparison in machine-readable form.' >> "${GITHUB_STEP_SUMMARY}"
          echo 'RESULT=PERF_CRYPTO_MEDIAN_SUMMARY_READY'

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: edp-crypto-direct-vs-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/crypto-io-results/
            ${{ runner.temp }}/crypto-io-summary.txt
            ${{ runner.temp }}/crypto-io-summary.csv
            ${{ runner.temp }}/encrypt-fixture.txt
          retention-days: 14
