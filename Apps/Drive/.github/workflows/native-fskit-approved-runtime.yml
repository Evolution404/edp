name: Native FSKit Approved Runtime Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Approved macOS 26 FSKit runtime
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Verify approved EDP FSKit block runtime
        env:
          EDP_RUNTIME_DIAG_DIR: ${{ runner.temp }}/edp-fskit-approved-runtime
        run: |
          set -euo pipefail
          bash native/EDPFSKitPoC/Tools/verify-approved-runtime.sh

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-fskit-approved-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/edp-fskit-approved-runtime
          if-no-files-found: ignore
          retention-days: 14
