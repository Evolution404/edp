name: macFUSE Local Transport Builder Contract

on:
  push:
    branches: ["test/self-signed-standalone-distribution"]
    paths:
      - "installer/build-transport-backends.sh"
      - "native/EDPFSKitPoC/Tools/MacFUSEMinimal/**"
      - "native/EDPFSKitPoC/Tools/EDPReadWriteBlockCBridge.swift"
      - ".github/workflows/macfuse-local-transport-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install official macFUSE 5.3.3 runtime
        run: |
          set -euo pipefail
          DMG="${RUNNER_TEMP}/macfuse.dmg"
          curl -fsSL --retry 3 https://github.com/macfuse/macfuse/releases/download/macfuse-5.3.3/macfuse-5.3.3.dmg -o "${DMG}"
          test "$(shasum -a 256 "${DMG}" | awk '{print $1}')" = 7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15
          ATTACH="$(hdiutil attach -nobrowse -readonly "${DMG}")"
          VOL="$(printf '%s\n' "${ATTACH}" | awk -F '\t' '/\/Volumes\// {print $NF; exit}')"
          PKG="$(find "${VOL}" -maxdepth 2 \( -type f -o -type d \) -name '*.pkg' -print -quit)"
          sudo installer -pkg "${PKG}" -target /
          hdiutil detach "${VOL}" >/dev/null
      - name: Build the macFUSE Local product transport
        run: |
          set -euo pipefail
          chmod +x installer/build-transport-backends.sh
          installer/build-transport-backends.sh "${RUNNER_TEMP}/bin" | tee "${RUNNER_TEMP}/builder.txt"
          grep -Fq 'RESULT=EDP_MACFUSE_LOCAL_TRANSPORT_BUILT' "${RUNNER_TEMP}/builder.txt"
          test -x "${RUNNER_TEMP}/bin/edp-mfmount-local-readwrite"
          test "$(find "${RUNNER_TEMP}/bin" -maxdepth 1 -type f -name 'edp-*readwrite*' | wc -l | tr -d ' ')" -eq 1
          otool -L "${RUNNER_TEMP}/bin/edp-mfmount-local-readwrite" | tee "${RUNNER_TEMP}/otool.txt"
          grep -Fq 'MFMount.framework' "${RUNNER_TEMP}/otool.txt"
          if grep -Eiq 'libfuse|libosxfuse|libmacfuse' "${RUNNER_TEMP}/otool.txt"; then
            echo 'unexpected libfuse-family dynamic dependency in macFUSE Local transport' >&2
            exit 1
          fi
          echo 'RESULT=MACFUSE_LOCAL_TRANSPORT_BUILDER_CONTRACT_OK'
