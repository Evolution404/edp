name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-install-contract:
    name: macOS 26 / native install + trust contract
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native install and signing contract
        run: |
          set -euo pipefail
          bash -n native/EDPOpenNative/Scripts/build-native.sh
          bash -n native/EDPOpenNative/Scripts/install-native.sh
          bash -n native/EDPOpenNative/Scripts/verify-installed-native.sh
          bash -n native/EDPOpenNative/Scripts/verify-peer-signing-contract.sh
          plutil -lint native/EDPOpenNative/Installer/com.evolution404.edpopen.rawbroker.plist
          grep -Fq 'EDP Project Code Signing' native/EDPOpenNative/Scripts/build-native.sh
          grep -Fq 'CONFIGURATION="${EDPOPEN_CONFIGURATION:-Release}"' native/EDPOpenNative/Scripts/build-native.sh
          grep -Fq 'ARCHS=arm64' native/EDPOpenNative/Scripts/build-native.sh
          grep -Fq 'ARCHS: arm64' native/EDPOpenNative/project.yml
          grep -Fq 'CONFIGURATION="${EDPOPEN_CONFIGURATION:-Release}"' native/EDPOpenNative/Scripts/install-native.sh
          grep -Fq '040b5488fb2b6c02b0786e76b674cb4460658ca2' native/EDPOpenNative/Scripts/install-native.sh
          grep -Fq '/Applications/EDPOpen.app' native/EDPOpenNative/Scripts/install-native.sh
          grep -Fq '/Library/PrivilegedHelperTools/com.evolution404.edpopen.rawbroker' native/EDPOpenNative/Scripts/install-native.sh
          grep -Fq 'root:wheel' native/EDPOpenNative/Scripts/verify-installed-native.sh
          grep -Fq 'TeamIdentifier=W82WPH8HY7' native/EDPOpenNative/Scripts/verify-installed-native.sh
          grep -Fq 'setCodeSigningRequirement(RawBrokerConstants.brokerCodeSigningRequirement)' native/EDPOpenNative/Sources/RawBrokerClient.swift
          grep -Fq 'setCodeSigningRequirement(RawBrokerConstants.appCodeSigningRequirement)' native/EDPOpenNative/BrokerSources/RawBrokerService.swift
          echo 'RESULT=EDPOPEN_NATIVE_INSTALL_TRUST_CONTRACT_OK'

  test:
    name: macOS 26 / Rust + frontend checks
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend syntax
        run: node --check src/app.js

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust build
        run: cargo build --manifest-path src-tauri/Cargo.toml
