name: EDPOpenNative
options:
  bundleIdPrefix: com.evolution404
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: EDPOpen
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: EDPOpen
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Evolution404
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W82WPH8HY7
targets:
  EDPOpen:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Shared
    preBuildScripts:
      - name: Build Rust EDP Core
        script: |
          "$SRCROOT/Scripts/build-rust-core.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evolution404.edpopen
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Support/EDPOpenCoreBridge.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../core/edpopen-ffi/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../core/edpopen-ffi/target/release"
        OTHER_LDFLAGS: "$(inherited) -ledpopen_ffi"
    dependencies:
      - target: EDPOpenRawBroker
    scheme:
      testTargets: []
  EDPOpenRawBroker:
    type: tool
    platform: macOS
    sources:
      - path: BrokerSources
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: EDPOpenRawBroker
        PRODUCT_BUNDLE_IDENTIFIER: com.evolution404.edpopen.rawbroker
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
