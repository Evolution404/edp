<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDPOpen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">ED<span class="accent">P</span>Open</div>
    <div class="disk-bar">
      <select id="disk-select"><option value="">— 未检测到 USB 盘 —</option></select>
      <button id="btn-refresh" title="重新枚举 USB 盘">⟳ 刷新</button>
      <span id="disk-hint" class="hint"></span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-page="overview" class="active">概览</button>
    <button data-page="map">盘地图</button>
    <button data-page="sector">扇区</button>
    <button data-page="convert">改造</button>
    <button data-page="backup">备份</button>
  </nav>

  <main>
    <section id="page-overview" class="page active">
      <div id="overview-content"><div class="card placeholder">插入 USB 盘后自动识别 · 状态判定 · 分区摘要</div></div>
    </section>
    <section id="page-map" class="page">
      <div class="card">
        <h3>LBA 0-13 元数据区 <span class="dim" style="font-weight:400">(点击方格查看扇区)</span></h3>
        <div id="map-meta" class="meta-grid"></div>
      </div>
      <div class="card">
        <h3>全盘布局 <span id="map-total" class="dim" style="font-weight:400"></span></h3>
        <div id="map-strip" class="map-strip"></div>
        <div class="map-legend" id="map-legend"></div>
      </div>
      <div class="card">
        <h3>尾部区域 <span class="dim" style="font-weight:400">(CHS 基准前, 放大显示)</span></h3>
        <div id="map-tail" class="map-strip tail"></div>
      </div>
    </section>
    <section id="page-sector" class="page">
      <div class="card sector-nav">
        <span>LBA</span>
        <input id="sector-lba" type="number" min="0" value="0" style="width:110px">
        <button id="btn-sector-load">读取</button>
        <span id="sector-prev" class="nav-btn" title="上一扇区">◀</span>
        <span id="sector-next" class="nav-btn" title="下一扇区">▶</span>
        <span id="sector-jumps"></span>
        <label class="view-sw"><input type="radio" name="sector-view" value="dec" checked> 解密视图</label>
        <label class="view-sw"><input type="radio" name="sector-view" value="raw"> 原始密文</label>
        <span id="sector-method" class="dim"></span>
      </div>
      <div class="card"><pre id="hexdump" class="hexdump">选择盘后读取扇区…</pre></div>
    </section>
    <section id="page-convert" class="page">
      <div class="card">
        <h3>免密改造 <span class="dim" style="font-weight:400">加密盘 → 明文直挂免密盘</span></h3>
        <div class="sector-nav">
          <span>Share 大小</span>
          <input id="convert-size" type="number" placeholder="默认占满到 Encrypt 前" style="width:180px">
          <span class="dim">GB</span>
          <button id="btn-convert-load">生成预览</button>
        </div>
        <div id="convert-preview" style="margin-top:10px"><div class="dim">选盘后生成预览…</div></div>
        <div style="margin-top:12px">
          <button id="btn-convert-apply" disabled>写入 U 盘（管理员授权）</button>
          <span id="convert-status" class="dim"></span>
        </div>
      </div>
    </section>
    <section id="page-backup" class="page">
      <div class="card placeholder">备份列表（labelOnlyId 匹配）· 还原（MD5 校验）</div>
    </section>
  </main>

  <footer id="statusbar">后端: <span id="backend-state">连接中…</span></footer>

  <div id="tooltip" class="tooltip" hidden></div>

  <script src="app.js"></script>
</body>
</html>
