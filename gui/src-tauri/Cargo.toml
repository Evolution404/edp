# 独立 workspace：GUI 依赖 tauri 巨量依赖，故不并入根 workspace，
# 避免拖慢内核 crate 的 build/test/clippy 门禁。path 依赖复用 edp-proto/edp-macos。
[workspace]

[package]
name = "gui"
version = "0.1.0"
description = "EDP 加密 U 盘客户端 GUI"
authors = ["Evolution404"]
edition = "2021"

[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
edp-proto = { path = "../../crates/edp-proto" }
edp-macos = { path = "../../crates/edp-macos" }
chrono = { version = "0.4", features = ["serde"] }
