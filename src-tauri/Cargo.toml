[package]
name = "edpopen"
version = "0.1.0"
description = "EDPOpen — cems 加密 U 盘分析与免密改造工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
encoding_rs = "0.8"
md5 = "0.7"
regex = "1"

[lib]
name = "edpopen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
